# A new database cluster recovered from the backups (base backup + archived WAL), as a restore
# would be done: smoke.sh checks that the latest writes are in it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ferrum-db-restored
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ferrum-backups
          serverName: ferrum-db
