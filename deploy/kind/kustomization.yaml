# deploy/k8s as CI deploys it to kind (smoke.sh): images loaded into the cluster, attachments
# and database backups in the S3 emulator (s3.yaml). Everything else is as in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ferrum
resources:
  - ../k8s
  - s3-egress.yaml
# The browser editors' server too, with the example hosts (smoke.sh resolves them).
components:
  - ../k8s/editors
images:
  - name: ghcr.io/cbferrum/ferrum
    newName: ferrum
    newTag: ci
  - name: ghcr.io/cbferrum/ferrum-editors
    newName: ferrum-editors
    newTag: ci
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ferrum
      spec:
        template:
          spec:
            containers:
              - name: ferrum
                env:
                  - {name: FERRUM_S3_BUCKET, value: ferrum-files}
                  - {name: FERRUM_S3_REGION, value: us-east-1}
                  - {name: FERRUM_S3_ENDPOINT, value: "http://s3.ci-s3.svc.cluster.local:5000"}
  # Shapes B and C (smoke.sh's last step): workspaces and the accounts host at *.ferrum.example and
  # one custom domain, each listener with a certificate cert-manager has the CI root sign.
  - target: {group: gateway.networking.k8s.io, version: v1, kind: Gateway, name: ferrum}
    patch: |-
      - op: add
        path: /spec/listeners/-
        value: {name: https-workspaces, protocol: HTTPS, port: 443, hostname: "*.ferrum.example", tls: {mode: Terminate, certificateRefs: [{name: ferrum-workspaces-tls}]}, allowedRoutes: {namespaces: {from: Same}}}
      - op: add
        path: /spec/listeners/-
        value: {name: https-custom, protocol: HTTPS, port: 443, hostname: shop.example.org, tls: {mode: Terminate, certificateRefs: [{name: ferrum-custom-tls}]}, allowedRoutes: {namespaces: {from: Same}}}
  - target: {group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute, name: ferrum}
    patch: |-
      - op: add
        path: /spec/parentRefs/-
        value: {name: ferrum, sectionName: https-workspaces}
      - op: add
        path: /spec/parentRefs/-
        value: {name: ferrum, sectionName: https-custom}
      - op: add
        path: /spec/hostnames/-
        value: "*.ferrum.example"
      - op: add
        path: /spec/hostnames/-
        value: shop.example.org
  # kind has no load balancers: the proxies get a cluster address (smoke.sh port-forwards to it).
  - patch: |-
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyProxy
      metadata:
        name: ferrum
      spec:
        provider:
          kubernetes:
            envoyService:
              type: ClusterIP
              externalTrafficPolicy: null
  - patch: |-
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: ferrum-backups
      spec:
        configuration:
          destinationPath: s3://ferrum-backups/ci
          endpointURL: "http://s3.ci-s3.svc.cluster.local:5000"
