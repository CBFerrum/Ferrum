# An S3 emulator for CI (attachments and database backups) in a namespace of its own.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: ci-s3
spec:
  replicas: 1
  selector:
    matchLabels: {app: s3}
  template:
    metadata:
      labels: {app: s3}
    spec:
      containers:
        - name: moto
          image: motoserver/moto:5.2.5
          ports:
            - {containerPort: 5000}
          readinessProbe:
            tcpSocket: {port: 5000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: ci-s3
spec:
  selector: {app: s3}
  ports:
    - {port: 5000, targetPort: 5000}
