# Mosquitto beside the site runtime, for equipment that publishes to the gateway itself. It runs as
# its own process, so that a fault in either leaves the other standing. Make the password file with
# `mosquitto_passwd -c /etc/mosquitto/passwd <user>`, and point definitions at mqtt://127.0.0.1:1883.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

# What was retained and what QoS 1 subscribers missed survive a restart.
persistence true
persistence_location /var/lib/mosquitto/

# Bounded, so that a subscriber that went away costs this much and no more.
max_queued_messages 10000
max_inflight_messages 100
message_size_limit 1048576
