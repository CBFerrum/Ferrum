{{- if .Values.office.enabled }}
{{- $n := printf "%s-office" (include "ferrum.fullname" .) }}
{{- $ns := .Values.office.namespace }}
{{- $app := include "ferrum.fullname" . }}
{{- $public := .Values.publicUrl | trimSuffix "/" }}
# The online editor: Collabora Online (CODE unless you change the image) in a namespace of its own,
# because it needs capabilities that `restricted` refuses and `baseline` allows. It serves only
# Ferrum's WOPI host, shows no administration console, and may be reached by the gateway's proxies
# (browsers) and by the Ferrum server (discovery), nothing else. See values.yaml and docs/operations.md.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
  labels: {{- include "ferrum.labels" (list . $n) | nindent 4 }}
spec:
  replicas: {{ .Values.office.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $n }}}
    spec:
      automountServiceAccountToken: false
      # Time to save and unload open documents.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collabora
          image: {{ include "ferrum.image" (list "office.image" .Values.office.image) }}
          ports:
            - {name: http, containerPort: 9980}
          env:
            # The only WOPI host it serves: Ferrum, as the editor reaches it. Nothing else is accepted.
            - {name: aliasgroup1, value: "http://{{ $app }}.{{ .Release.Namespace }}.svc.cluster.local:80"}
            # The host browsers use; the gateway terminates TLS, and only Ferrum's pages may frame it.
            - {name: server_name, value: {{ .Values.office.host | quote }}}
            - name: extra_params
              value: >-
                --o:ssl.enable=false
                --o:ssl.termination=true
                --o:net.frame_ancestors={{ $public }}
                --o:admin_console.enable=false
                --o:allow_update_popup=false
                --o:logging.level=warning
          resources: {{- toYaml .Values.office.resources | nindent 12 }}
          # The jails need file capabilities on the editor's helper, so privilege escalation is
          # allowed; the container keeps only the four capabilities the jails take.
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "MKNOD", "SYS_CHROOT"]
          volumeMounts:
            # The WOPI proof key, when the Secret exists (values.yaml): without it the editor
            # publishes no key and Ferrum cannot tell its calls from a stolen token's.
            - {name: proof, mountPath: /etc/coolwsd/proof_key, subPath: proof_key, readOnly: true}
          startupProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
      volumes:
        - name: proof
          secret: {secretName: {{ .Values.office.proofKeySecret }}, optional: true, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
spec:
  selector: {app.kubernetes.io/name: {{ $n }}}
  ports:
    - {name: http, port: 9980, targetPort: http}
{{- if .Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}-https-redirect
  namespace: {{ $ns }}
spec:
  parentRefs: [{name: {{ $app }}, namespace: {{ .Release.Namespace }}, sectionName: office-http}]
  hostnames: [{{ .Values.office.host }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
spec:
  parentRefs: [{name: {{ $app }}, namespace: {{ .Release.Namespace }}, sectionName: office-https}]
  hostnames: [{{ .Values.office.host }}]
  rules:
    # Not for the public: the administration console, its metrics, and the conversion service
    # (its callers are checked by address, and the gateway's address is one it trusts). Sent back
    # to Ferrum's home page.
    - matches:
        - path: {type: PathPrefix, value: /cool/adminws}
        - path: {type: PathPrefix, value: /cool/getMetrics}
        - path: {type: PathPrefix, value: /cool/convert-to}
        - path: {type: PathPrefix, value: /browser/dist/admin}
        - path: {type: PathPrefix, value: /hosting/discovery}
        - path: {type: PathPrefix, value: /hosting/capabilities}
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, hostname: {{ $public | trimPrefix "https://" | trimPrefix "http://" }}, statusCode: 302}
    # The editor's pages and its WebSockets, which have no overall time limit.
    - matches:
        - path: {type: PathPrefix, value: /browser}
        - path: {type: PathPrefix, value: /cool}
      backendRefs: [{name: {{ $n }}, port: 9980}]
      timeouts: {request: "0s"}
{{- end }}
{{- if gt (int .Values.office.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# The gateway's proxies (browsers) and the Ferrum server (discovery) reach it; it reaches Ferrum's
# WOPI endpoints and DNS, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.office.gatewayNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            {{- include "ferrum.serverPods" . | nindent 12 }}
      ports:
        - {port: 9980}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: {{ $app }}}
      ports:
        - {port: 5150}
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- end }}
{{- end }}
