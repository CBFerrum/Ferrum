{{- if .Values.privateGateway.enabled }}
{{- $pg := .Values.privateGateway }}
{{- $g := (include "ferrum.routing" . | fromJson).gateways.private }}
# A second Gateway for traffic from inside your network (values.yaml, privateGateway): its own class,
# hosts, certificate and Envoy proxies behind an internal load balancer. Its routes are in routes.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  {{- with $pg.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ . }}
  {{- end }}
spec:
  gatewayClassName: {{ $pg.gatewayClassName }}
  {{- if $pg.envoyProxy.enabled }}
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: {{ $g.name }}}
  {{- end }}
  listeners:
    {{- range (concat $g.own $g.extra) }}
    - name: https{{ get $g.suffix . }}
      protocol: HTTPS
      port: 443
      hostname: {{ . | quote }}
      tls:
        mode: Terminate
        certificateRefs: [{name: {{ $pg.tlsSecretName }}}]
      allowedRoutes: {namespaces: {from: Same}}
    - name: http{{ get $g.suffix . }}
      protocol: HTTP
      port: 80
      hostname: {{ . | quote }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
{{- if $pg.envoyProxy.enabled }}
---
# Its proxies as the public gateway's (envoy-proxy.yaml), behind the Service settings given here: an
# internal load balancer is your cloud's annotation (docs/operations.md, "Deployment shapes").
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $g.name }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ $pg.envoyProxy.replicas }}
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels: {gateway.envoyproxy.io/owning-gateway-name: {{ $g.name }}}
      envoyPDB:
        minAvailable: 1
      envoyService: {{- toYaml $pg.envoyProxy.envoyService | nindent 8 }}
{{- end }}
{{- end }}
