{{- if .Values.database.enabled }}
{{- $n := include "ferrum.fullname" . }}
{{- $d := .Values.database }}
# PostgreSQL with synchronous replication, automatic failover, continuous WAL archiving and daily
# base backups through the Barman Cloud plugin. CloudNativePG creates the `{{ $n }}-db-app` secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $n }}-db
spec:
  instances: {{ $d.instances }}
  imageName: {{ $d.imageName }}
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 15
  minSyncReplicas: 1
  maxSyncReplicas: 1
  storage:
    size: {{ $d.storageSize }}
  walStorage:
    size: {{ $d.walStorageSize }}
  {{- include "ferrum.dbBootstrap" . | nindent 2 }}
  managed:
    roles:
      - name: ferrum
        ensure: present
        login: true
        connectionLimit: {{ $d.connectionLimit }}
  postgresql:
    parameters: {{- toYaml $d.parameters | nindent 6 }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources: {{- toYaml $d.resources | nindent 4 }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $n }}-backups
        {{- with $d.backup.serverName }}
        serverName: {{ . }}
        {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $n }}-db-daily
spec:
  schedule: {{ $d.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $n }}-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $n }}-backups
spec:
  retentionPolicy: {{ $d.backup.retention | quote }}
  configuration:
    destinationPath: {{ $d.backup.destinationPath }}
    {{- with $d.backup.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId: {name: {{ $d.backup.credentialsSecret }}, key: ACCESS_KEY_ID}
      secretAccessKey: {name: {{ $d.backup.credentialsSecret }}, key: ACCESS_SECRET_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
{{- end }}
