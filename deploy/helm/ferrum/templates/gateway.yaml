{{- if .Values.gateway.enabled }}
{{- $n := include "ferrum.fullname" . }}
{{- $h := .Values.gateway.hostname }}
# Traffic from outside, through the Gateway API: TLS terminated with a certificate cert-manager
# issues, plain HTTP redirected, the server answering everything.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $n }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.clusterIssuer }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  {{- if .Values.envoyProxy.enabled }}
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: {{ $n }}}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $h }}
      tls:
        mode: Terminate
        certificateRefs: [{name: {{ .Values.gateway.tlsSecretName }}}]
      allowedRoutes: {namespaces: {from: Same}}
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $h }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- if .Values.editors.enabled }}
    - name: editors-https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.editors.host }}
      tls: {mode: Terminate, certificateRefs: [{name: {{ .Values.editors.tlsSecretName }}}]}
      allowedRoutes: {namespaces: {from: Same}}
    - name: editors-http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.editors.host }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}-https-redirect
spec:
  parentRefs: [{name: {{ $n }}, sectionName: http}]
  hostnames: [{{ $h }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
spec:
  parentRefs: [{name: {{ $n }}, sectionName: https}]
  hostnames: [{{ $h }}]
  rules:
    # Long-lived connections: WebSockets and MCP streams have no overall time limit.
    - matches:
        - path: {type: PathPrefix, value: /ws}
        - path: {type: PathPrefix, value: /mcp}
      backendRefs: [{name: {{ $n }}, port: 80}]
      timeouts: {request: "0s"}
    # The rest of the server: large exports and imports may take minutes.
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /files}
        - path: {type: PathPrefix, value: /oauth}
        - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource}
        - path: {type: Exact, value: /.well-known/oauth-authorization-server}
        - path: {type: Exact, value: /.well-known/caldav}
        - path: {type: Exact, value: /.well-known/carddav}
      backendRefs: [{name: {{ $n }}, port: 80}]
      timeouts: {request: 600s}
    # Everything else: Home, apps' interfaces, the shell's files and pages.
    - backendRefs: [{name: {{ $n }}, port: 80}]
{{- if .Values.editors.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}-editors-https-redirect
spec:
  parentRefs: [{name: {{ $n }}, sectionName: editors-http}]
  hostnames: [{{ .Values.editors.host }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}-editors
spec:
  parentRefs: [{name: {{ $n }}, sectionName: editors-https}]
  hostnames: [{{ .Values.editors.host }}]
  rules:
    - backendRefs: [{name: {{ $n }}-editors, port: 80}]
{{- end }}
{{- end }}
