{{- if .Values.migrate.enabled }}
{{- $n := include "ferrum.fullname" . }}
# Runs before the install or upgrade is applied. Needs a `migrate` task in the server (not built yet).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-migrate
  labels: {{- include "ferrum.labels" (list . (printf "%s-migrate" $n)) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $n }}-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "ferrum.image" (list "image" .Values.image) }}
          args: {{ toJson .Values.migrate.args }}
          env:
            {{- include "ferrum.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
{{- end }}
