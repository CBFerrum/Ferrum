{{- if .Values.metricsEngine.enabled }}
{{- $n := printf "%s-metrics-engine" (include "ferrum.fullname" .) }}
{{- $m := .Values.metricsEngine }}
{{- $rendered := eq (include "ferrum.renders" (list . "metrics-engine" $m.files)) "true" }}
{{- /* With its token rendered, its pod reaches the database as it starts, for the render alone. */}}
# Metrics' engine for external sources, apart from the API so that a heavy query is bounded here.
# Stateless; only the API may call it, with the token both hold, and it calls nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  labels: {{- include "ferrum.labels" (list . $n) | nindent 4 }}
spec:
  replicas: {{ $m.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $n }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: {{ $n }}}
      terminationGracePeriodSeconds: 30
      {{- if $rendered }}
      initContainers:
        {{- include "ferrum.renderInit" (list . "metrics-engine") | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: {{ include "ferrum.image" (list "metricsEngine.image" $m.image) }}
          ports:
            - {name: http, containerPort: 5180}
          env:
            - {name: FERRUM_METRICS_ENGINE_CONFIG, value: /etc/ferrum/engine.json}
            - {name: FERRUM_METRICS_ENGINE_ADDR, value: "0.0.0.0:5180"}
            {{- if $rendered }}
            # The vault's token, one line each: the current, and the one before while a rotation's overlap lasts.
            - {name: FERRUM_METRICS_ENGINE_TOKEN_FILE, value: /run/companion/token}
            {{- else }}
            - name: FERRUM_METRICS_ENGINE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $m.tokenSecret.name }}, key: {{ $m.tokenSecret.key }}}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources: {{- toYaml $m.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            {{- if $rendered }}
            - {name: companion, mountPath: /run/companion, readOnly: true}
            {{- end }}
            - {name: config, mountPath: /etc/ferrum, readOnly: true}
            - {name: datasets, mountPath: /data, readOnly: true}
      volumes:
        {{- if $rendered }}
        {{- include "ferrum.renderVolumes" . | nindent 8 }}
        {{- end }}
        - name: config
          configMap: {name: {{ $m.configMap }}, items: [{key: engine.json, path: engine.json}]}
        - name: datasets
          persistentVolumeClaim: {claimName: {{ $m.datasetsClaim }}, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
spec:
  selector: {app.kubernetes.io/name: {{ $n }}}
  ports:
    - {name: http, port: 5180, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            {{- include "ferrum.serverPods" . | nindent 12 }}
      ports:
        - {port: 5180}
  {{- if $rendered }}
  # The render as the pod starts: the database, and the names that lead to it.
  egress:
    {{- include "ferrum.databaseEgress" . | nindent 4 }}
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
  {{- else }}
  egress: []
  {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
{{- end }}
