{{- if .Values.secrets.externalSecret.enabled }}
{{- $e := .Values.secrets.externalSecret }}
# The server's Secret (secrets.existingSecret), made by the External Secrets Operator from your secret
# store. The chart still holds no secret value. Pods read the Secret when they start: restart them after a
# value changes (kubectl rollout restart).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecret.secretStoreRef.name: name the SecretStore or ClusterSecretStore" $e.secretStoreRef.name }}
    kind: {{ $e.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  {{- if not (or $e.data $e.dataFrom) }}
  {{- fail "secrets.externalSecret: give data or dataFrom, the store's keys for the Secret's keys" }}
  {{- end }}
  {{- with $e.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $e.dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
