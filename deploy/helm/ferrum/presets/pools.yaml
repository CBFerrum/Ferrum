# Four pools on one gateway. `general` keeps today's names and answers what no other pool's route takes;
# `public` answers the portal host; `finance` answers the API calls of the apps named (matched on the
# X-Ferrum-UI header; use your apps' ids); `worker` runs the background work. Every pool holds every app.
# Connections: 4 x 36 + 3 x 26 + 2 x 36 + 2 x 26 + 20 = 366 of 370.
pools:
  - name: general
    background: "off"
    autoscaling: {minReplicas: 2, maxReplicas: 4}
  - name: public
    background: "off"
    autoscaling: {minReplicas: 2, maxReplicas: 3}
    dbMaxConnections: 20
    routes:
      - {gateway: public, hostnames: [portal.example.com]}
  - name: finance
    background: "off"
    autoscaling: {minReplicas: 2, maxReplicas: 2}
    routes:
      - {gateway: public, apps: [erp, books]}
  - name: worker
    background: only
    autoscaling: {enabled: false}
    replicas: 2
    dbMaxConnections: 20
