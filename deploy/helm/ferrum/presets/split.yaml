# Two pools: `web` answers requests and runs no background work; `worker` runs only background work
# (outbox, webhooks, jobs, upkeep) and takes no requests. `web` keeps today's names, so moving here from
# single.yaml is an in-place upgrade. Connections: 8 x (30 + 6) + 2 x (20 + 6) + 20 = 360 of 370.
pools:
  - name: web
    background: "off"
    autoscaling: {minReplicas: 3, maxReplicas: 8}
  - name: worker
    background: only
    autoscaling: {enabled: false}
    replicas: 2
    dbMaxConnections: 20
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 1Gi}
