# Ferrum: the stateless server, the PDF renderer, the online editor for Word, Excel and PowerPoint files (Collabora
# Online), the Gateway in front, and two optional parts. It takes the address of a PostgreSQL (database.urlSecret) and a
# bucket (storage.bucket) and runs neither: reference/kubernetes/ is an example of both. Install: docs/operations.md,
# "Installing with the Helm chart".

# Names are "<fullnameOverride>", "<fullnameOverride>-pdf", "<fullnameOverride>-db" and so on.
fullnameOverride: ferrum

# The server's image. Set digest (preferred) or tag; rendering fails when neither is set, and
# there is no default: `latest` is never used. The digest wins when both are set.
image:
  repository: ghcr.io/cbferrum/ferrum
  digest: ""    # sha256:...
  tag: ""       # a commit's full SHA

# The address users open; the Gateway's host below should match. This, storage.bucket, gateway.hostname and office.host
# (editors.host, privateGateway.hostnames when those are on) ship as placeholders: the chart refuses to render until each
# is your own. database.urlSecret.name, database.connectionLimit and database.backupReachDays have no default either.
publicUrl: https://erp.example.com
# Names that should never change (docs/operations.md, "Names that should never change"); empty
# keeps each as the server had it before the setting existed.
names:
  accountsHost: ""   # FERRUM_ACCOUNTS_HOST: where people sign in once
  hooksHost: ""      # FERRUM_HOOKS_HOST: where other services call back
  passkeyRp: ""      # FERRUM_PASSKEY_RP: the passkeys' relying party
  linkHost: ""       # FERRUM_LINK_HOST: every mailed or printed link goes through it
  hostLeavingDays: "" # FERRUM_HOST_LEAVING_DAYS: days a removed address still serves those signed in there (14; 0 none)
  domainProof: ""     # FERRUM_DOMAIN_PROOF: points, or record (a domain's DNS record as well); empty: record with a base domain
  dnsResolvers: ""    # FERRUM_DNS_RESOLVERS: DNS servers asked for that record, comma-separated; empty: the system's
logLevel: info
# Connections each replica may open (plus 6 beside them: 4 on the side, an eighth of this past 32, and 2 direct: the
# connection that LISTENs and a session lock). Autoscaling's maxReplicas x (this + 6) must fit database.connectionLimit.
dbMaxConnections: 30

# Attachments must be shared by all replicas: object storage, a bucket that exists (the chart never makes one:
# `ferrum task bucket_set_up` does, docs/operations.md, "Object storage"). The credentials are AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in the Secret below, or the pod's own identity.
storage:
  bucket: CHANGE-ME-files-bucket
  region: ap-south-1
  endpoint: ""  # MinIO, Cloudflare R2 and other S3-compatible stores: https://<account>.r2.cloudflarestorage.com
  # The network policy's way out to it (networkPolicy.enabled), beside the HTTPS that egressAnyHost allows: `to` is a list
  # of NetworkPolicy peers (an `ipBlock` for a provider, a `podSelector` and `namespaceSelector` for a store in this
  # cluster) and `ports` their ports. Empty `to`: no rule of its own.
  egress:
    to: []
    ports: [443]

# The name of a Secret you created, read where it is there: none of its keys is required any more, as the vault holds
# the platform's secrets (docs/operations.md, "The platform's secrets"; `ferrum task secret_set`). Its keys, each
# optional: JWT_SECRET, FERRUM_BOOTSTRAP_TOKEN, FERRUM_METRICS_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or the
#   pod's own identity), FERRUM_CLAMAV_ADDR, FERRUM_CLAMAV_MAX_MB, FERRUM_CONNECTION_UPLOAD_MB, FERRUM_OPS_TELEMETRY_DAYS,
#   FERRUM_OPERATOR_TOKEN (the settings routes for the Operations screen, in a zone with `operator: true` only).
# The environment, where it sets one, still wins over the vault in this release, but for the three tokens: once the
# vault holds one, its copy here is refused.
secrets:
  existingSecret: ferrum-secrets
  # Optional: have the External Secrets Operator (installed separately) make that Secret from your
  # secret store (Vault, AWS Secrets Manager, Google Secret Manager, ...). Off: create it yourself.
  externalSecret:
    enabled: false
    secretStoreRef: {name: "", kind: ClusterSecretStore}
    refreshInterval: 1h
    # Every key at once, from one entry holding them all:
    dataFrom: []   # - extract: {key: ferrum/production}
    # Or key by key:
    data: []       # - {secretKey: JWT_SECRET, remoteRef: {key: ferrum/production, property: JWT_SECRET}}

# The vault's root (docs/operations.md, "The vault"): files mounted at /run/ferrum in every pod and Job.
vault:
  # The key file of the vault's `file` slot, at /run/ferrum/root.key. Empty name: the chart makes the Secret
  # <fullname>-vault-key once, with a random key, kept when the release is removed and never changed by an upgrade (it
  # looks the Secret up and keeps what it holds). Every cluster then has a slot beside the credential one, so a changed
  # database password (an import, a copy, a recovery, a provider's reset) closes nothing: the next start makes the
  # credential slot again by itself. Name an existing Secret to bring the key along: an installation that takes another's
  # database (restored, copied or moved) names a copy of the old installation's key Secret. A tool that renders the chart
  # without the cluster (Argo CD, `helm template`) cannot look the Secret up and would make a new key each time: with one,
  # make the Secret yourself (`kubectl create secret generic ferrum-vault-key
  # --from-literal=root.key="$(openssl rand -base64 32)"`) and name it here.
  keySecret: {name: "", key: root.key}
  # The key-management service of the vault's `kms` slot (the settings kms_transit, kms_kubernetes_role, ...: in
  # `settings` below). Its token is never a setting: a Secret mounted at /run/ferrum/kms.token, or the pod's own
  # service account (serviceAccount: true mounts its token at its standard path, for kms_kubernetes_role).
  kms:
    tokenSecret: {name: "", key: token}
    # A certificate authority the service's certificate is checked against, mounted at /run/ferrum/kms-ca.pem.
    caSecret: {name: "", key: ca.crt}
    serviceAccount: false

# Settings the chart does not know yet: entries of a container's `env`, added to the server.
extraEnv: []
# - {name: FERRUM_PROXY_HOPS, value: "2"}

# Settings kept in the database (docs/operations.md, "Settings in the database"), applied by a Job before the pods
# start, as the migrate Job runs (`ferrum task apply_settings`). Name each setting by its key:
#   settings:
#     installation: {session_days: "7", user_requests_per_minute: "1200"}
#     pools: {default: {db_max_connections: "40"}}   # a pool's own; `default` with no `pools`
#     others: keep    # what the document leaves out: keep (the default), or unset it in the table
# The environment still wins over the table: a setting this chart also renders as a variable keeps the variable's
# value unless `environment` is minimal. Empty (the default): no Job.
settings: {}
# The server pods' environment: `full` (the default), every setting as a variable, as before; or `minimal`: the
# database's address with the pool in it (`application_name=pool:<name>`), the secrets, and the variables apps
# compiled into the server still read themselves. Every other setting then comes from the table: the settings Job
# writes the values the full environment would have held, with `settings` over them.
environment: full

# No replicas are set while autoscaling is enabled: the autoscaler owns the count.
replicas: 3     # used only when autoscaling.enabled is false
autoscaling:
  enabled: true
  minReplicas: 3
  # Each replica may open dbMaxConnections + 6 connections, and 2 more while it starts: (9 + 1 in a rollout) x 36,
  # 1 starting x 2 and 20 for others = 382 fit connectionLimit 390 (a full restart's 9 x 38 = 342 is less).
  # Put a pooler in front of the database (database.directHost) before raising this.
  maxReplicas: 9
  cpuUtilization: 70
  scaleDownStabilizationSeconds: 300

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 1Gi}

pdb:
  enabled: true
  maxUnavailable: 1

# Pools: several Deployments of the same server image that differ only in settings (docs/operations.md,
# "Deployment shapes"; ready-made shapes in presets/). Empty: one Deployment, as above. The first pool keeps
# today's names and selector (so a release upgrades in place); every other pool is "<fullname>-<name>" with
# its own Deployment, autoscaler (or fixed replicas), disruption budget, network policy and, unless
# `background: only`, Service. A pool takes every setting it leaves out from the top-level values above.
pools: []
# - name: web                  # lower-case letters, digits and dashes; unique
#   background: both           # both | off (FERRUM_RUN_BACKGROUND=false: API only) | only (no Service, no routes)
#   replicas: 3                # used when autoscaling.enabled is false
#   autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 9}
#   keda: {enabled: false}       # background: only pools: scale on waiting work (`keda` below)
#   resources: {requests: {cpu: 250m, memory: 256Mi}}
#   dbMaxConnections: 30       # FERRUM_DB_MAX_CONNECTIONS for this pool
#   pdb: {enabled: true, maxUnavailable: 1}
#   env: []                    # entries of `env`; a name already set is replaced
#   nodeSelector: {}
#   tolerations: []
#   priorityClassName: ""        # e.g. a low class for a public pool, so it is evicted first
#   affinity: {}                 # the pod's affinity, e.g. private pools on nodes of their own
#   topologySpreadConstraints: [] # replaces the default spread over zones and hosts
#   zone: ""                   # a name from `zones`: FERRUM_ZONE, and the pod label ferrum.dev/zone
#   routes:                    # what reaches this pool; the rest goes to each gateway's defaultPool
#     - gateway: public        # public | private
#       hostnames: []          # whole hosts (with no paths or apps); empty: the gateway's own hosts
#       paths: []              # path prefixes
#       apps: []               # app ids, matched on the X-Ferrum-UI header ({app}@{version})

# Scaling a pool with `background: only` on how much work waits, with KEDA (installed separately; the chart
# installs no part of it). A pool turns it on with `keda: {enabled: true}` and takes the rest from here; it
# must then have `autoscaling: {enabled: false}`, since an autoscaler and KEDA would both own its replicas.
# The triggers read the server's gauges through Prometheus (the ServiceMonitor and PodMonitor above). Every
# replica reports the same figures, which it reads from the database, so the queries take `max`, never `sum`.
#   ferrum_outbox_pending              events not yet handled (also those waiting to be retried)
#   ferrum_jobs_oldest_waiting_seconds how long the oldest job that is due has waited (0: none)
keda:
  minReplicas: 1               # at least 1: schedules and upkeep show in no gauge, so none would wake a worker
  maxReplicas: 4               # counted in the connection budget
  pollingInterval: 30
  cooldownPeriod: 300
  prometheusAddress: ""        # e.g. http://prometheus-operated.monitoring.svc:9090
  outboxPerReplica: 500        # one more replica for every this many events waiting
  jobWaitSeconds: 60           # more replicas while the oldest due job has waited longer than this
  triggers: []                 # KEDA triggers that replace the two above (ScaledObject spec.triggers)

# Zones (docs/plan/topology.md, D4): name -> rule, given to every pool as FERRUM_ZONES (JSON). A rule:
# {staff: all | none | [app, ...], admin: true|false, scim: true|false, networks: [cidr, ...], step_up: true|false,
#  operator: true|false (the operator's routes are there, and in no zone without it)}.
# Empty: one unnamed zone admitting everyone, as before.
zones: {}
# public: {staff: none}
# office: {staff: all}
# sales: {staff: [crm, helpdesk]}     # level 2: staff limited to these apps (and what they depend on), no administrators
zoneDefault: ""   # FERRUM_ZONE_DEFAULT: the zone of a request no host or network places
zoneMode: ""      # FERRUM_ZONE_MODE: enforce (the server's default) or report

# Only the Gateway's proxies and Prometheus may reach the server; it may reach the database, the
# PDF renderer, DNS and HTTPS/SMTP endpoints.
networkPolicy:
  enabled: true
  ingressNamespaces: [envoy-gateway-system, monitoring]   # the Gateway's proxies; Prometheus
  # With pools, each pool admits only the Envoy proxies of the gateways whose routes lead to it (Envoy
  # Gateway's owning-gateway labels, in this namespace), Prometheus, and, for the first pool, the editor.
  gatewayNamespace: envoy-gateway-system
  monitoringNamespaces: [monitoring]
  # The server may reach any host on 443 (HTTPS) and 587 (mail). false: only the networks in egressCIDRs
  # (include object storage, mail, and every service your connections call).
  egressAnyHost: true
  egressCIDRs: []

# Needs the Prometheus operator. It sends FERRUM_METRICS_TOKEN from the Secret above, which it needs: in production
# /metrics answers nobody while no token is set.
serviceMonitor:
  enabled: true
  interval: 30s

# Needs a Gateway API implementation and cert-manager. The class and the Envoy proxy settings
# are Envoy Gateway's (tested with it); for another implementation set gatewayClassName and
# envoyProxy.enabled: false, and add its proxies' namespace to networkPolicy.ingressNamespaces.
gateway:
  enabled: true
  gatewayClassName: eg
  hostname: erp.example.com
  clusterIssuer: letsencrypt
  tlsSecretName: ferrum-tls
  # With pools: the pool that answers what no pool's route takes (empty: the first pool). Hosts that
  # pools' routes name get listeners here, with the same certificate.
  defaultPool: ""
envoyProxy:
  enabled: true
  replicas: 2

# A second Gateway, for traffic from inside your network: its own hosts, certificate and Envoy proxies,
# behind an internal load balancer (envoyService: Envoy Gateway's Service settings, where your cloud's
# annotation for an internal load balancer goes). Pools say in `routes` which gateway reaches them.
privateGateway:
  enabled: false
  name: ""                         # empty: "<fullname>-private"
  gatewayClassName: eg
  hostnames: [erp.internal.example.com]
  clusterIssuer: ""                # empty: no cert-manager annotation; create tlsSecretName yourself
  tlsSecretName: ferrum-private-tls
  defaultPool: ""                  # what no pool's route takes; required with pools
  envoyProxy:
    enabled: true
    replicas: 2
    envoyService:
      externalTrafficPolicy: Local
      annotations: {}
      # AWS:   service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      # GCP:   networking.gke.io/load-balancer-type: Internal
      # Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# The PostgreSQL Ferrum uses, which the chart does not run: Amazon RDS or Aurora, Cloud SQL, Azure, Supabase, Neon, a
# cluster of your own (reference/kubernetes/ is one example). Its backups, failover, upgrades and pooler are its owner's
# (docs/operations.md, "Any PostgreSQL"). The three values without a default are required: rendering fails naming each.
database:
  # The Secret holding DATABASE_URL: the ordinary role's address (the pooler's, if there is one).
  urlSecret: {name: "", key: uri}
  # host or host:port of PostgreSQL itself when urlSecret's address is a pooler in transaction mode (RDS Proxy, PgBouncer,
  # Supabase's or Neon's pooled address): listeners, session locks and migrations go there, with urlSecret's role,
  # password, database and TLS options (FERRUM_DATABASE_DIRECT_HOST; with `environment: minimal`, the address's own
  # `ferrum_direct_host`). The migrate and settings Jobs get it too. Empty: everything through urlSecret's address. With
  # it, only each replica's direct connections count in the budget below: the pooler's own connections to PostgreSQL are
  # the provider's to fit.
  directHost: ""
  # host or host:port of a read replica reports and exports may read from (FERRUM_DATABASE_READ_HOST; with
  # `environment: minimal`, the address's own `ferrum_read_host`). Empty: none.
  readHost: ""
  # A Secret holding the certificate authority the database's certificate is checked against (Amazon's RDS bundle,
  # Google's server CA, ...), mounted at /run/ferrum/db-ca.pem in the pods and Jobs. With it, an address that asks
  # for no TLS mode is checked in full (verify-full), `require` checks the certificate (verify-ca, as libpq does),
  # and the server refuses to start, saying why, when the certificate does not verify.
  caSecret: {name: "", key: ca.crt}
  # With `environment: minimal`: whether that address already has a query (`?sslmode=require`), so that the pool's
  # name is added to it with `&` instead of `?`.
  urlHasQuery: false
  # How many connections the role may hold on PostgreSQL for this installation: its `rolconnlimit`, or `max_connections`
  # less what you keep for administration, replication and monitoring. Rendering fails when the pools, a rollout and the
  # Jobs together may open more (and 20 for other users of the role). No default: it is the database's, not the chart's.
  connectionLimit: ~
  # How many days back the database's backups reach: FERRUM_BACKUP_REACH_DAYS, and how long a deleted file stays in the
  # bucket (FERRUM_FILES_DELETE_AFTER_DAYS), so that a database restored to any moment its backups reach finds its files
  # (docs/operations.md, "Backups of files"). No default: a database without backups is 0, and says so.
  backupReachDays: ~
  # The network policy's way out to it (networkPolicy.enabled): `to` is a list of NetworkPolicy peers (an `ipBlock` for a
  # provider, a `podSelector` and `namespaceSelector` for a database in this cluster) and `ports` their ports (the pooler's
  # too). Empty `to`: no rule, and the pods cannot reach it while the policy is on.
  egress:
    to: []
    ports: [5432]

# The PDF renderer (Gotenberg). The server needs it for print formats.
pdf:
  enabled: true
  replicas: 2
  image: {repository: gotenberg/gotenberg, digest: "", tag: "8"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The online editor for Drive: Collabora Online opens and co-edits Word, Excel and PowerPoint files
# (docs/operations.md, "Online editing"). On by default; `enabled: false` turns it off and takes it
# out of the server's settings. It is the Development Edition (CODE): free, with no vendor support;
# a supported build is Collabora's subscription or your own build (set image.repository).
# It lives in a namespace of its own (the chart creates it) because it needs capabilities the
# `restricted` Pod Security level refuses, and on a host of its own, a sibling of the server's (an
# origin of its own: it must never share Ferrum's). Only that host's /browser and /cool paths are
# public; the administration console, metrics and conversion service are sent back to Ferrum.
# One replica: Collabora keeps each open document in the pod that opened it, and the Gateway API
# cannot route by document, so size the pod instead (about 590 MiB at rest and 50 to 60 MiB for each small open
# document). Above 1 the chart adds a PodDisruptionBudget, but a document then lives in whichever
# pod the Gateway picked: only with routing by WOPISrc of your own.
office:
  enabled: true
  namespace: ferrum-office
  host: office.example.com
  tlsSecretName: ferrum-office-tls
  replicas: 1
  # The namespaces of the Gateway's proxies, the only pods besides the server that may reach the editor.
  gatewayNamespaces: [envoy-gateway-system]
  image: {repository: collabora/code, digest: "", tag: "26.04.5.2.1"}
  # An optional Secret in the editor's namespace holding the WOPI proof key (key `proof_key`, a
  # PEM RSA key: openssl genrsa -traditional -out proof_key 2048). With it, Ferrum refuses any WOPI
  # call the editor did not sign. Create it before the first start, or restart the pod after.
  proofKeySecret: ferrum-office-proof
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}

# Browser editors for Drive (docs/operations.md, "Browser editors"): a server on a host of its own.
editors:
  enabled: false
  host: editors.example.com
  tlsSecretName: ferrum-editors-tls
  replicas: 2
  image: {repository: ghcr.io/cbferrum/ferrum-editors, digest: "", tag: ""}
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

# Metrics' engine for external sources (docs/operations.md). Create these first: the Secret
# (key `token`, 32 characters or more), the ConfigMap (key `engine.json`) and a ReadOnlyMany
# PersistentVolumeClaim holding the datasets.
metricsEngine:
  enabled: false
  replicas: 2
  image: {repository: ghcr.io/cbferrum/ferrum-metrics-engine, digest: "", tag: ""}
  tokenSecret: {name: ferrum-metrics-engine, key: token}
  # Where its token comes from (docs/operations.md, "Files for the programs beside the server"): `secret`, the Secret
  # above, typed once for the engine and once for the server, as before; or `rendered`, a file the vault's token is
  # written to as each engine pod starts (an init container of the server's image, with the database's address as its
  # one input), and no Secret: only with a Metrics release that declares its service `metrics-engine` (0.9.0 on), an
  # engine that reads FERRUM_METRICS_ENGINE_TOKEN_FILE, and a key file or a database password the vault opens with.
  # Empty: `secret`, and with `environment: minimal`, `rendered` (the server's image declares the service).
  files: ""
  configMap: ferrum-metrics-engine
  datasetsClaim: ferrum-metrics-datasets
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 3Gi}

# A Job that migrates the database before an install or upgrade (Helm hook): it runs the server
# image with `args`, `task migrate`, which applies the kernel's SQL migrations and syncs the schema, and
# fails the release when one fails: a database that is down or refuses the role stops the release, and nothing rolls out.
# While it is enabled the server's pods also get `serverEnv`, FERRUM_MIGRATE_AT_START=false: they no longer migrate as they
# start, only check that the Job did, and refuse to start (naming the command) when it has not.
# Pods of the release before keep starting once the Job has run: on a database a newer build migrated,
# a build its COMPATIBLE_FROM lets in runs as a guest that changes nothing (docs/operations.md, Rolling
# back), so a paused or failed rollout keeps its capacity and `helm rollback` needs no Job.
# Off, each pod migrates itself at start, as the Compose files do.
migrate:
  enabled: true
  args: ["task", "migrate"]
  serverEnv:   # entries of `env`, added to the server while the Job is enabled
    - {name: FERRUM_MIGRATE_AT_START, value: "false"}
  backoffLimit: 2
  activeDeadlineSeconds: 600

# Create the namespace from the chart: off, use `helm install --create-namespace`. (With it on,
# do not also pass --create-namespace.)
namespace:
  create: false
