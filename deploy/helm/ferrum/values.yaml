# Ferrum: the stateless server, its PostgreSQL cluster (CloudNativePG), the PDF renderer, the
# online editor for Word, Excel and PowerPoint files (Collabora Online), the Gateway in front, and
# two optional parts. The defaults render what deploy/k8s renders
# (deploy/helm/test.sh checks that). Install: docs/operations.md, "Installing with the Helm chart".

# Names are "<fullnameOverride>", "<fullnameOverride>-pdf", "<fullnameOverride>-db" and so on.
fullnameOverride: ferrum

# The server's image. Set digest (preferred) or tag; rendering fails when neither is set, and
# there is no default: `latest` is never used. The digest wins when both are set.
image:
  repository: ghcr.io/cbferrum/ferrum
  digest: ""    # sha256:...
  tag: ""       # a commit's full SHA

# The address users open; the Gateway's host below should match.
publicUrl: https://erp.example.com
logLevel: info
# Connections each replica may open (plus 4 on the side). Autoscaling's maxReplicas x (this + 4)
# must fit the database's connectionLimit.
dbMaxConnections: 30

# Attachments must be shared by all replicas: object storage. The credentials are
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the Secret below.
storage:
  bucket: CHANGE-ME-files-bucket
  region: ap-south-1
  endpoint: ""  # MinIO, Cloudflare R2 and other S3-compatible stores: https://<account>.r2.cloudflarestorage.com

# The name of a Secret you created. The chart creates none and holds no secret value. Keys:
#   JWT_SECRET, FERRUM_SECRET_KEY, FERRUM_BOOTSTRAP_TOKEN, FERRUM_METRICS_TOKEN,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# and, optional: FERRUM_CLAMAV_ADDR, FERRUM_CLAMAV_MAX_MB, FERRUM_CONNECTION_UPLOAD_MB, FERRUM_OPS_TELEMETRY_DAYS,
#   FERRUM_RETIRED_SECRET_KEYS.
secrets:
  existingSecret: ferrum-secrets
  # Optional: have the External Secrets Operator (installed separately) make that Secret from your
  # secret store (Vault, AWS Secrets Manager, Google Secret Manager, ...). Off: create it yourself.
  externalSecret:
    enabled: false
    secretStoreRef: {name: "", kind: ClusterSecretStore}
    refreshInterval: 1h
    # Every key at once, from one entry holding them all:
    dataFrom: []   # - extract: {key: ferrum/production}
    # Or key by key:
    data: []       # - {secretKey: JWT_SECRET, remoteRef: {key: ferrum/production, property: JWT_SECRET}}

# Settings the chart does not know yet: entries of a container's `env`, added to the server.
extraEnv: []
# - {name: FERRUM_PROXY_HOPS, value: "2"}

# No replicas are set while autoscaling is enabled: the autoscaler owns the count.
replicas: 3     # used only when autoscaling.enabled is false
autoscaling:
  enabled: true
  minReplicas: 3
  # Each replica may open dbMaxConnections + 4 connections; 10 x 34 fits max_connections 400.
  # Add a PgBouncer pooler before raising this.
  maxReplicas: 10
  cpuUtilization: 70
  scaleDownStabilizationSeconds: 300

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 1Gi}

pdb:
  enabled: true
  maxUnavailable: 1

# Pools: several Deployments of the same server image that differ only in settings (docs/operations.md,
# "Deployment shapes"; ready-made shapes in presets/). Empty: one Deployment, as above. The first pool keeps
# today's names and selector (so a release upgrades in place); every other pool is "<fullname>-<name>" with
# its own Deployment, autoscaler (or fixed replicas), disruption budget, network policy and, unless
# `background: only`, Service. A pool takes every setting it leaves out from the top-level values above.
pools: []
# - name: web                  # lower-case letters, digits and dashes; unique
#   background: both           # both | off (FERRUM_RUN_BACKGROUND=false: API only) | only (no Service, no routes)
#   replicas: 3                # used when autoscaling.enabled is false
#   autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 10}
#   keda: {enabled: false}       # background: only pools: scale on waiting work (`keda` below)
#   resources: {requests: {cpu: 250m, memory: 256Mi}}
#   dbMaxConnections: 30       # FERRUM_DB_MAX_CONNECTIONS for this pool
#   pdb: {enabled: true, maxUnavailable: 1}
#   env: []                    # entries of `env`; a name already set is replaced
#   nodeSelector: {}
#   tolerations: []
#   priorityClassName: ""        # e.g. a low class for a public pool, so it is evicted first
#   affinity: {}                 # the pod's affinity, e.g. private pools on nodes of their own
#   topologySpreadConstraints: [] # replaces the default spread over zones and hosts
#   zone: ""                   # a name from `zones`: FERRUM_ZONE, and the pod label ferrum.dev/zone
#   routes:                    # what reaches this pool; the rest goes to each gateway's defaultPool
#     - gateway: public        # public | private
#       hostnames: []          # whole hosts (with no paths or apps); empty: the gateway's own hosts
#       paths: []              # path prefixes
#       apps: []               # app ids, matched on the X-Ferrum-UI header ({app}@{version})

# Scaling a pool with `background: only` on how much work waits, with KEDA (installed separately; the chart
# installs no part of it). A pool turns it on with `keda: {enabled: true}` and takes the rest from here; it
# must then have `autoscaling: {enabled: false}`, since an autoscaler and KEDA would both own its replicas.
# The triggers read the server's gauges through Prometheus (the ServiceMonitor and PodMonitor above). Every
# replica reports the same figures, which it reads from the database, so the queries take `max`, never `sum`.
#   ferrum_outbox_pending              events not yet handled (also those waiting to be retried)
#   ferrum_jobs_oldest_waiting_seconds how long the oldest job that is due has waited (0: none)
keda:
  minReplicas: 1               # at least 1: schedules and upkeep show in no gauge, so none would wake a worker
  maxReplicas: 4               # counted in the connection budget
  pollingInterval: 30
  cooldownPeriod: 300
  prometheusAddress: ""        # e.g. http://prometheus-operated.monitoring.svc:9090
  outboxPerReplica: 500        # one more replica for every this many events waiting
  jobWaitSeconds: 60           # more replicas while the oldest due job has waited longer than this
  triggers: []                 # KEDA triggers that replace the two above (ScaledObject spec.triggers)

# Zones (docs/plan/topology.md, D4): name -> rule, given to every pool as FERRUM_ZONES (JSON). A rule:
# {staff: all | none | [app, ...], admin: true|false, scim: true|false, networks: [cidr, ...]}.
# Empty: one unnamed zone admitting everyone, as before.
zones: {}
# public: {staff: none}
# office: {staff: all}
zoneDefault: ""   # FERRUM_ZONE_DEFAULT: the zone of a request no host or network places
zoneMode: ""      # FERRUM_ZONE_MODE: enforce (the server's default) or report

# Only the Gateway's proxies and Prometheus may reach the server; it may reach the database, the
# PDF renderer, DNS and HTTPS/SMTP endpoints.
networkPolicy:
  enabled: true
  ingressNamespaces: [envoy-gateway-system, monitoring]   # the Gateway's proxies; Prometheus
  # With pools, each pool admits only the Envoy proxies of the gateways whose routes lead to it (Envoy
  # Gateway's owning-gateway labels, in this namespace), Prometheus, and, for the first pool, the editor.
  gatewayNamespace: envoy-gateway-system
  monitoringNamespaces: [monitoring]
  # The server may reach any host on 443 (HTTPS) and 587 (mail). false: only the networks in egressCIDRs
  # (include object storage, mail, and every service your connections call).
  egressAnyHost: true
  egressCIDRs: []

# Needs the Prometheus operator. Also scrapes the database's exporter when database.enabled.
serviceMonitor:
  enabled: true
  interval: 30s

# Needs a Gateway API implementation and cert-manager. The class and the Envoy proxy settings
# are Envoy Gateway's (tested with it); for another implementation set gatewayClassName and
# envoyProxy.enabled: false, and add its proxies' namespace to networkPolicy.ingressNamespaces.
gateway:
  enabled: true
  gatewayClassName: eg
  hostname: erp.example.com
  clusterIssuer: letsencrypt
  tlsSecretName: ferrum-tls
  # With pools: the pool that answers what no pool's route takes (empty: the first pool). Hosts that
  # pools' routes name get listeners here, with the same certificate.
  defaultPool: ""
envoyProxy:
  enabled: true
  replicas: 2

# A second Gateway, for traffic from inside your network: its own hosts, certificate and Envoy proxies,
# behind an internal load balancer (envoyService: Envoy Gateway's Service settings, where your cloud's
# annotation for an internal load balancer goes). Pools say in `routes` which gateway reaches them.
privateGateway:
  enabled: false
  name: ""                         # empty: "<fullname>-private"
  gatewayClassName: eg
  hostnames: [erp.internal.example.com]
  clusterIssuer: ""                # empty: no cert-manager annotation; create tlsSecretName yourself
  tlsSecretName: ferrum-private-tls
  defaultPool: ""                  # what no pool's route takes; required with pools
  envoyProxy:
    enabled: true
    replicas: 2
    envoyService:
      externalTrafficPolicy: Local
      annotations: {}
      # AWS:   service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      # GCP:   networking.gke.io/load-balancer-type: Internal
      # Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# A CloudNativePG Cluster with continuous backups (Barman Cloud plugin). Off: bring your own
# database and name the Secret holding its connection URI in urlSecret.
database:
  enabled: true
  urlSecret: {name: "", key: uri}   # used when enabled is false
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storageSize: 100Gi
  walStorageSize: 20Gi
  # What the application role may hold; max_connections minus 30 for administration,
  # replication and a migration.
  connectionLimit: 370
  parameters:
    max_connections: "400"
    shared_buffers: 2GB
    effective_cache_size: 6GB
    work_mem: 16MB
    idle_in_transaction_session_timeout: 60s
    lock_timeout: 15s
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {memory: 8Gi}
  backup:
    destinationPath: s3://CHANGE-ME-backup-bucket/ferrum
    endpointURL: ""                    # S3-compatible stores
    credentialsSecret: ferrum-backup-s3  # keys ACCESS_KEY_ID, ACCESS_SECRET_KEY
    retention: 30d
    schedule: "0 0 2 * * *"            # six fields, seconds first
    # The name this cluster's backups and WAL go under in destinationPath (empty: "<fullname>-db"). A new
    # cluster refuses to archive where one of the same name already did: give it a new name when it starts
    # from a copy or a backup of a cluster that wrote there.
    serverName: ""
  # A connection pooler (PgBouncer, as CloudNativePG's Pooler) in front of the primary, in transaction mode,
  # with protocol-level prepared statements (PgBouncer 1.21 or later; CloudNativePG's own image is newer).
  # On, the server's DATABASE_URL points at it and FERRUM_DATABASE_DIRECT_URL at the primary, which the
  # server uses for LISTEN, session locks and migrations (the migrate Job always connects directly). Only
  # with a server that reads FERRUM_DATABASE_DIRECT_URL: an older one would LISTEN through the pooler.
  # PostgreSQL then sees `instances x poolSize` connections from the pooler (plus reserve_pool_size, if
  # set in parameters) and directConnectionsPerReplica from each server replica.
  pooler:
    enabled: false
    instances: 2
    poolSize: 40                  # default_pool_size: connections each instance keeps to PostgreSQL
    maxClientConnections: 1000    # max_client_conn: each instance's connections from server replicas
    maxPreparedStatements: 200    # max_prepared_statements; 0 turns prepared statements off
    parameters: {}                # other PgBouncer settings CloudNativePG allows
    # Each replica's direct connections: listeners and locks. To be confirmed by the server change.
    directConnectionsPerReplica: 8
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 256Mi}
  # How the database starts, read once when the Cluster is created (docs/operations.md, "Moving from one
  # shape to another"). Keep the same values on later upgrades.
  #   empty     a new, empty database
  #   import    a dump of one database from a running PostgreSQL (pg_dump, then pg_restore here); any
  #             version up to imageName's. The server treats the result as restored from a backup and holds
  #             mail, webhooks, jobs and commands until an operator releases them.
  #   copy      a physical copy of a running PostgreSQL (pg_basebackup), which must run imageName's major
  #             version (17) on the same architecture with the same tablespaces, allow a replication
  #             connection from this cluster in pg_hba.conf and have max_wal_senders free for two. It keeps
  #             the database's identity, but starts on a new timeline: the server holds as after a restore
  #             unless FERRUM_HOLD_ON_TIMELINE is false. Stop writes to the source first.
  #   recovery  the newest state, or the state at targetTime, from the backups in object storage (the Barman
  #             Cloud plugin, as this chart backs up). Held as after a restore.
  bootstrap:
    mode: empty
    source:                    # import and copy: the existing server, reachable from this cluster
      host: ""
      port: 5432
      database: ferrum         # the database to import or, for copy, the one the application uses
      user: ""                 # import: a superuser (row-level security hides rows from any other role);
                               # copy: a role with REPLICATION and LOGIN
      passwordSecret: {name: "", key: password}   # a Secret you created, holding that role's password
      sslmode: prefer
    recovery:
      objectStore: ""          # an ObjectStore holding the backups; empty: this chart's own "<fullname>-backups"
      serverName: ""           # the name they were taken under; empty: "<fullname>-db"
      targetTime: ""           # e.g. "2026-11-14 10:00:00+00"; empty: up to the last archived change

# The PDF renderer (Gotenberg). The server needs it for print formats.
pdf:
  enabled: true
  replicas: 2
  image: {repository: gotenberg/gotenberg, digest: "", tag: "8"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The online editor for Drive: Collabora Online opens and co-edits Word, Excel and PowerPoint files
# (docs/operations.md, "Online editing"). On by default; `enabled: false` turns it off and takes it
# out of the server's settings. It is the Development Edition (CODE): free, with no vendor support;
# a supported build is Collabora's subscription or your own build (set image.repository).
# It lives in a namespace of its own (the chart creates it) because it needs capabilities the
# `restricted` Pod Security level refuses, and on a host of its own, a sibling of the server's (an
# origin of its own: it must never share Ferrum's). Only that host's /browser and /cool paths are
# public; the administration console, metrics and conversion service are sent back to Ferrum.
# One replica: Collabora keeps each open document in the pod that opened it, and the Gateway API
# cannot route by document, so size the pod instead (about 590 MiB at rest and 50 to 60 MiB for each small open
# document). Above 1 the chart adds a PodDisruptionBudget, but a document then lives in whichever
# pod the Gateway picked: only with routing by WOPISrc of your own.
office:
  enabled: true
  namespace: ferrum-office
  host: office.example.com
  tlsSecretName: ferrum-office-tls
  replicas: 1
  # The namespaces of the Gateway's proxies, the only pods besides the server that may reach the editor.
  gatewayNamespaces: [envoy-gateway-system]
  image: {repository: collabora/code, digest: "", tag: "26.04.5.2.1"}
  # An optional Secret in the editor's namespace holding the WOPI proof key (key `proof_key`, a
  # PEM RSA key: openssl genrsa -traditional -out proof_key 2048). With it, Ferrum refuses any WOPI
  # call the editor did not sign. Create it before the first start, or restart the pod after.
  proofKeySecret: ferrum-office-proof
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}

# Browser editors for Drive (docs/operations.md, "Browser editors"): a server on a host of its own.
editors:
  enabled: false
  host: editors.example.com
  tlsSecretName: ferrum-editors-tls
  replicas: 2
  image: {repository: ghcr.io/cbferrum/ferrum-editors, digest: "", tag: ""}
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

# Metrics' engine for external sources (docs/operations.md). Create these first: the Secret
# (key `token`, 32 characters or more), the ConfigMap (key `engine.json`) and a ReadOnlyMany
# PersistentVolumeClaim holding the datasets.
metricsEngine:
  enabled: false
  replicas: 2
  image: {repository: ghcr.io/cbferrum/ferrum-metrics-engine, digest: "", tag: ""}
  tokenSecret: {name: ferrum-metrics-engine, key: token}
  configMap: ferrum-metrics-engine
  datasetsClaim: ferrum-metrics-datasets
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 3Gi}

# A Job that migrates the database before an install or upgrade (Helm hook): it runs the server
# image with `args`, `task migrate`, which applies the kernel's SQL migrations, syncs the schema and
# runs the one-time upgrade steps, and fails the release when one fails. While it is enabled the
# server's pods also get `serverEnv`, FERRUM_MIGRATE_AT_START=false: they no longer migrate as they
# start, only check that the Job did, and refuse to start (naming the command) when it has not.
# Off, each pod migrates itself at start, as the Compose files do.
# With database.enabled the Cluster does not exist yet on the first install (hooks run first), so on
# that install the chart renders no Job and the pods migrate themselves; every upgrade after uses the Job.
migrate:
  enabled: false
  args: ["task", "migrate"]
  serverEnv:   # entries of `env`, added to the server while the Job is enabled
    - {name: FERRUM_MIGRATE_AT_START, value: "false"}
  backoffLimit: 2
  activeDeadlineSeconds: 600

# Create the namespace from the chart: off, use `helm install --create-namespace`. (With it on,
# do not also pass --create-namespace.)
namespace:
  create: false
