# kubectl apply -k deploy/k8s   (after creating the secrets described in secret.example.yaml)
# Requires the CloudNativePG operator with its Barman Cloud plugin, a Gateway API implementation,
# cert-manager with Gateway API support (for TLS and the plugin), metrics-server (for the
# autoscaler) and optionally the Prometheus operator (ServiceMonitor). CI deploys these manifests
# to a kind cluster with the versions in deploy/kind/install.sh; see docs/operations.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ferrum
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - web.yaml
  - pdf.yaml
  - service.yaml
  - gateway.yaml
  - envoy-proxy.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
# Browser editors (docs/operations.md, "Browser editors"): uncomment, and set its hosts in editors/.
# components:
#   - editors
images:
  - name: ferrum
    newName: ghcr.io/cbferrum/ferrum
    newTag: latest
  - name: ferrum-frontend
    newName: ghcr.io/cbferrum/ferrum-frontend
    newTag: latest
  - name: ghcr.io/cbferrum/ferrum-editors
    newTag: latest
