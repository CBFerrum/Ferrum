apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferrum
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # Per client IP; offices behind one NAT share it, so keep it generous.
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [erp.example.com]
      secretName: ferrum-tls
  rules:
    - host: erp.example.com
      http:
        paths:
          # API, downloads, AI agents (MCP) and realtime go straight to the server…
          - {path: /api, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /files, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /ws, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /oauth, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /.well-known/oauth-protected-resource, pathType: Prefix, backend: {service: {name: ferrum, port: {name: http}}}}
          - {path: /.well-known/oauth-authorization-server, pathType: Exact, backend: {service: {name: ferrum, port: {name: http}}}}
          # …everything else is the web app.
          - {path: /, pathType: Prefix, backend: {service: {name: ferrum-web, port: {name: http}}}}
