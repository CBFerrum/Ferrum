# Prometheus operator scrape config for /metrics (remove if the operator is not installed).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ferrum
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ferrum}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      bearerTokenSecret: {name: ferrum-secrets, key: FERRUM_METRICS_TOKEN}
