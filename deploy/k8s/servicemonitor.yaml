# Prometheus operator scrape configs: the API's /metrics and the database instances' exporter
# (remove this file if the operator is not installed).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ferrum
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ferrum}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials: {name: ferrum-secrets, key: FERRUM_METRICS_TOKEN}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ferrum-db
spec:
  selector:
    matchLabels: {cnpg.io/cluster: ferrum-db}
  podMetricsEndpoints:
    - port: metrics
