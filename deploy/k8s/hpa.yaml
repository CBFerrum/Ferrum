apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ferrum
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ferrum}
  minReplicas: 3
  # Each replica may open 36 database connections (its pool of 30, 4 side, 2 direct) and 2 more while it starts;
  # (9 + 1 in a rollout) × 36, the one starting's 2 and Cloud's 20 = 382 fit the role's limit of 390
  # (docs/operations.md, "Database role"). Add a
  # PgBouncer pooler before raising this.
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
