# Traffic from outside, through the Gateway API (the ingress-nginx controller was retired in March
# 2026). The Gateway terminates TLS with a certificate cert-manager issues for the host and
# redirects plain HTTP to HTTPS; the API, downloads, the MCP endpoint, WebSockets and OAuth go
# straight to the server, everything else to the web app. Request bodies are streamed (the server
# limits their size) and every client address has a request budget in the server itself.
# Tested with Envoy Gateway (GatewayClass `eg`, its proxies set up in envoy-proxy.yaml). For
# another implementation, set gatewayClassName, drop infrastructure.parametersRef and
# envoy-proxy.yaml, and allow its proxies' namespace in networkpolicy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ferrum
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: ferrum}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: erp.example.com
      tls:
        mode: Terminate
        certificateRefs: [{name: ferrum-tls}]
      allowedRoutes: {namespaces: {from: Same}}
    - name: http
      protocol: HTTP
      port: 80
      hostname: erp.example.com
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferrum-https-redirect
spec:
  parentRefs: [{name: ferrum, sectionName: http}]
  hostnames: [erp.example.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferrum
spec:
  parentRefs: [{name: ferrum, sectionName: https}]
  hostnames: [erp.example.com]
  rules:
    # Long-lived connections: WebSockets and MCP streams have no overall time limit.
    - matches:
        - path: {type: PathPrefix, value: /ws}
        - path: {type: PathPrefix, value: /mcp}
      backendRefs: [{name: ferrum, port: 80}]
      timeouts: {request: "0s"}
    # The rest of the server: large exports and imports may take minutes.
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /files}
        - path: {type: PathPrefix, value: /oauth}
        - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource}
        - path: {type: Exact, value: /.well-known/oauth-authorization-server}
        # Calendar and contacts apps look here first (docs/operations.md, "Calendar and contacts apps").
        - path: {type: Exact, value: /.well-known/caldav}
        - path: {type: Exact, value: /.well-known/carddav}
      backendRefs: [{name: ferrum, port: 80}]
      timeouts: {request: 600s}
    - backendRefs: [{name: ferrum-web, port: 80}]
