# Metrics' engine for external sources (docs/operations.md, "Metrics' engine for external sources"; the Metrics
# repository's docs/engine.md), and the settings that point Ferrum at it. To use it, list it under `components:`
# in deploy/k8s/kustomization.yaml, after creating in the namespace:
#   - the Secret ferrum-metrics-engine, key `token` (32 characters or more), which Ferrum sends and the engine checks;
#   - the ConfigMap ferrum-metrics-engine, key `engine.json`: the datasets (paths under /data) and the limits;
#   - the PersistentVolumeClaim ferrum-metrics-datasets (ReadOnlyMany) holding the datasets.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - metrics-engine.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ferrum
      spec:
        template:
          spec:
            containers:
              - name: ferrum
                env:
                  - {name: FERRUM_METRICS_ENGINE_URL, value: "http://ferrum-metrics-engine:5180"}
                  - name: FERRUM_METRICS_ENGINE_TOKEN
                    valueFrom: {secretKeyRef: {name: ferrum-metrics-engine, key: token}}
  # The API may reach the engine.
  - target: {kind: NetworkPolicy, name: ferrum}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels: {app.kubernetes.io/name: ferrum-metrics-engine}
          ports:
            - {port: 5180}
