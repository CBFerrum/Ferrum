# Metrics' engine: a metric's Wren semantic model over the operator's CSV and Parquet datasets, planned by Wren
# and run on DataFusion, apart from the API so that a heavy query is bounded here. Stateless: two replicas,
# either one answering. Only the API may call it, with the token both hold, and it calls nothing: it reads the
# datasets mounted read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-metrics-engine
  labels: {app.kubernetes.io/name: ferrum-metrics-engine}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ferrum-metrics-engine}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ferrum-metrics-engine}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ferrum-metrics-engine}
      # SIGTERM: it stops taking work and finishes what it holds, each query within its time limit.
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          # Published from the Metrics repository's main (its engine-image job); an overlay may pin a digest.
          image: ghcr.io/cbferrum/ferrum-metrics-engine:latest
          ports:
            - {name: http, containerPort: 5180}
          env:
            - {name: FERRUM_METRICS_ENGINE_CONFIG, value: /etc/ferrum/engine.json}
            - {name: FERRUM_METRICS_ENGINE_ADDR, value: "0.0.0.0:5180"}
            - name: FERRUM_METRICS_ENGINE_TOKEN
              valueFrom: {secretKeyRef: {name: ferrum-metrics-engine, key: token}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          # Each query at once may hold its configuration's memory_mb: 4 × 512 MiB unless set, and the engine's
          # own overhead. Raise the limit with either.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 3Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/ferrum, readOnly: true}
            - {name: datasets, mountPath: /data, readOnly: true}
      volumes:
        - name: config
          configMap: {name: ferrum-metrics-engine, items: [{key: engine.json, path: engine.json}]}
        - name: datasets
          persistentVolumeClaim: {claimName: ferrum-metrics-datasets, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-metrics-engine
spec:
  selector: {app.kubernetes.io/name: ferrum-metrics-engine}
  ports:
    - {name: http, port: 5180, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferrum-metrics-engine
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ferrum-metrics-engine}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ferrum}
      ports:
        - {port: 5180}
  egress: []
---
# Node drains and upgrades take at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferrum-metrics-engine
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ferrum-metrics-engine}
