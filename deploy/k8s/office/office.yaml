# The online editor: Collabora Online Development Edition (CODE), a free development edition without
# vendor support (docs/operations.md says what production use needs). One replica: Collabora keeps
# each open document in the pod that opened it, so several replicas would need routing by document
# (consistent hashing on WOPISrc), which the Gateway API cannot express; size the one pod instead.
# It serves only Ferrum's WOPI host, shows no administration console, and may be reached by the
# gateway's proxies (browsers) and by the Ferrum server (discovery), nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-office
  labels: {app.kubernetes.io/name: ferrum-office}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ferrum-office}
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {app.kubernetes.io/name: ferrum-office}
    spec:
      automountServiceAccountToken: false
      # Time to save and unload open documents.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collabora
          image: collabora/code
          ports:
            - {name: http, containerPort: 9980}
          env:
            # The only WOPI host it serves: Ferrum, as the editor reaches it. Nothing else is accepted.
            - {name: aliasgroup1, value: "http://ferrum.ferrum.svc.cluster.local:80"}
            # The host browsers use; the gateway terminates TLS, and only Ferrum's pages may frame it.
            - {name: server_name, value: "office.example.com"}
            - name: extra_params
              value: >-
                --o:ssl.enable=false
                --o:ssl.termination=true
                --o:net.frame_ancestors=https://erp.example.com
                --o:admin_console.enable=false
                --o:allow_update_popup=false
                --o:logging.level=warning
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 3Gi}
          # The jails need file capabilities on the editor's helper, so privilege escalation is
          # allowed; the container keeps only the four capabilities the jails take.
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "MKNOD", "SYS_CHROOT"]
          volumeMounts:
            # The WOPI proof key, when the Secret exists (docs/operations.md): without it the editor
            # publishes no key and Ferrum cannot tell its calls from a stolen token's.
            - {name: proof, mountPath: /etc/coolwsd/proof_key, subPath: proof_key, readOnly: true}
          startupProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /hosting/discovery, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
      volumes:
        - name: proof
          secret: {secretName: ferrum-office-proof, optional: true, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-office
spec:
  selector: {app.kubernetes.io/name: ferrum-office}
  ports:
    - {name: http, port: 9980, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferrum-office-https-redirect
spec:
  parentRefs: [{name: ferrum, namespace: ferrum, sectionName: office-http}]
  hostnames: [office.example.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferrum-office
spec:
  parentRefs: [{name: ferrum, namespace: ferrum, sectionName: office-https}]
  hostnames: [office.example.com]
  rules:
    # Not for the public: the administration console, its metrics, and the conversion service
    # (its callers are checked by address, and the gateway's address is one it trusts). Sent back
    # to Ferrum's home page.
    - matches:
        - path: {type: PathPrefix, value: /cool/adminws}
        - path: {type: PathPrefix, value: /cool/getMetrics}
        - path: {type: PathPrefix, value: /cool/convert-to}
        - path: {type: PathPrefix, value: /browser/dist/admin}
        - path: {type: PathPrefix, value: /hosting/discovery}
        - path: {type: PathPrefix, value: /hosting/capabilities}
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, hostname: erp.example.com, statusCode: 302}
    # The editor's pages and its WebSockets, which have no overall time limit.
    - matches:
        - path: {type: PathPrefix, value: /browser}
        - path: {type: PathPrefix, value: /cool}
      backendRefs: [{name: ferrum-office, port: 9980}]
      timeouts: {request: "0s"}
---
# The gateway's proxies (browsers) and the Ferrum server (discovery) reach it; it reaches Ferrum's
# WOPI endpoints and DNS, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferrum-office
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ferrum-office}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ferrum}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ferrum}
      ports:
        - {port: 9980}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ferrum}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ferrum}
      ports:
        - {port: 5150}
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
