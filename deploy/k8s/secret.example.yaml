# Not applied by kustomize: create the secrets yourself. None of ferrum-secrets' keys is required: the vault holds the
# platform's secrets (docs/operations.md, "The platform's secrets"; `ferrum task secret_set`), and the environment, where
# it still sets one, wins in this release. The vault's key file is made once and kept (docs/operations.md, "The vault"):
#   kubectl -n ferrum create secret generic ferrum-vault-key --from-literal=root.key="$(openssl rand -base64 32)"
# Keep a copy of it apart from the database's backups; a new cluster that takes this database over needs the same one.
# Then, only what you still give through the environment, e.g.:
#   kubectl -n ferrum create secret generic ferrum-secrets \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#   kubectl -n ferrum create secret generic ferrum-backup-s3 \
#     --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=...
# The database credentials (secret `ferrum-db-app`) are generated by CloudNativePG.
apiVersion: v1
kind: Secret
metadata:
  name: ferrum-secrets
type: Opaque
stringData:
  # Each optional (the vault's, once set there):
  # JWT_SECRET: ""                 # sessions are signed with the vault's keys without it
  # FERRUM_BOOTSTRAP_TOKEN: ""
  # FERRUM_METRICS_TOKEN: ""
  # FERRUM_OPERATOR_TOKEN: ""      # the settings routes for the Operations screen; absent, they answer nobody
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
