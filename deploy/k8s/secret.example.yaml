# Not applied by kustomize — create the secrets yourself, e.g.:
#   kubectl -n ferrum create secret generic ferrum-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=FERRUM_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=FERRUM_BOOTSTRAP_TOKEN="" \
#     --from-literal=FERRUM_METRICS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#   kubectl -n ferrum create secret generic ferrum-backup-s3 \
#     --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=...
# The database credentials (secret `ferrum-db-app`) are generated by CloudNativePG.
apiVersion: v1
kind: Secret
metadata:
  name: ferrum-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-openssl-rand-base64-48"
  FERRUM_SECRET_KEY: "replace-with-openssl-rand-base64-32"
  FERRUM_BOOTSTRAP_TOKEN: ""
  FERRUM_METRICS_TOKEN: "replace-with-openssl-rand-hex-32"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
