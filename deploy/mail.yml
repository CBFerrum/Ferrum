# Hosted mail: a Stalwart mail server beside the stack, holding the workspaces' mailboxes
# (docs/operations.md, "Hosted mail").
#   docker compose -f deploy/docker-compose.yml -f deploy/mail.yml --env-file deploy/.env up -d
# Before the first start, store the mail server's address, whose host the vault binds its administrator's secret to:
# `ferrum task set key:comms.mail_url value:http://mail:8080`. That secret (Stalwart's fallback administrator, `admin`)
# is made by the vault and rendered by a one-shot service before each start of Stalwart into a volume the two share
# (docs/operations.md, "Files for the programs beside the server"). In Stalwart's config.toml (the mail-config
# volume), once:
#   authentication.fallback-admin.user = "admin"
#   authentication.fallback-admin.secret = "%{file:/run/mail-files/admin-secret}%"
# Rotating it: `ferrum task vault_rotate level:service service:mail`, then restart mail (it takes one value). If the
# mail server's address moves, store the new one and rotate: the new secret goes to the new address only.
services:
  mail-files:
    image: ${FERRUM_IMAGE:?set FERRUM_IMAGE to a commit tag, docs/operations.md "Images"}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    # Its one input: the database's address. What it writes comes from the database and the vault.
    environment:
      DATABASE_URL: postgres://ferrum:${FERRUM_DB_PASSWORD}@db:5432/ferrum
    command: ["task", "render", "service:mail", "to:/var/lib/ferrum/companion"]
    volumes:
      # Owned by the server's user, as the image's directory is.
      - mail-files:/var/lib/ferrum/companion
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  mail:
    image: stalwartlabs/stalwart:${STALWART_TAG:-v1.0}
    restart: unless-stopped
    depends_on:
      mail-files:
        condition: service_completed_successfully
    volumes:
      - mail-config:/etc/stalwart
      - mail-data:/var/lib/stalwart
      - mail-files:/run/mail-files:ro
    ports:
      - "25:25" # mail from other servers
      - "465:465" # submission (TLS)
      - "587:587" # submission (STARTTLS)
      - "993:993" # IMAP (TLS)
      - "4190:4190" # ManageSieve
      # Setup and administration over plain HTTP: on the host only.
      - "127.0.0.1:${MAIL_ADMIN_PORT:-8081}:8080"
  ferrum:
    environment:
      FERRUM_MAIL_URL: http://mail:8080
      FERRUM_MAIL_ADMIN: admin
      # The mail server's public host name, shown to people setting up mail programs.
      FERRUM_MAIL_HOST: ${FERRUM_MAIL_HOST:-}

volumes:
  mail-config:
  mail-data:
  mail-files:
