# Single-host deployment: PostgreSQL + the Ferrum server + the web app (which also proxies the API). For production use the Kubernetes manifests
# (replicated database, several API replicas, backups) — see docs/operations.md.
#   cp deploy/.env.example deploy/.env   # then edit the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml exec ferrum ferrum task create_tenant \
#     slug:acme name:"Acme Ltd" email:admin@acme.com password:'Change-Me-2026!'
name: ferrum

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The superuser is only for administration; Ferrum connects as the ordinary role `ferrum`
      # created by postgres-init (superusers bypass row-level security).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      FERRUM_DB_PASSWORD: ${FERRUM_DB_PASSWORD:?set FERRUM_DB_PASSWORD in deploy/.env}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "wal_level=replica"]
    volumes:
      - db:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferrum"]
      interval: 5s
      timeout: 5s
      retries: 20

  ferrum:
    image: ${FERRUM_IMAGE:-ghcr.io/cbferrum/ferrum:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ferrum:${FERRUM_DB_PASSWORD}@db:5432/ferrum
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      FERRUM_SECRET_KEY: ${FERRUM_SECRET_KEY:?set FERRUM_SECRET_KEY (openssl rand -base64 32)}
      FERRUM_BOOTSTRAP_TOKEN: ${FERRUM_BOOTSTRAP_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Single server: attachments on the local volume. Set FERRUM_S3_BUCKET (and FERRUM_S3_ENDPOINT,
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for MinIO/R2/...) to use object storage instead.
      FERRUM_REQUIRE_OBJECT_STORAGE: ${FERRUM_REQUIRE_OBJECT_STORAGE:-false}
      # Requests a user may make per minute on each replica (0: no limit).
      FERRUM_USER_REQUESTS_PER_MINUTE: ${FERRUM_USER_REQUESTS_PER_MINUTE:-3000}
      FERRUM_S3_BUCKET: ${FERRUM_S3_BUCKET:-}
      FERRUM_S3_ENDPOINT: ${FERRUM_S3_ENDPOINT:-}
      FERRUM_S3_REGION: ${FERRUM_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # PDFs of print formats (Download PDF, apps that attach documents); empty turns them off.
      FERRUM_PDF_URL: ${FERRUM_PDF_URL:-http://pdf:3000}
    volumes:
      - files:/var/lib/ferrum/files

  # Lays print formats out as PDFs. JavaScript is off and Chromium may load only the page itself
  # and inline images, so a template cannot make the renderer fetch anything.
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=^(data:|file:///tmp/).*", "--api-timeout=60s"]

  web:
    image: ${FERRUM_WEB_IMAGE:-ghcr.io/cbferrum/ferrum-frontend:latest}
    restart: unless-stopped
    depends_on:
      - ferrum
    environment:
      FERRUM_API_URL: http://ferrum:5150
    ports:
      - "${FERRUM_PORT:-8080}:8080"

volumes:
  db:
  files:
