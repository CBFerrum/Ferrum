# Single-host deployment: PostgreSQL + the Ferrum server (every page and the API) + the PDF renderer
# + the online editor for Word, Excel and PowerPoint files (Collabora Online). For production use the
# Kubernetes manifests (replicated database, several API replicas, backups): docs/operations.md.
# The renderer and the editor are on by default; each is turned off by one line in deploy/.env
# (FERRUM_PDF_URL=  and  FERRUM_OFFICE_URL=  , empty), see "Online editing" in docs/operations.md.
#   cp deploy/.env.example deploy/.env   # then edit the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml exec ferrum ferrum task create_tenant \
#     slug:acme name:"Acme Ltd" email:admin@acme.com password:'Change-Me-2026!'
name: ferrum

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The superuser is only for administration; Ferrum connects as the ordinary role `ferrum`
      # created by postgres-init (superusers bypass row-level security).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      FERRUM_DB_PASSWORD: ${FERRUM_DB_PASSWORD:?set FERRUM_DB_PASSWORD in deploy/.env}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "wal_level=replica"]
    # Parallel queries share memory through /dev/shm, which Docker makes 64 MB: a three-hour soak
    # ran out of it ("could not resize shared memory segment") once tables had grown.
    shm_size: 512mb
    volumes:
      - db:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Over TCP: while a new volume's init scripts run, the server listens on its socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ferrum"]
      interval: 5s
      timeout: 5s
      retries: 20

  ferrum:
    image: ${FERRUM_IMAGE:-ghcr.io/cbferrum/ferrum:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ferrum:${FERRUM_DB_PASSWORD}@db:5432/ferrum
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      FERRUM_SECRET_KEY: ${FERRUM_SECRET_KEY:?set FERRUM_SECRET_KEY (openssl rand -base64 32)}
      FERRUM_RETIRED_SECRET_KEYS: ${FERRUM_RETIRED_SECRET_KEYS:-}
      FERRUM_CLAMAV_ADDR: ${FERRUM_CLAMAV_ADDR:-}
      FERRUM_CLAMAV_MAX_MB: ${FERRUM_CLAMAV_MAX_MB:-25}
      FERRUM_OPS_TELEMETRY_DAYS: ${FERRUM_OPS_TELEMETRY_DAYS:-30}
      FERRUM_BOOTSTRAP_TOKEN: ${FERRUM_BOOTSTRAP_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Single server: attachments on the local volume. Set FERRUM_S3_BUCKET (and FERRUM_S3_ENDPOINT,
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for MinIO/R2/...) to use object storage instead.
      FERRUM_REQUIRE_OBJECT_STORAGE: ${FERRUM_REQUIRE_OBJECT_STORAGE:-false}
      # Requests a user may make per minute on each replica (0: no limit).
      FERRUM_USER_REQUESTS_PER_MINUTE: ${FERRUM_USER_REQUESTS_PER_MINUTE:-3000}
      # Per client address. Behind your own proxy (TLS), set FERRUM_PROXY_HOPS to how many there are,
      # so the server takes the address from X-Forwarded-For.
      FERRUM_ADDRESS_REQUESTS_PER_MINUTE: ${FERRUM_ADDRESS_REQUESTS_PER_MINUTE:-6000}
      FERRUM_PROXY_HOPS: ${FERRUM_PROXY_HOPS:-0}
      FERRUM_S3_BUCKET: ${FERRUM_S3_BUCKET:-}
      FERRUM_S3_ENDPOINT: ${FERRUM_S3_ENDPOINT:-}
      FERRUM_S3_REGION: ${FERRUM_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # PDFs of print formats (Download PDF, apps that attach documents); empty turns them off.
      # Set but empty (FERRUM_PDF_URL=) turns it off, and the renderer then does not start.
      FERRUM_PDF_URL: ${FERRUM_PDF_URL-http://pdf:3000}
      # Online editing of Word, Excel and PowerPoint files in Drive (the `office` service below).
      # FERRUM_OFFICE_URL: the editor as the server reaches it (set but empty turns it off, and the
      # editor then does not start); FERRUM_OFFICE_WOPI_URL: the server as the editor reaches it;
      # FERRUM_OFFICE_ORIGIN: the editor as browsers reach it, which Drive's pages may frame.
      FERRUM_OFFICE_URL: ${FERRUM_OFFICE_URL-http://office:9980}
      FERRUM_OFFICE_WOPI_URL: ${FERRUM_OFFICE_WOPI_URL:-http://ferrum:5150}
      FERRUM_OFFICE_ORIGIN: ${OFFICE_PUBLIC_URL:-http://localhost:9980}
      FERRUM_OFFICE_IPS: ${FERRUM_OFFICE_IPS:-}
      # The largest file in one request (Drive upload, version, editor save), in MB; the server
      # holds it in memory meanwhile. A proxy in front must let bodies that large through.
      FERRUM_DRIVE_MAX_FILE_MB: ${FERRUM_DRIVE_MAX_FILE_MB:-32}
      # How long one request may take, its body included (ms): raise it with the file size for slow links.
      FERRUM_REQUEST_TIMEOUT_MS: ${FERRUM_REQUEST_TIMEOUT_MS:-120000}
      # The Assistant (off without a key; docs/operations.md, "Assistant").
      FERRUM_ASSISTANT_API_KEY: ${FERRUM_ASSISTANT_API_KEY:-}
      FERRUM_ASSISTANT_MODEL: ${FERRUM_ASSISTANT_MODEL:-}
      FERRUM_ASSISTANT_URL: ${FERRUM_ASSISTANT_URL:-}
      FERRUM_ASSISTANT_EFFORT: ${FERRUM_ASSISTANT_EFFORT:-}
      FERRUM_ASSISTANT_FALLBACKS: ${FERRUM_ASSISTANT_FALLBACKS:-}
      FERRUM_ASSISTANT_CALLS_PER_HOUR: ${FERRUM_ASSISTANT_CALLS_PER_HOUR:-}
    ports:
      - "${FERRUM_PORT:-8080}:5150"
    volumes:
      - files:/var/lib/ferrum/files
    # As in deploy/k8s: a read-only root filesystem, no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Lays print formats out as PDFs. JavaScript is off and Chromium may load only the page itself
  # and inline images, so a template cannot make the renderer fetch anything.
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # One replica, or none when FERRUM_PDF_URL is set but empty (an own renderer: PDF_REPLICAS=0).
    deploy:
      replicas: ${PDF_REPLICAS:-${FERRUM_PDF_URL+0}${FERRUM_PDF_URL-1}}
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=^(data:|file:///tmp/).*", "--api-timeout=60s"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The online editor: Collabora Online Development Edition (CODE), a free development edition
  # without vendor support (docs/operations.md, "Online editing", says what production needs).
  # It opens and saves Drive's Word, Excel and PowerPoint files over WOPI, with each person's own
  # rights. Browsers reach it on a port and origin of its own (OFFICE_PORT; behind your TLS proxy,
  # its own host name): it must never share Ferrum's origin.
  office:
    image: collabora/code:${COLLABORA_TAG:-26.04.5.2.1}
    restart: unless-stopped
    # One replica, or none when FERRUM_OFFICE_URL is set but empty (an own editor: OFFICE_REPLICAS=0).
    deploy:
      replicas: ${OFFICE_REPLICAS:-${FERRUM_OFFICE_URL+0}${FERRUM_OFFICE_URL-1}}
    environment:
      # The only WOPI host it serves: Ferrum, as the editor reaches it. Nothing else is accepted.
      aliasgroup1: ${FERRUM_OFFICE_WOPI_URL:-http://ferrum:5150}
      # How browsers reach it: the host name (and port) it puts in its editor page addresses.
      server_name: ${OFFICE_PUBLIC_HOST:-localhost:9980}
      # Only Ferrum's pages may frame it; no administration console; plain HTTP behind your
      # TLS proxy (set OFFICE_TLS_TERMINATED=true when the proxy serves it over HTTPS); logs on stdout.
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=${OFFICE_TLS_TERMINATED:-false}
        --o:net.frame_ancestors=${PUBLIC_URL:-http://localhost:8080}
        --o:admin_console.enable=false
        --o:allow_update_popup=false
        --o:logging.level=warning
    volumes:
      # The WOPI proof key (docs/operations.md): with it, Ferrum refuses any WOPI call the editor did
      # not sign. deploy/preflight.sh --generate makes it and sets OFFICE_PROOF_KEY. Without one,
      # /dev/null: the editor logs that it found no key and publishes none.
      - ${OFFICE_PROOF_KEY:-/dev/null}:/etc/coolwsd/proof_key:ro
    ports:
      - "${OFFICE_BIND:-0.0.0.0}:${OFFICE_PORT:-9980}:9980"
    # Runs as user 1001. It builds a jail for each document, which takes these four capabilities and
    # file capabilities on its helper, so `no-new-privileges` cannot be set here.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, MKNOD, SYS_CHROOT]
    # Memory: about 590 MiB for the editor at rest and about 50 to 60 MiB for each small open document
    # (docs/operations.md, "Online editing", Sizing); larger files cost more.
    mem_limit: ${OFFICE_MEMORY:-2g}

volumes:
  db:
  files:
