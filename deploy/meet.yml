# Video meetings (docs/operations.md, "Meetings"): a LiveKit server beside the stack. Browsers reach
# it directly: signalling over a WebSocket on 7880 (FERRUM_MEET_URL: wss://meet.example.com behind
# your TLS proxy, or ws://localhost:7880 to try it on one machine) and sound and pictures over UDP
# 7882, or TCP 7881 where UDP is blocked. Open those two ports to the internet; 7880 only through
# your proxy.
#   docker compose -f deploy/docker-compose.yml -f deploy/meet.yml --env-file deploy/.env up -d
# In deploy/.env: FERRUM_MEET_URL. LiveKit's configuration file, with its key, is rendered from the server's
# database and vault by a one-shot service before each start of LiveKit (docs/operations.md, "Files for the programs
# beside the server"): the vault makes the key at the first render, and `ferrum task vault_rotate level:service
# service:meet` rotates it. LiveKit finds the address it gives browsers by STUN; to give it yourself, store it before
# the first start: `ferrum task set key:comms.meet_node_ip value:<address>` (and comms.meet_external_ip false on a
# network without internet access).
services:
  meet-files:
    image: ${FERRUM_IMAGE:?set FERRUM_IMAGE to a commit tag, docs/operations.md "Images"}
    restart: "no"
    # Its one input: the database's address (deploy/.env, as for the server). What it writes comes from the database and the vault.
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    command: ["task", "render", "service:meet", "to:/var/lib/ferrum/companion"]
    volumes:
      # Owned by the server's user, as the image's directory is.
      - meet-files:/var/lib/ferrum/companion
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  meet:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    depends_on:
      meet-files:
        condition: service_completed_successfully
    command: ["--config", "/run/meet-files/livekit.yaml"]
    volumes:
      - meet-files:/run/meet-files:ro
    ports:
      - "${FERRUM_MEET_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"
    # Nothing to write: rooms live in memory (a second LiveKit server needs Redis, see docs).
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  ferrum:
    environment:
      FERRUM_MEET_URL: ${FERRUM_MEET_URL:?set FERRUM_MEET_URL in deploy/.env (LiveKit as browsers reach it)}
      # Recordings, once LiveKit Egress runs beside LiveKit with its storage (docs/operations.md).
      FERRUM_MEET_RECORDINGS: ${FERRUM_MEET_RECORDINGS:-false}
      FERRUM_MEET_API_URL: ${FERRUM_MEET_API_URL:-}

volumes:
  meet-files:
