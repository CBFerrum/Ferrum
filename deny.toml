# cargo-deny: licences, sources, duplicate versions and advisories of everything in Cargo.lock
# (`cargo deny check`, run by `scripts/local_ci.sh audit`).
#
# Licences: the same acceptance as scripts/licenses.py (PERMISSIVE, WEAK_COPYLEFT, OURS) and docs/licenses.md.
# PostgreSQL and Unicode-DFS-2016 (accepted by scripts/licenses.py) are not in the lock today: add them when one arrives.
# An expression passes when one of its alternatives is allowed, as there.
[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "0BSD", "Zlib", "Unlicense", "CC0-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "BSL-1.0",
  # File-level copyleft, fine linked into AGPL software.
  "MPL-2.0",
  # Ferrum's own crates and the apps'.
  "AGPL-3.0-or-later", "AGPL-3.0-only",
]

# temporalio's crates name LICENSE.txt instead of an SPDX expression. The file says "The MIT License"
# (docs/references/logic.md); scripts/licenses.py re-reads it on every run and refuses a changed one, which
# this clarification does not.
[[licenses.clarify]]
name = "temporalio-client"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-common"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-common-wasm"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-macros"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-protos"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-sdk"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-sdk-core"
expression = "MIT"
license-files = []
[[licenses.clarify]]
name = "temporalio-workflow"
expression = "MIT"
license-files = []

# Only crates.io and the CBFerrum organisation's repositories (the apps, pinned in Cargo.lock).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-org = { github = ["CBFerrum"] }

# Advisories: the policy is `cargo audit`'s (.cargo/audit.toml, reasons in docs/registry/advisories.yaml). This list
# repeats .cargo/audit.toml: change both together.
# Unmaintained crates are not checked here: `cargo audit` reports them as warnings, not failures, and that is
# the policy kept.
[advisories]
unmaintained = "none"
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0387",
  "RUSTSEC-2026-0459",
  "RUSTSEC-2026-0441",
  "RUSTSEC-2026-0215",
  "RUSTSEC-2024-0449",
]

[bans]
# 51 names are in the lock twice or more today. This becomes "deny", with a skip list of what is left,
# once the count is driven down.
multiple-versions = "warn"
wildcards = "allow"
