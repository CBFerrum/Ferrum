areas:
  - area: Native business actions
    existing: [crates/meta/src/types.rs (ActionDef, ActionParam), crates/kernel/src/doc.rs (run_action_tx, transition_tx), crates/mcp/src/lib.rs]
    relationship: extend
    how: "Actions already carry typed parameters, permission, document states and a condition. Add an optional contract (effect class, returns, idempotency, completion, compensation, outcome lookup) with derived defaults; the catalog is built from installed packages, not typed in again"
    requirements: [FLC-CAP-001, FLC-CAP-002, FLC-CAP-006]
    confirmed: "Extended (W1): ActionDef.contract in crates/meta/src/types.rs, the catalog and gate in crates/kernel/src/capability.rs, built from installed packages; MCP and Studio serve the same descriptors (catalog_it). No second action model"
  - area: Record hooks
    existing: [crates/kernel/src/hooks.rs (DocHook, after, fills), crates/kernel/src/doc.rs]
    relationship: reuse
    how: "Compiled tenant rules run as a DocHook per workspace and entity; their derived fields join the fills check, so two writers of one field are refused"
    requirements: [FLC-HOOK-001, FLC-HOOK-003, FLC-HOOK-004]
    confirmed: "Reused (W2): customer rules run as one `*` DocHook (crates/kernel/src/logic.rs, TenantRules) after the apps' own hooks, and their fills join the conflict check (logic_rules_it)"
  - area: No external calls inside a record's transaction
    existing: [crates/plugins/src/host.rs, crates/plugins/tests/after_commit_it.rs]
    relationship: reuse
    how: "The plugin host already refuses fetches, sockets and resources inside a hook; tenant rules get no host at all, and the compiler refuses effects in rule phases before they run"
    requirements: [FLC-HOOK-002, FLC-COMP-008]
    confirmed: "Reused (W2): rule phases compile no effects (crates/logic/src/compile.rs) and the rules evaluator has no host; plugins keep their own refusal"
  - area: Automations
