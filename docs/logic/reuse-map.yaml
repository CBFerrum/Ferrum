# What the Logic Platform builds on (package MASTER_PLAN §3, FLC-BASE-003). Each area: the code that already
# does part of it, at the revision read, and how this program relates to it:
#   reuse    - used as it is
#   extend   - grows to cover the requirement; its owner and behaviour stay
#   migrate  - kept working, then carried into the new model with its identifiers and history
#   new      - nothing here does it
#   move     - code in another repository brought here because several components need it
# Confirmed when each workstream starts, and each `confirmed` below says what was built once all nine had landed
# (W0-W8, 8 November 2026): reused, extended, migrated, moved or new, and no area with two owners.
read_at:
  CBFerrum/Ferrum: a924d07 (confirmed; first read at 2c8f5d4ed0)
  CBFerrum/Ferrum-Frontend: 4ae0e39
