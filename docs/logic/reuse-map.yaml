    how: "Kept running. W2 fixes its e-mail (queued with the outbox in its transaction) and compiles its expressions once; W8 imports each into a draft with its id and history, and turns its saver's administrator rights into a reviewed grant"
    requirements: [FLC-MIG-001, FLC-HOOK-006, FLC-CAP-005]
    confirmed: "Migrated (W8): crates/kernel/src/authoring.rs imports each automation as a draft with provenance; activation hands its events over under the automation's lock (automation_run 'handed_over', process_it). Automations stay working until then"
