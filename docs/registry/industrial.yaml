# Industrial operations (docs/plan/industrial.md). Strategy assessment of 1 November 2026. Nothing has
# run on hardware, and nothing here is a functional-safety claim. `implemented_unqualified` means code
# with tests against stand-ins: qualification needs equipment, a site and people this repository has not.
defaults: {component: operations, repositories: [CBFerrum/Ferrum], workstream: 8, basis: tested}
