  - {id: FERRUM-INDUSTRY-003, title: "Retail and distribution: replenishment, omnichannel, franchise", spec: "10", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-retail], files: ["ferrum-app-retail:src/collect.rs", "ferrum-app-retail:src/franchise.rs", "ferrum-app-retail:src/transfer.rs", "ferrum-app-retail:src/site.rs", "ferrum-app-retail:ui/src/Portal.tsx", "ferrum-app-retail:packages/retail/entities/retail.yaml", "ferrum-app-retail:ui/src/Home.tsx", "ferrum-app-erp:addons/procurement/src/reorder.rs", "ferrum-app-retail:docs/PROVENANCE.md", "ferrum-app-retail:src/ship.rs", "ferrum-app-retail:src/returns.rs", "ferrum-app-retail:src/aisle.rs", "ferrum-app-retail:packages/retail/package.yaml"], tests: ["ferrum-app-retail:tests/retail_it.rs", "ferrum-app-erp:addons/procurement/tests/procurement_it.rs", "ferrum-app-retail:tests/omnichannel_it.rs"], limits: ["Click and collect from the store an order ships from, ready once the store holds it, handed over against its code with the delivery note submitted; franchise royalties and marketing fees reported for periods within the agreement and invoiced once through ERP; 22 mutants by hand; its own design", "Replenishment is ERP Procurement's auto-reorder levels per store warehouse, as transfers from the distribution centre: not reimplemented", "Transfers between stores: asked for, sent only from what the giving store holds into the goods in transit, and taken in whole or item by item, each move a submitted ERP stock entry; what never arrives is written off out of the goods in transit with what happened, closing the transfer short; without a transit warehouse it arrives as sent; turned down with a reason or cancelled", "Franchisees report their sales on the portal's Your franchise, under their own agreements and by the office's rules, and see the fees and issued invoices", "Stores are warehouses marked Is A Store. Ship from store: an online order is shipped from a named store, or else from the store holding the most of it among those holding all of it, by its delivery note made from that store (every line from the store, whether or not the order named a warehouse), with the carrier and tracking number kept; never twice, never also collected. A store is chosen by what it holds, not by where the customer is, and carriers are not booked", "The endless aisle: Stock by Store says where an item is, stores first; a click and collect brings what its store lacks from another store as a transfer", "Returns to any store against the invoice that sold the goods, never more than it sold less what came back (any credit note counts, Commerce's too): credited through ERP at what was paid, and back in that store's stock at the cost they left at, by the credit note when the invoice delivered them or by a return delivery note against each delivery note that did. The refund itself is ERP's (or Commerce's for a web order), and serial-numbered goods come back through ERP", "Walked in a browser on a server built on one machine: a store chosen by what it holds, a shipment with its carrier and tracking number, an order naming no warehouse shipped from its store on 0.3.2, a return at another store credited through ERP with its return delivery note, and Stock by Store (evidence/browser-2026-11-07-fork.md); transfers between stores (refused beyond the giving store's stock, turned down with a reason, sent, part received and the rest written off out of the goods in transit), click and collect brought from another store and handed over against its pickup code, and a franchisee reporting a period's sales on the portal, invoiced once through ERP and opening on Your invoices, walked on 7 November (evidence/browser-2026-11-07-fork.md)"], deps: [FERRUM-POS-001, FERRUM-COMMERCE-001]}
