ed send is one post; read back without reposts with likes, reposts, replies and quotes as engagements; replies as comments, mentions and quotes as mentions; replies in their threads; refusals and rate limits as the platform's errors and waiting; tested over HTTP against a stand-in speaking the parts of the AT Protocol it uses", "Not run against a real Mastodon or Bluesky server, which need an account's token or app password; Bluesky's direct messages (its chat) are not read; no connector for X, LinkedIn, Threads, Instagram or YouTube (FERRUM-CONNECT-002)", "A post carries one picture with alt text saying what it shows. It goes to Mastodon as media and to Bluesky as an embedded image (1 MB at most), only through connections that can publish pictures, and an edit sends it for review again. No video, threads or polls; what posts did is kept day by day: whenever a reading changes a publication's impressions, engagements or clicks, that day's Daily Insight takes the new numbers (one row a day, by the workspace's day). The report Social Engagement by Day shows what each day added, for everything, a brand or an account, each day's numbers less the publication's day before", "The history starts when Social first reads a post, and a day holds what that day's last reading found; there are no best times to post", "Walked in a browser on a server built on one machine, against a Mastodon stand-in: a connection, an account naming it, a post reviewed and out at its time, engagements read back, the inbox answered, and a direct message answered directly (evidence/browser-2026-11-04-flows.md)"]}
