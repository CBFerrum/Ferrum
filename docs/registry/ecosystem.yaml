  - {id: FERRUM-ECOSYSTEM-010, title: Governed enterprise analytics, spec: "9", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-metrics], deps: [FERRUM-STUDIO-001], files: ["ferrum-app-metrics:src/metric.rs", "ferrum-app-metrics:src/delivery.rs", "ferrum-app-metrics:src/site.rs", "ferrum-app-metrics:packages/metrics/entities/metrics.yaml", "ferrum-app-metrics:ui/src/Home.tsx", "ferrum-app-metrics:docs/PROVENANCE.md", "crates/studio", "ferrum-app-metrics:src/dataset.rs", "ferrum-app-metrics:src/warehouse.rs", "crates/meta/src/types.rs", "Ferrum-Frontend:src/app/QueryInput.tsx"], tests: ["ferrum-app-metrics:tests/metrics_it.rs", "ferrum-app-metrics:tests/datasets_it.rs", "ferrum-app-metrics:src/warehouse.rs", "ferrum-app-metrics:src/dataset.rs", "crates/meta/src/catalog.rs", "Ferrum-Frontend:src/app/queryinput.test.tsx"], limits: ["Metrics defined once as a Studio query of one measure and checked when saved, their lineage worked out from the query, certified by a Data Steward who does not own them, back in draft when the definition changes, read by everyone with their own rights to the records counted, kept as snapshots, deprecated pointing at a replacement, and a glossary; 29 mutants by hand; their lineage names each linked record they read, and by which field", "Dashboards and drill-down are Studio's, which does not read certified metrics; Objectives' key results read certified metrics by name (objectives-metrics)", "Certified metrics delivered to who follows them, daily, weekly or monthly on the workspace's day, read with their own rights and kept as their values; a metric deprecated since is said so once, with what replaces it", "Datasets: a table defined once as a Studio query, reaching linked records by link.field, with columns that do not change with its rows: a pivot names its values, one column each whatever the records hold (Metrics 0.4.0 with Ferrum PR 95), and a comparison adds each measure's previous period; governed as metrics are, certified by a steward who does not own it, which keeps its columns, back in draft when its definition changes, deprecated naming a replacement; read with each reader's own rights. Only along links: no free join between unrelated records", "The warehouse feed: a certified dataset as CSV or JSON lines from /api/app/metrics/dataset with the caller's rights (an API key for a warehouse), up to 10,000 rows a load, with its definition's fingerprint and truncation in headers; certified metrics' kept values since a time from /api/app/metrics/values, oldest first, without who read them. Warehouses pull: nothing is pushed, and a dataset loads whole each time", "A metric defined, refused certification by its owner, certified by a steward and recorded, in a browser on a server built on one machine (evidence/browser-2026-11-04-flows.md); a dataset defined on its page, its lineage worked out, its draft fed to its owner as CSV and JSON lines, its certification refused to its owner, and the values feed read since a time (evidence/browser-2026-11-06-dataset-feed.md)", "A metric's and a dataset's definition is built on its page with Studio's report builder (what it is about, its columns or groupings and measures across linked records, filters, the period and sort), the first rows it gives beside it, or written as JSON; in a workspace without Studio it is written as JSON. Walked on 7 November (evidence/browser-2026-11-07-definition-builder.md)"]}
  - {id: FERRUM-ECOSYSTEM-011, title: Portfolio and objectives, spec: "9", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-objectives], deps: [FERRUM-PROJECTS-002], files: ["ferrum-app-objectives:src/okr.rs", "ferrum-app-objectives:packages/objectives/entities/objectives.yaml", "ferrum-app-objectives:packages/objectives_metrics/package.yaml", "ferrum-app-objectives:connectors/metrics/app.yaml", "ferrum-app-objectives:ui/src/Home.tsx", "ferrum-app-objectives:docs/PROVENANCE.md"], tests: ["ferrum-app-objectives:tests/objectives_it.rs", "ferrum-app-objectives:tests/metrics_it.rs", "ferrum-app-objectives:ui/src/tree.test.ts", "ferrum-app-objectives:ui/src/meeting.test.ts"], limits: ["Objectives aligned to their parents within their periods, key results that increase, decrease or finish measured by check-ins, progress rolled up the tree, scores kept on closing, and the projects and portfolios behind them from Projects; 20 mutants by hand", "Portfolios, risks and resource allocations are Projects'; there are no programs and no capacity planning across a portfolio", "Key results measured from the records by a Studio query of one measure, read with their owner's rights when saved, each day and at each check-in (the value measured, not typed; a day's failure kept on the key result); owners of key results checked in by hand reminded in the app when a check-in is due, every 7 days unless set (0 for never), once until the next", "With Metrics, the connector objectives-metrics (0.1.0) lets a key result name a certified metric instead of a query of its own. It is measured as the metric is defined now, with the key result's owner's rights, when saved, at each check-in and each day. A metric no longer certified measures nothing: the day's upkeep keeps why and check-ins are refused", "A review page lists each active objective, those at risk first, with its key results' progress since a chosen day against now, their confidence and last check-in", "Key results and objectives count in their objective's progress by their weights: 1 unless set, and 0 counts for nothing. The review page weighs them the same way. A closed objective's score is told on 0 to 100, 0.0 to 1.0, 1 to 5 or as a letter (A from 90 to F below 60), and graded Missed, Progress Made or Achieved by the workspace's bands (40 and 70 unless set); each of its key results is scored and graded too when it closes, by its own progress, on the same scale (Objectives 0.6.0)", "An objective, a key result and a check-in rolling up, walked in a browser on a server built on one machine (evidence/browser-2026-11-04-flows.md)"]}
  - {id: FERRUM-ECOSYSTEM-012, title: Digital asset management, spec: "9", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-dam], deps: [FERRUM-DRIVE-001], files: ["ferrum-app-dam:src/assets.rs", "ferrum-app-dam:src/embedded.rs", "ferrum-app-dam:src/renditions.rs", "ferrum-app-dam:src/sharing.rs", "ferrum-app-dam:packages/dam/entities/dam.yaml", "ferrum-app-dam:ui/src/Home.tsx", "ferrum-app-dam:docs/PROVENANCE.md", "ferrum-app-dam:src/preview.rs", "ferrum-app-dam:ui/src/View.tsx"], tests: ["ferrum-app-dam:tests/dam_it.rs", "ferrum-app-dam:src/renditions.rs", "ferrum-app-dam:ui/src/library.test.ts", "ferrum-app-dam:src/preview.rs", "ferrum-app-dam:src/embedded.rs"], limits: ["Assets kept as Drive files with their type, size and digest read from the file, rights with licensors, last days, credits and editorial-only flags, approval by a Brand Manager of the file's version then, back to review on a new version, expiry, collections, and usages only of the approved version within the rights; 19 mutants by hand", "Images get a thumbnail and a preview, turned as the camera was held, seen only by whoever sees the asset, and remade for each new version. An office document gets them from the picture of its first page it carries (ODF always, OOXML when saved with one). Kept on the asset: an image's size, when and with what it was taken, and the creator and copyright its EXIF names; the place is never kept, only that the file records one. Any file's XMP and a JPEG's IPTC give its title, caption and keywords, and the keywords become its tags when it has none. The place a file shows (IPTC's location shown, never where it was taken), the people it shows, and its licence's usage terms and web address are kept too, and an asset whose file names people is approved only once their releases are held. XMP and IPTC beyond these (PLUS licensing, model release IDs) are not read. People shown are kept by name: a personal-data request by e-mail does not find them", "An asset's thumbnail and preview show as pictures on its form, above their download links (Ferrum-Frontend PR 47; walked, evidence/browser-2026-11-07-words-and-watermarks.md). Each asset is seen whole at /dam/view/{asset}: its video or sound plays, its PDF reads, its picture shows. The file comes from /api/app/dam/preview/{asset}, which answers whoever sees the asset with the current version's file for those kinds only (never HTML or SVG), inline and uncached. The server answers byte ranges, so a video seeks (Ferrum PR 87)", "No renditions of a video's frame (the server carries no video decoder), and none past 40 megapixels or 50 MB. A PDF's first page is drawn with hayro, in pure Rust (Digital Assets 0.7.0), walked on 7 November: a PDF uploaded to Drive got its thumbnail and preview, text in a standard font drawn (evidence/browser-2026-11-07-pdf-renditions.md). An encrypted PDF keeps a note, and what hayro does not draw yet (blending, knockout groups) is left out of the picture. The asset's form shows its renditions as download links, not pictures", "A Brand Manager shares an approved asset outside the workspace by link. Each link is for one recipient and one channel, and lasts until a day within the asset's rights. It is shown once, only its SHA-256 digest is kept, and it counts as a usage. At /api/site/{workspace}/dam/s/{token} it downloads the approved version, without caching or indexing, while it is not revoked, its day and download count last, and the asset stays approved with that version. Otherwise it answers as an unknown link. A link may carry a watermark of up to 60 letters, drawn across each picture it downloads: white with a dark edge, partly see-through, repeated on a slant, set in Helvetica by hayro, the picture turned as the camera was held and its EXIF left behind (Digital Assets 0.8.0; walked, evidence/browser-2026-11-07-words-and-watermarks.md); letters outside Latin-1 show as ?, and other files go unmarked. No portal of shared assets, and nothing kept about who opened it beyond the count and the last time", "An asset from a Drive file, reviewed, approved, and used within its rights (advertising refused for an editorial-only licence), in a browser on a server built on one machine (evidence/browser-2026-11-04-flows.md); the view page walked with a PDF read and a video played from the preview route, on the walk server (evidence/browser-2026-11-06-dam-property-website.md)"]}
