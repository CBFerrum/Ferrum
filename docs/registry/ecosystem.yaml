  - {id: FERRUM-ECOSYSTEM-005, title: Social media management, spec: "9", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-social], deps: [FERRUM-CONNECT-001], external: [BLOCK-CONNECTOR-SANDBOXES], files: ["ferrum-app-social:src/posts.rs", "ferrum-app-social:src/inbox.rs", "ferrum-app-social:src/lib.rs", "ferrum-app-social:src/mastodon.rs", "ferrum-app-social:src/bluesky.rs", "ferrum-app-social:src/insights.rs", "ferrum-app-social:packages/social/entities/social.yaml", "ferrum-app-social:ui/src/Home.tsx", "ferrum-app-social:docs/PROVENANCE.md"], tests: ["ferrum-app-social:tests/social_it.rs", "ferrum-app-social:tests/mastodon_it.rs", "ferrum-app-social:tests/bluesky_it.rs"], limits: ["Brands and their accounts, each reached through a platform connection; posts that fit each network's length and kind (YouTube refused, since it takes only video; Instagram only with a picture) and an account's connection able to publish; approval by someone other than the author, again after a change; sent at their time, one publication per account through that account's own connection by the platform's delivery; impressions and engagements read back with the network's posts; the inbox routed by handle, assigned, and answered through the message's connection when it can reply; 40 mutants by hand", "A Mastodon connector (0.2.0, src/mastodon.rs): statuses sent once each with the delivery's key as Idempotency-Key, read back without boosts with favourites, boosts and replies as engagements, mentions as comments, mentions and direct messages, replies answering them, refusals and rate limits as the platform's errors and waiting; tested over HTTP against a stand-in speaking the parts of Mastodon's API it uses, 27 more mutants caught", "A Bluesky connector (0.3.0, src/bluesky.rs): an app password's session kept an hour and opened again when the server stops taking it; posts as records with their links as link facets, under a record key made from the delivery's key so a retried send is one post; read back without reposts with likes, reposts, replies and quotes as engagements; replies as comments, mentions and quotes as mentions; replies in their threads; refusals and rate limits as the platform's errors and waiting; tested over HTTP against a stand-in speaking the parts of the AT Protocol it uses", "Not run against a real Mastodon or Bluesky server, which need an account's token or app password; Bluesky's direct messages (its chat) are not read; no connector for X, LinkedIn, Threads, Instagram or YouTube (FERRUM-CONNECT-002)", "A post carries one picture with alt text saying what it shows. It goes to Mastodon as media and to Bluesky as an embedded image (1 MB at most), only through connections that can publish pictures, and an edit sends it for review again. No video, threads or polls; what posts did is kept day by day: whenever a reading changes a publication's impressions, engagements or clicks, that day's Daily Insight takes the new numbers (one row a day, by the workspace's day). The report Social Engagement by Day shows what each day added, for everything, a brand or an account, each day's numbers less the publication's day before", "The history starts when Social first reads a post, and a day holds what that day's last reading found. Best times to post rank the weekday and hour posts went out at (the workspace's clock) by their engagements on average, without the audience's own time zones", "Walked in a browser on a server built on one machine, against a Mastodon stand-in: a connection, an account naming it, a post reviewed and out at its time, engagements read back, the inbox answered, and a direct message answered directly (evidence/browser-2026-11-04-flows.md)"]}
