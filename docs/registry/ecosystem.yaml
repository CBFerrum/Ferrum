ds the approved version, without caching or indexing, while it is not revoked, its day and download count last, and the asset stays approved with that version. Otherwise it answers as an unknown link. No watermarks, no portal of shared assets, and nothing kept about who opened it beyond the count and the last time", "An asset from a Drive file, reviewed, approved, and used within its rights (advertising refused for an editorial-only licence), in a browser on a server built on one machine (evidence/browser-2026-11-04-flows.md)"]}
