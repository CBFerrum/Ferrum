  - {id: FERRUM-INDUSTRY-008, title: "Property and facilities: leases, charges, inspections, portals", spec: "10", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-property], files: ["ferrum-app-property:src/leases.rs", "ferrum-app-property:src/requests.rs", "ferrum-app-property:src/lib.rs", "ferrum-app-property:packages/property/entities/property.yaml", "ferrum-app-property:src/site.rs", "ferrum-app-property:ui/src/Home.tsx", "ferrum-app-property:ui/src/Portal.tsx", "ferrum-app-property:docs/PROVENANCE.md", "ferrum-app-property:src/service.rs", "ferrum-app-property:src/statements.rs"], tests: ["ferrum-app-property:tests/property_it.rs", "ferrum-app-property:ui/src/units.test.ts"], limits: ["Units held by one lease's days at a time, terms kept once active, rent and charges invoiced each period once through ERP, leases ended at their end or early, urgent repair requests holding a unit until done, inspections with findings, lessees' Your home on the portal (their leases, rent invoiced and repairs asked for, only in a unit they rent now), and owners' Properties you own (each building whose Owner is their address: its units and the lease letting each now at its rent in effect today (its reviews and indexing counted), the rent, charges and late fees invoiced and still owed by the month their period starts, from issued invoices only, and its repairs open or done in the last 90 days); 27 mutants by hand; its own design", "Owners open Properties you own on the portal (/portal/owner/). It shows their buildings' units, let or vacant, and the lease letting each now; the rent, charges and late fees invoiced and still owed, by month, from issued invoices, with credit notes counted in their month; and the buildings' repairs. Anyone else sees no building.", "Owners' statements: for a building and some days, the rent, charges and late fees collected on rent invoices for periods starting then (credit notes taken off), less the building's management fee percentage and the expenses charged to the owner: repairs done then at their cost, once each, and lines by hand. The payout is billed as the owner's purchase invoice to the company (the owner as ERP's supplier), and the owner sees billed statements on the portal with what is still to pay. Expenses are not read from ERP's bills, and the fee is one percentage", "No paying rent on the portal beyond ERP's invoices page. An owner signs in once an administrator makes them a portal person", "Upkeep, the to-today checks on notice and early ends, and the day a repair was done go by the workspace's own day", "A period cut short owes its days' share; rent reviewed from given days, each period at the rent in effect on its first day; notice ending a lease when it runs out; a late fee once on an issued rent invoice still owed past its due day; deposits held and given back through journal entries, what is kept with its reason", "Ending a lease early, or giving notice, gives back the days invoiced past its new last day: a draft credit note against each issued rent invoice for those days' share of each line, with draft invoices made again", "Rent is indexed each year on the lease's anniversary to a Rent Index's latest values, within the lease's cap and floor. The change is kept as a rent review naming the values and what held the rise back (its cap, its floor, or no fall without a floor); a review made by hand from that day stands instead", "Service charge budgets per building and year are shared by floor area and invoiced with the rent, at the rate in use on each period's first day, and given back with an early end. Once the year is over they are reconciled against what the lease's invoices bore for those days (each period's line rounded on its own; their credit notes taken off): for each lease's days in the year, an invoice, or a credit note against its latest issued invoice of the year (noted when there is none). Shares are by floor area only, and the landlord bears vacant units' shares. A period across two budget years bears each year's days at that year's rate, once the next year's budget is in use", "Walked in a browser on a server built on one machine: installed through the App Manager, a lease activated and invoiced through ERP, and the lessee's Your home with a repair asked for and the issued invoice opening on Your invoices (evidence/browser-2026-11-04-flows.md); the owners' portal walked for an owner signed in with a code and for someone who owns nothing (evidence/browser-2026-11-06-dam-property-website.md); service charges invoiced by floor area at each year's rate, a budget reconciled, rent indexed to its 3% cap, and an owner's statement collected, charged its fee and expenses and billed as a purchase invoice, walked on 6–7 November (evidence/browser-2026-11-07-fork.md), and the billed statement seen by its owner on the portal with what is still to pay"]}
  - {id: FERRUM-INDUSTRY-009, title: "Logistics and fleets: dispatch, routes, proof of delivery", spec: "10", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-logistics], files: ["ferrum-app-logistics:src/trips.rs", "ferrum-app-logistics:src/pod.rs", "ferrum-app-logistics:src/geo.rs", "ferrum-app-logistics:src/site.rs", "ferrum-app-logistics:packages/logistics/entities/logistics.yaml", "ferrum-app-logistics:ui/src/Drive.tsx", "ferrum-app-logistics:docs/PROVENANCE.md", "ferrum-app-logistics:src/fleet.rs", "ferrum-app-logistics:ui/src/offline.ts", "ferrum-app-logistics:ui/public/sw.js"], tests: ["ferrum-app-logistics:tests/logistics_it.rs", "ferrum-app-logistics:ui/src/trips.test.ts"], limits: ["Trips from submitted delivery notes, a note on one open trip at a time, stops ordered nearest first with straight-line distances, dispatch checking the vehicle's state and load, the driver's licence on the day and that neither is out on another trip, proof of delivery only by the trip's driver, once a stop, with a signature or a photo, and a driver's own stops; 28 mutants by hand; its own design", "No road distances, travel times, optimised routes, geocoding or live tracking: they need a maps provider (BLOCK-MAPS-KEY)", "Stops deliver or collect: a collection carries ERP's return delivery note in draft, submitted when the stop is proved collected, a return note on one open trip at a time. Windows from HH:MM to HH:MM: stops ordered by when they open, nearest first among those opening together, and a stop that happened after its window closed is late on the workspace's clock. A vehicle and its driver go out again the same day once their trip is completed", "Fuel logs whose odometer reading never goes back, moving the vehicle's reading on; services due by the day or every so many km, recorded with It Was Serviced, and upkeep marking those falling due by the workspace's day; a completed trip's cost at the vehicle's rate per km; Fleet Costs per vehicle over a range of days (trips, distance, cost, litres, fuel cost, km by the odometer, litres per 100 km)", "A driver's page that opens offline under the app's own worker, from the day's trips kept under the workspace's offline lease. Proofs are recorded there with a photo or a signature drawn on the screen and kept on the phone for the driver alone until the connection is back, each safe to send twice; a refusal stays with its reason. A proof says when it happened (not later than now, nor before the trip went out), and lateness goes by it", "The order is a sort by window, not a route weighing windows against driving time; no service history of its own (bills are ERP purchase invoices), fuel cards or telematics; offline, fuel logs and the records pages need a connection; 0.2 and 0.3's checks have had no mutant run", "A stop's weight is typed, or else taken from its delivery or return note: each line's quantity times its item's weight (Logistics' Weight (kg) on the item, Logistics 0.3.4). An item without a weight counts nothing, so dispatch's load check is as good as the weights given", "Walked in a browser on a server built on one machine: stops ordered by window then nearest, dispatch, and the driver's page with a delivery proved late against its window and a collection submitting its return note; with the server stopped, the page showed the day's trips kept under the offline lease, a delivery was recorded there with a photo and kept on the phone, and was sent by itself two seconds after the server answered again, judged on time by when it happened; the trip completed at the van's rate per km, fuel logs moving the odometer on and refusing a reading that went back, a service falling due by the kilometres recorded with It Was Serviced, and Fleet Costs; on the pins build, a signature drawn on the driver's page with no photo, saved while the server was stopped, kept on the phone and sent by itself once it answered, stored as the proof's signature (evidence/browser-2026-11-07-fork.md). Opening the page with no connection was not walked: the desktop app's browser pane registers no service worker, not even the platform's own /sw.js"], external: [BLOCK-MAPS-KEY]}
  - {id: FERRUM-INDUSTRY-010, title: "Government: cases, permits, citizen portals", spec: "10", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-government], files: ["ferrum-app-government:src/permits.rs", "ferrum-app-government:src/cases.rs", "ferrum-app-government:src/site.rs", "ferrum-app-government:packages/government/entities/government.yaml", "ferrum-app-government:ui/src/Portal.tsx", "ferrum-app-government:docs/PROVENANCE.md"], tests: ["ferrum-app-government:tests/government_it.rs", "ferrum-app-government:ui/src/services.test.ts"], limits: ["Permits applied for on the portal with their documents uploaded, submitted only with every document the type needs, fees invoiced through ERP and paid before approval, rejections saying why, permits issued for the type's months, expiring or revoked; cases due within their category's days, resolved saying how and overdue when late; citizens see only their own; 24 mutants by hand; its own design", "Review stages per permit type, passed in order by the stage's role and never by whoever passed the stage before, site inspections saying what they found, approval waiting for every stage and setting conditions the permit keeps; a rejection while waiting records the stage failed. Stages alongside the one before are passed side by side, in any order, each by its own people and no one passing two of them (Government 0.2.5)", "Renewable permits renewed from their type's days before the end, by the officer or by the holder on the portal, the new permit running on from the day after; holders told once when renewal opens; applicants told as their application is submitted, approved, rejected or issued (e-mail unless they choose otherwise)", "The public register of the types published on it, without sign-in: holder, days, status and conditions, the latest 1,000, as JSON or CSV. Dates go by the workspace's day", "No paying the fee on the portal beyond ERP's invoices page, and no SMS", "No public-sector rule is claimed to be met until a legal review (BLOCK-LEGAL-REVIEW)", "Citizens' applications walked in a browser from the portal to their permits on a server built on one machine, one with its fee invoiced, issued and paid in ERP before approval and its paid invoice opened from the application (evidence/browser-2026-11-04-flows.md); a site-inspection stage passed with findings, approval with conditions, a permit issued and renewed running on from the day after, a holder reminded by upkeep once renewal opened, and the public register as JSON and CSV without sign-in walked on 7 November (evidence/browser-2026-11-07-fork.md); a permit renewed by its holder on the citizens' portal (renewal offered only where open and not already live), the holder told at each step, and a case raised on the portal, refused as resolved without saying how, then resolved and its resolution seen by the citizen, walked on 7 November; a case gone overdue at midnight in the workspace's zone (Asia/Kolkata) by the server's upkeep, read from the database as the upkeep left it (evidence/browser-2026-11-07-apps-words.md)"], external: [BLOCK-LEGAL-REVIEW]}
