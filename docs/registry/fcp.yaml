  - {id: FCP-DEPLOY-008, title: "Graceful rollout", workstream: W05, status: verified_software, files: ["ferrum-app-cloud:serve/src/node.rs", "ferrum-app-cloud:src/deploy/controller.rs", "ferrum-app-cloud:docs/operating-deploy.md"], tests: ["ferrum-app-cloud:serve/tests/serving_it.rs", "ferrum-app-cloud:tests/deploy_it.rs"], limits: "A node stopped mid-request finishes it, and an open WebSocket ends with the node and the client is told, so it reconnects to what serves next. A socket stays on its replica until either side closes it. Uploads go to object storage, not through a node. On one machine"}
