  - {id: FCP-SCALE-007, title: "Noisy neighbor", workstream: W09, status: verified_software, files: ["server/src/state.rs", "server/src/extract.rs", "ferrum-app-cloud:src/operations.rs", "ferrum-app-cloud:serve/src/node.rs"], tests: ["server/src/state.rs", "scripts/share_check.py", "ferrum-app-cloud:tests/control_it.rs", "ferrum-app-cloud:serve/tests/serving_it.rs"], limits: "Queries: a workspace's API requests take turns within half of each replica's database connections, say how long they waited, and are refused and counted past five seconds. Flooded from 64 threads on one laptop, another workspace's p95 went from 13 to 25 ms, and to 145 ms with the share off. Backlogs: one with twenty times the work does not make others wait. Builds: a cap per workspace; sites, a request cap each. Per replica, measured once on one machine, and the database's CPU is not divided"}
