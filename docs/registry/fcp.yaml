  - {id: FCP-BASE-007, title: "Evidence classification", workstream: W00, status: partial, files: ["scripts/registry.py", "docs/registry/README.md"], limits: "This registry records evidence states; the older registry's `basis` is coarser"}
  - {id: FCP-BASE-008, title: "Feature inventory", workstream: W00, status: partial, files: ["scripts/baseline.py"], limits: "Lists every repository this token can see; images and production are recorded as unread, not absent"}
