  - {id: FCP-UI-005, title: "Permission explanation", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:contract/src/policy.rs", "ferrum-app-cloud:ui/src/parts.tsx", "ferrum-app-cloud:ui/src/proof.ts"], tests: ["ferrum-app-cloud:tests/control_it.rs", "ferrum-app-cloud:ui/src/proof.test.ts"], limits: "In a browser: a viewer pressing a button their role does not allow is told so beside it, and that a project administrator can change it, without being told who. A refusal is announced in a live region. Proof is offered where it would cure the refusal"}
