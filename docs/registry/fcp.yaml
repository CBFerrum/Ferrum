  - {id: FCP-CODE-001, title: "Repository lifecycle", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/controller.rs", "ferrum-app-cloud:src/code/api.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "A crash after the forge made it binds what is there. Against real Gitea 28.2.0"}
