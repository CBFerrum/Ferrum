  - {id: FCP-UI-008, title: "Audit visibility", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:ui/src/Support.tsx", "ferrum-app-cloud:src/views.rs", "crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs", "ferrum-app-cloud:tests/control_it.rs", "scripts/support_check.py"], limits: "Support grants in the console: who, what they reach, why, given and ending, how often used, each request as refused or let in, and a way to end them, tried in a browser. Deployment and policy changes are in each project's record"}
  - {id: FCP-OBS-001, title: "Telemetry correlation", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:src/operations.rs", "ferrum-app-cloud:src/events.rs", "crates/kernel/src/db.rs", "server/src/controllers/sites.rs"], tests: ["ferrum-app-cloud:tests/control_it.rs"], limits: "One id from a request through other processes, also confirmed on a real server. There is no tracing backend, and logs go where a deployment sends them"}
  - {id: FCP-OBS-002, title: "Tenant telemetry isolation", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:src/operations.rs", "ferrum-app-cloud:src/events.rs"], tests: ["ferrum-app-cloud:tests/control_it.rs"], limits: "Row-level security refuses another workspace's operations and events, however the question is put. There is no customer log service to refuse"}
  - {id: FCP-OBS-003, title: "Bounded cardinality", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:serve/src/node.rs", "ferrum-app-cloud:deploy/k8s/alerts.yaml"], tests: ["ferrum-app-cloud:serve/tests/serving_it.rs"], limits: "No tenant or site in a label"}
  - {id: FCP-OBS-004, title: "Operational alert coverage", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:deploy/k8s/alerts.yaml", "ferrum-app-cloud:deploy/k8s/alertmanager.yaml", "ferrum-app-cloud:src/views.rs"], tests: ["ferrum-app-cloud:scripts/check_alerts.py", "ferrum-app-cloud:deploy/k8s/alerts.test.yaml", "ferrum-app-cloud:tests/resources_it.rs"], limits: "Drift, backlogs, operations nobody can vouch for, backup age, access past its time, terms and certificates near their end: each fires on its condition under promtool and not otherwise, once however many replicas report it, routes to its owner and every critical one to on-call under amtool, and a real Alertmanager delivers a cause with its runbook and holds back what it explains. The receivers there are stand-ins: real paging needs the deployment's addresses and keys"}
