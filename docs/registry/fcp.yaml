  - {id: FCP-AI-001, title: "Agent capability boundary", workstream: W06, status: verified_software, files: ["crates/mcp/src/lib.rs", "crates/ops/src/mcp.rs", "server/src/assistant.rs"], tests: ["server/tests/assistant_egress_it.rs", "crates/mcp/tests/mcp_it.rs", "crates/ops/tests/ops_it.rs", "server/tests/assistant_it.rs"], limits: "A stand-in that does whatever a ticket tells it gets nothing its person could not do, changes wait for that person, and physical work can only be proposed. Nothing relies on a model's judgement, and no real model was tried. A client running elsewhere is bound by its token, not by this"}
  - {id: FCP-AI-002, title: "Model/provider policy", workstream: W06, status: verified_software, files: ["server/src/assistant.rs", "crates/kernel/src/ctx.rs"], tests: ["server/tests/assistant_egress_it.rs"], limits: "A model the operator has not allowed is not used, and what a workspace forbids does not leave it, whichever model is asked. A model has no region here: the operator chooses the address it is reached at"}
  - {id: FCP-AI-003, title: "Approval integrity", workstream: W06, status: verified_software, files: ["crates/ops/src/commands.rs", "ferrum-app-cloud:src/plans.rs"], tests: ["server/tests/assistant_egress_it.rs", "crates/ops/tests/ops_it.rs", "ferrum-app-cloud:tests/control_it.rs"], limits: "A change approved and then altered, or approved too long ago, does not run. A command has no way to change after approval, a plan's approval names the digest shown, and nobody approves their own, whatever roles they hold"}
  - {id: FCP-AI-004, title: "Development sandbox", workstream: W06, status: verified_software, files: ["ferrum-app-cloud:src/deploy/api.rs", "ferrum-app-cloud:starters/server/token.mjs", "ferrum-app-cloud:docs/user-guide.md"], tests: ["ferrum-app-cloud:tests/resources_it.rs", "ferrum-app-cloud:starters/server/token.test.mjs", "ferrum-app-cloud:tests/deploy_it.rs"], limits: "A development token exists for previews and not production, reaches only that environment, and says so in its scope. The server starter takes only such a token on a workstation and refuses a production one pasted in. The starter is the client made here: other clients are their makers'. Cloud does not check that what a preview is bound to is synthetic, and a raw provider credential is outside what a token can stop"}
  - {id: FCP-AI-005, title: "Budget and cancellation", workstream: W06, status: verified_software, files: ["server/src/assistant.rs"], tests: ["server/tests/assistant_egress_it.rs"], limits: "Past a workspace's allowance the provider is not called, a turn stops at 25 steps, a failing service is tried four times, and one turn runs per thread. Usage is shown in tokens, not money. Scripted models"}
