  - {id: FCP-CODE-001, title: "Repository lifecycle", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/controller.rs", "ferrum-app-cloud:src/code/api.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "A crash after the forge made it binds what is there. Against real Gitea 28.2.0"}
  - {id: FCP-CODE-002, title: "Ref consistency", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "Conflicting pushes over HTTPS and SSH race on real Git. Protection is the forge's and holds on both"}
  - {id: FCP-CODE-003, title: "Git storage authority", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/forge.rs", "ferrum-app-cloud:docs/operating-code.md"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "One writable instance by design (D-08), so there is no second writer to split with. A killed forge keeps what it acknowledged. No high availability"}
  - {id: FCP-CODE-004, title: "Backup completeness", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "History, pull requests and protection come out and a second forge fscks clean. Not a scheduled backup of a whole forge yet: DR-006 covers that gap"}
  - {id: FCP-CODE-005, title: "Scoped Git credentials", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/api.rs", "ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Per-repository tokens, collected once, ended by revocation and by a person leaving"}
  - {id: FCP-CODE-006, title: "Server hook restriction", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:docs/operating-code.md", "ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "DISABLE_GIT_HOOKS is required configuration, and every management path was tried against it"}
  - {id: FCP-CODE-007, title: "Import and mirror egress", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/api.rs", "ferrum-app-cloud:contract/src/code.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Refused before fetching and again by the forge when fetching. Submodules are not fetched"}
  - {id: FCP-CODE-008, title: "Git resource limits", workstream: W03, status: partial, files: ["ferrum-app-cloud:docs/operating-code.md", "ferrum-app-cloud:serve/src/gate.rs", "ferrum-app-cloud:deploy/k8s/forge-gate.yaml"], tests: ["ferrum-app-cloud:tests/code_it.rs", "ferrum-app-cloud:serve/tests/gate_it.rs"], limits: "An oversized push fails plainly, and so does a tree deeper than 2048, refused by the forge's own git as it arrives from a client that does not hold itself back. Clones and pushes take turns per workspace at the gate in front of the forge, which also bounds their processes and CPU, one each, and one kept waiting is refused with 429: six of one workspace at two at a time took three packs' time while another's took one. There is no storage quota per workspace, and the forge here has none of its own"}
  - {id: FCP-CODE-009, title: "PR approval integrity", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/gitea.rs", "ferrum-app-cloud:src/code/controller.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "A force-push dismisses approvals and required checks are by name. Real Gitea"}
  - {id: FCP-CODE-010, title: "LFS access", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "A known object id from another repository gets nothing. Expiry of a signed URL is Gitea's"}
  - {id: FCP-CODE-011, title: "Forge outage isolation", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/build/controller.rs", "ferrum-app-cloud:serve/src/node.rs"], tests: ["ferrum-app-cloud:tests/deploy_it.rs"], limits: "What is live needs no forge. A build says why it waits, fails with that reason, and asking again afterwards builds once"}
  - {id: FCP-CODE-012, title: "Repository portability", workstream: W03, status: verified_software, files: ["ferrum-app-cloud:src/code/gitea.rs"], tests: ["ferrum-app-cloud:tests/code_it.rs"], limits: "Moved to a second real Gitea, every branch to the commit, in plain Git. No other forge product has been tried"}
  - {id: FCP-BUILD-001, title: "Webhook authenticity", workstream: W04, status: verified_software, files: ["ferrum-app-cloud:src/build/api.rs"], tests: ["ferrum-app-cloud:tests/build_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Signed, replay-safe, and bound to the repository it claims"}
  - {id: FCP-BUILD-002, title: "Exact commit checkout", workstream: W04, status: verified_software, files: ["ferrum-app-cloud:src/build/controller.rs"], tests: ["ferrum-app-cloud:tests/build_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Fetched by commit, checked after, and the moved branch does not appear"}
