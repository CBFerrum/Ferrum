  - {id: FCP-POL-008, title: "Policy freshness", workstream: W01, status: verified_software, files: ["ferrum-app-cloud:src/enforcement.rs", "ferrum-app-cloud:contract/src/policy.rs"], tests: ["ferrum-app-cloud:tests/control_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Coverage shows which point runs which revision, and a point past its age refuses. No real enforcement point reports yet; W05 and W07 add them"}
  - {id: FCP-POL-009, title: "Emergency access", workstream: W01, status: verified_software, files: ["ferrum-app-cloud:src/emergency.rs", "ferrum-app-cloud:src/access.rs"], tests: ["ferrum-app-cloud:tests/control_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "Codes work once, for an hour, tell the security administrators and reach project administration only. Offline storage of the codes is the customer's procedure, and no drill has been run with one"}
