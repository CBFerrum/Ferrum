  - {id: FCP-AI-008, title: "Operational autonomy", workstream: W06, status: verified_software, files: ["crates/ops/src/mcp.rs", "docs/operations-authority.md"], tests: ["crates/ops/tests/ops_it.rs"], limits: "An agent has three tools: two to look and one to propose an operation the device declares. Nothing reaches a PLC or a safety function, which stay with their makers. Not an evaluation of any model"}
  - {id: FCP-UI-001, title: "Consistent scope UI", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:ui/src/Plan.tsx", "ferrum-app-cloud:ui/src/words.ts", "ferrum-app-cloud:src/plans.rs"], tests: ["ferrum-app-cloud:ui/src/words.test.ts", "ferrum-app-cloud:tests/control_it.rs"], limits: "The digest on screen when the form opened goes with the decision, and the server refuses a stale one. No automated browser test"}
