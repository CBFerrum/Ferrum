  - {id: FCP-OBS-008, title: "Incident process", workstream: W09, status: partial, files: ["docs/incident-response.md"], limits: "Severity, roles, containment, communication and review are written. No drill has been run: that takes people"}
  - {id: FCP-OBS-009, title: "Abuse controls", workstream: W09, status: partial, files: ["ferrum-app-cloud:src/abuse.rs", "ferrum-app-cloud:src/access.rs", "ferrum-app-cloud:src/deploy/controller.rs", "ferrum-app-cloud:src/deploy/runtime.rs", "ferrum-app-cloud:deploy/k8s/alerts.yaml"], tests: ["ferrum-app-cloud:tests/deploy_it.rs", "ferrum-app-cloud:deploy/k8s/alerts.test.yaml"], limits: "Stopping one project and nothing else, an appeal, and the record, also on a real server. Rules hold a project's new builds for a person, with evidence, when it builds past a budget or its services stay at their CPU limit as mining does, read from docker stats on a real container, and an alert says so; a hold a person lifted stays lifted. Phishing, spam and public hosting are found by people's reports and handled with the same stop, appeal and record. Egress is neither enforced nor watched: that needs the qualified runtime class, which is blocked (D-09)"}
  - {id: FCP-CLOUD-001, title: "Tenant lifecycle", workstream: W09, status: verified_software, files: ["crates/kernel/src/account.rs", "crates/kernel/src/recovery.rs", "server/src/tasks.rs", "ferrum-app-cloud:src/projects.rs"], tests: ["crates/kernel/tests/closure_it.rs", "ferrum-app-cloud:tests/resources_it.rs", "crates/kernel/tests/support_it.rs"], limits: "Provisioning a workspace is the operator's create_tenant; active, grace, restricted and closed are the operator's, each on record. Closing keeps everything and stops what runs; after its date Cloud destroys what it provably made, and the workspace is deleted only when nothing is held elsewhere, files first. Closing rounds and retirement run again start nothing twice, a resource waiting for a person waits for them, and a store failing part way leaves every row. Self-service signup and billing are not here"}
  - {id: FCP-CLOUD-002, title: "Official partner scope", workstream: W09, status: blocked_external, blockers: [BLOCK-LEGAL-REVIEW], limits: "Partner terms are a legal and commercial decision"}
  - {id: FCP-CLOUD-003, title: "Support least privilege", workstream: W09, status: verified_software, files: ["crates/kernel/src/support.rs", "server/src/extract.rs"], tests: ["crates/kernel/tests/support_it.rs", "scripts/support_check.py", "ferrum-app-cloud:tests/control_it.rs"], limits: "A health-only key reaches its report and is refused on records, administration, reports, an app's routes, browser-session routes, two-factor setup and a live socket, each attempt on the customer's list as refused. Run against a real server, and by deploy/smoke.sh. Calendar and identity-provider keys are scoped apart"}
  - {id: FCP-CLOUD-004, title: "No standing partner admin", workstream: W09, status: verified_software, files: ["crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs", "ferrum-app-cloud:tests/control_it.rs"], limits: "A partner's account in a workspace of its own reaches nothing of a customer's, and a grant does not renew itself. Software only"}
  - {id: FCP-CLOUD-005, title: "Support revocation", workstream: W09, status: verified_software, files: ["crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs", "ferrum-app-cloud:tests/control_it.rs"], limits: "A key stops at once, one customer's revocation leaves another's grant alone, and every use stays listed by request. A diagnostic already running is not interrupted. Sessions are tracked by key"}
  - {id: FCP-CLOUD-006, title: "Residency coverage", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:contract/src/resource.rs", "ferrum-app-cloud:src/resources/api.rs", "ferrum-app-cloud:src/resources/controller.rs", "ferrum-app-cloud:src/deploy/api.rs"], tests: ["ferrum-app-cloud:tests/resources_it.rs", "ferrum-app-cloud:tests/deploy_it.rs"], limits: "Resources, backups, exports and releases, by what a deployment says of itself: nothing can check that. An attached resource cannot say where it is, so one held to a region refuses them. Cloud calls no model. No real region"}
  - {id: FCP-CLOUD-007, title: "Account restriction safety", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:src/abuse.rs", "ferrum-app-cloud:src/access.rs", "ferrum-app-cloud:src/metering.rs", "crates/kernel/src/account.rs"], tests: ["ferrum-app-cloud:tests/deploy_it.rs", "crates/kernel/tests/support_it.rs"], limits: "A restricted account keeps its sites up and its work running, can read, export, restore, go back to an earlier release and close a project, and starts nothing new, by a person or a push. Also tried on a real server. An unpaid account is not ended or deleted by anything here"}
  - {id: FCP-CLOUD-008, title: "Customer controlled profile", workstream: W09, status: partial, files: ["docs/platform/customer-controlled.md"], tests: ["ferrum-app-cloud:serve/tests/serving_it.rs"], limits: "What it depends on, what stops when cut off, and what an operator can do. Each row has its evidence, and they have not been run together: no customer network has"}
  - {id: FCP-CLOUD-009, title: "Service ownership", workstream: W09, status: partial, files: ["ferrum-app-cloud:src/notices.rs", "docs/platform/services.md"], tests: ["ferrum-app-cloud:tests/resources_it.rs"], limits: "A provider going away tells each project what it has there and what moving it would take, once, and stops taking new work on the day. Names and support periods are the company's to fill in, and none are"}
  - {id: FCP-DR-001, title: "Complete backups", workstream: W09, status: verified_software, files: ["ferrum-app-cloud:docs/operating-recovery.md", "ferrum-app-cloud:scripts/verify_forge.py"], tests: ["ferrum-app-cloud:tests/drill_it.rs", "ferrum-app-cloud:tests/recovery_it.rs"], limits: "Database, repositories, artifacts and the key come back together somewhere new and are checked before anything is claimed, on one machine. Customer databases come back through restore plans, tested apart. No real region or provider"}
  - {id: FCP-DR-002, title: "Restore isolation", workstream: W09, status: verified_software, files: ["crates/kernel/src/recovery.rs", "crates/ops/src/commands.rs", "ferrum-app-cloud:src/operations.rs"], tests: ["crates/kernel/tests/recovery_it.rs", "ferrum-app-cloud:tests/control_it.rs", "ferrum-app-cloud:scripts/mutants.py"], limits: "A real pg_dump and pg_restore: what was waiting does not run, and a person releases the rest. Noticed by database identity and timeline"}
  - {id: FCP-DR-003, title: "Tenant-level recovery", workstream: W09, status: verified_software, files: ["crates/kernel/src/recovery.rs", "server/src/tasks.rs"], tests: ["crates/kernel/tests/recovery_it.rs", "ferrum-app-cloud:tests/recovery_it.rs"], limits: "Through real dump and restore, on the kernel's schema and Cloud's. The task itself has not been run, and a full ERP schema has not been taken back: circular references were read from a real one. Files are not checked against the store, and a resource made since is left at its provider"}
