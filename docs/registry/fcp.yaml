# Ferrum Code, Deploy, Access and Resources: the supplied specification's requirements (FCP-*), imported
# without overwriting what the rest of this registry knows. A status is what the evidence supports. See
# docs/platform/README.md for the states and docs/platform/catalog.json for each acceptance case.
