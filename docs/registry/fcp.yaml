  - {id: FCP-BUILD-005, title: "Secret exposure controls", workstream: W04, status: verified_software, files: ["ferrum-app-cloud:src/build/controller.rs", "ferrum-app-cloud:contract/src/build.rs"], tests: ["ferrum-app-cloud:tests/build_it.rs"], limits: "No credential is in reach, so there is nothing to print. Redaction exists for test secrets only"}
  - {id: FCP-BUILD-006, title: "Cache trust", workstream: W04, status: verified_software, files: ["ferrum-app-cloud:src/build/controller.rs", "ferrum-app-cloud:contract/src/build.rs"], tests: ["ferrum-app-cloud:tests/build_it.rs", "ferrum-app-cloud:contract/src/build.rs"], limits: "A cache per repository and level of trust, at /cache. It goes when it passes 1 GiB, and a second worker on another host starts empty"}
