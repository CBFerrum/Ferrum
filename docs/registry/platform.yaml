# The shared kernel and application platform (specification §3, §4). See README.md for the format.
defaults: {component: platform, repositories: [CBFerrum/Ferrum], workstream: 2}
requirements:
  - {id: FERRUM-PLATFORM-001, title: Modular monolith with a Rust kernel and apps as crates, status: implemented_unqualified, basis: read, spec: "3.1", files: [crates/kernel/src/lib.rs, server/src/packages.rs, docs/plan/architecture.md]}
  - {id: FERRUM-PLATFORM-002, title: Authoritative ownership of each shared concept, status: partial, basis: read, spec: "3.2", files: [docs/registry/domain-dictionary.md, packages/contacts, packages/parties, packages/products, packages/project_records], limits: ["Person, party, product and project are shared packages; employee, payment and consent are not yet one owned model across apps"]}
  - {id: FERRUM-PLATFORM-003, title: Controlled merging of duplicate customers with aliases, status: implemented_unqualified, basis: tested, spec: "3.2", files: [crates/kernel/src/merge.rs, crates/kernel/migrations/20261101000009_record_alias.sql, packages/parties/entities/parties.yaml], tests: [crates/kernel/tests/merge_it.rs], deps: [FERRUM-PLATFORM-002], limits: ["Customer and Supplier opt in; apps with their own people or companies have not", "Duplicates are found by equal fields, not fuzzy matching", "A merge is not undone", "ERP's statements read merged ids only once it asks ferrum_kernel::merge::merged_ids", "External identifiers wait for the connector platform"]}
  - {id: FERRUM-PLATFORM-004, title: Typed cross-application contracts with stated idempotency and failure behaviour, status: implemented_unqualified, basis: tested, spec: "3.3", repositories: [CBFerrum/ferrum-app-erp], files: [ferrum-app-erp:docs/contracts.md, crates/kernel/src/hooks.rs, ferrum-app-erp:src/localization.rs], tests: [ferrum-app-erp:tests/contract_it.rs], limits: ["ERP's engine publishes its contract with the apps that call it (docs/contracts.md): each operation in the caller's transaction, append-only, what it refuses and whether calling it twice does it twice; contract_it holds each guarantee", "The contract is Rust signatures checked when an app builds against an ERP revision, not a versioned wire protocol; other apps reach ERP through its documents", "ERP is 0.x: a minor version may change an operation, and says so in its changelog"]}
  - {id: FERRUM-PLATFORM-005, title: Hook dependencies and ordering checked at startup, status: implemented_unqualified, basis: tested, spec: "3.3", files: [crates/kernel/src/hooks.rs, crates/kernel/src/tenant.rs], tests: [crates/kernel/src/hooks.rs], limits: ["The mechanism exists; apps' hooks have not declared names or fills yet, so they run in registration order"]}
  - {id: FERRUM-PLATFORM-006, title: "Isolation profiles: shared cells, dedicated, on-premises, disconnected", status: partial, basis: read, spec: "3.4", files: [deploy/docker-compose.yml, deploy/k8s/deployment.yaml], deps: [FERRUM-CLOUD-001], limits: ["Single-server and Kubernetes deployments exist; cells and a disconnected profile do not"]}
  - {id: FERRUM-PLATFORM-007, title: Strong types at consequential boundaries, status: partial, basis: read, spec: "4.1", files: [crates/calc, crates/kernel/src/value.rs], limits: ["Money and tax go through ferrum-calc with decimals; documents stay JSON-shaped maps"]}
  - {id: FERRUM-PLATFORM-008, title: Explicit document state machine with per-state field rules, status: implemented_unqualified, basis: tested, spec: "4.2", files: [crates/kernel/src/doc.rs, crates/meta/src/types.rs, crates/meta/src/catalog.rs], tests: [crates/kernel/tests/kernel_it.rs, crates/kernel/tests/collab_it.rs], limits: ["Draft, submitted and cancelled are general, with amendment; an app's or a workspace's workflow adds its states (approved and the like)", "A workflow state may name the only fields a person changes while a document is in it and the fields it needs, held on every save in it and on entering it, and shown in the form; the server's own updates are not held to them", "No general archived state"]}
  - {id: FERRUM-PLATFORM-009, title: Custom fields and entities with conflict detection, status: implemented_unqualified, basis: tested, spec: "4.3", files: [crates/kernel/src/customize.rs, crates/meta/src/catalog.rs, crates/kernel/migrations/20261101000006_overlay_base.sql], tests: [crates/kernel/tests/customize_it.rs, crates/meta/src/catalog.rs], limits: ["Customizations made before this have no record of what they replaced, and are not compared", "Compares property changes and added fields; rules, workflows and print templates are not compared"]}
  - {id: FERRUM-PLATFORM-010, title: "Schema evolution: expand, migrate, contract, resumable backfills", status: implemented_unqualified, basis: tested, spec: "4.3", files: [server/src/upgrade.rs, crates/kernel/src/backfill.rs, crates/kernel/migrations/20261105000005_backfills.sql, crates/meta/src/catalog.rs, docs/operations.md], tests: [crates/kernel/tests/backfill_it.rs], limits: ["Expand is the metadata sync, which only adds; orphaned columns are reported, never dropped", "Packages declare backfills (a table or entity, the rows that need it, what it sets): run per workspace in batches by the hourly upkeep, resumed after a failure from the last row a batch reached, each row visited once; the report gives rows changed, rows it could not change and rows needing it now, and an administrator runs a finished one again", "Contract is by hand, once every workspace reports none remaining; no package declares a backfill yet"]}
  - {id: FERRUM-PLATFORM-011, title: Equivalent integrity on every mutation path, status: blocked_external, basis: read, spec: "4.4", files: [crates/kernel/src/bulk.rs, crates/kernel/src/doc.rs, server/src/importer.rs, docs/registry/mutation-paths.md], external: [BLOCK-SECURITY-REVIEW], limits: ["Reviewed on 5 November: the 96 statements in 13 apps that write entity tables outside the document pipeline, by kind (docs/registry/mutation-paths.md): engine work, consequences of audited operations, a person's action on a public link, and those that log their own activity", "Workspace isolation and legal holds hold on every one, in the database; document actions are audited by the kernel before their handlers write", "Versions checked one by one on 6 November: 14 of the 79 engine updates move a record's version, as the kernel's own engine write does not; no read is served stale from one", "Public links read one by one on 6 November: each of the 10 checks a signed token scoped to one record, and limits what it does (confirmation before unsubscribing, redirects only to an email's own links, lockouts and download caps)", "Nobody independent has reviewed it"]}
  - {id: FERRUM-PLATFORM-012, title: Transactional outbox with idempotent consumers, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs, crates/kernel/src/receipt.rs, docs/events.md], tests: [crates/kernel/tests/events_it.rs, crates/kernel/tests/kernel_it.rs, crates/kernel/tests/receipts_it.rs], limits: ["A create, an update or an action sent again with its Idempotency-Key is done once and answered the same, the key bound to its request and to whoever claimed it, for 30 days (FEO-003); a client that does not send one is not protected"]}
  - {id: FERRUM-PLATFORM-013, title: "Event envelope: origin, correlation, causation, trace context, versions", status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/db.rs, crates/kernel/migrations/20261101000001_event_envelope.sql, server/src/app.rs], tests: [crates/kernel/tests/events_it.rs], limits: ["Tasks an event handler spawns start without a trace"]}
  - {id: FERRUM-PLATFORM-014, title: Tenant fairness and priority classes for events, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs, crates/kernel/src/bulk.rs, server/src/controllers/docs.rs], tests: [crates/kernel/tests/events_it.rs, crates/kernel/tests/jobs_it.rs], limits: ["Fairness covers the outbox and plugins; apps' own background jobs (Campaigns sending, upkeep) have none yet", "Bulk operations (bulk.rs) and imports (Kernel::import_rows, behind POST /api/v1/{entity}/_import) run at bulk priority, and crates/kernel/tests/jobs_it.rs checks the priority of what each sets off"], deps: [FERRUM-PLATFORM-012]}
  - {id: FERRUM-PLATFORM-015, title: Dead letters with inspection and audited replay, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs, server/src/controllers/admin.rs], tests: [crates/kernel/tests/events_it.rs], limits: ["An API only: no administrator screen yet"]}
  - {id: FERRUM-PLATFORM-016, title: "Durable jobs with leases, cancellation and poison isolation", status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/jobs.rs, crates/kernel/src/export.rs, crates/kernel/migrations/20261101000004_jobs.sql, server/src/controllers/jobs.rs], tests: [crates/kernel/tests/jobs_it.rs], limits: ["Nothing schedules a job for later or repeats one; apps' periodic work stays in their maintenance", "Plugin schedules and app maintenance are not moved onto it yet"]}
  - {id: FERRUM-PLATFORM-017, title: External effects run after commit, status: implemented_unqualified, basis: tested, spec: "4.6", files: [crates/plugins/src/host.rs, docs/events.md], tests: [crates/plugins/tests/after_commit_it.rs], limits: ["Enforced for plugins; native hooks are held to it by review (IRP and VIES read; other connectors not)"]}
  - {id: FERRUM-PLATFORM-018, title: No transaction held across an external call, status: implemented_unqualified, basis: tested, spec: "4.6", files: [crates/kernel/src/outbox.rs], tests: [crates/kernel/tests/events_it.rs]}
  - {id: FERRUM-PLATFORM-019, title: Stateful cross-system workflows with compensation, status: implemented_unqualified, basis: tested, spec: "4.6", files: [crates/kernel/src/saga.rs, crates/kernel/src/jobs.rs, crates/kernel/migrations/20261104000001_saga.sql, docs/events.md], tests: [crates/kernel/tests/saga_it.rs, crates/kernel/tests/jobs_it.rs], deps: [FERRUM-PLATFORM-012, FERRUM-PLATFORM-016], limits: ["No app's process runs on it yet", "Steps run in order, one at a time: no parallel branches, timers or waiting for a person within a workflow", "Rust steps only: plugins cannot define workflows"]}
