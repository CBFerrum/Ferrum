# The shared kernel and application platform (specification §3, §4). See README.md for the format.
defaults: {component: platform, repositories: [CBFerrum/Ferrum], workstream: 2}
requirements:
  - {id: FERRUM-PLATFORM-001, title: Modular monolith with a Rust kernel and apps as crates, status: implemented_unqualified, basis: read, spec: "3.1", files: [crates/kernel/src/lib.rs, server/src/packages.rs, docs/plan/architecture.md]}
  - {id: FERRUM-PLATFORM-002, title: Authoritative ownership of each shared concept, status: partial, basis: read, spec: "3.2", files: [docs/registry/domain-dictionary.md, packages/contacts, packages/parties, packages/products, packages/project_records], limits: ["Person, party, product and project are shared packages; employee, payment and consent are not yet one owned model across apps"]}
  - {id: FERRUM-PLATFORM-003, title: Controlled merging of duplicate customers with aliases, status: missing, basis: probe, spec: "3.2", deps: [FERRUM-PLATFORM-002]}
  - {id: FERRUM-PLATFORM-004, title: Typed cross-application contracts with stated idempotency and failure behaviour, status: partial, basis: read, spec: "3.3", files: [crates/kernel/src/hooks.rs, ferrum-app-erp:src/localization.rs], limits: ["Apps call ERP's engine as a crate, without a published contract for each operation"]}
  - {id: FERRUM-PLATFORM-005, title: Hook dependencies and ordering checked at startup, status: partial, basis: read, spec: "3.3", files: [crates/kernel/src/hooks.rs], limits: ["Order is registration order; cycles and conflicts are not detected"]}
  - {id: FERRUM-PLATFORM-006, title: "Isolation profiles: shared cells, dedicated, on-premises, disconnected", status: partial, basis: read, spec: "3.4", files: [deploy/docker-compose.yml, deploy/k8s/deployment.yaml], deps: [FERRUM-CLOUD-001], limits: ["Single-server and Kubernetes deployments exist; cells and a disconnected profile do not"]}
  - {id: FERRUM-PLATFORM-007, title: Strong types at consequential boundaries, status: partial, basis: read, spec: "4.1", files: [crates/calc, crates/kernel/src/value.rs], limits: ["Money and tax go through ferrum-calc with decimals; documents stay JSON-shaped maps"]}
  - {id: FERRUM-PLATFORM-008, title: Explicit document state machine with per-state field rules, status: partial, basis: read, spec: "4.2", files: [crates/kernel/src/doc.rs], tests: [crates/kernel/tests/kernel_it.rs], limits: ["Draft, submitted and cancelled are general; approved, amended and archived vary by app"]}
  - {id: FERRUM-PLATFORM-009, title: Custom fields and entities with conflict detection, status: partial, basis: read, spec: "4.3", files: [crates/kernel/src/customize.rs, crates/meta], limits: ["Conflict detection between vendor, partner and tenant layers is not built"]}
  - {id: FERRUM-PLATFORM-010, title: "Schema evolution: expand, migrate, contract, resumable backfills", status: partial, basis: read, spec: "4.3", files: [server/src/upgrade.rs, crates/kernel/migrations], limits: ["Upgrade steps exist; resumable backfills and validation reports do not"]}
  - {id: FERRUM-PLATFORM-011, title: Equivalent integrity on every mutation path, status: partial, basis: read, spec: "4.4", files: [crates/kernel/src/bulk.rs, crates/kernel/src/doc.rs, server/src/importer.rs], limits: ["Not audited path by path; app maintenance jobs that write SQL directly need a review"]}
  - {id: FERRUM-PLATFORM-012, title: Transactional outbox with idempotent consumers, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs, docs/events.md], tests: [crates/kernel/tests/events_it.rs, crates/kernel/tests/kernel_it.rs]}
  - {id: FERRUM-PLATFORM-013, title: "Event envelope: origin, correlation, causation, trace context, versions", status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/db.rs, crates/kernel/migrations/20261101000001_event_envelope.sql, server/src/app.rs], tests: [crates/kernel/tests/events_it.rs], limits: ["Tasks an event handler spawns start without a trace"]}
  - {id: FERRUM-PLATFORM-014, title: Tenant fairness and priority classes for events, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs], tests: [crates/kernel/tests/events_it.rs], limits: ["Fairness covers the outbox and plugins; apps' own background jobs (Campaigns sending, upkeep) have none yet", "Bulk paths must set the bulk priority; importer and bulk.rs do not yet"], deps: [FERRUM-PLATFORM-012]}
  - {id: FERRUM-PLATFORM-015, title: Dead letters with inspection and audited replay, status: implemented_unqualified, basis: tested, spec: "4.5", files: [crates/kernel/src/outbox.rs, server/src/controllers/admin.rs], tests: [crates/kernel/tests/events_it.rs], limits: ["An API only: no administrator screen yet"]}
  - {id: FERRUM-PLATFORM-016, title: "Durable jobs with leases, cancellation and poison isolation", status: partial, basis: read, spec: "4.5", files: [server/src/tasks.rs, crates/plugins/src/schedule.rs], limits: ["Each scheduler is its own; there is no shared job queue with cancellation or retry budgets"]}
  - {id: FERRUM-PLATFORM-017, title: External effects run after commit, status: implemented_unqualified, basis: tested, spec: "4.6", files: [crates/plugins/src/host.rs, docs/events.md], tests: [crates/plugins/tests/after_commit_it.rs], limits: ["Enforced for plugins; native hooks are held to it by review (IRP and VIES read; other connectors not)"]}
  - {id: FERRUM-PLATFORM-018, title: No transaction held across an external call, status: implemented_unqualified, basis: tested, spec: "4.6", files: [crates/kernel/src/outbox.rs], tests: [crates/kernel/tests/events_it.rs]}
  - {id: FERRUM-PLATFORM-019, title: Stateful cross-system workflows with compensation, status: missing, basis: probe, spec: "4.6", deps: [FERRUM-PLATFORM-012]}
