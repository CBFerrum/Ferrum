  - {id: BF-ENTITY-001, title: "Child tables", workstream: BF8, status: verified_software, files: ["crates/kernel/migrations/20261110000002_custom_lines.sql", "crates/meta/src/effective.rs", "crates/kernel/src/store.rs", "crates/kernel/src/query.rs", "crates/kernel/src/ctx.rs", "crates/kernel/src/doc.rs", "crates/kernel/src/privacy.rs", "crates/kernel/src/lifecycle.rs", "crates/studio/src/query.rs", "docs/builder/decisions.md"], tests: ["crates/kernel/tests/custom_lines_it.rs", "crates/studio/tests/custom_lines_it.rs"], limits: "A custom master or document holds tables of custom child entities, their rows in custom_record under the parent, each child entity the lines of one table field only. Two tables of one order never mix through loading, list filters, adding, changing, removing and reordering rows, deleting (rows cascade), the workspace's export, Studio's grouping, measures and filters, or a portal path; rows are validated one by one, rules read the parent, 5,000 rows at most (custom_lines_it in the kernel and Studio; mutants custom-lines-load-mixes-tables, custom-lines-filter-mixes-tables, custom-lines-portal-path-mixes-tables, custom-lines-studio-grain-mixes-tables, custom-lines-studio-filter-mixes-tables). No index on a row's fields, which live in JSON; a row rule reading the parent reads all of it per row, slow near 5,000 rows; a customization adds no table to a package's entity; not walked in a browser"}
  - {id: BF-ENTITY-002, title: "Unique keys", workstream: BF8, status: verified_software, files: ["crates/kernel/migrations/20261110000002_custom_lines.sql", "crates/kernel/src/store.rs", "crates/kernel/src/customize.rs", "crates/meta/src/effective.rs", "docs/builder/decisions.md"], tests: ["crates/kernel/tests/custom_lines_it.rs"], limits: "Unique fields and keys of several fields on a custom master or document are rows of custom_key, written in the record's transaction with its primary key as the guard: of two saves at once one wins and the other is refused naming the fields; a changed, deleted or cancelled record frees its values, empty values hold none, another workspace's are its own; a key defined over records sharing values is refused listing them, and one removed takes its rows (custom_lines_it; mutants custom-keys-not-kept, custom-keys-held-by-cancelled, custom-key-over-duplicates). Values compare as typed (case counts); a child entity holds no keys; engine-kept values (set_values) may not touch a key field"}
  - {id: BF-ENTITY-003, title: "Numbering and totals", workstream: BF8, status: partial, files: ["crates/meta/src/types.rs", "crates/meta/src/catalog.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/custom_lines_it.rs"], limits: "Totals are done: a field's rollup sums a number field of its own rows, or counts them, in exact decimals at every save and in the draft preview, before validation, on any entity, ignoring what a client sends (custom_lines_it: 0.1 + 0.2 is 0.3, a 19-digit sum is exact; mutant rollup-not-computed). Missing: numbering series on a custom document were not exercised against AT-BF-ENTITY-003; a rollup has no condition and no other operation, and computed fields see the total of the save before"}
  - {id: BF-ENTITY-004, title: "Links both ways", workstream: BF8, status: not_started, limits: "Not started"}
  - {id: BF-PACK-001, title: "Pack format", workstream: BF9, status: partial, files: ["crates/kernel/src/pack.rs", "docs/api.md", "docs/builder/decisions.md"], tests: ["crates/kernel/src/pack.rs", "crates/studio/tests/pack_it.rs"], limits: "Done: a ferrum.pack/1 JSON document with a name, a version and the packages it requires, holding custom entities, fields, rules, workflows, print templates, roles and their rules, automations with their schedules and mail templates, Studio items, Logic solutions and reference records (seeds), read strictly (unknown keys refused, 5 MiB at most), with the platform's canonical digest leaving out exported_at: two exports of one definition have one digest, a changed word changes it (pack.rs unit tests, pack_it; mutant packs-digest-not-checked). Missing: approvals, public pages and words (their gates are not built), a publisher, and signing (BF-PACK-002)"}
  - {id: BF-PACK-002, title: "Signed and installed", workstream: BF9, status: not_started, limits: "Not started"}
  - {id: BF-PACK-003, title: "Upgraded and removed", workstream: BF9, status: not_started, limits: "Not started"}
  - {id: BF-PACK-004, title: "Exported between workspaces", workstream: BF9, status: verified_software, files: ["crates/kernel/src/pack.rs", "crates/kernel/src/customize.rs", "crates/kernel/src/auth.rs", "crates/kernel/src/automation.rs", "crates/kernel/migrations/20261110000004_pack_install.sql", "server/src/controllers/admin.rs", "docs/api.md"], tests: ["crates/studio/tests/pack_it.rs", "server/tests/pack_api_it.rs"], limits: "A gym built by configuration (an entity with lines, a key, a total, a check and a workflow; a role and a portal role with a path; an automation on each new record and a daily one with a mail template; a report, chart, card, dashboard and space; a solution whose rule counts; three reference rows) is exported, planned and installed in a fresh workspace, where each works as it did, the solution as a draft a second administrator reviews before it runs; installed again it changes nothing; a field, a condition and a row changed at the source follow, records kept; a wrong digest, an oversized or unknown-keyed pack, a non-administrator, a missing or older package and a refusal half way are each refused with nothing kept (pack_it, pack_api_it; mutants packs-digest-not-checked, packs-plan-kept, packs-automations-duplicated, packs-carry-people). Unsigned and administrator to administrator only; nothing is uninstalled or deleted; Studio queries and JSON fields holding record ids travel as they are; matched by name, label and key; not walked in a browser (no screen yet)"}
