  - {id: BF-SCHED-001, title: "Relative to a record's date", workstream: BF6, status: verified_software, files: ["crates/kernel/migrations/20261110000003_automation_schedule.sql", "crates/kernel/src/schedule.rs", "crates/kernel/src/automation.rs", "crates/kernel/src/lib.rs", "docs/api.md"], tests: ["crates/kernel/tests/schedule_it.rs", "crates/kernel/src/schedule.rs"], limits: "An automation with a relative schedule fires at a date or datetime field plus a signed offset of days, hours and minutes, a date field's at a time of day in the workspace's zone, once per record and moment however many replicas look (two scans at once, one run); the run reads the record afresh, so a date moved fires at its new moment (again, if the old one fired), a date cleared or moved away since the scan does not fire, a deleted record is skipped, and the condition is judged then; nothing already past fires for a new automation; right instants in Kolkata and across New York's change to daylight saving (schedule_it; mutants scheduled-moment-not-rechecked, scheduled-ignores-the-zone, schedule-takes-any-field). The smallest step is a minute; a custom field's dates are read out of JSON with no index; moments more than seven days late are skipped; no business calendar; not walked in a browser (the Administration dialog does not offer schedules yet)"}
  - {id: BF-SCHED-002, title: "Repeating schedules", workstream: BF6, status: verified_software, files: ["crates/kernel/migrations/20261110000003_automation_schedule.sql", "crates/kernel/src/schedule.rs", "crates/kernel/src/automation.rs", "crates/kernel/src/lib.rs", "docs/api.md"], tests: ["crates/kernel/tests/schedule_it.rs", "crates/kernel/src/schedule.rs"], limits: "Every day, week (a weekday) or month (a day 1-28 or the last) at a time in the workspace's zone, for each record a filter of at most eight conditions passes, or every day, week, month or year from a record's date until another; each occurrence fires once across replicas, and a scan stopped part way resumes from its cursor, a page at a time, none lost or doubled; after downtime the last seven days are caught up and older moments skipped (schedule_it; mutants scheduled-page-repeats-its-cursor, scheduled-catches-up-forever, scheduled-occurrences-never-pruned). Days 29-31 of a month are not offered (last is); a repeating schedule on a datetime field looks at every started record on each look; the scan runs once a minute, so a moment fires up to about a minute and a half late; not walked in a browser"}
