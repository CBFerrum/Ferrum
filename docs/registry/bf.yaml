# The builder-first program (BF-*): what each requirement has, by its evidence (docs/builder/README.md).
# The requirement's text and acceptance case are in docs/builder/catalog.json.
requirements:
  - {id: BF-BASE-001, title: "Decisions recorded", workstream: BF0, status: implemented_unverified, files: ["docs/builder/decisions.md"], limits: "Nine decisions recorded before building, each with what it rules out and its gate; each is proven only when its gate lands and its rows here say so"}
  - {id: BF-BASE-002, title: "Register checked", workstream: BF0, status: verified_software, files: ["scripts/registry.py", "docs/registry/bf.yaml", "docs/builder/catalog.json"], tests: ["scripts/registry.py"], limits: "Checked like the other programs (states, evidence, catalog agreement, limits); its self-test refuses a row verified without tests, partial citing nothing, in another gate, or silent on its limits. A person still decides what a test proves"}
  - {id: BF-BASE-003, title: "Exact inventory", workstream: BF0, status: verified_software, files: ["scripts/builder_inventory.py", "docs/builder/inventory.md"], tests: ["scripts/test_builder_inventory.py"], limits: "A search of 40 public app repositories at the heads it lists: it finds where a feature is written, not whether it is right, and patterns can miss a feature written another way. The private Cloud repository is left out"}
  - {id: BF-BASE-004, title: "Closure packages re-scoped", workstream: BF0, status: verified_software, files: ["docs/registry/feo.yaml", "scripts/registry.py", "docs/plan/builder-first.md"], tests: ["scripts/registry.py"], limits: "Twenty open closure packages name the gate taking them over, whole or in part, with what it takes; the check refuses a gate that does not exist (self-test). The other 37 stay with their apps or the platform, unchanged"}
