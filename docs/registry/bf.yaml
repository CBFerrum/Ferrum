# The builder-first program (BF-*): what each requirement has, by its evidence (docs/builder/README.md).
# The requirement's text and acceptance case are in docs/builder/catalog.json.
requirements:
  - {id: BF-BASE-001, title: "Decisions recorded", workstream: BF0, status: implemented_unverified, files: ["docs/builder/decisions.md"], limits: "Nine decisions recorded before building, each with what it rules out and its gate; each is proven only when its gate lands and its rows here say so"}
  - {id: BF-BASE-002, title: "Register checked", workstream: BF0, status: verified_software, files: ["scripts/registry.py", "docs/registry/bf.yaml", "docs/builder/catalog.json"], tests: ["scripts/registry.py"], limits: "Checked like the other programs (states, evidence, catalog agreement, limits); its self-test refuses a row verified without tests, partial citing nothing, in another gate, or silent on its limits. A person still decides what a test proves"}
  - {id: BF-BASE-003, title: "Exact inventory", workstream: BF0, status: verified_software, files: ["scripts/builder_inventory.py", "docs/builder/inventory.md"], tests: ["scripts/test_builder_inventory.py"], limits: "A search of 40 public app repositories at the heads it lists: it finds where a feature is written, not whether it is right, and patterns can miss a feature written another way. The private Cloud repository is left out"}
  - {id: BF-BASE-004, title: "Closure packages re-scoped", workstream: BF0, status: verified_software, files: ["docs/registry/feo.yaml", "scripts/registry.py", "docs/plan/builder-first.md"], tests: ["scripts/registry.py"], limits: "Twenty open closure packages name the gate taking them over, whole or in part, with what it takes; the check refuses a gate that does not exist (self-test). The other 37 stay with their apps or the platform, unchanged"}
  - {id: BF-PORTAL-001, title: "Portal roles", workstream: BF1, status: verified_software, files: ["crates/meta/src/types.rs", "crates/meta/src/catalog.rs", "crates/kernel/src/auth.rs", "crates/kernel/migrations/20261110000001_portal_roles.sql", "server/src/controllers/admin.rs"], tests: ["crates/kernel/tests/portal_it.rs"], limits: "A role marked for the portal holds own-record rules, and read-only rules on reference data (no package declares the entity personal and it keeps no email or phone), never every entity, delete, cancel, export or import; portal people hold portal roles only, guests none, neither an administrator (portal_it; mutants portal-role-holds-anything, portal-reads-personal-data-whole, portal-people-hold-member-roles, portal-roles-given-to-anyone). Whether an entity is reference data is read from declarations and field types: an undeclared entity keeping people's details in a text field counts as reference data"}
  - {id: BF-PORTAL-002, title: "Ownership through links", workstream: BF1, status: verified_software, files: ["crates/meta/src/via.rs", "crates/kernel/src/ctx.rs", "crates/kernel/src/doc.rs", "crates/kernel/src/access.rs"], tests: ["crates/kernel/tests/portal_it.rs", "crates/meta/src/via.rs"], limits: "Paths of at most two links and a child table to an email or text field, compared trimmed in any case; lists by SQL subqueries, single records looked up in their own transaction, never cached: a guardian taken off a student loses the student's records at once; another workspace's same email reaches nothing (portal_it; mutants portal-path-not-looked-up, portal-path-is-whoever-made-it, portal-path-ignores-the-rules-condition, portal-path-matches-case). Paths go outwards only: a record that links to the person's from elsewhere is not reached. Not measured on soak data (no index is added for the email fields paths end at)"}
  - {id: BF-PORTAL-003, title: "Fields and actions under portal roles", workstream: BF1, status: verified_software, files: ["crates/kernel/src/ctx.rs", "crates/kernel/src/describe.rs", "crates/kernel/src/collab.rs", "crates/kernel/src/audit.rs", "crates/domain/src/reports.rs"], tests: ["crates/kernel/tests/portal_it.rs"], limits: "Grouped fields stay hidden unless a rule names the group; a rule names the actions its holders run whatever the action's permission, under its condition and its app's checks; a record's comments, files, assignments, tags and history are refused to portal people and guests; unscoped reports refuse paths (portal_it; mutants named-action-runs-on-any-record, rule-names-an-action-that-is-not-there, portal-people-read-a-records-surroundings, portal-people-read-a-records-history). Global search was not exercised as a portal person; it goes through the same list scopes"}
  - {id: BF-PORTAL-004, title: "Generic portal pages", workstream: BF1, status: verified_software, files: ["crates/studio/app.yaml", "crates/studio/src/site.rs", "server/src/controllers/shell.rs", "Ferrum-Frontend:apps/studio/src/main.tsx", "Ferrum-Frontend:src/app/studio/PortalRecords.tsx", "Ferrum-Frontend:src/app/FormView.tsx", "docs/builder/evidence/browser-2026-11-10-portal.md"], tests: ["crates/kernel/tests/portal_it.rs", "docs/builder/evidence/browser-2026-11-10-portal.md"], limits: "Studio 0.3.0 gives the portal Your records: the entities a person's portal roles reach as theirs, their lists and forms, the actions they may run, without a record's discussion or activity. Walked in a browser as a portal person: lists, a record, a consent created, an action run, someone else's visit not found. A workspace on Studio 0.2.0 gets the page once Studio is upgraded; not walked on a phone"}
  - {id: BF-PORTAL-005, title: "Portal roles administered and previewed", workstream: BF1, status: verified_software, files: ["Ferrum-Frontend:src/app/Admin.tsx", "server/src/controllers/admin.rs", "crates/kernel/src/access.rs", "docs/builder/portal.md"], tests: ["crates/kernel/tests/portal_it.rs", "docs/builder/evidence/browser-2026-11-10-portal.md"], limits: "Administrators mark a role for the portal, give rules their path and actions, and give portal people portal roles only, in Administration (walked); the explanation names the rule's path (portal_it, mutant explanation-ignores-the-record). The explanation screen itself was not walked for a portal person"}
  - {id: BF-PORTAL-006, title: "Proof: two portals as configuration", workstream: BF1, status: verified_software, files: ["ferrum-app-healthcare:packages/healthcare/package.yaml", "ferrum-app-healthcare:src/appointments.rs", "ferrum-app-healthcare:src/consent.rs", "ferrum-app-education:packages/education/package.yaml", "ferrum-app-education:src/site.rs"], tests: ["ferrum-app-healthcare:tests/healthcare_it.rs", "ferrum-app-education:tests/education_it.rs"], limits: "Healthcare's Patient Portal and Education's Family roles, shipped as configuration, reach exactly the visits, enrollments, attendance, fees and published report cards the apps' own pages show, with cancelling held to the clinic's window and consents recorded as the pages record them (healthcare_it, education_it). The apps' own portal pages stay until their pages are retired for the generic ones (BD-08); invoices stay on ERP's page"}
