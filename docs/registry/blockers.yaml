# What only someone outside this repository can give (specification §2.2). Work that depends on one
# stays open until its evidence exists; nothing here is to be simulated.
blockers:
  - {id: BLOCK-INDUSTRIAL-HARDWARE, needs: "A robot or AMR, a PLC, an industrial gateway and a floor to run them on", owner: Chinmoy Bhuyan, blocks: "Any claim that the site runtime or an adapter works on equipment; gates G2, G3 and G5"}
  - {id: BLOCK-INDUSTRIAL-VENDORS, needs: "Vendor access: simulators, SDKs and test agreements", owner: Chinmoy Bhuyan, blocks: "Compatibility beyond stand-ins, OPC UA and any vendor-qualified adapter"}
  - {id: BLOCK-INDUSTRIAL-SAFETY, needs: "A functional-safety specialist and a site's hazard analysis", owner: Chinmoy Bhuyan, blocks: "Any statement about what may be started remotely; gate G7. Ferrum makes no safety claim"}
  - {id: BLOCK-INDUSTRIAL-SECURITY, needs: "An independent review against IEC 62443 on a customer's network", owner: Chinmoy Bhuyan, blocks: "Gate G1 and any claim of secure connectivity"}
  - {id: BLOCK-PAYMENT-KEYS, needs: "Stripe, Razorpay and PayPal test keys", owner: Chinmoy Bhuyan, blocks: "Gateways against real sandboxes; deposits; cloud billing"}
  - {id: BLOCK-NIC-SANDBOX, needs: NIC e-invoice sandbox credentials, owner: Chinmoy Bhuyan, blocks: India's IRP connection against the sandbox}
  - {id: BLOCK-EINVOICE-PROVIDERS, needs: "Accounts with Peppol access points, HMRC, Avalara, ANAF and the rest", owner: Chinmoy Bhuyan, blocks: Each country's live connection}
  - {id: BLOCK-IDP-TENANT, needs: Test tenants at Okta and Microsoft Entra, owner: Chinmoy Bhuyan, blocks: Running SCIM against real providers}
  - {id: BLOCK-SECURITY-REVIEW, needs: An independent penetration test and ASVS assessment, owner: Chinmoy Bhuyan, blocks: Any claim of security verification}
  - {id: BLOCK-ACCESSIBILITY-AUDIT, needs: A manual WCAG 2.2 AA audit, owner: Chinmoy Bhuyan, blocks: Any claim of accessibility conformance}
  - {id: BLOCK-LEGAL-REVIEW, needs: "Counsel on licensing, partner terms, privacy duties and regulated industries", owner: Chinmoy Bhuyan, blocks: "Licensing claims, partner program, healthcare and government packs"}
  - {id: BLOCK-TAX-REVIEW, needs: A qualified accountant's review of each country's output, owner: Chinmoy Bhuyan, blocks: Any claim that a country's taxes are right}
  - {id: BLOCK-PAYROLL-REVIEW, needs: Payroll fixtures prepared independently per jurisdiction, owner: Chinmoy Bhuyan, blocks: Any jurisdiction's payroll}
  - {id: BLOCK-POS-HARDWARE, needs: "Receipt printers, drawers, displays and a card terminal with a provider account", owner: Chinmoy Bhuyan, blocks: Device adapters}
  - {id: BLOCK-EV-HARDWARE, needs: Charge points and OCPP conformance testing, owner: Chinmoy Bhuyan, blocks: EV charging pack}
  - {id: BLOCK-MAPS-KEY, needs: A routing provider's account, owner: Chinmoy Bhuyan, blocks: Road travel times}
  - {id: BLOCK-SIGNING-PROVIDER, needs: A qualified trust service provider, owner: Chinmoy Bhuyan, blocks: PAdES and qualified signatures}
  - {id: BLOCK-HOSPITALITY-CHANNELS, needs: "Certification with Booking.com and other channels", owner: Chinmoy Bhuyan, blocks: Hospitality channel connections}
  - {id: BLOCK-GHCR-VISIBILITY, needs: "A decision on making the ghcr packages public, which cannot be undone", owner: Chinmoy Bhuyan, blocks: Anonymous image pulls in Frontend CI and by self-hosters}
  - {id: BLOCK-PRODUCTION-DOMAINS, needs: "A production domain and a DNS account Ferrum may change", owner: Chinmoy Bhuyan, blocks: "Real custom domains and certificates; staging and test domains only until then"}
  - {id: BLOCK-PROVIDER-CONTRACTS, needs: "Provider contracts, redistribution and managed-use rights for each hosted component", owner: Chinmoy Bhuyan, blocks: "Offering Gitea, Harbor, Pomerium, NetBird or similar as a managed service; their adapters stay off for that mode"}
  - {id: BLOCK-TIMESCALE-LICENSE, needs: "A decision on Timescale's editions and hosting terms", owner: Chinmoy Bhuyan, blocks: "A managed Timescale offering; a customer-owned path or an alternative stands in"}
  - {id: BLOCK-REAL-TENANTS, needs: "Real tenants at an IdP, a private network provider, an MDM and a PAM service", owner: Chinmoy Bhuyan, blocks: "Provider qualification; contract tests stay labelled software-only"}
  - {id: BLOCK-EDGE-SERVICE-TIER, needs: "A chosen CDN, WAF and PAM service tier", owner: Chinmoy Bhuyan, blocks: "Global delivery and perimeter claims"}
  - {id: BLOCK-RESIDENCY-POLICY, needs: "Decisions on residency, retention and legal hold per customer", owner: Chinmoy Bhuyan, blocks: "Cross-boundary transfer, which stays refused"}
  - {id: BLOCK-LTS-SUPPORT, needs: "A funded support and LTS commitment", owner: Chinmoy Bhuyan, blocks: "Any SLA or production-supported label"}
  - {id: BLOCK-CLOUD-VISIBILITY, needs: "Where ferrum-cloud's images are published, and the credentials a cluster pulls them with: ferrum-app-cloud is private, and a package it publishes would be too", owner: Chinmoy Bhuyan, blocks: "Deploying Cloud from a registry. Its server and its images are built and started as deployed in ferrum-app-cloud's CI (server/, Dockerfile, its server and image jobs) from public sources at one commit of this repository, so nothing here fetches that repository or its packages"}
  - {id: BLOCK-SANDBOX-QUALIFICATION, needs: "A qualified runtime class for untrusted code, with egress enforced, on a real cluster", owner: Chinmoy Bhuyan, blocks: "Running a stranger's builds or servers on shared hosts in production. Docker is the development stand-in"}
  - {id: BLOCK-KMS, needs: "A KMS and a decision on key custody per deployment", owner: Chinmoy Bhuyan, blocks: "Signing keys held outside the database, and key recovery drills"}
