# AI as a governed capability (specification §13).
defaults: {component: ai, repositories: [CBFerrum/Ferrum], workstream: 8, basis: read}
requirements:
  - {id: FERRUM-AI-001, title: Assistant acts as the person with writes approved in the conversation, status: implemented_unqualified, basis: tested, spec: "13.1 13.4", files: [server/src/assistant.rs, crates/mcp/src/lib.rs], tests: [server/tests/assistant_it.rs, server/tests/assistant_egress_it.rs], limits: ["Approval is bound to the stored call, the record's version and 30 minutes; estimated financial impact is not shown", "Before every call to the model, retry and tool, the person and the policy are read again; a change stops the turn, and later turns send earlier answers only while what they drew on may still go (FEO-059, FEO-060)", "A call runs unasked only when this server knows it reads; inputs are checked at every depth (FEO-061)"]}
  - {id: FERRUM-AI-002, title: "Shared AI gateway: providers, allowlists, regions, spending limits", status: implemented_unqualified, basis: tested, spec: "13.2", files: [server/src/assistant.rs, server/src/assistant_openai.rs, crates/kernel/src/tenant.rs, docs/operations.md], tests: [server/tests/assistant_egress_it.rs, server/tests/assistant_openai_it.rs, server/src/assistant_openai.rs], limits: ["Two provider protocols: Anthropic's Messages API (or a proxy that speaks it) and an OpenAI-compatible chat API, which carries text, tools and usage and leaves Anthropic's reasoning, citations and fallbacks out", "Regions are by deployment: each calls the endpoint its operator sets (a provider's regional one); one deployment does not route workspaces to different regions", "Budgets are in tokens: no prices are invented", "Usage is metered per workspace, person and model", "A workspace's policy that cannot be read is never the defaults: the one last read stands in for at most five minutes, never once its settings are known to have changed, and otherwise the assistant is unavailable (FEO-004)", "Each call holds back what it may use under one lock per workspace, so turns at once stay within the allowance; keys in answers are withheld as they stream (FEO-062)"]}
  - {id: FERRUM-AI-003, title: Egress policy separate from read permission, status: implemented_unqualified, basis: tested, spec: "13.2", files: [crates/kernel/src/ctx.rs, crates/kernel/src/doc.rs, crates/kernel/src/query.rs], tests: [server/tests/assistant_egress_it.rs], deps: [FERRUM-AI-002], limits: ["Packages mark entities `internal` and fields with perm_group. Reviewed across every app on 8 November 2026: HR's bank, identity, review, personal (date of birth, blood group) and pay (CTC) fields, Healthcare's patients' dates of birth and their allergies and visit notes (clinical), Education's students' and applicants' dates of birth, Nonprofit's donors' tax ids and Logistics' drivers' licence numbers are in groups, each granted to every role that read or wrote them, so people see what they saw and only what goes to an AI provider changed. Token digests (Commerce, Digital Assets, IoT Edge) are not in a group: a digest of a random token gives nothing away", "An app's own reports read by SQL keep to the policy only where they ask readable(): HR's do (upcoming events, the income tax and bank reports, ferrum-app-hr tests/hr_it.rs)", "Fields free of any group go, whatever they hold"]}
  - {id: FERRUM-AI-004, title: Authorization-aware retrieval, status: implemented_unqualified, basis: tested, spec: "13.3", files: [server/src/search.rs, server/src/assistant.rs, server/src/controllers/mcp.rs], tests: [server/tests/assistant_egress_it.rs], limits: ["The assistant and AI agents retrieve through the workspace's search (search_workspace) and the records tools: on its own indexes (trigram, per workspace under row-level security), filtered when asked by the person's rights and, for the assistant, its narrowed view (internal records and grouped fields are not searched)", "No embeddings or semantic index: nothing is cached for anyone beyond the request, and retrieval matches words, not meaning"]}
  - {id: FERRUM-AI-005, title: Evaluation datasets and prompt-injection tests, status: blocked_external, basis: tested, spec: "13.5", files: [server/src/assistant_eval.rs, server/assistant-evals/grounded.yaml, server/src/assistant.rs, server/tests/assistant_egress_it.rs], tests: [server/tests/assistant_eval_it.rs, server/tests/assistant_egress_it.rs], deps: [FERRUM-AI-001], external: [BLOCK-MODEL-KEY], limits: ["Grounded-answer cases (server/assistant-evals) graded by `ferrum task assistant_eval`: what the answer says, what it read before answering, and what a record planted for it to say", "Each answer records the prompt version it was answered under (instructions, tools, model), whose text each workspace keeps", "An adversarial test with a model that obeys injected instructions", "Never yet run against a real model: that needs a provider's key and a budget for the runs"]}
  - {id: FERRUM-AI-006, title: Domain-specific assistants with sources shown, status: implemented_unqualified, basis: read, spec: "13.6", deps: [FERRUM-AI-002], files: [server/src/assistant.rs, server/shell/assistant.js, crates/apps/src/shell.rs], tests: [server/src/assistant.rs], limits: ["An app tells the assistant about its records through shell.assistant, added to the context of each message written in its pages: every app's is written (their states, what counts and where figures come from, with questions to ask there), checked by the platform's manifest parser; their suggestions are English, as an app's manifest is", "Sources are the records, lists and reports the answer's reads looked at, shown under it; what the model took from each is not marked sentence by sentence", "Not tried in a browser against a real model when it was built"]}
