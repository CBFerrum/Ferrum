# AI as a governed capability (specification §13).
defaults: {component: ai, repositories: [CBFerrum/Ferrum], workstream: 8, basis: read}
requirements:
  - {id: FERRUM-AI-001, title: Assistant acts as the person with writes approved in the conversation, status: implemented_unqualified, basis: tested, spec: "13.1 13.4", files: [server/src/assistant.rs, crates/mcp/src/lib.rs], tests: [server/tests/assistant_it.rs, server/tests/assistant_egress_it.rs], limits: ["Approval is bound to the stored call, the record's version and 30 minutes; estimated financial impact is not shown"]}
  - {id: FERRUM-AI-002, title: "Shared AI gateway: providers, allowlists, regions, spending limits", status: implemented_unqualified, basis: tested, spec: "13.2", files: [server/src/assistant.rs, server/src/assistant_openai.rs, crates/kernel/src/tenant.rs, docs/operations.md], tests: [server/tests/assistant_egress_it.rs, server/tests/assistant_openai_it.rs, server/src/assistant_openai.rs], limits: ["Two provider protocols: Anthropic's Messages API (or a proxy that speaks it) and an OpenAI-compatible chat API, which carries text, tools and usage and leaves Anthropic's reasoning, citations and fallbacks out", "Regions are by deployment: each calls the endpoint its operator sets (a provider's regional one); one deployment does not route workspaces to different regions", "Budgets are in tokens: no prices are invented", "Usage is metered per workspace, person and model"]}
  - {id: FERRUM-AI-003, title: Egress policy separate from read permission, status: implemented_unqualified, basis: tested, spec: "13.2", files: [crates/kernel/src/ctx.rs, crates/kernel/src/doc.rs, crates/kernel/src/query.rs], tests: [server/tests/assistant_egress_it.rs], deps: [FERRUM-AI-002], limits: ["Packages must mark entities `internal` and fields with perm_group: HR's are marked, others not yet reviewed", "Fields free of any group go, whatever they hold"]}
  - {id: FERRUM-AI-004, title: Authorization-aware retrieval, status: partial, spec: "13.3", files: [server/src/assistant.rs], limits: ["Tools run as the person, so reads are theirs; no retrieval index, so caches and embeddings do not arise yet"]}
  - {id: FERRUM-AI-005, title: Evaluation datasets and prompt-injection tests, status: partial, basis: tested, spec: "13.5", files: [server/tests/assistant_egress_it.rs], tests: [server/tests/assistant_egress_it.rs], deps: [FERRUM-AI-001], limits: ["An adversarial test with a model that obeys injected instructions; no evaluation against real models, no grounded-answer datasets, no recorded prompt versions"]}
  - {id: FERRUM-AI-006, title: Domain-specific assistants with sources shown, status: implemented_unqualified, basis: read, spec: "13.6", deps: [FERRUM-AI-002], files: [server/src/assistant.rs, server/shell/assistant.js, crates/apps/src/shell.rs], tests: [server/src/assistant.rs], limits: ["An app tells the assistant about its records through shell.assistant, added to the context of each message written in its pages; ERP's is written, other apps' not yet", "Sources are the records, lists and reports the answer's reads looked at, shown under it; what the model took from each is not marked sentence by sentence", "Not tried in a browser against a real model when it was built"]}
