# AI as a governed capability (specification §13).
defaults: {component: ai, repositories: [CBFerrum/Ferrum], workstream: 8, basis: read}
requirements:
  - {id: FERRUM-AI-001, title: Assistant acts as the person with writes approved in the conversation, status: partial, spec: "13.1 13.4", files: [server/src/assistant.rs], tests: [server/tests/assistant_it.rs], limits: ["An approval is not bound to an exact proposal with versions and an expiry"]}
  - {id: FERRUM-AI-002, title: "Shared AI gateway: providers, allowlists, regions, spending limits", status: missing, basis: probe, spec: "13.2", limits: ["One provider through one key"]}
  - {id: FERRUM-AI-003, title: Egress policy separate from read permission, status: missing, basis: probe, spec: "13.2", deps: [FERRUM-AI-002]}
  - {id: FERRUM-AI-004, title: Authorization-aware retrieval, status: partial, spec: "13.3", files: [server/src/assistant.rs], limits: ["Tools run as the person, so reads are theirs; no retrieval index, so caches and embeddings do not arise yet"]}
  - {id: FERRUM-AI-005, title: Evaluation datasets and prompt-injection tests, status: missing, basis: probe, spec: "13.5", limits: ["Prompt-injection acceptance not tested"], deps: [FERRUM-AI-001]}
  - {id: FERRUM-AI-006, title: Domain-specific assistants with sources shown, status: missing, basis: probe, spec: "13.6", deps: [FERRUM-AI-002]}
