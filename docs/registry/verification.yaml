# Independent verification (specification §18). A journey stays open until it runs end to end,
# through interfaces, with its failure paths and independently prepared expectations.
defaults: {component: verification, repositories: [CBFerrum/Ferrum], workstream: 11, basis: read, status: missing}
requirements:
  - {id: FERRUM-VERIFY-001, title: Tests detect broken invariants, status: implemented_unqualified, basis: tested, spec: "18.3", files: [scripts/mutants.py], tests: [scripts/mutants.py], limits: ["Covers this work's invariants, not the whole platform"]}
  - {id: FERRUM-VERIFY-002, title: Independent domain fixtures for finance and payroll, spec: "18.1", status: blocked_external, external: [BLOCK-TAX-REVIEW, BLOCK-PAYROLL-REVIEW], limits: ["Independent means prepared apart from the code that computes them: a qualified accountant's review of each country's output, and payroll cases prepared per jurisdiction by someone who knows its rules", "The payroll engine computes income tax from the slabs a workspace sets (ferrum-app-hr src/payroll), so a jurisdiction's fixtures need its slabs set up as that jurisdiction says, beside the cases", "The tests that exist were written with the code, by its authors"]}
