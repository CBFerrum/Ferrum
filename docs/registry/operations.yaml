# Installation, reliability and release (specification §16, §17).
defaults: {component: operations, repositories: [CBFerrum/Ferrum], workstream: 11, basis: read}
requirements:
  - {id: FERRUM-OPS-001, title: Local development and single-server deployment, status: implemented_unqualified, spec: "16.1", files: [deploy/docker-compose.yml, docs/operations.md, deploy/smoke.sh]}
  - {id: FERRUM-OPS-002, title: High availability on Kubernetes, status: implemented_unqualified, spec: "16.1", files: [deploy/k8s/deployment.yaml, deploy/kind/smoke.sh]}
  - {id: FERRUM-OPS-003, title: "Dedicated, on-premises and disconnected profiles", status: partial, spec: "16.1", files: [docs/operations.md], limits: ["No registry mirroring or offline install procedure"]}
  - {id: FERRUM-OPS-004, title: Installer preflight and a doctor command, status: implemented_unqualified, basis: tested, spec: "16.2", files: [crates/kernel/src/doctor.rs, server/src/doctor.rs, deploy/preflight.sh], tests: [crates/kernel/tests/doctor_it.rs, server/src/doctor.rs], limits: ["preflight.sh is checked for syntax, not run on a clean host", "Does not send mail, so a mailer's credentials are not proven"]}
  - {id: FERRUM-OPS-005, title: Reference workloads and measured capacity, status: partial, spec: "16.3", files: [tools/loadtest.py], limits: ["A short load test; no published reference workload or targets"]}
  - {id: FERRUM-OPS-006, title: "Safe large files: resumable uploads, limits", status: partial, basis: tested, spec: "16.4", files: [server/src/objects.rs, server/src/controllers/sites.rs, crates/kernel/src/files.rs, crates/kernel/src/hooks.rs], tests: [server/tests/streamed_files_it.rs, crates/kernel/tests/collab_it.rs], limits: ["Direct uploads to S3 up to 2 GiB; uploads through the server stay at the request limit", "Downloads stream: the platform's, and an app's that answers with the stored file (SiteResponse::file); an app's whole read is refused past 256 MB", "Drive's downloads and the attachments of Comms, Helpdesk and Learn answer with the stored file", "Uploads do not resume after a dropped connection"]}
  - {id: FERRUM-OPS-007, title: Malware scanning of uploads, status: implemented_unqualified, basis: tested, spec: "16.4", files: [crates/kernel/src/scan.rs, server/src/objects.rs, crates/kernel/migrations/20261101000007_file_scan.sql], tests: [crates/kernel/tests/scan_it.rs], limits: ["Tested against a stand-in speaking clamd's protocol, not a real ClamAV", "A file is scanned once, on upload; nothing rescans when signatures change", "The direct-upload path is not covered by a test"]}
  - {id: FERRUM-OPS-008, title: Disaster recovery rehearsed into a clean environment, status: implemented_unqualified, spec: "16.5", files: [deploy/smoke.sh, deploy/kind/smoke.sh, docs/operations.md], limits: ["Compose and kind rehearsals; zone, region and ransomware procedures not written"]}
  - {id: FERRUM-OPS-009, title: Structured logs and basic metrics, status: implemented_unqualified, basis: tested, spec: "16.6", files: [server/src/request_log.rs, server/src/controllers/system.rs, server/src/telemetry.rs, crates/kernel/src/lib.rs, crates/kernel/src/doc.rs], tests: [server/src/controllers/system.rs, server/src/telemetry.rs, crates/kernel/tests/collab_it.rs], limits: ["Traces over OTLP/HTTP when a collector is configured: each request is a span (its method and path), a caller's traceparent its parent; database queries, jobs and outgoing calls are not spans of their own", "Tried against stand-in collectors (the test's, and one beside a running server, which received a request's span in the caller's trace), not an OpenTelemetry Collector, Jaeger or Tempo", "Job, outbox and connection health are metrics, and so are submits, cancels, actions and workflow steps that did not go through, per package, entity and operation, refused by their own rules or a fault; counted per process since it started, not per workspace", "Saves that fail validation are not counted: they are a person's to correct"]}
  - {id: FERRUM-RELEASE-001, title: Build once and promote the qualified digest, status: implemented_unqualified, spec: "1.2 17.1", files: [.github/workflows/ci.yml, .github/workflows/cluster.yml], limits: ["The workflows have not run yet: they need a push to main"]}
  - {id: FERRUM-RELEASE-002, title: Provenance and SBOM attested at promotion, status: implemented_unqualified, spec: "17.1 17.3", files: [.github/workflows/ci.yml], limits: ["Not run yet; requires the images to be attested by CI"]}
  - {id: FERRUM-RELEASE-003, title: Release manifest of every component, status: implemented_unqualified, basis: tested, spec: "17.2", files: [docs/registry/release-manifest.yaml, scripts/release_evidence.py, scripts/registry.py, .github/workflows/ci.yml], tests: [scripts/registry.py], limits: ["Generated from Cargo.lock and checked in CI, and each build's evidence kept on its run. Not yet attached to a release, because none has been qualified", "Evidence names the migrations in this repository: an app's are at the commit it names"]}
  - {id: FERRUM-RELEASE-004, title: Accepted advisories with owner and review date, status: implemented_unqualified, basis: tested, spec: "17.3", files: [docs/registry/advisories.yaml, .cargo/audit.toml, scripts/registry.py], tests: [scripts/registry.py]}
  - {id: FERRUM-RELEASE-005, title: Published support and compatibility policy, status: partial, basis: read, spec: "17", files: [docs/support-policy.md], limits: ["A draft: support windows are the owner's commitment to make, and none is in force"]}
  - {id: FERRUM-RELEASE-006, title: Base images pinned by digest, status: implemented_unqualified, spec: "17.3", files: [Dockerfile], limits: ["Compose and Kubernetes still name some third-party images by tag"]}
