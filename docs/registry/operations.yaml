# Installation, reliability and release (specification §16, §17).
defaults: {component: operations, repositories: [CBFerrum/Ferrum], workstream: 11, basis: read}
requirements:
  - {id: FERRUM-OPS-001, title: Local development and single-server deployment, status: implemented_unqualified, spec: "16.1", files: [deploy/docker-compose.yml, docs/operations.md, deploy/smoke.sh]}
  - {id: FERRUM-OPS-002, title: High availability on Kubernetes, status: implemented_unqualified, spec: "16.1", files: [deploy/k8s/deployment.yaml, deploy/kind/smoke.sh]}
  - {id: FERRUM-OPS-003, title: "Dedicated, on-premises and disconnected profiles", status: partial, spec: "16.1", files: [docs/operations.md], limits: ["No registry mirroring or offline install procedure"]}
  - {id: FERRUM-OPS-004, title: Installer preflight and a doctor command, status: missing, basis: probe, spec: "16.2"}
  - {id: FERRUM-OPS-005, title: Reference workloads and measured capacity, status: partial, spec: "16.3", files: [tools/loadtest.py], limits: ["A short load test; no published reference workload or targets"]}
  - {id: FERRUM-OPS-006, title: "Safe large files: resumable uploads, limits", status: partial, spec: "16.4", files: [server/src/objects.rs], limits: ["Direct uploads to S3 up to 2 GiB; apps read files into memory"]}
  - {id: FERRUM-OPS-007, title: Malware scanning of uploads, status: missing, basis: probe, spec: "16.4"}
  - {id: FERRUM-OPS-008, title: Disaster recovery rehearsed into a clean environment, status: implemented_unqualified, spec: "16.5", files: [deploy/smoke.sh, deploy/kind/smoke.sh, docs/operations.md], limits: ["Compose and kind rehearsals; zone, region and ransomware procedures not written"]}
  - {id: FERRUM-OPS-009, title: Structured logs and basic metrics, status: partial, spec: "16.6", files: [server/src/request_log.rs, server/src/controllers/system.rs], limits: ["No OpenTelemetry traces; no business metrics such as failed postings or stale syncs"]}
  - {id: FERRUM-RELEASE-001, title: Build once and promote the qualified digest, status: implemented_unqualified, spec: "1.2 17.1", files: [.github/workflows/ci.yml, .github/workflows/cluster.yml], limits: ["The workflows have not run yet: they need a push to main"]}
  - {id: FERRUM-RELEASE-002, title: Provenance and SBOM attested at promotion, status: implemented_unqualified, spec: "17.1 17.3", files: [.github/workflows/ci.yml], limits: ["Not run yet; requires the images to be attested by CI"]}
  - {id: FERRUM-RELEASE-003, title: Release manifest of every component, status: partial, spec: "17.2", files: [docs/registry/release-manifest.yaml], limits: ["Written by hand at this audit; not yet generated in CI"]}
  - {id: FERRUM-RELEASE-004, title: Accepted advisories with owner and review date, status: implemented_unqualified, basis: tested, spec: "17.3", files: [docs/registry/advisories.yaml, .cargo/audit.toml, scripts/registry.py], tests: [scripts/registry.py]}
  - {id: FERRUM-RELEASE-005, title: Published support and compatibility policy, status: missing, basis: probe, spec: "17.4"}
  - {id: FERRUM-RELEASE-006, title: Base images pinned by digest, status: implemented_unqualified, spec: "17.3", files: [Dockerfile], limits: ["Compose and Kubernetes still name some third-party images by tag"]}
