# Ferrum Cloud and the partner model (specification §14, §15). Multi-tenant hosting exists; the
# operating layer around it does not.
defaults: {component: cloud, repositories: [], workstream: 9, basis: probe, status: missing}
requirements:
  - {id: FERRUM-CLOUD-001, title: Control plane separate from customer workloads, spec: "14.1", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-control], files: ["ferrum-app-control:src/fleet.rs", "ferrum-app-control:src/hosting.rs", "ferrum-app-control:src/site.rs", "ferrum-app-control:packages/control/entities/control.yaml", "ferrum-app-control:ui/src/Home.tsx", "ferrum-app-control:docs/PROVENANCE.md", docs/support-access.md], tests: ["ferrum-app-control:tests/control_it.rs"], limits: ["The control plane is an app run in a workspace of its own: it records cells, where each workspace runs and on what terms, and reads a workspace only through the health-only support key its customer gave, over HTTP, as the server answers one; it holds no records, and the cells do not call it", "Placement by capacity, releases by digest, health, plans and monthly amounts as metadata, support access ending, and recovery requests decided by a second operator", "It makes workspaces on their cells from their setups, and with ERP it invoices hosted workspaces monthly (FERRUM-CLOUD-003); it does not provision cells or run backups or restores: those stay with each cell's tooling", "Statements, certifications and upkeep go by the control plane's own day", "Tested with one customer workspace standing in for a cell; never run against a deployment"]}
  - {id: FERRUM-CLOUD-002, title: "Tenant lifecycle: signup, provisioning, plans, closure", spec: "14.2", status: implemented_unqualified, basis: tested, repositories: [CBFerrum/Ferrum, CBFerrum/Ferrum-Frontend], files: [crates/kernel/src/signup.rs, crates/kernel/src/plans.rs, crates/kernel/src/account.rs, crates/kernel/src/tenant.rs, crates/kernel/migrations/20261104000002_people_quota.sql, server/src/app.rs, server/src/controllers/accounts.rs, server/src/controllers/admin.rs, server/shell/signup.js, server/src/tasks.rs, "Ferrum-Frontend:src/app/Admin.tsx"], tests: [crates/kernel/tests/signup_it.rs, crates/kernel/tests/closure_it.rs, docs/platform/evidence/browser-2026-11-04.md], limits: ["Sign-up, plans and their quotas, and closing by the administrator or the operator are tested in the kernel, with mutants, and were walked once in a browser on a server built on one machine (evidence/browser-2026-11-04.md); not on the image or a deployment", "Sign-up needs a base domain and mail", "A plan charges nothing: prices and payment are FERRUM-CLOUD-003's"], deps: [FERRUM-CLOUD-001]}
  - {id: FERRUM-CLOUD-003, title: "Metering, billing, entitlements", status: partial, basis: tested, spec: "14.3", repositories: [CBFerrum/Ferrum, CBFerrum/ferrum-app-control], files: ["crates/kernel/src/account.rs", "server/src/tasks.rs", "ferrum-app-control:src/billing.rs", "ferrum-app-control:packages/control_erp/package.yaml", "ferrum-app-control:connectors/erp/app.yaml", "crates/kernel/src/support.rs", "ferrum-app-control:src/hosting.rs", "ferrum-app-control:packages/control_erp/entities/billing.yaml"], tests: ["crates/kernel/tests/support_it.rs", "ferrum-app-control:tests/billing_it.rs"], deps: [FERRUM-CLOUD-001], external: [BLOCK-PAYMENT-KEYS], limits: ["Metering and account states exist in each workspace. Its support report gives its people and storage (Ferrum PR 86), and the Control Plane keeps each workspace's daily usage from its health readings", "With ERP, the Control Plane's connector (control-erp) invoices each billed workspace once a month as an ERP Sales Invoice. The invoice holds what the workspace pays a month, for its days, plus the people and whole GB of storage beyond its terms at the month's peak. A month is never invoiced twice. Without ERP, partners' statements count what workspaces pay", "No price lists, and usage is not prorated. Payment is ERP's, and payment gateways wait for their keys", "Storage, people and assistant tokens are enforced quotas, as Operations' devices and measurements are; jobs are only metered", "Connector and communication usage are not metered"]}
  - {id: FERRUM-CLOUD-004, title: "Fleet inventory, staged upgrades, customer-facing status", spec: "14.4", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-control], deps: [FERRUM-CLOUD-001], files: ["ferrum-app-control:src/fleet.rs", "ferrum-app-control:src/hosting.rs", "ferrum-app-control:src/site.rs", "ferrum-app-control:packages/control/entities/control.yaml", "ferrum-app-control:ui/src/Home.tsx", "ferrum-app-control:docs/PROVENANCE.md", "ferrum-app-control:ui/src/Service.tsx", "ferrum-app-control:ui/src/Status.tsx"], tests: ["ferrum-app-control:tests/control_it.rs", "ferrum-app-control:ui/src/status.test.tsx"], limits: ["Cells report version, digest, configuration fingerprint, last backup, certificate expiry and resource use; a cell is down when quiet for 15 minutes or its certificate has expired, degraded on drift, an old backup, a near certificate or a resource at 90%", "Rollouts of releases qualified by a second Release Manager go one wave at a time in each cell's weekly window, soak while healthy, and halt when a cell falls ill, misses its window or the release is withdrawn; contacts are told when one starts", "Incidents told in updates that stay as posted; a public status by region naming no customer; a customer's page with their workspace's health, cell, maintenance, incidents, recovery requests and cases", "Release digests are checked for form, not against a signature or provenance; certificates are watched, not renewed; restores are requested, not run", "The public status has a page anyone opens at /control/status/{workspace} (Control Plane 0.1.7), read again every minute, as well as its JSON; not yet walked on a running server. In a browser on a server built on one machine, a release recorded and qualified by a second Release Manager, a rollout through its wave in eu-1's maintenance window to the end of its soak, an incident told in updates with the status read signed out, and a restore requested, refused to who asked, approved by another and marked done as its customer read it (evidence/browser-2026-11-04-flows.md); the cell's tooling was a stand-in loop"]}
  - {id: FERRUM-PARTNER-001, title: Partner console, spec: "15.1", status: partial, basis: tested, repositories: [CBFerrum/ferrum-app-control], deps: [FERRUM-CLOUD-001], files: ["ferrum-app-control:src/partners.rs", "ferrum-app-control:src/site.rs", "ferrum-app-control:ui/src/Partner.tsx", "ferrum-app-control:packages/control/entities/control.yaml"], tests: ["ferrum-app-control:tests/control_it.rs"], limits: ["A partner's members, on the portal, see their customers' workspaces with health, plan, renewals and support access ending, onboard customers from setup templates (versioned packs of packages, store apps and settings, a workspace keeping the revision it was set up from), raise support cases due by the support plan, and read revenue statements of their share", "A workspace is made on its cell from its setup (the cell's POST /api/tenants with the cell's bootstrap token, the setup's packages and settings, and its first administrator, whose first password is random and kept nowhere), by a fleet operator or at once when a partner onboards a customer with its first administrator; where the cell cannot, it is recorded and the partner told why. A setup's store apps are installed by the administrator.", "A month's statement counts what each workspace was invoiced for it through ERP, else what an active one pays a month, in the operator's one billing currency", "The partner's portal page walked in a browser on a server built on one machine: the portfolio, a case raised, onboarding refused while the region's cell was full, and a month's statement issued, refused a second time and for a month not ended, and read there (evidence/browser-2026-11-04-flows.md)"]}
  - {id: FERRUM-PARTNER-002, title: Layered support access that expires and is visible to the customer, status: implemented_unqualified, basis: tested, spec: "15.2", files: [crates/kernel/src/support.rs, server/src/extract.rs, server/src/controllers/admin.rs, docs/support-access.md], tests: [crates/kernel/tests/support_it.rs], limits: ["The request log is written by the HTTP layer, which the suite exercises directly rather than over HTTP", "No partner console shows these: they are API routes"]}
