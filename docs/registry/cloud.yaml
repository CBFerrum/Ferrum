# Ferrum Cloud and the partner model (specification §14, §15). Multi-tenant hosting exists; the
# operating layer around it does not.
defaults: {component: cloud, repositories: [], workstream: 9, basis: probe, status: missing}
requirements:
  - {id: FERRUM-CLOUD-001, title: Control plane separate from customer workloads, spec: "14.1"}
  - {id: FERRUM-CLOUD-002, title: "Tenant lifecycle: signup, provisioning, plans, closure", spec: "14.2", status: partial, basis: read, repositories: [CBFerrum/Ferrum], files: [crates/kernel/src/tenant.rs], limits: ["Tenants are created by a task or API; no signup, plans or closure"], deps: [FERRUM-CLOUD-001]}
  - {id: FERRUM-CLOUD-003, title: "Metering, billing, entitlements", status: partial, basis: tested, spec: "14.3", files: [crates/kernel/src/account.rs, server/src/tasks.rs], tests: [crates/kernel/tests/support_it.rs], deps: [FERRUM-CLOUD-001], external: [BLOCK-PAYMENT-KEYS], limits: ["Metering and account states exist; prices, invoices and payment do not", "Storage is the only enforced quota", "Connector and communication usage are not metered"]}
  - {id: FERRUM-CLOUD-004, title: "Fleet inventory, staged upgrades, customer-facing status", spec: "14.4", deps: [FERRUM-CLOUD-001]}
  - {id: FERRUM-PARTNER-001, title: Partner console, spec: "15.1", deps: [FERRUM-CLOUD-001]}
  - {id: FERRUM-PARTNER-002, title: Layered support access that expires and is visible to the customer, status: implemented_unqualified, basis: tested, spec: "15.2", files: [crates/kernel/src/support.rs, server/src/extract.rs, server/src/controllers/admin.rs, docs/support-access.md], tests: [crates/kernel/tests/support_it.rs], limits: ["The request log is written by the HTTP layer, which the suite exercises directly rather than over HTTP", "No partner console shows these: they are API routes"]}
  - {id: FERRUM-PARTNER-003, title: Program terms separate from open-source rights, spec: "15.4", status: blocked_external, basis: read, external: [BLOCK-LEGAL-REVIEW]}
