# Privacy and records management (specification §6).
defaults: {component: privacy, repositories: [CBFerrum/Ferrum], workstream: 4}
requirements:
  - {id: FERRUM-PRIVACY-001, title: Packages declare personal data, status: implemented_unqualified, basis: read, spec: "6.1", files: [crates/kernel/src/privacy.rs], tests: [crates/kernel/tests/kernel_it.rs], limits: ["Match by email field only"]}
  - {id: FERRUM-PRIVACY-002, title: "Relationship-aware discovery: identities, attachments, messages", status: implemented_unqualified, basis: tested, spec: "1.2 6.1", files: [crates/kernel/src/privacy.rs, crates/kernel/src/export.rs, crates/kernel/migrations/20261101000003_privacy.sql, docs/registry/data-governance.md], tests: [crates/kernel/tests/privacy_it.rs, crates/kernel/tests/jobs_it.rs], limits: ["Found by email under every address held, with attached files, and by phone number where a declaration names a phone field, records holding no address by that alone or through a link to a record found so (the platform's contacts, customers and suppliers do, as do Bookings, Commerce, CRM, Field Service, Healthcare, Hospitality, HR, Logistics, Nonprofit and Restaurant; Education, Government and Contracts declare names); a name only lists records as possibly the person's, never erased for it", "A number that differs from the one asked for only by a country code lists its records as possibly theirs, never erased for it; otherwise the digits must be the same", "26 of the 36 apps compiled in declare their people's records (92 declarations), patients, citizens, counterparties, restaurant guests and Edge's customer people among them; the ten that declare nothing hold staff addresses on work records and are named in each answer as not searched", "An erasure deletes the workspace's stored exports, and an export it lands on starts again; search keeps no words and Studio no results, so neither holds anything to reach", "Comments' text stays, under an anonymized author", "People held in a child table's rows are declared by `table.field`: only their rows are copied and erased, journalled by row id", "A declaration that erases reaches at most 1000 records of one person (more is an address shared by many), one that retains 20,000"], deps: [FERRUM-PRIVACY-001]}
  - {id: FERRUM-PRIVACY-003, title: Restriction of processing as its own operation, status: implemented_unqualified, basis: tested, spec: "6.2", files: [crates/kernel/src/retention.rs, crates/kernel/src/outbox.rs], tests: [crates/kernel/tests/retention_it.rs], limits: ["Stops queued mail under every address the person has had; Campaigns and hosted mail must ask Kernel::may_contact on their own delivery paths"]}
  - {id: FERRUM-PRIVACY-004, title: Legal holds, status: implemented_unqualified, basis: tested, spec: "6.2", files: [crates/kernel/src/privacy.rs, crates/kernel/src/ddl.rs, crates/kernel/src/recovery.rs, crates/kernel/src/apps.rs, crates/kernel/migrations/20261105000006_held_guard.sql, crates/kernel/migrations/20261109000002_held_versions.sql, server/src/controllers/admin.rs], tests: [crates/kernel/tests/privacy_it.rs, crates/kernel/tests/closure_it.rs, crates/kernel/tests/retention_it.rs], limits: ["A hold on a record: the database refuses any delete of it, an app's own SQL among them, and keeps the version it had whenever anything changes it, for administrators to read until the hold is released (FEO-007)", "A hold on a person keeps their records, under any address, from erasure, the platform's deletion, retention and an app's removal with its data; the database refuses only deletes of records placed under a hold, and their earlier versions are kept only under such a hold", "Deleting a workspace, or removing an app with its data, is refused while a hold covers what it would destroy; releasing the hold first is recorded"]}
  - {id: FERRUM-PRIVACY-005, title: Retention rules by data category, status: implemented_unqualified, basis: tested, spec: "6.1", files: [crates/kernel/src/retention.rs, crates/kernel/migrations/20261101000008_privacy_operations.sql], tests: [crates/kernel/tests/retention_it.rs], limits: ["Rules are by entity, set per workspace; packages suggest none", "Reaches 5000 records a rule a day (the server's setting), each day going on from where the last stopped, past held records and failed deletions, which are listed (FEO-005)"]}
  - {id: FERRUM-PRIVACY-006, title: Deletion journal reapplied after a restore, status: implemented_unqualified, basis: tested, spec: "6.3", files: [crates/kernel/src/privacy.rs, server/src/tasks.rs, docs/operations.md], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Rehearsed on this machine with a real dump, a restore into a new database and the task: a customer erased after the backup came back with the restore and was erased again (evidence/browser-2026-11-08-languages.md). deploy/smoke.sh carries the same steps, not yet run here (no Ferrum image on this machine)", "Restricted-processing has no journal because it has no operation yet"], deps: [FERRUM-PRIVACY-002]}
  - {id: FERRUM-PRIVACY-007, title: Immutable evidence without duplicated personal data, status: partial, basis: tested, spec: "6.2", files: [crates/kernel/src/audit.rs, crates/kernel/src/privacy.rs], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Audit diffs of records are redacted on erasure, keeping hashes, and so are the names of the passkeys a person added", "The platform's other audit payloads were read on 5 November: they hold ids, flags, settings, hosts and reasons; a support grant keeps its grantee's name and reason, an outside party's, not erased with a workspace's person", "Apps' audit payloads were read on 5 November (23 calls in 5 apps): those naming who acted by address (Edge's, ERP's shop floor) lose it on erasure, as does any address of the person in the history's payloads, again after a restore; free-text notes stay"]}
  - {id: FERRUM-PRIVACY-008, title: Evidence pack for compliance reviews, status: partial, basis: tested, spec: "6.4", files: [crates/kernel/src/evidence.rs, server/src/controllers/admin.rs, docs/registry/advisories.yaml, docs/licenses.md], tests: [crates/kernel/tests/privacy_it.rs], external: [BLOCK-LEGAL-REVIEW], limits: ["A workspace's pack holds its access review, outside parties, personal data declarations, retention and the state of its history", "The control inventory, advisories and licences are in this repository; incident records and backup reports are the operator's and are not in it", "No jurisdiction profiles; what a pack satisfies is for a reviewer to say"]}
