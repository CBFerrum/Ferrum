# Privacy and records management (specification §6).
defaults: {component: privacy, repositories: [CBFerrum/Ferrum], workstream: 4}
requirements:
  - {id: FERRUM-PRIVACY-001, title: Packages declare personal data, status: implemented_unqualified, basis: read, spec: "6.1", files: [crates/kernel/src/privacy.rs], tests: [crates/kernel/tests/kernel_it.rs], limits: ["Match by email field only"]}
  - {id: FERRUM-PRIVACY-002, title: "Relationship-aware discovery: identities, attachments, messages", status: partial, basis: tested, spec: "1.2 6.1", files: [crates/kernel/src/privacy.rs, crates/kernel/migrations/20261101000003_privacy.sql, docs/registry/data-governance.md], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Found by email under every address held, with attached files, and by phone number where a declaration names a phone field (the platform's contacts, customers and suppliers do, and Bookings, Commerce, CRM, Field Service, Hospitality, HR and Nonprofit declare theirs; Education declares its names); a name only lists records as possibly the person's, never erased for it", "A number recorded with its country code and asked for without it is not found: the digits must be the same", "18 compiled-in apps declare their people's records; packages that declare nothing are named in each answer, not searched", "Search words and analytics exports are not reached"], deps: [FERRUM-PRIVACY-001]}
  - {id: FERRUM-PRIVACY-003, title: Restriction of processing as its own operation, status: implemented_unqualified, basis: tested, spec: "6.2", files: [crates/kernel/src/retention.rs, crates/kernel/src/outbox.rs], tests: [crates/kernel/tests/retention_it.rs], limits: ["Stops queued mail under every address the person has had; Campaigns and hosted mail must ask Kernel::may_contact on their own delivery paths"]}
  - {id: FERRUM-PRIVACY-004, title: Legal holds, status: implemented_unqualified, basis: tested, spec: "6.2", files: [crates/kernel/src/privacy.rs, server/src/controllers/admin.rs], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Holds apply to the platform's erasure and deletion; apps' own SQL deletes do not check them yet"]}
  - {id: FERRUM-PRIVACY-005, title: Retention rules by data category, status: implemented_unqualified, basis: tested, spec: "6.1", files: [crates/kernel/src/retention.rs, crates/kernel/migrations/20261101000008_privacy_operations.sql], tests: [crates/kernel/tests/retention_it.rs], limits: ["Rules are by entity, set per workspace; packages suggest none", "Reaches 5000 records a rule a day"]}
  - {id: FERRUM-PRIVACY-006, title: Deletion journal reapplied after a restore, status: implemented_unqualified, basis: tested, spec: "6.3", files: [crates/kernel/src/privacy.rs, server/src/tasks.rs, docs/operations.md], tests: [crates/kernel/tests/privacy_it.rs], limits: ["The restore is simulated in the test; not yet rehearsed in deploy/smoke.sh", "Restricted-processing has no journal because it has no operation yet"], deps: [FERRUM-PRIVACY-002]}
  - {id: FERRUM-PRIVACY-007, title: Immutable evidence without duplicated personal data, status: partial, basis: tested, spec: "6.2", files: [crates/kernel/src/audit.rs, crates/kernel/src/privacy.rs], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Audit diffs of records are redacted on erasure, keeping hashes, and so are the names of the passkeys a person added", "The platform's other audit payloads were read on 5 November: they hold ids, flags, settings, hosts and reasons; a support grant keeps its grantee's name and reason, an outside party's, not erased with a workspace's person", "Apps' own audit payloads are not reviewed"]}
  - {id: FERRUM-PRIVACY-008, title: Evidence pack for compliance reviews, status: partial, basis: tested, spec: "6.4", files: [crates/kernel/src/evidence.rs, server/src/controllers/admin.rs, docs/registry/advisories.yaml, docs/licenses.md], tests: [crates/kernel/tests/privacy_it.rs], external: [BLOCK-LEGAL-REVIEW], limits: ["A workspace's pack holds its access review, outside parties, personal data declarations, retention and the state of its history", "The control inventory, advisories and licences are in this repository; incident records and backup reports are the operator's and are not in it", "No jurisdiction profiles; what a pack satisfies is for a reviewer to say"]}
