# Privacy and records management (specification §6).
defaults: {component: privacy, repositories: [CBFerrum/Ferrum], workstream: 4}
requirements:
  - {id: FERRUM-PRIVACY-001, title: Packages declare personal data, status: implemented_unqualified, basis: read, spec: "6.1", files: [crates/kernel/src/privacy.rs], tests: [crates/kernel/tests/kernel_it.rs], limits: ["Match by email field only"]}
  - {id: FERRUM-PRIVACY-002, title: "Relationship-aware discovery: identities, attachments, messages", status: partial, basis: tested, spec: "1.2 6.1", files: [crates/kernel/src/privacy.rs, crates/kernel/migrations/20261101000003_privacy.sql, docs/registry/data-governance.md], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Found by email, under every address held, with attached files; not by name or phone", "The apps' new declarations are on local branches, unpushed; packages that declare nothing are named in each answer, not searched", "Search words and analytics exports are not reached"], deps: [FERRUM-PRIVACY-001]}
  - {id: FERRUM-PRIVACY-003, title: Restriction of processing as its own operation, status: missing, basis: probe, spec: "6.2"}
  - {id: FERRUM-PRIVACY-004, title: Legal holds, status: implemented_unqualified, basis: tested, spec: "6.2", files: [crates/kernel/src/privacy.rs, server/src/controllers/admin.rs], tests: [crates/kernel/tests/privacy_it.rs], limits: ["Holds apply to the platform's erasure and deletion; apps' own SQL deletes do not check them yet"]}
  - {id: FERRUM-PRIVACY-005, title: Retention rules by data category, status: partial, basis: probe, spec: "6.1", files: [crates/kernel/src/lib.rs], limits: ["Event retention only; no category-based policy"]}
  - {id: FERRUM-PRIVACY-006, title: Deletion journal reapplied after a restore, status: implemented_unqualified, basis: tested, spec: "6.3", files: [crates/kernel/src/privacy.rs, server/src/tasks.rs, docs/operations.md], tests: [crates/kernel/tests/privacy_it.rs], limits: ["The restore is simulated in the test; not yet rehearsed in deploy/smoke.sh", "Restricted-processing has no journal because it has no operation yet"], deps: [FERRUM-PRIVACY-002]}
  - {id: FERRUM-PRIVACY-007, title: Immutable evidence without duplicated personal data, status: partial, basis: read, spec: "6.2", files: [crates/kernel/src/audit.rs, crates/kernel/src/privacy.rs], limits: ["Audit diffs of records are redacted on erasure, keeping hashes; other audit payloads are not reviewed"]}
  - {id: FERRUM-PRIVACY-008, title: Evidence pack for compliance reviews, status: missing, basis: probe, spec: "6.4", external: [BLOCK-LEGAL-REVIEW]}
