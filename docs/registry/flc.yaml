# The Logic Platform v2 package's requirements (FLC-*), imported with what this repository already has
# for each. A status is what the evidence supports (docs/platform/README.md "States"). See docs/logic/README.md
# for the program and docs/logic/catalog.json for each requirement's text and acceptance case.
requirements:
  # W0: establish reality and decision records
  - {id: FLC-BASE-001, title: "Fresh assembled baseline", workstream: W0, status: verified_software, files: ["scripts/baseline.py", "docs/logic/baseline.json"], tests: ["scripts/test_baseline.py"], limits: "Heads, pins, builds and installed versions are read separately; installed versions come from the local development database only, so no production installation is known"}
  - {id: FLC-BASE-002, title: "Safe worktree", workstream: W0, status: verified_software, files: ["scripts/baseline.py"], tests: ["scripts/test_baseline.py"], limits: "Reports dirty files and unused patches; it does not stop anyone committing them"}
  - {id: FLC-BASE-003, title: "Reuse map", workstream: W0, status: partial, files: ["docs/logic/reuse-map.yaml"], limits: "Mapped by reading the code at the pins it names; each entry is confirmed when its workstream starts"}
  - {id: FLC-BASE-004, title: "Durable backend ADR", workstream: W0, status: verified_software, files: ["docs/logic/decisions.md", "docs/plan/spike-l01-temporal.md", "docs/plan/spikes/temporal_logic/src/main.rs"], tests: ["docs/plan/spikes/temporal_logic/run.sh"], limits: "One development-layout server without TLS, high availability or online backup; 200 workflows is not a capacity test; Temporal's documentation must list PostgreSQL 17 before production (its schema applied and every probe ran on 17.9)"}
  - {id: FLC-BASE-005, title: "Supported profiles", workstream: W0, status: partial, files: ["docs/logic/profiles.md"], limits: "Profiles are written down; no installation refuses a long-lived process yet, because none can be defined"}
  - {id: FLC-BASE-006, title: "License inventory", workstream: W0, status: partial, files: ["scripts/licenses.py", "docs/references/logic.md"], limits: "Rust dependencies are inventoried by scripts/licenses.py; Temporal, Wren and DataFusion are reviewed by reading their licences, and nothing gates an unapproved engine in a deployment plan yet"}
  # W1: shared types and business capabilities
  - {id: FLC-CAP-001, title: "Typed capability registry", workstream: W1, status: implemented_unverified, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/meta/src/types.rs", "crates/studio/src/site.rs", "crates/mcp/src/lib.rs", "docs/logic/capabilities.md"], tests: ["crates/kernel/tests/capability_it.rs", "crates/studio/tests/catalog_it.rs"], limits: "Read from what a workspace installs, with effect, rights, input and output schemas, idempotency, completion and digest; the builder's endpoint, the agent's tools and the kernel agree digest for digest over ERP's packages (catalog_it). Studio's solution screens (W4) choose capabilities from the same catalog"}
  - {id: FLC-CAP-002, title: "Native invariants", workstream: W1, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/invariants_it.rs"], limits: "A ledger offers no capability, a read-only field is the app's to set, and actions run through their owning app (capability_it, mutant capability-ledger-offered). Record updates remain capabilities for the fields an app leaves writable: an app protects a balance by making it read-only or a ledger"}
  - {id: FLC-CAP-003, title: "Trusted context", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/ctx.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/logic/src/capability.rs"], limits: "An input naming a workspace, a role or an administrator flag is refused unless the capability declares that field as data, and another workspace's records and receipts do not exist (capability_it, mutant capability-input-says-who-asks). Values resolved inside a process (references from a device message) come with W3 and W5"}
  - {id: FLC-CAP-004, title: "Version and digest lock", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs"], tests: ["crates/kernel/tests/capability_it.rs"], limits: "Each capability carries its package's version and a digest of what it promises; asked for another version, the gate refuses (mutant capability-version-adopted). Keeping a waiting process on its old binding needs processes (W3)"}
  - {id: FLC-CAP-005, title: "Delegation modes", workstream: W1, status: partial, files: ["crates/kernel/src/jobs.rs", "crates/kernel/src/service.rs", "crates/kernel/src/automation.rs"], limits: "Jobs run with their creator's rights as they are now and service apps have accounts of their own; automations run on their saver's administrator rights, a third mode this program replaces"}
  - {id: FLC-CAP-006, title: "Completion semantics", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/ops-contract/src/command.rs"], limits: "Each capability says what done means, and mail says it is queued, not delivered; a run waiting for the business outcome after an acceptance needs processes (W3)"}
  - {id: FLC-CAP-007, title: "Unknown outcomes", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/ops-contract/src/command.rs"], limits: "Each capability declares its unknown-outcome behaviour; a native receipt lets the outcome of a transactional action be looked up. External effects that can end unknown, and their reconciliation, come with W3"}
  - {id: FLC-CAP-008, title: "Deprecation ownership", workstream: W1, status: not_started, limits: "No capability revisions exist to deprecate"}
  - {id: FLC-SEC-001, title: "Least privilege grants", workstream: W1, status: partial, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/automation.rs", "ferrum-app-edge:docs/flows.md"], tests: ["crates/kernel/tests/capability_it.rs"], limits: "Capabilities come from installed apps and each needs its own rights, so declaring one grants nothing (mutant capability-rights-ignored); mail is an administrator's. Solution packs, their reviewers and deployers come with W2 and W4; an automation still runs with its saver's administrator rights"}
  - {id: FLC-SEC-002, title: "Deny precedence", workstream: W1, status: partial, files: ["crates/kernel/src/customize.rs"], tests: ["crates/kernel/tests/customize_it.rs"], limits: "A customization that makes a packaged required field optional is suspended; rules, workflows and tenant logic are not compared yet"}
  - {id: FLC-SEC-003, title: "Secret handles", workstream: W1, status: partial, files: ["crates/kernel/src/secret.rs"], tests: ["crates/kernel/tests/secret_it.rs"], limits: "Connectors and plugins name secrets by reference; no solution source or run history exists yet to keep them out of"}
  - {id: FLC-SEC-004, title: "WASM budgets", workstream: W1, status: partial, files: ["crates/plugins/src/runtime.rs"], tests: ["crates/plugins/tests/platform_it.rs"], limits: "Plugins run under memory limits, epoch deadlines that count host calls, and a cap on host calls; no test here runs an endless guest beside a slow host call"}
  - {id: FLC-SEC-005, title: "Egress and SSRF", workstream: W1, status: partial, files: ["crates/plugins/src/host.rs", "crates/kernel/src/outbox.rs"], limits: "Plugin fetches and webhooks refuse private addresses, pin the vetted address and follow no redirects; logic capabilities with destinations do not exist yet"}
  - {id: FLC-SEC-006, title: "Cross-tenant caches", workstream: W1, status: partial, files: ["crates/studio/src/run.rs"], limits: "Studio computes every result for the viewer and keeps no shared result cache; logic plan and result caches do not exist yet"}
  - {id: FLC-SEC-007, title: "Diagnostic access", workstream: W1, status: partial, files: ["crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs"], limits: "Support grants are graded, expire and list every request for the customer; there are no run traces yet to restrict"}
  - {id: FLC-SEC-008, title: "Fail-closed uncertainty", workstream: W1, status: partial, files: ["crates/kernel/src/jobs.rs"], limits: "Delayed work whose requester lost their rights fails closed; logic has no permission or evidence state yet"}
  # W2: compiler, pure rules and hook integration
  - {id: FLC-COMP-001, title: "Strict parsing", workstream: W2, status: verified_software, files: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs"], tests: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs"], limits: "A solution's source is JSON read strictly: a key twice, an unknown key anywhere, more than 1 MiB or 64 levels, a non-finite number or trailing text is refused before compiling (t03, t32, t33, unknown_keys_are_refused_everywhere). The format has no reference to fetch, so nothing is fetched"}
  - {id: FLC-COMP-002, title: "Business types", workstream: W2, status: partial, files: ["crates/logic/src/expr.rs", "crates/logic/src/compile.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/expr.rs", "crates/logic/src/compile.rs"], limits: "Money in one currency, quantities in one unit, exact decimals, missing kept apart from unknown, and outputs typed from each capability's schema, all checked before publishing (types_follow_the_data, money_compares_exactly_at_the_boundary). Links are typed as text ids, so a reference to the wrong kind of record is not caught before running"}
  - {id: FLC-COMP-003, title: "Deterministic expressions", workstream: W2, status: partial, files: ["crates/logic/src/expr.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/expr.rs"], limits: "The rules evaluator reads no clock, network or randomness: the kernel hands it today and now once per save, and functions are a fixed list (the_clock_is_a_fact_not_a_reading, an unknown function refused at compile). The Edge gateway's build of the evaluator and the replay across server and gateway come with W5; automations' and workflows' older CEL still reads the clock when no time is given"}
  - {id: FLC-COMP-004, title: "Canonical identity", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/canonical.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/logic_rules_it.rs"], limits: "The source digest leaves out layout and keeps labels, forms and parameters; the artifact digest adds the compiler, the profile and the lock (layout_is_not_meaning_and_meaning_is). A review is of the digest shown and activation compares it, so a changed instruction needs a new approval (logic_rules_it)"}
  - {id: FLC-COMP-005, title: "Dependency closure", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A release locks each capability at its digest and each field its rules read or fill at its type; activation compiles it again and needs the same digest, and an active release whose fields changed refuses its entity's saves with stale_approval (logic_rules_it, a_release_approved_against_other_fields_does_not_run). Solutions have no subflows to resolve"}
  - {id: FLC-COMP-006, title: "Graph semantics", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs"], tests: ["crates/logic/src/compile.rs"], limits: "One entry, routes to existing steps, every step reachable, no cycle, a step budget covering the graph, unique lower_snake ids, a label on every step, and a step reads only what surely ran before it (t04-t07, names_versions_and_bounds, a_step_reads_only_what_has_surely_run). Processes have no parallel branches, so no join can be malformed"}
  - {id: FLC-COMP-007, title: "Bounded iteration", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/expr.rs", "crates/logic/src/process.rs"], tests: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], limits: "Cycles are refused and expressions have no comprehensions (t07); repetition is a for-each over at most 1000 items with stable keys from their data, at most 20 at once, or a repeat of at most 100 rounds, each with a route when it runs out, and a run's max_steps stops what the bounds together allow (compile and process tests; mutants rework-unbounded, item-keys-collide, step-budget-ignored)"}
  - {id: FLC-COMP-008, title: "Effect typing", workstream: W2, status: verified_software, files: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs", "crates/logic/src/rules.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/logic_rules_it.rs"], limits: "A rule cannot name a capability (t10, logic_rules_it), and at run time its evaluator has nothing to call; a query step cannot use a capability that changes anything, nor an action step a read (t13)"}
  - {id: FLC-COMP-009, title: "Data-flow policy", workstream: W2, status: verified_software, files: ["crates/logic/src/rules.rs", "crates/logic/src/compile.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A rule reads no restricted field of its record or of a linked one, at compile and at run time; its message is plain text; linked records are read with the saver's rights; refusal evidence keeps no copy of the record (logic_rules_it, rules_read_nothing_restricted_and_write_once). Process outputs, traces and destinations come with W3"}
  - {id: FLC-COMP-010, title: "Source maps", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "Every fault has a stable code and a JSON pointer; a refusal at run time names its solution, version and rule, and its evidence the release and rule (logic_rules_it). Process steps map to their nodes with W3; there are no subflows"}
  - {id: FLC-HOOK-001, title: "Phase ordering", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/src/hooks.rs", "crates/kernel/src/lib.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs"], limits: "Tenant derivations run after the app's own fills and before every validation, so the app's guards see the final record; a derivation writes only the customer's own fields, never company, owner or the app's (logic_rules_it, t10_t11_t12)"}
  - {id: FLC-HOOK-002, title: "Pure hook boundary", workstream: W2, status: verified_software, files: ["crates/logic/src/expr.rs", "crates/kernel/src/automation.rs", "crates/plugins/src/host.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/automation_mail_it.rs", "crates/plugins/tests/after_commit_it.rs"], limits: "Tenant rules can call no function outside a fixed pure list (an http_get is refused at compile); an automation's e-mail is queued with its run (mutant automation-mails-before-commit); plugins are refused I/O inside hooks"}
  - {id: FLC-HOOK-003, title: "Competing writes", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "One writer per field within a solution (compile), across active releases and against apps' declared fills (activation), and an entity whose active rules conflict refuses its saves (logic_rules_it, cycles_and_competing_writers_are_found_when_prepared). No merge rule can be declared. Plugins' own hooks are not compared"}
  - {id: FLC-HOOK-004, title: "Bounded prefetch", workstream: W2, status: verified_software, files: ["crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A rule reads only the linked records it declares: four per rule, sixteen fields each, eight per save, none restricted; they are read with the saver's rights before any rule runs, and a saver who may not read one is refused (logic_rules_it)"}
  - {id: FLC-HOOK-005, title: "Equivalent mutation paths", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/mcp/tests/mcp_it.rs", "crates/plugins/tests/platform_it.rs"], limits: "One invalid order through insert, update, import, bulk, a capability's invocation, an automation and a job, and a customer through MCP's create_record and invoke_capability and a plugin's data.insert: all refused alike and nothing written. The REST and /api/v1 routes call the same kernel insert and are not sent through over HTTP here"}
  - {id: FLC-HOOK-006, title: "After-commit durability", workstream: W2, status: verified_software, files: ["crates/kernel/src/outbox.rs", "crates/kernel/src/automation.rs"], tests: ["crates/kernel/tests/automation_mail_it.rs", "crates/kernel/tests/events_it.rs"], limits: "Events and queued mail commit with their change: an automation run that rolls back queues nothing, and one delivered twice mails once (automation_mail_it, mutant automation-mails-before-commit); consumers dedupe by receipt (events_it)"}
  - {id: FLC-HOOK-007, title: "Rejection evidence", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/migrations/20261108000002_logic_release.sql"], tests: ["crates/kernel/tests/logic_rules_it.rs"], limits: "A rule with audit_refusals keeps when, which release and rule, which record, who and whether false or unknown, in a transaction of its own; the refused change is not written and no copy of it is kept (logic_rules_it). It takes a second database connection while the save's is held"}
  - {id: FLC-HOOK-008, title: "Event recursion", workstream: W2, status: verified_software, files: ["crates/kernel/src/outbox.rs", "crates/kernel/src/db.rs", "crates/kernel/src/jobs.rs", "crates/kernel/src/automation.rs"], tests: ["crates/kernel/tests/event_chain_it.rs"], limits: "Work answering an event writes events one step further, whatever handler does it, jobs included; the dispatcher stops an event 8 steps from its chain's start, or past 1000 events from one change, before any handler runs, and keeps it dead with the chain it took; a replay starts afresh; automations stopped at their own limit say so (event_chain_it)"}
  # W3: durable processes and human work
  - {id: FLC-PROC-001, title: "Idempotent starts", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs"], limits: "An event is accepted once per process and business key, on the release active then, with its start queued in the same transaction; two acceptances racing make one run (process_it). The workflow id is made from the run, a repeated start finds it, and a run that ended is not started again (conformance_it; mutants run-started-twice, run-started-again). A reviewed catch-up over past events does not exist"}
  - {id: FLC-PROC-002, title: "Native action receipts", workstream: W3, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/migrations/20261108000001_logic_effect.sql", "crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/process_it.rs"], limits: "The receipt commits in the change's transaction: a repeat gets it, two racing get one change, a failure before the commit leaves neither (capability_it; mutants capability-no-receipt, capability-same-key-other-input). A process's effects go through the same gate under {run}/{activation}: asked again it returns the same record (process_it). A database crash mid-commit is PostgreSQL's to keep atomic; receipts are not yet removed after their retention"}
  - {id: FLC-PROC-003, title: "External effect identity", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/capability.rs", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/capability_it.rs"], limits: "A step's effect key is the same on every attempt (the activity is retried under its activation) and the gate binds it to the input's digest: other input under it is refused (process_it). An outcome unknown goes where the step says, never to success; providers' own idempotency horizons are not recorded, and an unknown outcome is not queried back automatically"}
  - {id: FLC-PROC-004, title: "Signal before wait", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql"], tests: ["crates/kernel/tests/process_it.rs"], limits: "An event that comes before its wait is kept, by the record it is about, and handed over once when the run waits (process_it, held waits; mutant early-event-dropped). It is kept seven days: older ones no longer match but are not yet deleted"}
  - {id: FLC-PROC-005, title: "Signal spoofing", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A run hears only its workspace's committed events about the record its wait names; another record's event, or another workspace's, advances nothing (process_it; mutant event-crosses-records). Nothing outside Ferrum can signal a run"}
  - {id: FLC-PROC-006, title: "Current authority", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "Each effect runs with the rights of whoever started the run as they are then, through the capability gate; rights revoked while it waited refuse it, and the run waits for a person (process_it; mutant effect-borrows-rights). A run no person started acts with whoever activated its release; there is no separate service grant per release"}
  - {id: FLC-PROC-007, title: "Replay determinism", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/process/src/lib.rs"], tests: ["crates/logic/src/process.rs", "crates/process/tests/conformance_it.rs"], limits: "The state machine reads no clock, store or network: the same events ask for the same things, across a serialized continuation (process tests). The workflow's history replays with the same build and codec, and each effect's activity id is its activation, as the spike required (conformance_it). Replaying open runs before a new worker build takes over is a release step for W8"}
  - {id: FLC-PROC-008, title: "Parallel race", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs"], tests: ["crates/logic/src/process.rs"], limits: "The first branch to complete wins; the others are asked to stop, and an effect one settles afterwards is recorded and handed to a person, never dropped (process tests; mutant late-effect-erased). Run in the state machine the runtime drives, not end to end on Temporal"}
  - {id: FLC-PROC-009, title: "Business rework", workstream: W3, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], tests: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], limits: "A repeat runs its body again while it ends `again`, at most its rounds, then takes on_exhausted, never success (compile and process tests; mutant rework-unbounded)"}
  - {id: FLC-PROC-010, title: "Cancellation", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/kernel/src/process.rs"], tests: ["crates/logic/src/process.rs", "crates/kernel/tests/process_it.rs"], limits: "A cancelled run closes its tasks and waits, keeps awaiting the effects in hand, records one that completes anyway and hands it to a person, and finishes once they settle (process tests, process_it; mutant cancel-drops-work-in-hand). An effect in hand cannot be stopped midway: the gate runs it in one transaction"}
  - {id: FLC-PROC-011, title: "Compensation failure", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/logic/src/process.rs", "crates/logic/src/compile.rs"], limits: "Compensation runs newest first through each app's compensating action; a refused or unknown one stays open, handed to a person, and the run waits for a recovery that tries only what is still open (process tests; mutant compensation-oldest-first). The compensating action is given the effect's record, not a mapping the solution declares"}
  - {id: FLC-PROC-012, title: "Worker fencing", workstream: W3, status: partial, files: ["crates/process/src/lib.rs", "crates/kernel/src/process.rs"], tests: ["crates/process/tests/conformance_it.rs"], limits: "A stopped worker's runs are taken up by another (conformance_it); a repeated effect finds its receipt, and Temporal refuses the completion of an attempt that timed out. A worker paused past its timeout and then resumed was not tried"}
  - {id: FLC-PROC-013, title: "History bounds", workstream: W3, status: verified_software, files: ["crates/process/src/lib.rs"], tests: ["crates/process/tests/conformance_it.rs"], limits: "A run continues as new after 500 events, or when Temporal suggests it, carrying its state, deadlines and undelivered signals under the same workflow id and activations; the conformance test continues after every event, across a decision delivered while no worker ran"}
  - {id: FLC-PROC-014, title: "Snapshot plus subscription", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000004_logic_studio.sql", "Ferrum-Frontend:src/lib/solutions.ts"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "The run feed's cursor is a transaction boundary: a run committed late by a slower transaction comes in a later page, never skipped, and a cursor from another database gets resync and the runs as they stand (solutions_it; mutants cursor-passes-open-transaction, restored-cursor-not-resynced). The page polls every five seconds; there is no push channel"}
  - {id: FLC-HUMAN-001, title: "Independent approval", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/compile.rs"], limits: "The requester cannot decide their own request whatever roles they hold, nor an administrator without the task's role, and a task approved by several needs that many different people; the compiler refuses a task that allows the requester (process_it; mutants requester-decides, administrator-decides)"}
  - {id: FLC-HUMAN-002, title: "Input-bound approval", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A decision is bound to the digest of what was shown; an effect relying on an approval carries it and is refused if the approved record's version changed since, or the record is gone (process_it; mutants decided-on-other-material, effect-on-stale-approval, approval-of-deleted-record). Any change of version counts as material; the release's digest is the policy it ran under"}
  - {id: FLC-HUMAN-003, title: "Timeout race", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs"], limits: "A decision and a deadline are settled under the task's row lock: one of them, never both; a deadline after a decision tells the decision, and asked again after a lost answer it says the same (process_it; mutants deadline-overrides-decision, repeated-deadline-says-nothing). On Temporal a deadline is a timer, and the database decides what it means (conformance_it)"}
  - {id: FLC-HUMAN-004, title: "Delegation", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A task is handed on at most its bound of hand-ons (three at most), only to someone holding its role, never back along its chain or to the requester; who decided is recorded (process_it; mutants delegation-unbounded, delegation-counts-people, delegation-goes-back). Standing substitutes during leave do not exist"}
  - {id: FLC-HUMAN-005, title: "Calendar semantics", workstream: W3, status: verified_software, files: ["crates/logic/src/calendar.rs", "crates/kernel/src/process.rs"], tests: ["crates/logic/src/calendar.rs", "crates/kernel/tests/process_it.rs"], limits: "Business days skip weekends and holidays at the same local time; a skipped local time moves past the gap, a repeated one takes the earlier; each deadline records the calendar, its revision, the zone and the zone data, and a revision moves only later deadlines (calendar tests, process_it). There are no schedules yet, so no misfire policy"}
  - {id: FLC-HUMAN-006, title: "Task evidence", workstream: W3, status: partial, files: ["crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A task's material is readable only by someone who may decide it, or an administrator (process_it). Forms take typed values; attachments as evidence do not exist"}
  - {id: FLC-HUMAN-007, title: "Case work", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/compile.rs"], limits: "A case starts only its listed tasks, each once its dependencies are done, and is closed only by its owner's role, never by the requester, once the required ones are; other work needs a new reviewed definition; dependency circles are refused when compiled (process_it; mutants case-order-ignored, requester-closes-case). The close carries the finished tasks' results, so it counts even ahead of their own deliveries (mutant case-close-waits-for-deliveries)"}
  - {id: FLC-HUMAN-008, title: "Manual disposition", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/process.rs"], limits: "A suspended step is recovered by an administrator with a reason, resumed only where its source allows or ended refused; nothing marks it a success; what a run hands to a person is acknowledged with a reason (process_it; mutant recovery-forces-success). The authority is an administrator's; no recovery role per solution"}
  # W4: complete Studio product
  - {id: FLC-UI-001, title: "In-app authoring", workstream: W4, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/SolutionsPage.tsx", "Ferrum-Frontend:src/app/studio/solutions/DraftEditor.tsx", "Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "docs/logic/studio.md"], tests: ["crates/studio/tests/solutions_it.rs", "Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "A Solution Author built, checked, simulated and kept an approval in the guided editor; another administrator reviewed it, consented to its new power and activated it; requests then ran through it on the real binary with Temporal, as ordinary roles (evidence/w4-studio.md). Activation is per workspace, with no test workspace or cohort first (W8); decision tables and rules are edited in the source"}
  - {id: FLC-UI-002, title: "Single definition", workstream: W4, status: partial, files: ["Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "Ferrum-Frontend:src/lib/solutions.ts"], tests: ["Ferrum-Frontend:src/lib/solutions.test.ts"], limits: "Guided and Source edit one parsed source in place: settings written in the source (a business-day deadline, a parallel step, an action's approval) survived the guided view, a save and a reload (walk journey 2). No drawn diagram view exists, so the visual editor the requirement names is missing"}
  - {id: FLC-UI-003, title: "Typed inspector", workstream: W4, status: verified_software, files: ["Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "crates/logic/src/capability.rs", "crates/kernel/src/capability.rs"], tests: ["Ferrum-Frontend:src/app/studio/solutions/render.test.tsx", "crates/logic/src/compile.rs"], limits: "The inspector shows, from the catalog, what a step's capability does, the rights it needs from whoever starts the run, what done means, its attempts and receipts, what happens to an unknown outcome and what undoes it, and flags an action that can end unknown without a route for it, as the compiler refuses (render.test, compile tests). Attempts and timeouts are the capability's, not settable per step"}
  - {id: FLC-UI-004, title: "Accessible outline", workstream: W4, status: implemented_unverified, files: ["Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "Ferrum-Frontend:src/app/studio/solutions/field.tsx", "Ferrum-Frontend:src/app/Shell.tsx", "Ferrum-Frontend:src/app/studio/runs/TasksPage.tsx"], tests: ["Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "By keyboard alone an administrator added a step, routed a rejection to it and mended the faults the check announced (each check result read out through a live region, opening a fault moving focus to that step's settings), and a reviewer reached, read and decided a task; focus moves into each new page; axe finds nothing on the solution, run and task screens (walk journey 6, render.test). No screen reader was used and no assistive-technology user has tried it (BLOCK-ACCESSIBILITY-AUDIT)"}
  - {id: FLC-UI-005, title: "Semantic diff", workstream: W4, status: verified_software, files: ["crates/logic/src/diff.rs", "crates/kernel/src/authoring.rs", "crates/kernel/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/ReleasePage.tsx"], tests: ["crates/logic/src/diff.rs", "crates/studio/tests/solutions_it.rs", "Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "A release's review lists what changed by meaning, each changed setting as it was and as it is, capabilities with versions and whether they change records; new changing capabilities need consent one by one, and approval binds to the digest shown, so any change needs a review of its own (diff tests, solutions_it; mutants approval-without-consent, diff-shows-old-as-new, author-reviews). Data destinations are read from the changed inputs; there is no separate data-flow view"}
  - {id: FLC-UI-006, title: "Conflict handling", workstream: W4, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/DraftEditor.tsx"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "A draft saves against the version read (If-Match); a later save is refused naming who saved and when, and the page offers to keep one's own text as a new draft or open the latest (solutions_it, walk journey 4; mutant draft-save-overwrites). Text not yet saved is also kept in the browser"}
  - {id: FLC-UI-007, title: "Simulator parity", workstream: W4, status: implemented_unverified, files: ["crates/logic/src/simulate.rs", "crates/kernel/src/authoring.rs", "Ferrum-Frontend:src/app/studio/solutions/SimulatorPanel.tsx"], tests: ["crates/logic/src/simulate.rs", "crates/studio/tests/solutions_it.rs"], limits: "The simulator drives the runtime's own state machine with the workspace's calendars on a virtual clock, labels each line stand-in, not modelled or deadline, and treats an unanswered capability as an unknown outcome, never a success (simulate tests, solutions_it). The same boundary fixtures have not been run side by side in the simulator and a deployed test profile"}
  - {id: FLC-UI-008, title: "Recovery console", workstream: W4, status: partial, files: ["crates/kernel/src/process.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/runs/TasksPage.tsx", "Ferrum-Frontend:src/app/studio/runs/RunsPage.tsx"], tests: ["crates/kernel/tests/process_it.rs", "crates/studio/tests/solutions_it.rs"], limits: "A run shows each step's outcome, refusals first, and what it did; a recovery records who did what and why and resumes where the process allows or ends the run refused, and the run and task read the same after a refresh and a server restart (walk journey 7). An unknown outcome is settled by a person with evidence: the console has no capability-specific lookup action, and one server was walked, not two replicas"}
  - {id: FLC-UI-009, title: "Localization", workstream: W4, status: verified_software, files: ["Ferrum-Frontend:src/locales/ar.ts", "Ferrum-Frontend:src/locales/hi.ts", "Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "crates/logic/src/calendar.rs"], tests: ["Ferrum-Frontend:src/app/interfacewords.test.ts", "crates/logic/src/calendar.rs"], limits: "In Arabic, right to left, with times shown in Asia/Kolkata, an author edited a solution and a reviewer decided a task whose deadline came from the office calendar (Asia/Kolkata, Saturday and Sunday off); identifiers stay as written (walk). Every word of these screens is in the Arabic and Hindi catalogs. The workspace's own zone was UTC; Hindi was not walked"}
  - {id: FLC-UI-010, title: "Preview isolation", workstream: W4, status: verified_software, files: ["crates/logic/src/simulate.rs", "crates/kernel/src/authoring.rs"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "A simulation creates no run, task or record and a mail step answered in it queues nothing (solutions_it); the simulator is pure and has no gate to call; a draft never runs. A separate sandbox for real test effects does not exist"}
