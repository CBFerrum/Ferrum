# The Logic Platform v2 package's requirements (FLC-*), imported with what this repository already has
# for each. A status is what the evidence supports (docs/platform/README.md "States"). See docs/logic/README.md
# for the program and docs/logic/catalog.json for each requirement's text and acceptance case.
requirements:
  # W0: establish reality and decision records
  - {id: FLC-BASE-001, title: "Fresh assembled baseline", workstream: W0, status: verified_software, files: ["scripts/baseline.py", "docs/logic/baseline.json"], tests: ["scripts/test_baseline.py"], limits: "Heads, pins, builds and installed versions are read separately; installed versions come from the local development database only, so no production installation is known"}
  - {id: FLC-BASE-002, title: "Safe worktree", workstream: W0, status: verified_software, files: ["scripts/baseline.py"], tests: ["scripts/test_baseline.py"], limits: "Reports dirty files and unused patches; it does not stop anyone committing them"}
  - {id: FLC-BASE-003, title: "Reuse map", workstream: W0, status: verified_software, files: ["docs/logic/reuse-map.yaml"], tests: ["crates/studio/tests/catalog_it.rs", "crates/kernel/tests/logic_rules_it.rs", "crates/kernel/tests/process_it.rs"], limits: "Each area was read at the pins the map names and confirmed once all nine workstreams had landed: reused, extended, migrated, moved or new, and no area with two owners (one catalog behind Studio, MCP and the kernel in catalog_it; customer rules as one DocHook in logic_rules_it; runs on the outbox and the receipts in process_it). A reading of code, kept current by hand"}
  - {id: FLC-BASE-004, title: "Durable backend ADR", workstream: W0, status: verified_software, files: ["docs/logic/decisions.md", "docs/plan/spike-l01-temporal.md", "docs/plan/spikes/temporal_logic/src/main.rs"], tests: ["docs/plan/spikes/temporal_logic/run.sh"], limits: "One development-layout server without TLS, high availability or online backup; 200 workflows is not a capacity test; Temporal's documentation must list PostgreSQL 17 before production (its schema applied and every probe ran on 17.9)"}
  - {id: FLC-BASE-005, title: "Supported profiles", workstream: W0, status: verified_software, files: ["docs/logic/profiles.md", "crates/logic/src/compile.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/compile.rs"], limits: "An installation without a durable process runtime runs Core: a long-lived process is refused when kept, naming the Full Process profile it needs, and nothing is kept (logic_rules_it; mutant core-runs-a-process). docs/logic/profiles.md publishes each profile's features, topology and exclusions"}
  - {id: FLC-BASE-006, title: "License inventory", workstream: W0, status: verified_software, files: ["scripts/licenses.py", "docs/registry/engines.yaml", "docs/references/logic.md"], tests: ["scripts/licenses.py"], limits: "Rust dependencies are inventoried by cargo metadata; every image a deploy file names must be an engine approved in docs/registry/engines.yaml, its licence read and accepted, its terms and the decision to run it stated, or scripts/licenses.py check fails (its self-test refuses an unapproved image, an unaccepted licence and a missing decision). The gate found Moto in the kind cluster unrecorded; it is recorded as test-only. Frontend packages are inventoried by the release SBOM"}
  # W1: shared types and business capabilities
  - {id: FLC-CAP-001, title: "Typed capability registry", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/meta/src/types.rs", "crates/studio/src/site.rs", "crates/mcp/src/lib.rs", "docs/logic/capabilities.md"], tests: ["crates/kernel/tests/capability_it.rs", "crates/studio/tests/catalog_it.rs"], limits: "Read from what a workspace installs, with effect, rights, input and output schemas, idempotency, completion and digest. The builder's endpoint, the agent's tools and the kernel agree digest for digest over ERP's packages (catalog_it), and Studio's screens choose from the builder's endpoint (W4 walk, journey 1)"}
  - {id: FLC-CAP-002, title: "Native invariants", workstream: W1, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/invariants_it.rs"], limits: "A ledger offers no capability, a read-only field is the app's to set, and actions run through their owning app (capability_it, mutant capability-ledger-offered). Record updates remain capabilities for the fields an app leaves writable: an app protects a balance by making it read-only or a ledger"}
  - {id: FLC-CAP-003, title: "Trusted context", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/ctx.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/logic/src/capability.rs"], limits: "An input naming a workspace, a role or an administrator flag is refused unless the capability declares that field as data, and another workspace's records and receipts do not exist (capability_it, mutant capability-input-says-who-asks). Values resolved inside a process (references from a device message) come with W3 and W5"}
  - {id: FLC-CAP-004, title: "Version and digest lock", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/process_it.rs"], limits: "Each capability carries its package's version and a digest of what it promises; asked for another version the gate refuses (mutant capability-version-adopted). A version replaced while a run waits is not taken up: the step waits, administrators are told which version it is bound to, and with that version back it goes on, once (process_it; mutant replaced-version-taken-up)"}
  - {id: FLC-CAP-005, title: "Delegation modes", workstream: W1, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/logic.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/service.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/capability_it.rs"], limits: "A run some person's act started acts with that person's rights as they are now: withdrawn, its next effect is refused. A run nobody's act started acts as its solution's own account, holding exactly the rights of the capabilities its release was reviewed with (an administrator's capability allowed by that review, never by making it an administrator), never its activator's: offboarding whoever activated it changes nothing, it cannot use what its release does not, and it stops with the solution (process_it; mutants company-run-acts-as-its-activator, solution-account-holds-more, admin-capability-for-anyone, effect-borrows-rights). Automations not yet imported still run on their saver's rights (FLC-MIG-001)"}
  - {id: FLC-CAP-006, title: "Completion semantics", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/ops-contract/src/command.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/capability_it.rs"], limits: "Each capability says what done means (accepted is not completed; mail is queued, not delivered). A run whose order was accepted stays running until the order's own event, then completes (process_it, and LRP-02 on the assembled build)"}
  - {id: FLC-CAP-007, title: "Unknown outcomes", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/process.rs", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs", "scripts/logic_load.py"], limits: "Each capability declares its unknown-outcome behaviour and writes its receipt in the effect's own transaction. A step whose answer is lost after it ran stops for a person; the console looks the effect up by its receipt and keeps what it found, and resuming repeats the step under its key, which the receipt answers: nothing done twice (process_it; mutant look-up-misses-the-receipt). A start answered twice and a worker stopped mid-batch repeat nothing (conformance_it, logic_load.py)"}
  - {id: FLC-CAP-008, title: "Deprecation ownership", workstream: W1, status: not_started, limits: "No capability revisions exist to deprecate"}
  - {id: FLC-SEC-001, title: "Least privilege grants", workstream: W1, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/logic.rs", "crates/kernel/src/authoring.rs", "crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/capability_it.rs", "scripts/lrp_walk.py"], limits: "Authors keep releases and may not approve their own; another administrator reviews, consenting by name to each new changing capability; administrators deploy; runs execute with the requester's rights or the solution's reviewed account; support grants are their own (process_it, LRP-01, LRP-04: a partner can neither approve nor activate). Declaring a capability grants nothing (mutant capability-rights-ignored). Automations not yet imported run on their saver's rights"}
  - {id: FLC-SEC-002, title: "Deny precedence", workstream: W1, status: partial, files: ["crates/kernel/src/customize.rs"], tests: ["crates/kernel/tests/customize_it.rs"], limits: "A customization that makes a packaged required field optional is suspended; rules, workflows and tenant logic are not compared yet"}
  - {id: FLC-SEC-003, title: "Secret handles", workstream: W1, status: partial, files: ["crates/kernel/src/secret.rs"], tests: ["crates/kernel/tests/secret_it.rs"], limits: "Connectors and plugins name secrets by reference; no solution source or run history exists yet to keep them out of"}
  - {id: FLC-SEC-004, title: "WASM budgets", workstream: W1, status: verified_software, files: ["crates/plugins/src/runtime.rs"], tests: ["crates/plugins/src/runtime.rs", "crates/plugins/tests/platform_it.rs"], limits: "Plugins run under memory limits, fuel, epoch deadlines and a host-call deadline. An endless guest and a guest held in a slow host call, side by side, each stop at their own budget, the slow call dropped and never completing, while a guest started meanwhile finishes without waiting (runtime tests)"}
  - {id: FLC-SEC-005, title: "Egress and SSRF", workstream: W1, status: verified_software, files: ["crates/kernel/src/outbound.rs", "crates/kernel/src/outbox.rs", "crates/plugins/src/host.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/src/outbox.rs"], limits: "Calls out resolve the host once, refuse private and loopback addresses, pin the vetted address and follow no redirect. At a real connection: a host resolving to loopback is refused before anything is sent, and a permitted host's redirect to a private endpoint comes back unfollowed, the endpoint never reached (capability_it; mutants egress-follows-redirects, egress-reaches-private-hosts). Webhooks and plugin fetches use the same pattern; the connection test exercises the kernel's client, and address classes are unit-tested"}
  - {id: FLC-SEC-006, title: "Cross-tenant caches", workstream: W1, status: verified_software, files: ["crates/studio/src/run.rs", "ferrum-app-metrics:src/metric.rs", "crates/kernel/src/logic.rs", "crates/kernel/src/process.rs"], tests: ["ferrum-app-metrics:tests/composed_it.rs", "scripts/lrp_walk.py"], limits: "No result is cached across viewers: Studio and Metrics work every result out for its reader (three readers, three averages from one definition in composed_it; LRP-05, a reader without the rights gets no value). The logic caches hold compiled rules and trigger lists per workspace and version, never a result"}
  - {id: FLC-SEC-007, title: "Diagnostic access", workstream: W1, status: partial, files: ["crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs"], limits: "Support grants are graded, expire and list every request for the customer; there are no run traces yet to restrict"}
  - {id: FLC-SEC-008, title: "Fail-closed uncertainty", workstream: W1, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/recovery.rs", "crates/kernel/src/jobs.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/recovery_it.rs"], limits: "Uncertainty stops work, never allows it: after a restore effects wait until a person releases the hold; a capability out of service makes its step wait; an approval whose material changed is refused; a requester's lost rights refuse the next effect; an unknown outcome stops for a person (process_it, recovery_it; mutants effect-ignores-restore-hold, effect-on-stale-approval). Delayed jobs whose requester lost their rights fail closed"}
  # W2: compiler, pure rules and hook integration
  - {id: FLC-COMP-001, title: "Strict parsing", workstream: W2, status: verified_software, files: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs"], tests: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs"], limits: "A solution's source is JSON read strictly: a key twice, an unknown key anywhere, more than 1 MiB or 64 levels, a non-finite number or trailing text is refused before compiling (t03, t32, t33, unknown_keys_are_refused_everywhere). The format has no reference to fetch, so nothing is fetched"}
  - {id: FLC-COMP-002, title: "Business types", workstream: W2, status: partial, files: ["crates/logic/src/expr.rs", "crates/logic/src/compile.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/expr.rs", "crates/logic/src/compile.rs"], limits: "Money in one currency, quantities in one unit, exact decimals, missing kept apart from unknown, and outputs typed from each capability's schema, all checked before publishing (types_follow_the_data, money_compares_exactly_at_the_boundary). Links are typed as text ids, so a reference to the wrong kind of record is not caught before running"}
  - {id: FLC-COMP-003, title: "Deterministic expressions", workstream: W2, status: partial, files: ["crates/logic/src/expr.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/expr.rs"], limits: "The rules evaluator reads no clock, network or randomness: the kernel hands it today and now once per save, and functions are a fixed list (the_clock_is_a_fact_not_a_reading, an unknown function refused at compile). The Edge gateway's build of the evaluator and the replay across server and gateway come with W5; automations' and workflows' older CEL still reads the clock when no time is given"}
  - {id: FLC-COMP-004, title: "Canonical identity", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/canonical.rs", "crates/kernel/src/logic.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/logic_rules_it.rs"], limits: "The source digest leaves out layout and keeps labels, forms and parameters; the artifact digest adds the compiler, the profile and the lock (layout_is_not_meaning_and_meaning_is). A review is of the digest shown and activation compares it, so a changed instruction needs a new approval (logic_rules_it)"}
  - {id: FLC-COMP-005, title: "Dependency closure", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A release locks each capability at its digest and each field its rules read or fill at its type; activation compiles it again and needs the same digest, and an active release whose fields changed refuses its entity's saves with stale_approval (logic_rules_it, a_release_approved_against_other_fields_does_not_run). Solutions have no subflows to resolve"}
  - {id: FLC-COMP-006, title: "Graph semantics", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs"], tests: ["crates/logic/src/compile.rs"], limits: "One entry, routes to existing steps, every step reachable, no cycle, a step budget covering the graph, unique lower_snake ids, a label on every step, and a step reads only what surely ran before it (t04-t07, names_versions_and_bounds, a_step_reads_only_what_has_surely_run). Processes have no parallel branches, so no join can be malformed"}
  - {id: FLC-COMP-007, title: "Bounded iteration", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/expr.rs", "crates/logic/src/process.rs"], tests: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], limits: "Cycles are refused and expressions have no comprehensions (t07); repetition is a for-each over at most 1000 items with stable keys from their data, at most 20 at once, or a repeat of at most 100 rounds, each with a route when it runs out, and a run's max_steps stops what the bounds together allow (compile and process tests; mutants rework-unbounded, item-keys-collide, step-budget-ignored)"}
  - {id: FLC-COMP-008, title: "Effect typing", workstream: W2, status: verified_software, files: ["crates/logic/src/solution.rs", "crates/logic/src/compile.rs", "crates/logic/src/rules.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/logic_rules_it.rs"], limits: "A rule cannot name a capability (t10, logic_rules_it), and at run time its evaluator has nothing to call; a query step cannot use a capability that changes anything, nor an action step a read (t13)"}
  - {id: FLC-COMP-009, title: "Data-flow policy", workstream: W2, status: verified_software, files: ["crates/logic/src/rules.rs", "crates/logic/src/compile.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A rule reads no restricted field of its record or of a linked one, at compile and at run time; its message is plain text; linked records are read with the saver's rights; refusal evidence keeps no copy of the record (logic_rules_it, rules_read_nothing_restricted_and_write_once). Process outputs, traces and destinations come with W3"}
  - {id: FLC-COMP-010, title: "Source maps", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "Every fault has a stable code and a JSON pointer; a refusal at run time names its solution, version and rule, and its evidence the release and rule (logic_rules_it). Process steps map to their nodes with W3; there are no subflows"}
  - {id: FLC-HOOK-001, title: "Phase ordering", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/src/hooks.rs", "crates/kernel/src/lib.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs"], limits: "Tenant derivations run after the app's own fills and before every validation, so the app's guards see the final record; a derivation writes only the customer's own fields, never company, owner or the app's (logic_rules_it, t10_t11_t12)"}
  - {id: FLC-HOOK-002, title: "Pure hook boundary", workstream: W2, status: verified_software, files: ["crates/logic/src/expr.rs", "crates/kernel/src/automation.rs", "crates/plugins/src/host.rs"], tests: ["crates/logic/src/compile.rs", "crates/kernel/tests/automation_mail_it.rs", "crates/plugins/tests/after_commit_it.rs"], limits: "Tenant rules can call no function outside a fixed pure list (an http_get is refused at compile); an automation's e-mail is queued with its run (mutant automation-mails-before-commit); plugins are refused I/O inside hooks"}
  - {id: FLC-HOOK-003, title: "Competing writes", workstream: W2, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "One writer per field within a solution (compile), across active releases and against apps' declared fills (activation), and an entity whose active rules conflict refuses its saves (logic_rules_it, cycles_and_competing_writers_are_found_when_prepared). No merge rule can be declared. Plugins' own hooks are not compared"}
  - {id: FLC-HOOK-004, title: "Bounded prefetch", workstream: W2, status: verified_software, files: ["crates/logic/src/rules.rs", "crates/kernel/src/logic.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/logic/src/rules.rs"], limits: "A rule reads only the linked records it declares: four per rule, sixteen fields each, eight per save, none restricted; they are read with the saver's rights before any rule runs, and a saver who may not read one is refused (logic_rules_it)"}
  - {id: FLC-HOOK-005, title: "Equivalent mutation paths", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/logic_rules_it.rs", "crates/mcp/tests/mcp_it.rs", "crates/plugins/tests/platform_it.rs"], limits: "One invalid order through insert, update, import, bulk, a capability's invocation, an automation and a job, and a customer through MCP's create_record and invoke_capability and a plugin's data.insert: all refused alike and nothing written. The REST and /api/v1 routes call the same kernel insert and are not sent through over HTTP here"}
  - {id: FLC-HOOK-006, title: "After-commit durability", workstream: W2, status: verified_software, files: ["crates/kernel/src/outbox.rs", "crates/kernel/src/automation.rs"], tests: ["crates/kernel/tests/automation_mail_it.rs", "crates/kernel/tests/events_it.rs"], limits: "Events and queued mail commit with their change: an automation run that rolls back queues nothing, and one delivered twice mails once (automation_mail_it, mutant automation-mails-before-commit); consumers dedupe by receipt (events_it)"}
  - {id: FLC-HOOK-007, title: "Rejection evidence", workstream: W2, status: verified_software, files: ["crates/kernel/src/logic.rs", "crates/kernel/migrations/20261108000002_logic_release.sql"], tests: ["crates/kernel/tests/logic_rules_it.rs"], limits: "A rule with audit_refusals keeps when, which release and rule, which record, who and whether false or unknown, in a transaction of its own; the refused change is not written and no copy of it is kept (logic_rules_it). It takes a second database connection while the save's is held"}
  - {id: FLC-HOOK-008, title: "Event recursion", workstream: W2, status: verified_software, files: ["crates/kernel/src/outbox.rs", "crates/kernel/src/db.rs", "crates/kernel/src/jobs.rs", "crates/kernel/src/automation.rs"], tests: ["crates/kernel/tests/event_chain_it.rs"], limits: "Work answering an event writes events one step further, whatever handler does it, jobs included; the dispatcher stops an event 8 steps from its chain's start, or past 1000 events from one change, before any handler runs, and keeps it dead with the chain it took; a replay starts afresh; automations stopped at their own limit say so (event_chain_it)"}
  # W3: durable processes and human work
  - {id: FLC-PROC-001, title: "Idempotent starts", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs"], limits: "An event is accepted once per process and business key, on the release active then, with its start queued in the same transaction; two acceptances racing make one run (process_it). The workflow id is made from the run, a repeated start finds it, and a run that ended is not started again (conformance_it; mutants run-started-twice, run-started-again). A reviewed catch-up over past events does not exist"}
  - {id: FLC-PROC-002, title: "Native action receipts", workstream: W3, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/migrations/20261108000001_logic_effect.sql", "crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/process_it.rs"], limits: "The receipt commits in the change's transaction: a repeat gets it, two racing get one change, a failure before the commit leaves neither (capability_it; mutants capability-no-receipt, capability-same-key-other-input). A process's effects go through the same gate under {run}/{activation}: asked again it returns the same record (process_it). A database crash mid-commit is PostgreSQL's to keep atomic; receipts are not yet removed after their retention"}
  - {id: FLC-PROC-003, title: "External effect identity", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/capability.rs", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/kernel/tests/capability_it.rs"], limits: "A step's effect key is the same on every attempt (the activity is retried under its activation) and the gate binds it to the input's digest: other input under it is refused (process_it). An outcome unknown goes where the step says, never to success; providers' own idempotency horizons are not recorded, and an unknown outcome is not queried back automatically"}
  - {id: FLC-PROC-004, title: "Signal before wait", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql"], tests: ["crates/kernel/tests/process_it.rs", "scripts/lrp_walk.py"], limits: "An event that comes before its wait is kept, by the record it is about, and handed over once when the run waits; an event and its wait arriving at the same moment meet too, taken one at a time per workspace, event and correlation (process_it, held waits and sixty concurrent rounds; mutants early-event-dropped, signal-and-wait-unlocked; the walk's LRP-03 found the race). It is kept seven days: older ones no longer match but are not yet deleted"}
  - {id: FLC-PROC-005, title: "Signal spoofing", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000003_logic_process.sql"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A run hears only its workspace's committed events about the record its wait names; another record's event, or another workspace's, advances nothing (process_it; mutant event-crosses-records). Nothing outside Ferrum can signal a run"}
  - {id: FLC-PROC-006, title: "Current authority", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "Each effect runs with the rights of whoever started the run as they are then, through the capability gate; rights revoked while it waited refuse it, and the run waits for a person (process_it; mutant effect-borrows-rights). A run no person started acts with whoever activated its release; there is no separate service grant per release"}
  - {id: FLC-PROC-007, title: "Replay determinism", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/process/src/lib.rs"], tests: ["crates/logic/src/process.rs", "crates/process/tests/conformance_it.rs"], limits: "The state machine reads no clock, store or network: the same events ask for the same things, across a serialized continuation (process tests). The workflow's history replays with the same build and codec, and each effect's activity id is its activation, as the spike required (conformance_it). Replaying open runs before a new worker build takes over is a release step for W8"}
  - {id: FLC-PROC-008, title: "Parallel race", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs"], tests: ["crates/logic/src/process.rs"], limits: "The first branch to complete wins; the others are asked to stop, and an effect one settles afterwards is recorded and handed to a person, never dropped (process tests; mutant late-effect-erased). Run in the state machine the runtime drives, not end to end on Temporal"}
  - {id: FLC-PROC-009, title: "Business rework", workstream: W3, status: verified_software, files: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], tests: ["crates/logic/src/compile.rs", "crates/logic/src/process.rs"], limits: "A repeat runs its body again while it ends `again`, at most its rounds, then takes on_exhausted, never success (compile and process tests; mutant rework-unbounded)"}
  - {id: FLC-PROC-010, title: "Cancellation", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/kernel/src/process.rs"], tests: ["crates/logic/src/process.rs", "crates/kernel/tests/process_it.rs"], limits: "A cancelled run closes its tasks and waits, keeps awaiting the effects in hand, records one that completes anyway and hands it to a person, and finishes once they settle (process tests, process_it; mutant cancel-drops-work-in-hand). An effect in hand cannot be stopped midway: the gate runs it in one transaction"}
  - {id: FLC-PROC-011, title: "Compensation failure", workstream: W3, status: verified_software, files: ["crates/logic/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/logic/src/process.rs", "crates/logic/src/compile.rs"], limits: "Compensation runs newest first through each app's compensating action; a refused or unknown one stays open, handed to a person, and the run waits for a recovery that tries only what is still open (process tests; mutant compensation-oldest-first). The compensating action is given the effect's record, not a mapping the solution declares"}
  - {id: FLC-PROC-012, title: "Worker fencing", workstream: W3, status: partial, files: ["crates/process/src/lib.rs", "crates/kernel/src/process.rs"], tests: ["crates/process/tests/conformance_it.rs"], limits: "A stopped worker's runs are taken up by another (conformance_it); a repeated effect finds its receipt, and Temporal refuses the completion of an attempt that timed out. A worker paused past its timeout and then resumed was not tried"}
  - {id: FLC-PROC-013, title: "History bounds", workstream: W3, status: verified_software, files: ["crates/process/src/lib.rs"], tests: ["crates/process/tests/conformance_it.rs"], limits: "A run continues as new after 500 events, or when Temporal suggests it, carrying its state, deadlines and undelivered signals under the same workflow id and activations; the conformance test continues after every event, across a decision delivered while no worker ran"}
  - {id: FLC-PROC-014, title: "Snapshot plus subscription", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000004_logic_studio.sql", "Ferrum-Frontend:src/lib/solutions.ts"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "The run feed's cursor is a transaction boundary: a run committed late by a slower transaction comes in a later page, never skipped, and a cursor from another database gets resync and the runs as they stand (solutions_it; mutants cursor-passes-open-transaction, restored-cursor-not-resynced). The page polls every five seconds; there is no push channel"}
  - {id: FLC-HUMAN-001, title: "Independent approval", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/compile.rs"], limits: "The requester cannot decide their own request whatever roles they hold, nor an administrator without the task's role, and a task approved by several needs that many different people; the compiler refuses a task that allows the requester (process_it; mutants requester-decides, administrator-decides)"}
  - {id: FLC-HUMAN-002, title: "Input-bound approval", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A decision is bound to the digest of what was shown; an effect relying on an approval carries it and is refused if the approved record's version changed since, or the record is gone (process_it; mutants decided-on-other-material, effect-on-stale-approval, approval-of-deleted-record). Any change of version counts as material; the release's digest is the policy it ran under"}
  - {id: FLC-HUMAN-003, title: "Timeout race", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/process/src/lib.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs"], limits: "A decision and a deadline are settled under the task's row lock: one of them, never both; a deadline after a decision tells the decision, and asked again after a lost answer it says the same (process_it; mutants deadline-overrides-decision, repeated-deadline-says-nothing). On Temporal a deadline is a timer, and the database decides what it means (conformance_it)"}
  - {id: FLC-HUMAN-004, title: "Delegation", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A task is handed on at most its bound of hand-ons (three at most), only to someone holding its role, never back along its chain or to the requester; who decided is recorded (process_it; mutants delegation-unbounded, delegation-counts-people, delegation-goes-back). Standing substitutes during leave do not exist"}
  - {id: FLC-HUMAN-005, title: "Calendar semantics", workstream: W3, status: verified_software, files: ["crates/logic/src/calendar.rs", "crates/kernel/src/process.rs"], tests: ["crates/logic/src/calendar.rs", "crates/kernel/tests/process_it.rs"], limits: "Business days skip weekends and holidays at the same local time; a skipped local time moves past the gap, a repeated one takes the earlier; each deadline records the calendar, its revision, the zone and the zone data, and a revision moves only later deadlines (calendar tests, process_it). There are no schedules yet, so no misfire policy"}
  - {id: FLC-HUMAN-006, title: "Task evidence", workstream: W3, status: partial, files: ["crates/kernel/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A task's material is readable only by someone who may decide it, or an administrator (process_it). Forms take typed values; attachments as evidence do not exist"}
  - {id: FLC-HUMAN-007, title: "Case work", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/compile.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/compile.rs"], limits: "A case starts only its listed tasks, each once its dependencies are done, and is closed only by its owner's role, never by the requester, once the required ones are; other work needs a new reviewed definition; dependency circles are refused when compiled (process_it; mutants case-order-ignored, requester-closes-case). The close carries the finished tasks' results, so it counts even ahead of their own deliveries (mutant case-close-waits-for-deliveries)"}
  - {id: FLC-HUMAN-008, title: "Manual disposition", workstream: W3, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/logic/src/process.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/logic/src/process.rs"], limits: "A suspended step is recovered by an administrator with a reason, resumed only where its source allows or ended refused; nothing marks it a success; what a run hands to a person is acknowledged with a reason (process_it; mutant recovery-forces-success). The authority is an administrator's; no recovery role per solution"}
  # W4: complete Studio product
  - {id: FLC-UI-001, title: "In-app authoring", workstream: W4, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/SolutionsPage.tsx", "Ferrum-Frontend:src/app/studio/solutions/DraftEditor.tsx", "Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "docs/logic/studio.md"], tests: ["crates/studio/tests/solutions_it.rs", "Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "A Solution Author built, checked, simulated and kept an approval in the guided editor; another administrator reviewed it, consented to its new power and activated it; requests then ran through it on the real binary with Temporal, as ordinary roles (evidence/w4-studio.md). Activation is per workspace, with no test workspace or cohort first (W8); decision tables and rules are edited in the source"}
  - {id: FLC-UI-002, title: "Single definition", workstream: W4, status: verified_software, files: ["Ferrum-Frontend:src/app/studio/solutions/Diagram.tsx", "Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "Ferrum-Frontend:src/lib/solutions.ts"], tests: ["Ferrum-Frontend:src/app/studio/solutions/render.test.tsx", "Ferrum-Frontend:src/lib/solutions.test.ts"], limits: "Guided, Diagram and Source edit one parsed source in place. The diagram lays each process out from its first step along its routes and opens the guided view's own inspector, so its edits are the same edits; its layout only reads, dropping and changing nothing (render tests), and edits keep settings no view shows (solutions.test). Settings written in the source survived the guided view, a save and a reload on the running build (W4 walk, journey 2). Structured steps' own settings are edited in the source"}
  - {id: FLC-UI-003, title: "Typed inspector", workstream: W4, status: verified_software, files: ["Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "crates/logic/src/capability.rs", "crates/kernel/src/capability.rs"], tests: ["Ferrum-Frontend:src/app/studio/solutions/render.test.tsx", "crates/logic/src/compile.rs"], limits: "The inspector shows, from the catalog, what a step's capability does, the rights it needs from whoever starts the run, what done means, its attempts and receipts, what happens to an unknown outcome and what undoes it, and flags an action that can end unknown without a route for it, as the compiler refuses (render.test, compile tests). Attempts and timeouts are the capability's, not settable per step"}
  - {id: FLC-UI-004, title: "Accessible outline", workstream: W4, status: implemented_unverified, files: ["Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "Ferrum-Frontend:src/app/studio/solutions/field.tsx", "Ferrum-Frontend:src/app/Shell.tsx", "Ferrum-Frontend:src/app/studio/runs/TasksPage.tsx"], tests: ["Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "By keyboard alone an administrator added a step, routed a rejection to it and mended the faults the check announced (each check result read out through a live region, opening a fault moving focus to that step's settings), and a reviewer reached, read and decided a task; focus moves into each new page; axe finds nothing on the solution, run and task screens (walk journey 6, render.test). No screen reader was used and no assistive-technology user has tried it (BLOCK-ACCESSIBILITY-AUDIT)"}
  - {id: FLC-UI-005, title: "Semantic diff", workstream: W4, status: verified_software, files: ["crates/logic/src/diff.rs", "crates/kernel/src/authoring.rs", "crates/kernel/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/ReleasePage.tsx"], tests: ["crates/logic/src/diff.rs", "crates/studio/tests/solutions_it.rs", "Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "A release's review lists what changed by meaning, each changed setting as it was and as it is, capabilities with versions and whether they change records; new changing capabilities need consent one by one, and approval binds to the digest shown, so any change needs a review of its own (diff tests, solutions_it; mutants approval-without-consent, diff-shows-old-as-new, author-reviews). Data destinations are read from the changed inputs; there is no separate data-flow view"}
  - {id: FLC-UI-006, title: "Conflict handling", workstream: W4, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/solutions/DraftEditor.tsx"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "A draft saves against the version read (If-Match); a later save is refused naming who saved and when, and the page offers to keep one's own text as a new draft or open the latest (solutions_it, walk journey 4; mutant draft-save-overwrites). Text not yet saved is also kept in the browser"}
  - {id: FLC-UI-007, title: "Simulator parity", workstream: W4, status: implemented_unverified, files: ["crates/logic/src/simulate.rs", "crates/kernel/src/authoring.rs", "Ferrum-Frontend:src/app/studio/solutions/SimulatorPanel.tsx"], tests: ["crates/logic/src/simulate.rs", "crates/studio/tests/solutions_it.rs"], limits: "The simulator drives the runtime's own state machine with the workspace's calendars on a virtual clock, labels each stand-in, and treats an unanswered capability as unknown. On boundary fixtures (1000 proceeds, 1000.01 is reviewed) it decides as runs on the kernel's runtime path do (process_it); the same on the deployed build waits for the final walk"}
  - {id: FLC-UI-008, title: "Recovery console", workstream: W4, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/studio/src/logic.rs", "Ferrum-Frontend:src/app/studio/runs/TasksPage.tsx", "Ferrum-Frontend:src/app/studio/runs/RunsPage.tsx"], tests: ["crates/kernel/tests/process_it.rs", "crates/studio/tests/solutions_it.rs", "Ferrum-Frontend:src/app/studio/solutions/render.test.tsx"], limits: "A run shows each step's outcome, refusals first; a recovery records who did what and why. For an unknown outcome the console offers Look it up: the effect's receipt, which every capability writes in the effect's own transaction, says whether it was done, and what was found is kept on the item and reads the same on another replica (process_it; mutant look-up-misses-the-receipt; render test). Resuming then repeats the step under its key and the receipt answers it"}
  - {id: FLC-UI-009, title: "Localization", workstream: W4, status: verified_software, files: ["Ferrum-Frontend:src/locales/ar.ts", "Ferrum-Frontend:src/locales/hi.ts", "Ferrum-Frontend:src/app/studio/solutions/GuidedEditor.tsx", "crates/logic/src/calendar.rs"], tests: ["Ferrum-Frontend:src/app/interfacewords.test.ts", "crates/logic/src/calendar.rs"], limits: "In Arabic, right to left, with times shown in Asia/Kolkata, an author edited a solution and a reviewer decided a task whose deadline came from the office calendar (Asia/Kolkata, Saturday and Sunday off); identifiers stay as written (walk). Every word of these screens is in the Arabic and Hindi catalogs. The workspace's own zone was UTC; Hindi was not walked"}
  - {id: FLC-UI-010, title: "Preview isolation", workstream: W4, status: verified_software, files: ["crates/logic/src/simulate.rs", "crates/kernel/src/authoring.rs"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "A simulation creates no run, task or record and a mail step answered in it queues nothing (solutions_it); the simulator is pure and has no gate to call; a draft never runs. A separate sandbox for real test effects does not exist"}
  # W5: generic edge and event integration
  - {id: FLC-EDGE-001, title: "Authenticated observation", workstream: W5, status: partial, files: ["crates/ops/src/identity.rs", "ferrum-app-edge:src/facts.rs", "ferrum-app-edge:gateway/src/runtime.rs"], tests: ["crates/ops/tests/ops_it.rs", "ferrum-app-edge:tests/conditions_it.rs"], limits: "Facts are bound to the workspace and site of the gateway that signed them; a gateway names only devices it holds, and the platform keeps a condition only for a device of the reporting site. A payload's own claims of workspace or site are never read. No test sends a forged payload from one gateway naming another site's device"}
  - {id: FLC-EDGE-002, title: "Normalization provenance", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:docs/flows.md"], tests: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs"], limits: "Bring to units works in exact decimals (value \u00d7 scale + offset), keeps the raw value as provenance (carried to each condition's evidence) and quarantines what is not a number or lands outside what it can be (pipeline and flow tests). Units are named, not converted between, and the raw value is kept with conditions, not with every measurement"}
  - {id: FLC-EDGE-003, title: "Quality semantics", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:gateway/src/runtime.rs", "ferrum-app-edge:src/facts.rs"], tests: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:tests/conditions_it.rs"], limits: "Readings carry good, uncertain or bad; a flow that judges quality hears bad ones marked; a bad reading during an episode is evidence and never a recovery, and silence is said once as stale with the episode left open (pipeline, flow and conditions tests). A stuck value is judged by its device's limits (repeats), not by the flow"}
  - {id: FLC-EDGE-004, title: "State scope", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/flow.rs"], tests: ["ferrum-app-edge:contract/src/flow.rs"], limits: "A step keeps memory for 5,000 devices and a flow for 50,000 things in all; each one left out is said (flow test with 5,010 untrusted device codes). Memory is keyed by flow, revision, step and device at one gateway; nothing is keyed by correlation across gateways"}
  - {id: FLC-EDGE-005, title: "Atomic critical state", workstream: W5, status: verified_software, files: ["ferrum-app-edge:gateway/src/journal.rs", "ferrum-app-edge:gateway/src/runtime.rs", "ferrum-app-edge:contract/src/flow.rs"], tests: ["ferrum-app-edge:gateway/tests/critical_it.rs", "ferrum-app-edge:contract/src/flow.rs"], limits: "A business-critical flow's state and what it did are written in one SQLite transaction after each step that does something; killing the gateway before that write leaves neither and the reading is decided again once, after it leaves both and the same reading changes nothing (critical_it, real aborts at named crash points; flow tests across a restart). A push protocol that acknowledges a reading before the step is written can lose that reading in between; polled devices are read again"}
  - {id: FLC-EDGE-006, title: "Event-time lateness", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:docs/flows.md"], tests: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs"], limits: "Event-time windows declare their watermark (latest seen less a wait), a lateness for corrections said on revised, later readings on late, and a quiet device closing what it has; a correction revises the evidence and the command the first result led to is not repeated (pipeline and flow tests, simulated from midnight so the windows fall the same each run). Windows are tumbling; there are no sliding or session windows"}
  - {id: FLC-EDGE-007, title: "Episode identity", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:src/facts.rs", "ferrum-app-edge:packages/edge/package.yaml"], tests: ["ferrum-app-edge:contract/src/pipeline.rs", "ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:tests/conditions_it.rs"], limits: "An episode's identity comes from the flow, step, device and when it began to hold; the platform keeps one Edge Condition per episode, each reading once, publishes each turn once, and a process triggered by edge.condition_opened starts once per episode through duplicates, late and out-of-order facts and a reopening (pipeline, flow and conditions tests). The process's own runtime was not part of that test"}
  - {id: FLC-EDGE-008, title: "Offline scope", workstream: W5, status: partial, files: ["ferrum-app-edge:gateway/src/runtime.rs", "ferrum-app-edge:docs/flows.md"], limits: "Past its offline lease a gateway starts no new work and says so, and a command asked for offline waits and expires; what a flow looks up about devices has no declared maximum age, and grant ages are not declared per flow"}
  - {id: FLC-EDGE-009, title: "Distributed owner", workstream: W5, status: partial, files: ["crates/ops/src/connections.rs"], tests: ["crates/ops/tests/ops_it.rs"], limits: "Connections are fenced so an old one cannot revoke its replacement; flows have no owner incarnation of their own beyond the gateway holding the site"}
  - {id: FLC-EDGE-010, title: "State migration", workstream: W5, status: verified_software, files: ["ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:gateway/src/runtime.rs", "ferrum-app-edge:src/lib.rs", "ferrum-app-edge:packages/edge/entities/edge.yaml"], tests: ["ferrum-app-edge:contract/src/flow.rs"], limits: "Whoever runs a new revision chooses Start Empty, Drain First (open windows say their partial result, open episodes are said interrupted, not cleared) or Keep Unchanged (steps whose settings did not change keep their memory); the flow records which steps kept what before it runs, and the gateway notes the rest (flow tests). The gateway applies it when the running revision is replaced, not when it restarts in the middle of a change"}
  - {id: FLC-EDGE-011, title: "Backpressure", workstream: W5, status: implemented_unverified, files: ["ferrum-app-edge:gateway/src/runtime.rs", "ferrum-app-edge:gateway/src/journal.rs", "ferrum-app-edge:docs/flows.md"], limits: "Below its disk reserve a gateway keeps only alarms of its measurements, starts no new work and says so in its health; facts (conditions and requests among them) are always written, outside the telemetry budget. No test fills a disk"}
  - {id: FLC-EDGE-012, title: "Operational intent", workstream: W5, status: implemented_unverified, files: ["ferrum-app-edge:contract/src/flow.rs", "ferrum-app-edge:docs/flows.md"], limits: "A flow has no step that moves equipment: a command is a request to the ledger, and a case is a condition the platform hands to a reviewed process. This acceptance case was not run as written"}
  # W6: analytical semantics and engine reuse
  - {id: FLC-SEM-001, title: "Single semantic owner", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/metric.rs", "ferrum-app-metrics:src/dataset.rs"], tests: ["ferrum-app-metrics:tests/metrics_it.rs", "ferrum-app-metrics:tests/composed_it.rs"], limits: "Metrics is the one place metrics are defined, certified and composed (queries of one measure, formulas over certified metrics, datasets), with lineage; no external semantic model (Wren) is imported, so no conflicting definition can arrive to be reviewed"}
  - {id: FLC-SEM-002, title: "Grain and joins", workstream: W6, status: verified_software, files: ["crates/studio/src/query.rs"], tests: ["crates/studio/src/query.rs"], limits: "Grouping or measuring a child table makes its rows the grain; a sum, average or count of the parent's fields at that grain is refused (\"would count each invoice once per items row\"), count_distinct, min and max are allowed, and two child tables at once are refused (query.rs tests). Links are many-to-one and do not fan out. Totals across several documents' children (invoice, payment, shipment) are not joined at all"}
  - {id: FLC-SEM-003, title: "Composed metrics", workstream: W6, status: verified_software, files: ["ferrum-app-metrics:src/metric.rs", "ferrum-app-metrics:src/site.rs"], tests: ["ferrum-app-metrics:tests/composed_it.rs"], limits: "A composed metric is an explicit formula over named certified metrics, a ratio of their values ([Company terms] / [Company customers]), evaluated exactly for each reader; it is never made of itself, is certified after its parts, and has no value rather than a wrong one when a part is missing or zero (composed_it). An average of ratios is not offered, so the two cannot be confused; balances across periods have no declared additivity"}
  - {id: FLC-SEM-004, title: "Currency and time", workstream: W6, status: partial, files: ["crates/studio/src/spec.rs"], limits: "Exchange rates exist and Studio has relative dates and fiscal buckets; metrics are not converted by date, and rounding is not versioned"}
  - {id: FLC-SEM-005, title: "Query authority", workstream: W6, status: partial, files: ["crates/studio/src/query.rs", "ferrum-app-metrics:src/metric.rs"], tests: ["crates/studio/tests/studio_it.rs", "ferrum-app-metrics:tests/composed_it.rs"], limits: "Native queries apply every joined entity's row scope for the viewer, and a composed metric's parts are each read with the reader's own rights (three readers, three averages from one definition); external sources do not exist"}
  - {id: FLC-SEM-006, title: "Query sandbox", workstream: W6, status: partial, files: ["crates/studio/src/query.rs", "crates/studio/src/run.rs"], limits: "Identifiers come from metadata, values are bound, scans and time are bounded; no external engine or generated SQL exists to sandbox further"}
  - {id: FLC-SEM-007, title: "Result freshness", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/site.rs", "ferrum-app-metrics:src/metric.rs"], tests: ["ferrum-app-metrics:tests/composed_it.rs"], limits: "Every metric value says when it was worked out (as_of) and a series marks the period not yet over as partial (composed_it); there are no federated sources whose lag or failure could be disclosed"}
  - {id: FLC-SEM-008, title: "Sharing and schedules", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/delivery.rs", "crates/studio/src/builder.rs"], limits: "Followed metrics are delivered as each follower's own value, never the sender's; embeds and exports of analyses are not authorised per recipient yet"}
  - {id: FLC-SEM-009, title: "Semantic change control", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/metric.rs", "ferrum-app-metrics:src/site.rs"], tests: ["ferrum-app-metrics:tests/metrics_it.rs", "ferrum-app-metrics:tests/composed_it.rs"], limits: "A changed certified definition returns to draft and kept values carry its fingerprint; impact lists every metric composed of one, and a composed metric whose part is deprecated or uncertified has no value rather than a new meaning (composed_it). Saved analyses do not exist to bind to a revision"}
  - {id: FLC-SEM-010, title: "Engine interoperability", workstream: W6, status: not_started, limits: "No Wren or DataFusion adapter: DataFusion's build needs several gigabytes the build machine does not have, and native analysis runs through Studio's compiler. Recorded in docs/logic/evidence/w6-semantics.md"}
  # W7: Intelligence experience and governed proposals
  - {id: FLC-AI-001, title: "Typed proposals", workstream: W7, status: verified_software, files: ["ferrum-app-intelligence:src/intent.rs", "ferrum-app-intelligence:src/ask.rs", "server/src/assistant.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs", "ferrum-app-intelligence:src/intent.rs"], limits: "Intelligence turns a question into a typed request about certified metrics (a value or a series) and nothing else, and a proposal into a draft Solution checked by the platform's compiler, which returns its diagnostics; nothing generated can run without a person's review (evals_it). No model generates proposals here: they come from a template, so an invented capability from a model is not exercised"}
  - {id: FLC-AI-002, title: "Prompt injection", workstream: W7, status: verified_software, files: ["ferrum-app-intelligence:src/intent.rs", "ferrum-app-intelligence:src/ask.rs", "server/src/assistant.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs", "server/tests/assistant_egress_it.rs"], limits: "A question's words never become a query or an action: injected instructions name no metric and are declined, actions asked for are noticed and said back while only the metric is read (nothing was deleted), and every answer is read through Metrics with the asker's own rights (evals_it). Retrieved documents are not read by Intelligence at all"}
  - {id: FLC-AI-003, title: "Ambiguity", workstream: W7, status: verified_software, files: ["ferrum-app-intelligence:src/intent.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs", "ferrum-app-intelligence:src/intent.rs"], limits: "A question that could mean several certified metrics is asked back with them as options (Customers (companies) or (people)); a revoked metric is never offered (evals_it). No approved default interpretation is configured: it always asks"}
  - {id: FLC-AI-004, title: "Evidence-based answers", workstream: W7, status: verified_software, files: ["ferrum-app-intelligence:src/ask.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs"], limits: "An answer is only what Metrics returned, with who certified the metric and when, its definition's fingerprint, its lineage, when it was worked out and which periods are partial; with no value (a part revoked, a division by zero) it declines with the reason instead of giving a number (evals_it). No model writes the answer, so no fabricated number can be offered to refuse"}
  - {id: FLC-AI-005, title: "Bounded agent loop", workstream: W7, status: partial, files: ["ferrum-app-intelligence:src/intent.rs", "server/src/assistant.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs"], limits: "Intelligence answers in one step: a question becomes one request, a range over 120 periods is declined before anything runs, a question over 500 characters is refused, and a failing provider ends in a plain no (evals_it); the assistant has its own budgets. There is no multi-step agent loop to bound"}
  - {id: FLC-AI-006, title: "Separate action authority", workstream: W7, status: verified_software, files: ["ferrum-app-intelligence:src/ask.rs", "crates/kernel/src/authoring.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs"], limits: "Intelligence writes nothing operational: a proposal is a draft Solution kept as a Solution Author, refused to anyone else, and it has no way to review, approve or activate; the platform refuses its author's own approval anyway (evals_it, Ferrum solutions_it)"}
  - {id: FLC-AI-007, title: "Memory governance", workstream: W7, status: not_started, limits: "Nothing learns from feedback: questions are kept for their asker only, and no example is retrieved into another answer"}
  - {id: FLC-AI-008, title: "Model changes", workstream: W7, status: partial, files: ["ferrum-app-intelligence:tests/evals_it.rs", "server/src/assistant_eval.rs"], tests: ["ferrum-app-intelligence:tests/evals_it.rs", "server/tests/assistant_eval_it.rs"], limits: "Fixed and adversarial evaluations run on every change against the rules provider (evals_it), and the assistant has its harness; runs against a real model wait for a key (BLOCK-MODEL-KEY), so a confidently wrong model is not tried"}
  # W8: migration, release and operations
  - {id: FLC-OPS-001, title: "Observability", workstream: W8, status: verified_software, files: ["server/src/controllers/system.rs", "crates/kernel/src/process.rs", "crates/kernel/migrations/20261108000006_logic_attempt.sql", "docs/operations.md"], tests: ["crates/kernel/tests/process_it.rs", "scripts/logic_load.py"], limits: "A run's page names its original event, its release and generation, each step's outcome, how often each step was tried and how its last try went, the effects it did and every move; /metrics carries runs by state, the oldest start's wait, open and overdue tasks, recovery items, and the worker's steps in hand, deferrals and limits (process_it; mutant tries-not-counted; seen on the walk server). Logs carry the correlation id, but no single trace view joins them across replicas, and Temporal keeps its own activity history"}
  - {id: FLC-OPS-002, title: "Fair scheduling", workstream: W8, status: verified_software, files: ["crates/process/src/budget.rs", "crates/process/src/lib.rs", "crates/kernel/src/outbox.rs", "crates/kernel/src/jobs.rs"], tests: ["crates/process/src/budget.rs", "scripts/logic_load.py", "crates/kernel/tests/events_it.rs", "crates/kernel/tests/jobs_it.rs"], limits: "Events, jobs and the starts of runs take turns per workspace in the outbox; in the worker, a workspace holds at most its share of the effect slots and a quarter of the slots stay for bookkeeping, so a flood in one workspace left the other's orders at its quiet pace (logic_load: 60 at once beside 5; mutants workspace-takes-every-slot, effects-take-bookkeeping-slots). The share is per replica's worker, not across replicas, and analytical work (Metrics) runs in requests, outside the worker"}
  - {id: FLC-OPS-003, title: "Resource budget", workstream: W8, status: verified_software, files: ["crates/process/src/budget.rs", "crates/process/src/lib.rs", "docs/operations.md", "crates/logic/src/process.rs"], tests: ["crates/process/src/budget.rs", "scripts/logic_load.py"], limits: "The worker runs at most half the database pool in activities (its tuner's slots), so more workers than the pool serves cannot exhaust it; FERRUM_PROCESS_STEPS and FERRUM_PROCESS_STEPS_PER_WORKSPACE set it; a run has a step budget and continues as new. A provider's own rate limit is not set per capability beyond its attempts and timeout, and Temporal's server-side limits are its own configuration"}
  - {id: FLC-OPS-004, title: "Restore fencing", workstream: W8, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/recovery.rs", "docs/operations.md"], tests: ["crates/kernel/tests/process_it.rs"], limits: "While the platform is held after a restore, or fenced to another region, a process step that would change something waits and is tried again; reads and people's tasks go on; it runs once a person releases the hold, under the same receipt (process_it; mutant effect-ignores-restore-hold). The hold does not compare Temporal's history with the database by itself: the person releasing it reconciles external effects"}
  - {id: FLC-OPS-005, title: "Backup completeness", workstream: W8, status: verified_software, files: ["scripts/restore_drill.py", "crates/kernel/src/process.rs", "crates/kernel/src/recovery.rs", "docs/operations.md", "deploy/temporal.yml"], tests: ["scripts/restore_drill.py", "crates/kernel/tests/process_it.rs"], limits: "The drill took PostgreSQL before an order and Temporal's store after it, removed the originals and recovered into a new database, Temporal and server: it held, read every run with the same keys, kept the order asked for while held until a person released it and then made it once, and named the run whose history was ahead of the database (restore_drill.txt; process_it; mutants restored-effect-unnoticed, restore-not-rechecked). Object storage and its journals are not part of the drill; keys come from outside the database, as documented"}
  - {id: FLC-OPS-006, title: Retention, workstream: W8, status: partial, files: ["crates/kernel/src/retention.rs", "deploy/temporal.yml"], tests: ["crates/kernel/tests/retention_it.rs", "crates/kernel/tests/process_it.rs"], limits: "Retention and legal holds apply to records; an old event delivered again after its receipt expired starts nothing, its run found by business key (process_it). Temporal keeps a closed run's history for its namespace's retention (30 days); an erasure does not yet reach the copies a run keeps (trigger, task material, state)"}
  - {id: FLC-OPS-007, title: "Revocation response", workstream: W8, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/apps.rs", "crates/kernel/src/service.rs", "docs/operations.md"], tests: ["crates/kernel/tests/process_it.rs"], limits: "A capability taken out of service (an app's release revoked or taken out of the workspace, or the version a release is bound to replaced) is not used: a step that needs it waits, administrators see why on an attention item and may cancel the run (audited), and it goes on by itself under its own receipt once the capability is back (process_it, with the app taken out of the workspace; mutant revoked-capability-fails-the-step). Keys and apps are revoked as before; a plugin digest is revoked with its app's release, not on its own"}
  - {id: FLC-OPS-008, title: "Portability", workstream: W8, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "crates/kernel/src/export.rs"], tests: ["crates/studio/tests/solutions_it.rs"], limits: "A release leaves as a pack (source, digests, the capabilities, events and calendars it needs, review decisions without names; never a connection or a credential) and arrives in another workspace as a draft with what must be mapped; a pack changed on the way is refused (solutions_it; mutant pack-taken-in-changed). A pack holds one solution; run histories do not travel in it, and workspaces export their records as before"}
  - {id: FLC-MIG-001, title: "Legacy import", workstream: W8, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "docs/operations.md"], tests: ["crates/studio/tests/solutions_it.rs", "crates/kernel/tests/process_it.rs"], limits: "Each automation becomes a draft Solution with its event, its condition as written, its actions as capability steps, a run per event (event.id) and its provenance (and the administrator rights it no longer has), once; a notification to a role or a field is flagged and left for a person (solutions_it, process_it; mutant automation-imported-twice). Edge flows are not Logic solutions and stay as they are"}
  - {id: FLC-MIG-002, title: "Shadow comparison", workstream: W8, status: verified_software, files: ["crates/kernel/src/authoring.rs", "crates/studio/src/logic.rs", "crates/logic/src/simulate.rs"], tests: ["crates/kernel/tests/process_it.rs", "scripts/lrp_walk.py"], limits: "A candidate is replayed beside what runs now on the last runs of its solution, with the answers, refusals, recoveries, decisions and events each met, or beside an automation's recorded events and what it did; cases say what differs, a step the candidate adds is answered only by an assumption the person gives (listed per case), and no order, effect, release or run comes of it (process_it; mutants shadow-forgets-what-happened, shadow-replays-refusal-as-success, shadow-assumes-over-history). A permission-aware sandbox against providers' test systems does not exist"}
  - {id: FLC-MIG-003, title: "One-writer cutover", workstream: W8, status: verified_software, files: ["crates/kernel/src/process.rs", "crates/kernel/src/automation.rs", "crates/kernel/src/logic.rs", "crates/kernel/migrations/20261108000005_logic_cutover.sql"], tests: ["crates/kernel/tests/process_it.rs"], limits: "Each run records the generation it was accepted under, and an event is accepted under the release active as it is accepted. Activating a solution imported from an automation turns the automation off in the same step; each of its events is then claimed once under the automation's lock, by the solution or the automation's runner: events before, during and after the activation, in every order and delivered again, each told once (process_it; mutants cutover-runs-both, cutover-leaves-automation-on, run-forgets-its-generation). Each event reads the workspace's version from the database, so an activation committed on another replica is taken up by the very next event (process_it, with a second kernel that had not heard of it; mutant replica-misses-an-activation)"}
  - {id: FLC-MIG-004, title: "In-flight migration", workstream: W8, status: verified_software, files: ["crates/logic/src/process.rs", "crates/kernel/src/process.rs", "crates/process/src/lib.rs", "crates/studio/src/logic.rs"], tests: ["crates/kernel/tests/process_it.rs", "crates/process/tests/conformance_it.rs", "crates/logic/src/process.rs"], limits: "A waiting run moves onto the release that runs now only by a mapping of each step it waits at and each approval it carries, planned by one administrator and approved by another, at the top or inside a loop, branches, a round or a subprocess (a step that holds others keeps its id); an unmapped removed step, one mapped to a step that waits otherwise, or a move reaching a run decided meanwhile is refused and recorded (process_it, logic unit tests, conformance_it on Temporal, the walk; mutants move-approved-by-its-planner, move-over-a-decision, move-renames-a-holder). A run with an effect or an undoing in hand moves once that has settled"}
  - {id: FLC-MIG-005, title: "Schema lifecycle", workstream: W8, status: partial, files: ["crates/kernel/src/backfill.rs"], tests: ["crates/kernel/tests/backfill_it.rs"], limits: "Packages declare resumable backfills run in batches; contraction is by hand"}
  - {id: FLC-MIG-006, title: "Rollback truth", workstream: W8, status: verified_software, files: ["crates/kernel/src/logic.rs", "docs/operations.md", "ferrum-app-edge:docs/flows.md"], tests: ["crates/kernel/tests/process_it.rs"], limits: "Going back is activating the earlier release again: a new generation; new runs start under it, the run started under the later release goes on under it, and its order and receipt stay; the activation's answer and the release page say what was replaced and that nothing done is undone (process_it). Edge treats going back to an old flow as a change reviewed again"}
  - {id: FLC-QUAL-001, title: "Exact artifacts", workstream: W8, status: verified_software, files: ["scripts/release_evidence.py", "docs/logic/evidence/qualification.yaml", "docs/registry/release-manifest.yaml", "docs/logic/evidence/lrp-profiles.md"], tests: ["scripts/release_evidence.py"], limits: "Each qualification names the exact build it ran at: a digest of Ferrum's code and the commit of the frontend and every repository Cargo.lock builds. release_evidence.py qualified names what changed since and fails, and each build's evidence says whether each qualification stands for it (self-test: an app's pin changed after it passed, Ferrum's code changed). Rerunning is by hand with the qualification's scripts, then --stamp"}
  - {id: FLC-QUAL-002, title: "Ordinary roles", workstream: W8, status: verified_software, files: ["scripts/lrp_walk.py", "docs/logic/evidence/lrp-walk.txt", "server/tests/journeys_it.rs"], tests: ["scripts/lrp_walk.py"], limits: "The six reference profiles ran on one assembled build in two workspaces, each step as the person who would do it (authors, two administrators, reviewers, requesters, a partner with a time-bound grant, analysts, a steward, readers with and without the rights), allowed work completing and prohibited actions failing: 67 checks passed (lrp-walk.txt)"}
  - {id: FLC-QUAL-003, title: "Mutation coverage", workstream: W8, status: verified_software, files: ["scripts/mutants.py"], tests: ["scripts/mutants.py"], limits: "Mutants remove the program's invariants and the targeted tests fail: the workspace filter (no-tenant-share, replay-crosses-workspaces), the approval digest (decided-on-other-material, effect-on-stale-approval), stable effect identity (run-started-twice, late-effect-erased, capability-no-receipt), and each workstream's own (W4 to W8 recorded in their evidence). They run on demand; CI checks only that each still finds its text"}
  - {id: FLC-QUAL-004, title: "Performance evidence", workstream: W8, status: verified_software, files: ["scripts/logic_load.py", "docs/logic/evidence/logic-load.txt", "scripts/soak.py"], tests: ["scripts/logic_load.py"], limits: "Measured on stated hardware (an 8-core Apple silicon Mac, PostgreSQL 17, Temporal's 1.32.2 dev server on SQLite): source and planner costs apart from the runtime's, cold, warm, sixty at once beside another workspace, and a server stopped mid-batch (logic-load.txt). One machine and a development Temporal: not a production topology's numbers, and no model costs, as no model is used"}
  - {id: FLC-QUAL-005, title: "Independent fixtures", workstream: W8, status: partial, files: ["server/tests/journeys_it.rs", "crates/logic/src/decision.rs", "ferrum-app-metrics:tests/composed_it.rs"], limits: "Financial journeys check hand-worked numbers; decision tables (hit policies, gaps, overlaps) and composed metrics read per person are checked against hand-worked values; fixtures for fan-out, currencies, refunds and balances do not exist"}
  - {id: FLC-QUAL-006, title: "Full journeys", workstream: W8, status: verified_software, files: ["scripts/lrp_walk.py", "docs/logic/evidence/lrp-profiles.md", "docs/logic/evidence/lrp-walk.txt", "server/tests/journeys_it.rs"], tests: ["scripts/lrp_walk.py", "scripts/restore_drill.py", "scripts/logic_load.py"], limits: "Each profile ran complete in one walk on one assembled build with two workspaces: authored, reviewed, deployed, executed and recovered across apps; lrp-profiles.md lists what was real and what stood in (a gateway played by the walk with a key of its own; no model; no provider sandbox; no equipment)"}
  - {id: FLC-QUAL-007, title: "External qualification", workstream: W8, status: verified_software, files: ["scripts/registry.py", "docs/registry/reviewers.yaml"], tests: ["scripts/registry.py"], limits: "Software, simulator, provider, equipment and independent review are kept apart: a qualified status needs an independent reviewer on record, a release digest and a profile, and nothing blocked; registry.py refuses a simulator-only claim, a reviewer not on record, a missing digest and a blocked row (self-test). Nobody independent is on record yet, so nothing is qualified"}
  - {id: FLC-QUAL-008, title: "Maintenance owner", workstream: W8, status: blocked_external, blockers: [BLOCK-LTS-SUPPORT], limits: "Named people must take on supported profiles, versions and incidents"}
