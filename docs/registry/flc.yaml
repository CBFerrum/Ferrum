# The Logic Platform v2 package's requirements (FLC-*), imported with what this repository already has
# for each. A status is what the evidence supports (docs/platform/README.md "States"). See docs/logic/README.md
# for the program and docs/logic/catalog.json for each requirement's text and acceptance case.
requirements:
  # W0: establish reality and decision records
  - {id: FLC-BASE-001, title: "Fresh assembled baseline", workstream: W0, status: verified_software, files: ["scripts/baseline.py", "docs/logic/baseline.json"], tests: ["scripts/test_baseline.py"], limits: "Heads, pins, builds and installed versions are read separately; installed versions come from the local development database only, so no production installation is known"}
  - {id: FLC-BASE-002, title: "Safe worktree", workstream: W0, status: verified_software, files: ["scripts/baseline.py"], tests: ["scripts/test_baseline.py"], limits: "Reports dirty files and unused patches; it does not stop anyone committing them"}
  - {id: FLC-BASE-003, title: "Reuse map", workstream: W0, status: partial, files: ["docs/logic/reuse-map.yaml"], limits: "Mapped by reading the code at the pins it names; each entry is confirmed when its workstream starts"}
  - {id: FLC-BASE-004, title: "Durable backend ADR", workstream: W0, status: verified_software, files: ["docs/logic/decisions.md", "docs/plan/spike-l01-temporal.md", "docs/plan/spikes/temporal_logic/src/main.rs"], tests: ["docs/plan/spikes/temporal_logic/run.sh"], limits: "One development-layout server without TLS, high availability or online backup; 200 workflows is not a capacity test; Temporal's documentation must list PostgreSQL 17 before production (its schema applied and every probe ran on 17.9)"}
  - {id: FLC-BASE-005, title: "Supported profiles", workstream: W0, status: partial, files: ["docs/logic/profiles.md"], limits: "Profiles are written down; no installation refuses a long-lived process yet, because none can be defined"}
  - {id: FLC-BASE-006, title: "License inventory", workstream: W0, status: partial, files: ["scripts/licenses.py", "docs/references/logic.md"], limits: "Rust dependencies are inventoried by scripts/licenses.py; Temporal, Wren and DataFusion are reviewed by reading their licences, and nothing gates an unapproved engine in a deployment plan yet"}
  # W1: shared types and business capabilities
  - {id: FLC-CAP-001, title: "Typed capability registry", workstream: W1, status: implemented_unverified, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/meta/src/types.rs", "crates/studio/src/site.rs", "crates/mcp/src/lib.rs", "docs/logic/capabilities.md"], tests: ["crates/kernel/tests/capability_it.rs", "crates/studio/tests/catalog_it.rs"], limits: "Read from what a workspace installs, with effect, rights, input and output schemas, idempotency, completion and digest; the builder's endpoint, the agent's tools and the kernel agree digest for digest over ERP's packages (catalog_it). The builder's screens (W4) do not exist, so the case's UI is not yet part of it"}
  - {id: FLC-CAP-002, title: "Native invariants", workstream: W1, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/doc.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/kernel/tests/invariants_it.rs"], limits: "A ledger offers no capability, a read-only field is the app's to set, and actions run through their owning app (capability_it, mutant capability-ledger-offered). Record updates remain capabilities for the fields an app leaves writable: an app protects a balance by making it read-only or a ledger"}
  - {id: FLC-CAP-003, title: "Trusted context", workstream: W1, status: verified_software, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/kernel/src/ctx.rs"], tests: ["crates/kernel/tests/capability_it.rs", "crates/logic/src/capability.rs"], limits: "An input naming a workspace, a role or an administrator flag is refused unless the capability declares that field as data, and another workspace's records and receipts do not exist (capability_it, mutant capability-input-says-who-asks). Values resolved inside a process (references from a device message) come with W3 and W5"}
  - {id: FLC-CAP-004, title: "Version and digest lock", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs"], tests: ["crates/kernel/tests/capability_it.rs"], limits: "Each capability carries its package's version and a digest of what it promises; asked for another version, the gate refuses (mutant capability-version-adopted). Keeping a waiting process on its old binding needs processes (W3)"}
  - {id: FLC-CAP-005, title: "Delegation modes", workstream: W1, status: partial, files: ["crates/kernel/src/jobs.rs", "crates/kernel/src/service.rs", "crates/kernel/src/automation.rs"], limits: "Jobs run with their creator's rights as they are now and service apps have accounts of their own; automations run on their saver's administrator rights, a third mode this program replaces"}
  - {id: FLC-CAP-006, title: "Completion semantics", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/ops-contract/src/command.rs"], limits: "Each capability says what done means, and mail says it is queued, not delivered; a run waiting for the business outcome after an acceptance needs processes (W3)"}
  - {id: FLC-CAP-007, title: "Unknown outcomes", workstream: W1, status: partial, files: ["crates/logic/src/capability.rs", "crates/kernel/src/capability.rs", "crates/ops-contract/src/command.rs"], limits: "Each capability declares its unknown-outcome behaviour; a native receipt lets the outcome of a transactional action be looked up. External effects that can end unknown, and their reconciliation, come with W3"}
  - {id: FLC-CAP-008, title: "Deprecation ownership", workstream: W1, status: not_started, limits: "No capability revisions exist to deprecate"}
  - {id: FLC-SEC-001, title: "Least privilege grants", workstream: W1, status: partial, files: ["crates/kernel/src/capability.rs", "crates/kernel/src/automation.rs", "ferrum-app-edge:docs/flows.md"], tests: ["crates/kernel/tests/capability_it.rs"], limits: "Capabilities come from installed apps and each needs its own rights, so declaring one grants nothing (mutant capability-rights-ignored); mail is an administrator's. Solution packs, their reviewers and deployers come with W2 and W4; an automation still runs with its saver's administrator rights"}
  - {id: FLC-SEC-002, title: "Deny precedence", workstream: W1, status: partial, files: ["crates/kernel/src/customize.rs"], tests: ["crates/kernel/tests/customize_it.rs"], limits: "A customization that makes a packaged required field optional is suspended; rules, workflows and tenant logic are not compared yet"}
  - {id: FLC-SEC-003, title: "Secret handles", workstream: W1, status: partial, files: ["crates/kernel/src/secret.rs"], tests: ["crates/kernel/tests/secret_it.rs"], limits: "Connectors and plugins name secrets by reference; no solution source or run history exists yet to keep them out of"}
  - {id: FLC-SEC-004, title: "WASM budgets", workstream: W1, status: partial, files: ["crates/plugins/src/runtime.rs"], tests: ["crates/plugins/tests/platform_it.rs"], limits: "Plugins run under memory limits, epoch deadlines that count host calls, and a cap on host calls; no test here runs an endless guest beside a slow host call"}
  - {id: FLC-SEC-005, title: "Egress and SSRF", workstream: W1, status: partial, files: ["crates/plugins/src/host.rs", "crates/kernel/src/outbox.rs"], limits: "Plugin fetches and webhooks refuse private addresses, pin the vetted address and follow no redirects; logic capabilities with destinations do not exist yet"}
  - {id: FLC-SEC-006, title: "Cross-tenant caches", workstream: W1, status: partial, files: ["crates/studio/src/run.rs"], limits: "Studio computes every result for the viewer and keeps no shared result cache; logic plan and result caches do not exist yet"}
  - {id: FLC-SEC-007, title: "Diagnostic access", workstream: W1, status: partial, files: ["crates/kernel/src/support.rs"], tests: ["crates/kernel/tests/support_it.rs"], limits: "Support grants are graded, expire and list every request for the customer; there are no run traces yet to restrict"}
  - {id: FLC-SEC-008, title: "Fail-closed uncertainty", workstream: W1, status: partial, files: ["crates/kernel/src/jobs.rs"], limits: "Delayed work whose requester lost their rights fails closed; logic has no permission or evidence state yet"}
  # W2: compiler, pure rules and hook integration
  - {id: FLC-COMP-001, title: "Strict parsing", workstream: W2, status: partial, files: ["crates/studio/src/spec.rs", "crates/meta/src/types.rs"], limits: "Package YAML and Studio specs refuse unknown keys; duplicate JSON keys are not detected anywhere, and no solution source exists"}
  - {id: FLC-COMP-002, title: "Business types", workstream: W2, status: partial, files: ["crates/calc", "crates/kernel/src/value.rs"], limits: "Money and tax go through ferrum-calc decimals; expressions have no typed money, quantity or reference"}
  - {id: FLC-COMP-003, title: "Deterministic expressions", workstream: W2, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs", "crates/meta/src/expr.rs"], limits: "Edge flows evaluate purely in exact decimals; kernel CEL reads the wall clock when no time is supplied"}
  - {id: FLC-COMP-004, title: "Canonical identity", workstream: W2, status: partial, files: ["crates/logic/src/canonical.rs", "crates/logic/src/capability.rs"], tests: ["crates/logic/src/canonical.rs"], limits: "Cloud's canonical JSON is now the platform's (crates/logic), and capabilities and invocations are digested with it; logic definitions do not exist yet to hash"}
  - {id: FLC-COMP-005, title: "Dependency closure", workstream: W2, status: partial, files: ["ferrum-app-edge:contract/src/subflow.rs"], limits: "Edge copies a reviewed subflow in at check time and stops a flow whose subflow changed; nothing else resolves dependencies"}
  - {id: FLC-COMP-006, title: "Graph semantics", workstream: W2, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "Edge flows are checked for cycles and missing steps; process graphs do not exist"}
  - {id: FLC-COMP-007, title: "Bounded iteration", workstream: W2, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "An Edge flow cannot loop and bounds one message's work; processes with bounded loops do not exist"}
  - {id: FLC-COMP-008, title: "Effect typing", workstream: W2, status: partial, files: ["crates/plugins/src/host.rs"], tests: ["crates/plugins/tests/after_commit_it.rs"], limits: "Plugins are refused external calls inside hooks at run time; no compiler checks effects, and automations send mail from their transaction"}
  - {id: FLC-COMP-009, title: "Data-flow policy", workstream: W2, status: partial, files: ["crates/meta/src/types.rs"], limits: "Field masks and read permissions shape what a reader sees; messages, traces and destinations of tenant logic are not checked against them"}
  - {id: FLC-COMP-010, title: "Source maps", workstream: W2, status: partial, files: ["ferrum-app-edge:ui/src/FlowEditor.tsx"], limits: "Edge traces name the step a message reached; nothing maps logic runs to source revisions"}
  - {id: FLC-HOOK-001, title: "Phase ordering", workstream: W2, status: partial, files: ["crates/kernel/src/hooks.rs", "crates/kernel/src/doc.rs"], limits: "Native hooks run derive, validate, change checks and writes in order; tenant derivations have no stage of their own"}
  - {id: FLC-HOOK-002, title: "Pure hook boundary", workstream: W2, status: partial, files: ["crates/plugins/src/host.rs"], tests: ["crates/plugins/tests/after_commit_it.rs"], limits: "Enforced for plugins; an automation's e-mail action sends from inside its transaction"}
  - {id: FLC-HOOK-003, title: "Competing writes", workstream: W2, status: partial, files: ["crates/kernel/src/hooks.rs"], limits: "Hooks filling the same field must be ordered or the server does not start; apps have not declared fills yet, and tenant rules do not exist"}
  - {id: FLC-HOOK-004, title: "Bounded prefetch", workstream: W2, status: partial, files: ["crates/plugins/src/host.rs", "crates/plugins/src/runtime.rs"], limits: "A plugin's reads in a hook go through its declared permissions and a cap on host calls; tenant rules with declared prefetch do not exist"}
  - {id: FLC-HOOK-005, title: "Equivalent mutation paths", workstream: W2, status: partial, files: ["docs/registry/mutation-paths.md", "crates/kernel/src/bulk.rs"], limits: "The 96 direct writes were classified (FERRUM-PLATFORM-011); no single test sends one invalid record through every path"}
  - {id: FLC-HOOK-006, title: "After-commit durability", workstream: W2, status: partial, files: ["crates/kernel/src/outbox.rs"], tests: ["crates/kernel/tests/events_it.rs"], limits: "Events and queued mail commit with the change; an automation's e-mail does not"}
  - {id: FLC-HOOK-007, title: "Rejection evidence", workstream: W2, status: not_started, limits: "A refused change is counted, not recorded as evidence"}
  - {id: FLC-HOOK-008, title: "Event recursion", workstream: W2, status: partial, files: ["crates/kernel/src/automation.rs", "crates/kernel/src/outbox.rs"], limits: "Automations stop at depth 3 and events carry causation; there is no work budget per correlation across apps"}
  # W3: durable processes and human work
  - {id: FLC-PROC-001, title: "Idempotent starts", workstream: W3, status: partial, files: ["crates/kernel/src/saga.rs", "crates/kernel/src/jobs.rs"], tests: ["crates/kernel/tests/saga_it.rs"], limits: "A saga starts in the caller's transaction with a dedupe key; no process pins a release at acceptance"}
  - {id: FLC-PROC-002, title: "Native action receipts", workstream: W3, status: verified_software, files: ["crates/kernel/src/capability.rs", "crates/kernel/migrations/20261108000001_logic_effect.sql"], tests: ["crates/kernel/tests/capability_it.rs"], limits: "The receipt commits in the change's transaction: a repeat gets it, two racing get one change, a failure before the commit leaves neither (capability_it; mutants capability-no-receipt, capability-same-key-other-input). A database crash mid-commit is PostgreSQL's to keep atomic; receipts are not yet removed after their retention"}
  - {id: FLC-PROC-003, title: "External effect identity", workstream: W3, status: partial, files: ["crates/kernel/src/saga.rs"], tests: ["crates/kernel/tests/saga_it.rs"], limits: "A saga step runs under the same key on every attempt; no input digest is bound to it"}
  - {id: FLC-PROC-004, title: "Signal before wait", workstream: W3, status: not_started, limits: "Nothing waits for a signal"}
  - {id: FLC-PROC-005, title: "Signal spoofing", workstream: W3, status: not_started, limits: "Nothing receives process signals"}
  - {id: FLC-PROC-006, title: "Current authority", workstream: W3, status: partial, files: ["crates/kernel/src/jobs.rs", "crates/kernel/src/automation.rs"], tests: ["crates/kernel/tests/jobs_it.rs"], limits: "Jobs and automations recheck who they run as when they run; processes do not exist"}
  - {id: FLC-PROC-007, title: "Replay determinism", workstream: W3, status: not_started, limits: "No process runtime exists"}
  - {id: FLC-PROC-008, title: "Parallel race", workstream: W3, status: not_started, limits: "Sagas run one step at a time; nothing runs branches"}
  - {id: FLC-PROC-009, title: "Business rework", workstream: W3, status: partial, files: ["crates/kernel/src/doc.rs"], limits: "A record's workflow can move back between states of one status, without a limit on how often"}
  - {id: FLC-PROC-010, title: "Cancellation", workstream: W3, status: partial, files: ["crates/kernel/src/jobs.rs", "crates/kernel/src/saga.rs", "crates/ops-contract/src/command.rs"], limits: "Jobs and sagas separate a request to stop from stopping, and operational commands separate cancellation requested from cancelled; processes do not exist"}
  - {id: FLC-PROC-011, title: "Compensation failure", workstream: W3, status: partial, files: ["crates/kernel/src/saga.rs"], tests: ["crates/kernel/tests/saga_it.rs"], limits: "A saga whose undo fails says what a person must still undo; processes do not exist"}
  - {id: FLC-PROC-012, title: "Worker fencing", workstream: W3, status: partial, files: ["crates/kernel/src/jobs.rs"], tests: ["crates/kernel/tests/jobs_it.rs"], limits: "A job's lease token fences a worker that lost it; no process worker exists"}
  - {id: FLC-PROC-013, title: "History bounds", workstream: W3, status: not_started, limits: "No process history exists"}
  - {id: FLC-PROC-014, title: "Snapshot plus subscription", workstream: W3, status: not_started, limits: "Record pages update live; no run status stream exists, and the live updates were not reviewed against this case"}
  - {id: FLC-HUMAN-001, title: "Independent approval", workstream: W3, status: partial, files: ["crates/kernel/src/doc.rs", "crates/meta/src/types.rs"], tests: ["crates/kernel/tests/kernel_it.rs"], limits: "A workflow transition may refuse the record's creator whatever roles they hold; process tasks do not exist"}
  - {id: FLC-HUMAN-002, title: "Input-bound approval", workstream: W3, status: partial, files: ["crates/logic/src/approval.rs"], tests: ["crates/logic/src/approval.rs"], limits: "Approvals bound to a digest, by someone other than the requester, under a policy revision, are the platform's rules now (crates/logic/src/approval.rs); process tasks that use them come with W3, and a record's own approval is still bound to its version"}
  - {id: FLC-HUMAN-003, title: "Timeout race", workstream: W3, status: not_started, limits: "No task has a deadline"}
  - {id: FLC-HUMAN-004, title: "Delegation", workstream: W3, status: not_started, limits: "No task can be delegated"}
  - {id: FLC-HUMAN-005, title: "Calendar semantics", workstream: W3, status: partial, files: ["crates/kernel/src/tenant.rs"], limits: "Workspaces have a time zone; there is no versioned business calendar for deadlines"}
  - {id: FLC-HUMAN-006, title: "Task evidence", workstream: W3, status: not_started, limits: "No task exists to scope evidence to"}
  - {id: FLC-HUMAN-007, title: "Case work", workstream: W3, status: not_started, limits: "No discretionary case tasks exist"}
  - {id: FLC-HUMAN-008, title: "Manual disposition", workstream: W3, status: partial, files: ["crates/ops-contract/src/command.rs"], limits: "An operational command's unknown outcome is settled by evidence or a person; business effects have no disposition"}
  # W4: complete Studio product
  - {id: FLC-UI-001, title: "In-app authoring", workstream: W4, status: partial, files: ["ferrum-app-edge:ui/src/FlowEditor.tsx", "Ferrum-Frontend:src/app/Customize.tsx"], limits: "Edge flows, fields and rules are authored in the product; there is no solution, decision or process builder"}
  - {id: FLC-UI-002, title: "Single definition", workstream: W4, status: partial, files: ["Ferrum-Frontend:src/app/QueryInput.tsx"], limits: "Studio's builder and JSON edit one query spec; nothing else has synchronized views"}
  - {id: FLC-UI-003, title: "Typed inspector", workstream: W4, status: partial, files: ["ferrum-app-edge:ui/src/FlowEditor.tsx"], limits: "Edge's inspector shows a step's settings; no node shows permissions, effects, retries or completion"}
  - {id: FLC-UI-004, title: "Accessible outline", workstream: W4, status: partial, files: ["ferrum-app-edge:ui/src/FlowEditor.tsx", "Ferrum-Frontend:src/app/designer/Canvas.tsx"], limits: "Edge's canvas is reached by Tab and moved by arrow keys, and the form designer moves fields by menu; no linear outline exists for processes"}
  - {id: FLC-UI-005, title: "Semantic diff", workstream: W4, status: not_started, limits: "No release review exists"}
  - {id: FLC-UI-006, title: "Conflict handling", workstream: W4, status: partial, files: ["crates/kernel/src/doc.rs"], limits: "Records are saved against their version and a stale save is refused; drafts of logic do not exist"}
  - {id: FLC-UI-007, title: "Simulator parity", workstream: W4, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "Edge simulates with the code a gateway runs; nothing simulates processes"}
  - {id: FLC-UI-008, title: "Recovery console", workstream: W4, status: partial, files: ["crates/ops-contract/src/command.rs"], limits: "Operations shows unknown outcomes with a plain reason; nothing recovers business runs"}
  - {id: FLC-UI-009, title: "Localization", workstream: W4, status: partial, files: ["Ferrum-Frontend:src/app/Customize.tsx"], limits: "Interfaces carry Arabic and Hindi, right to left and workspace time zones; the builder does not exist"}
  - {id: FLC-UI-010, title: "Preview isolation", workstream: W4, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "A draft or simulated Edge flow reaches nothing; process simulation does not exist"}
  # W5: generic edge and event integration
  - {id: FLC-EDGE-001, title: "Authenticated observation", workstream: W5, status: partial, files: ["crates/ops/src/identity.rs"], tests: ["crates/ops/tests/ops_it.rs"], limits: "Devices and sites have identities held by the platform; pipeline v2 does not exist"}
  - {id: FLC-EDGE-002, title: "Normalization provenance", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/definitions.md"], limits: "Definitions describe what devices report; no checked unit and scale normalization keeps raw provenance"}
  - {id: FLC-EDGE-003, title: "Quality semantics", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "Flows hear only readings within quality limits and can ignore stale inputs; there are no quality classes"}
  - {id: FLC-EDGE-004, title: "State scope", workstream: W5, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "Each device is watched on its own; there is no limit on how many keys a flow's state may hold"}
  - {id: FLC-EDGE-005, title: "Atomic critical state", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "Platform flows apply a result with where they stand in one transaction; a gateway writes state every 15 seconds and may repeat an effect after a crash"}
  - {id: FLC-EDGE-006, title: "Event-time lateness", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "Platform flows hear closed minutes and say late gateway data is not heard; there are no watermarks"}
  - {id: FLC-EDGE-007, title: "Episode identity", workstream: W5, status: partial, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "Alarms are idempotent and notifications are rate-limited; there are no episodes"}
  - {id: FLC-EDGE-008, title: "Offline scope", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "A command asked for offline waits and expires; cached context and grant ages are not declared"}
  - {id: FLC-EDGE-009, title: "Distributed owner", workstream: W5, status: partial, files: ["crates/ops/src/connections.rs"], tests: ["crates/ops/tests/ops_it.rs"], limits: "Connections are fenced so an old one cannot revoke its replacement; pipeline owners do not exist"}
  - {id: FLC-EDGE-010, title: "State migration", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "A new revision starts with nothing remembered, said plainly; there is no drain or migration"}
  - {id: FLC-EDGE-011, title: "Backpressure", workstream: W5, status: partial, files: ["ferrum-app-edge:docs/flows.md"], limits: "Traces are disposable and dropped first; there is no evidence reserve under disk pressure"}
  - {id: FLC-EDGE-012, title: "Operational intent", workstream: W5, status: implemented_unverified, files: ["ferrum-app-edge:contract/src/flow.rs"], limits: "A flow has no step that moves equipment, only one that asks the ledger; this acceptance case was not run as written"}
  # W6: analytical semantics and engine reuse
  - {id: FLC-SEM-001, title: "Single semantic owner", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/metric.rs"], limits: "Metrics owns definitions, certification and lineage; no external model is imported yet"}
  - {id: FLC-SEM-002, title: "Grain and joins", workstream: W6, status: partial, files: ["crates/studio/src/query.rs"], limits: "Studio joins along links and child tables; nothing refuses a measure that fans out"}
  - {id: FLC-SEM-003, title: "Composed metrics", workstream: W6, status: not_started, limits: "Metrics has no ratios or series"}
  - {id: FLC-SEM-004, title: "Currency and time", workstream: W6, status: partial, files: ["crates/studio/src/spec.rs"], limits: "Exchange rates exist and Studio has relative dates; metrics do not convert currencies or follow fiscal calendars"}
  - {id: FLC-SEM-005, title: "Query authority", workstream: W6, status: partial, files: ["crates/studio/src/query.rs", "ferrum-app-metrics:src/metric.rs"], tests: ["crates/studio/tests/studio_it.rs"], limits: "Native queries apply every joined entity's row scope for the viewer; external sources do not exist"}
  - {id: FLC-SEM-006, title: "Query sandbox", workstream: W6, status: partial, files: ["crates/studio/src/query.rs", "crates/studio/src/run.rs"], limits: "Identifiers come from metadata, values are bound, aggregates are whitelisted, and queries run read-only under a timeout; no external engine exists"}
  - {id: FLC-SEM-007, title: "Result freshness", workstream: W6, status: not_started, limits: "Results carry no freshness, partial or approximate flags"}
  - {id: FLC-SEM-008, title: "Sharing and schedules", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/delivery.rs", "crates/studio/src/builder.rs"], limits: "Followed metrics are read with each follower's rights and shared dashboards compute for the viewer; exports and embeds are not reviewed against this case"}
  - {id: FLC-SEM-009, title: "Semantic change control", workstream: W6, status: partial, files: ["ferrum-app-metrics:src/metric.rs"], limits: "A changed certified definition returns to draft and kept values carry its fingerprint; analyses do not exist to bind"}
  - {id: FLC-SEM-010, title: "Engine interoperability", workstream: W6, status: not_started, limits: "No Wren or DataFusion adapter exists"}
  # W7: Intelligence experience and governed proposals
  - {id: FLC-AI-001, title: "Typed proposals", workstream: W7, status: partial, files: ["server/src/assistant.rs", "crates/mcp/src/lib.rs"], tests: ["server/tests/assistant_it.rs"], limits: "The assistant acts through typed tools as the person, with writes approved in the conversation; no process or query proposals exist"}
