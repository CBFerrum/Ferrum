# The Ferrum-only closure review of 9 November 2026 (FEO-*): 82 work packages, each with what this
# repository has done about it. A status is what the evidence supports (docs/closure/README.md); the
# package's text and acceptance case are in docs/closure/catalog.json.
requirements:
  - {id: FEO-001, title: "Persist Field Service rejection state across flushes", workstream: A, status: verified_software, classification: ["reproduced_defect"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["ferrum-app-field-service:ui/src/offline.ts", "ferrum-app-field-service:ui/src/held.ts", "ferrum-app-field-service:ui/src/useWork.ts", "ferrum-app-field-service:ui/src/Refused.tsx"], tests: ["ferrum-app-field-service:ui/src/offline.test.ts", "ferrum-app-field-service:tests/field_service_it.rs"], limits: "A refused step is kept with its reason and picture until the technician tries it again or discards it, and its job is not completed meanwhile, across reloads and from the job page alike: the review's case (a save refused, the next step cut off, a reload, the connection back) attempts the completion at f8e945c and does not now (offline.test.ts; Field Service 0.5.0, PR 6). The server checks completion itself (required tasks, signature, stock: field_service_it). Not walked on a phone against a running server (FEO-031)"}
  - {id: FEO-002, title: "Retain rejected offline evidence until disposition", workstream: A, status: verified_software, classification: ["source_flaw"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["ferrum-app-field-service:ui/src/offline.ts", "ferrum-app-field-service:ui/src/Refused.tsx"], tests: ["ferrum-app-field-service:ui/src/offline.test.ts"], limits: "A refused photo or signature stays on the phone with the step, its reason and when, in the store the lease sweep keeps for the person; it can be tried again, saved as a copy (the step as JSON and the picture) or discarded, which is confirmed and leaves a note on the job saying what and why (offline.test.ts). The confirmation is the kit's dialog, not exercised by a test; device storage limits and a person signed out of the device are as docs/offline.md says"}
  - {id: FEO-003, title: "Give offline mutations server-side operation receipts", workstream: A, status: verified_software, classification: ["source_flaw"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["crates/kernel/src/receipt.rs", "crates/kernel/src/doc.rs", "server/src/controllers/docs.rs", "crates/kernel/migrations/20261109000003_receipt_actor.sql", "ferrum-app-field-service:ui/src/held.ts", "ferrum-app-field-service:ui/src/offline.ts", "ferrum-app-field-service:packages/field_service/entities/service.yaml"], tests: ["crates/kernel/tests/receipts_it.rs", "ferrum-app-field-service:ui/src/held.test.ts", "ferrum-app-field-service:tests/field_service_it.rs"], limits: "Each step goes with its key, a change with a digest of its edits, and the server does it once and answers the same (receipts_it; mutants receipt-for-anyone, receipt-without-its-request, receipt-not-kept, receipts-gone-in-a-day). Rows carry the ref they were added under, so a resend finds them; pictures the job has are not uploaded again; one tab sends at a time (Web Locks). An expense sent twice under one key is added and counted once in Field Service's own suite. Two tabs racing were not run against a server; the receipt answers the second all the same"}
  - {id: FEO-004, title: "Fail closed on assistant policy lookup failures", workstream: A, status: verified_software, classification: ["reproduced_defect"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["server/src/assistant.rs", "crates/kernel/src/registry.rs", "crates/kernel/src/plans.rs"], tests: ["server/tests/assistant_it.rs", "server/tests/assistant_egress_it.rs", "crates/kernel/tests/signup_it.rs", "server/src/assistant.rs"], limits: "A policy that cannot be read is never the defaults: with nothing read before, the assistant is unavailable and no request reaches the model (assistant_it on a replica whose database is gone; mutant unread-policy-is-the-default restores the old behaviour and fails). The policy last read stands in for at most 300 seconds of an outage, never once the workspace's settings are known to have changed. A change of settings or plan is heard at once on every replica through the registry's notifications (mutants policy-change-unheard, plan-change-unheard); a replica whose listener is down reads again within 20 seconds. Intelligence's own reads are FEO-059 to FEO-062"}
  - {id: FEO-005, title: "Prevent retention starvation behind held or failed records", workstream: A, status: verified_software, classification: ["reproduced_defect"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["crates/kernel/src/retention.rs", "crates/kernel/migrations/20261109000001_retention_scan.sql", "crates/kernel/src/lib.rs"], tests: ["crates/kernel/tests/retention_it.rs"], limits: "Each rule keeps where its scan stopped: held records, records of people under a hold and records whose deletion fails are passed over and listed, the next run goes on behind them, a finished scan starts again, and a changed rule starts afresh (retention_it, with three records a day behind four held ones rather than 5,000 behind 5,000; mutants retention-starts-over-every-day, retention-ignores-held-people). A record whose deletion keeps failing is listed each time the scan reaches it; nothing escalates it beyond the rule's last result"}
  - {id: FEO-006, title: "Make duplicate merge and selected canonical-field changes atomic", workstream: A, status: verified_software, classification: ["documented_incomplete"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["crates/kernel/src/merge.rs", "server/src/controllers/docs.rs", "Ferrum-Frontend:src/app/list/MergeDialog.tsx", "Ferrum-Frontend:src/lib/merging.ts"], tests: ["crates/kernel/tests/merge_it.rs", "Ferrum-Frontend:src/lib/merging.test.ts"], limits: "A merge takes the values chosen to stay with the version they were chosen against and writes them in its own transaction: a merge that fails leaves none, a stale choice merges nothing, and the retried merge moves documents, submitted ones included, ledger rows and custom links (merge_it; mutant merge-forgets-the-chosen-values). The duplicate's records at providers follow the record that stays, and two in one stream go to a person as drift (mutant merge-leaves-provider-links). The web app's dialog sends the chosen values with the merge, in one call (merging.test.ts, Ferrum-Frontend PR 62). Not walked in a browser against a running server"}
  - {id: FEO-007, title: "Close held-data preservation paths", workstream: A, status: verified_software, classification: ["documented_incomplete"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["crates/kernel/src/privacy.rs", "crates/kernel/src/ddl.rs", "crates/kernel/src/recovery.rs", "crates/kernel/src/apps.rs", "crates/kernel/src/doc.rs", "crates/kernel/migrations/20261109000002_held_versions.sql"], tests: ["crates/kernel/tests/privacy_it.rs", "crates/kernel/tests/closure_it.rs", "crates/kernel/tests/retention_it.rs"], limits: "A held record changed by any path, an app's own SQL included, keeps the version it had, for administrators to read while the hold lasts; deleting it, removing its app with its data and deleting its workspace are refused until the hold is released, which is recorded (privacy_it, closure_it; mutants held-record-changed-without-a-trace, held-versions-outlive-the-hold, workspace-deleted-under-a-hold, app-removed-over-a-hold). A hold on a person keeps their records, under any address, from erasure, deletion, retention and an app's removal (mutants held-person-record-deleted, retention-ignores-held-people); their records' earlier versions are kept only under a hold placed on the record, and the database itself refuses only deletes of records placed under a hold"}
  - {id: FEO-008, title: "Do not treat unknown logistics weight as proof of safe load", workstream: A, status: verified_software, classification: ["reproduced_defect"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["ferrum-app-logistics:src/trips.rs", "ferrum-app-logistics:packages/logistics/entities/logistics.yaml", "ferrum-app-logistics:ui/src/Home.tsx"], tests: ["ferrum-app-logistics:tests/logistics_it.rs"], limits: "Goods whose item has no weight make the stop's and the trip's weight unknown, naming them; such a trip is not dispatched until its load is weighed and recorded (weight, where and how, who and when), and dispatch checks the vehicle against it while the stops are the ones weighed; a weighing lighter than the goods of known weight is refused, and drivers do not record one (logistics_it; with the old trips.rs the tiles read as known and the trip dispatches). Not walked in a browser; no weighbridge integration"}
  - {id: FEO-009, title: "Complete shared ownership of person, employee, party, payment and consent", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Publish owners and stable identifiers, effective-dated relationship models and mapping rules. The review saw: Core shared packages exist; the register still identifies employee, payment and consent ownership inconsistencies across apps."}
  - {id: FEO-010, title: "Adopt native invariant and hook contracts across applications", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Give hooks stable dependencies. The review saw: Hook ordering machinery exists but app declarations remain incomplete. Native write paths have a review inventory; not all engine updates move record versions."}
  - {id: FEO-011, title: "Use strong types at consequential boundaries", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Keep flexible document schemas but use checked domain types for money/currency, quantity/UOM, account, business date, tenant and operation identity at consequential APIs. The review saw: Money calculation uses decimal facilities while documents remain JSON-shaped and metadata-driven."}
  - {id: FEO-012, title: "Complete offboarding effects across apps", workstream: B, status: partial, classification: ["stale_evidence", "documented_incomplete"], levels: {mechanism: verified, adoption: partial, workflow: none, release: none}, files: ["crates/kernel/src/lifecycle.rs", "ferrum-app-drive:src/leaver.rs", "ferrum-app-helpdesk:packages/helpdesk/package.yaml", "server/src/assistant.rs"], tests: ["crates/kernel/tests/lifecycle_it.rs", "ferrum-app-drive:tests"], limits: "Rechecked on 9 November: the register's \"no app handles a departure\" was stale. The kernel ends sessions, keys and OAuth grants and moves assignments and every package's declared handover; Drive's leaver ends shares to them and gives their space and links to the successor (or stops the links); Helpdesk hands over open tickets, team membership and maintenance schedules; an assistant turn stops at its next step (FEO-059). Not yet: a process task delegated to the leaver personally, and one journey that offboards someone during a session, a queued notification, an open approval, a document share and a service case at once"}
  - {id: FEO-013, title: "Strengthen segregation of duties and sensitive reference disclosure", workstream: B, status: not_started, classification: ["product_boundary"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Provide a strict enterprise profile with separate emergency administration, transaction-level separation, explicit conflict remediation, protected linked titles and permission-aware snippets/counts. The review saw: Role pairs, maker-checker, field masks and reference policies exist, but admin exemptions, existing conflicting grants and sensitive-package adoption remain material boundaries."}
  - {id: FEO-014, title: "Qualify identity providers and key lifecycle", workstream: B, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-IDP-TENANT", "BLOCK-KMS"], limits: "Not started here: Test selected IdPs, certificate/key rotation, recovery and provider outage. The review saw: SAML was exercised with Keycloak; SCIM/OIDC against named commercial tenants are not established. OpenBao Transit exists; the remaining KMS modes and key paths are not all qualified."}
  - {id: FEO-015, title: "Unify purpose-aware consent and communication restrictions", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Keep lawful purposes distinct and require every automated send path to ask one authoritative decision at delivery time. The review saw: Campaigns has its own suppression; restriction-of-processing requires native delivery paths to call the shared contact decision."}
  - {id: FEO-016, title: "Complete personal-data discovery and derivative handling", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Inventory every sensitive source and derivative. The review saw: Personal-data declarations are incomplete; Comms transcripts and DAM people-by-name have gaps, and comments/free text remain outside reliable exact-person discovery."}
  - {id: FEO-017, title: "Finish shared jobs, dead letters and notifications", workstream: B, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Provide an operator exception queue, bounded retry/replay, tenant fairness for heavy native jobs, current recipient checks, schedule semantics and complete correlation across records/jobs/connectors. The review saw: Outbox and plugin fairness exist; app-specific maintenance/sending is uneven. Dead-letter operations are API-oriented; trace context across spawned work is incomplete."}
  - {id: FEO-018, title: "Independently verify accounting and selected jurisdiction output", workstream: C, status: blocked_external, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-TAX-REVIEW", "BLOCK-EINVOICE-PROVIDERS"], limits: "Not started here: Obtain accountant-owned expected outcomes for transaction, reversal, close, multi-currency, tax and statutory cases. The review saw: Finance and payroll have substantial code and limited independent fixtures, not comprehensive independent country qualification."}
  - {id: FEO-019, title: "Finish books, consolidation and intercompany scope", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Publish a precise supported accounting profile and implement the missing book-specific reports, eliminations and lifecycle operations needed by it. The review saw: Parallel books share AR/AP; some reports use common books. Consolidation has no investment/equity elimination with goodwill; intercompany mirroring does not cover all reciprocal/credit flows."}
  - {id: FEO-020, title: "Make stock posting and historical valuation semantics explicit", workstream: C, status: not_started, classification: ["product_boundary"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Keep an immutable-history profile or implement a separate controlled revaluation/reposting profile where needed. The review saw: Backdated stock is valued when posted without reposting later movements; this is a documented deliberate policy, not automatically an arithmetic defect."}
  - {id: FEO-021, title: "Complete procurement exceptions and supplier collaboration", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add supplier acknowledgments/revisions where promised, three-way match tolerances, partial receipt/quality rejection, invoice dispute and duplicate-number recovery into one workflow. The review saw: Native procure-to-pay has a browser walkthrough. Supplier portal acknowledgment and proposed delivery changes are missing; individual supporting scenarios are separate."}
  - {id: FEO-022, title: "Complete warehouse operations on the existing ERP stock owner", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add the selected warehouse’s reservation, pick/pack, substitute, packaging, shipping and recall workflows by extending the existing stock owner, not another inventory engine. The review saw: ERP/WMS reuse one balance; advanced picking, substitution, cartonization and carrier workflows remain limited."}
  - {id: FEO-023, title: "Finish manufacturing software independently of robot qualification", workstream: C, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Qualify native plan-to-produce with scrap, rework, alternate materials, subcontracting and actual costs. The review saw: BOMs, planning, execution, quality and genealogy exist. Discrete scope is stronger than batch/continuous, while equipment evidence is separate."}
  - {id: FEO-024, title: "Complete assets maintenance and accounting lifecycle", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Expose those restrictions clearly; qualify split/merge/disposal, impairment/value adjustments, maintenance history and book-specific reporting needed by supported customers. The review saw: Assets supports depreciation and separate book values with restrictions around split assets and changed values."}
  - {id: FEO-025, title: "Qualify CRM-to-cash exceptions rather than rebuild CRM", workstream: C, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Complete revision, discount authority, duplicate-party, expiration, partial fulfillment, cancelled sale, credit exposure and renewal boundaries across CRM and ERP. The review saw: Leads, opportunities, quotations, approvals, attribution and product rules exist; lead-to-cash was walked in a browser."}
  - {id: FEO-026, title: "Resolve offline POS stock and recovery policy", workstream: C, status: verified_software, classification: ["documented_incomplete"], levels: {mechanism: verified, adoption: verified, workflow: built, release: none}, acceptance: ran_in_software, files: ["ferrum-app-pos:src/invoice.rs", "ferrum-app-pos:src/shortfall.rs", "ferrum-app-pos:packages/pos/entities/pos.yaml", "ferrum-app-pos:ui/src/Till.tsx"], tests: ["ferrum-app-pos:tests/pos_it.rs"], blockers: ["BLOCK-POS-HARDWARE"], limits: "Two tills offline sell the last packet: the second sale arrives and, by the register's declared policy (Record and reconcile, the default), is recorded, the warehouse shows what left it and a Stock Shortfall says how much was not there until a manager marks it put right and says how; Refuse refuses it as online; sent again, nothing is recorded twice (pos_it; with the old invoice.rs the second sale is refused). Stock is not preallocated to tills, a till offline shows no stock levels, price books are not signed, and device identity is the signed-in cashier at a register"}
  - {id: FEO-027, title: "Complete payment lifecycle across Commerce and business apps", workstream: C, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-PAYMENT-KEYS"], limits: "Not started here: Qualify payment authorization/capture/failure/refund/dispute and reconciliation, including amount/currency checks, delayed/repeated webhooks and unknown outcomes. The review saw: Native storefront-to-return has manual/test-provider evidence. Provider gateways are not qualified against real approved accounts."}
  - {id: FEO-028, title: "Finish subscription lifecycle for the promised offering", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Implement recurring collection, dunning, changes/proration and entitlement rules where promised, or explicitly support invoice-renewal subscriptions. The review saw: Commerce renewals are customer-paid requests, not stored-card recurring collection; portal plan changes and own renewal messages are limited. Revenue plans are flat interval prices."}
  - {id: FEO-029, title: "Make approved project changes and resource planning operational", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Bind approved baselines/change orders to budget/date effects and resource calendars using actual work schedules, leave, holidays and allocations. The review saw: Projects’ approved changes do not move dates or budgets; capacity is a fixed 40-hour week. Programs/portfolio-wide capacity are not complete."}
  - {id: FEO-030, title: "Define Helpdesk entitlement enforcement and collision UX", workstream: C, status: not_started, classification: ["product_boundary"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Choose explicit entitlement policies with auditable overrides. The review saw: Concurrent saves conflict but agents do not see live typing; service entitlements currently inform rather than refuse."}
  - {id: FEO-031, title: "Qualify complete Field Service mobile work", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: After queue repairs, complete offline day/work-order startup, map integration, parts/expenses, customer proof and exception reconciliation on real supported mobile browsers. The review saw: Native field-to-invoice works in a walkthrough; cold-start offline browser evidence is incomplete and queue defects were identified."}
  - {id: FEO-032, title: "Close Bookings payment and calendar conflict gaps", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-PAYMENT-KEYS"], limits: "Not started here: Define consistent booking/deposit semantics, material calendar conflict handling, recurring paid appointments and cancellation/no-show policies. The review saw: Deposits/refunds and inbound iCalendar polling exist. Staff/guest payment paths differ; paid recurring series and conflicts introduced by later external calendar updates remain limited."}
  - {id: FEO-033, title: "Complete HR and payroll by explicit jurisdiction", workstream: C, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-PAYROLL-REVIEW"], limits: "Not started here: Finish a jurisdiction’s effective-date rules, payroll adjustments, final settlement, statutory reports and bank acknowledgment/reconciliation before claiming support. The review saw: Payroll, bank files, expenses and separation work exist; statutory outputs/bank acceptance and comprehensive independent fixtures are not established."}
  - {id: FEO-034, title: "Integrate training, leave, approver delegation and renewals", workstream: C, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Use shared calendars and explicit expiring delegation. The review saw: Training exists without certificate-expiry reminders. Logic lacks standing leave substitutes; schedules and capacity are not consistently shared."}
  - {id: FEO-035, title: "Qualify Docs, Sheets, Slides, PDF and Drive compatibility", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Build a representative compatibility corpus, declare unsupported formats/features, and qualify collaborative concurrency, recovery, formula precision and export round trips. The review saw: Drive already exposes Sheets, Slides and PDF; Docs has collaborative editing, imports/exports and comments. Full replacement fidelity is not established by those features alone."}
  - {id: FEO-036, title: "Define and enforce Drive share/link ownership lifecycle", workstream: E, status: partial, classification: ["stale_evidence", "product_boundary"], levels: {mechanism: verified, adoption: verified, workflow: partial, release: none}, files: ["ferrum-app-drive:src/leaver.rs", "ferrum-app-drive:src/sharing.rs"], tests: ["ferrum-app-drive:tests"], limits: "Rechecked on 9 November: links do not outlive their maker by default. When the maker leaves, their links go to the successor, or stop unless the workspace keeps such links (Drive Settings). Not yet: marking a link as the organization's own, apart from its maker, with an approved owner, and an access review listing what happened to each link on a departure"}
  - {id: FEO-037, title: "Finish Comms as an operated collaboration workflow", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Qualify live calls/recording/transcription, processing disclosure, retention and deletion; complete mail deliverability/transport configuration checks and mobile/reconnect behavior. The review saw: Mail/chat/calendar/meetings exist. Browser captions may use browser-vendor processing; real call/egress recording evidence and transcript erasure remain incomplete."}
  - {id: FEO-038, title: "Bind contract wording, review and signed artifact", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Generate the signing artifact from the approved revision or require an explicit equivalence review bound to its exact hash. The review saw: Contracts has approved clauses and Sign integration, but its PDF is attached separately instead of generated from those clauses."}
  - {id: FEO-039, title: "Complete signature profiles without conflating audit trails and qualified signatures", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-SIGNING-PROVIDER", "BLOCK-LEGAL-REVIEW"], limits: "Not started here: Publish separate evidence levels. The review saw: Sign implements electronic signature routing and sealed audit evidence, not PAdES/qualified provider signatures."}
  - {id: FEO-040, title: "Complete Forms and CMS composition using existing modules", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Integrate existing Forms, DAM/Drive, translations and review workflows into the CMS rather than adding separate engines. The review saw: Forms lacks form-content localization; Website has Markdown pages but limited themes/navigation/media/form composition."}
  - {id: FEO-041, title: "Finish marketing and social channel lifecycle", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-CONNECTOR-SANDBOXES"], limits: "Not started here: Qualify a selected channel cohort and capability matrix, provider consent/scopes, review, rate limits, corrections and reporting; advertise unsupported formats honestly. The review saw: Campaign consent is local; Social supports limited Mastodon/Bluesky adapters against stand-ins, with major channel adapters and richer formats incomplete."}
  - {id: FEO-042, title: "Complete intranet, DAM and unified portal task experience", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add shared resource pickers, appropriate new-member publication policy, subject/release linkage and audience-aware portal navigation. The review saw: Intranet requires raw Drive folder IDs; DAM people-by-name privacy and rendition/watermark limits remain; portal menus show unrelated app pages."}
  - {id: FEO-043, title: "Connect ITSM, CMDB and Assets without duplicating ownership", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Qualify supported discovery tools and reconciliation; add incident business calendars/pauses, linked customer tickets and multiple-approver changes where needed. The review saw: CMDB discovery intake and asset linkage exist; native network scanning is intentionally external. Incident targets and change governance remain limited."}
  - {id: FEO-044, title: "Make GRC evidence and objective metrics authoritative", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add consented evidence collection from identity, finance and operations; tie objectives to governed definitions; distinguish technical evidence from external certification. The review saw: GRC has risks/controls/policies but no complete framework/assessment/evidence collection. Objectives can use certified metrics but lacks program-level capacity."}
  - {id: FEO-045, title: "Finish the hospitality operating cycle", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-HOSPITALITY-CHANNELS"], limits: "Not started here: Complete direct reservations, housekeeping/room readiness, deposits and unified folio charging; qualify channel integrations independently. The review saw: Rooms/stays/folios/night audit exist. Channels, booking deposits, groups/allotments, housekeeping and POS-to-folio integration are incomplete."}
  - {id: FEO-046, title: "Finish restaurant service and stock workflows", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add menu modifiers, kitchen routing, split/merge/check settlement and recipe consumption on existing stock/payment owners. The review saw: Kitchen tickets and billing exist, but modifiers, split bills, tips, tableside payments, recipe stock and delivery integrations are limited."}
  - {id: FEO-047, title: "Complete education administration and family experience", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Connect admission, family consent, fee schedule, learning and academic reporting with scoped guardian access. The review saw: Admissions, enrollment, fees, timetable, attendance and grading exist. Online applications, parent portal, report cards and bulk fee schedules remain incomplete."}
  - {id: FEO-048, title: "Finish healthcare administration without silently expanding into clinical software", workstream: G, status: not_started, classification: ["product_boundary"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Complete the chosen administrative profile and data safeguards. The review saw: The supported application is administrative: appointments, consent and billing. Patient portal/reminders/online booking/insurance are not complete; clinical care is outside established scope."}
  - {id: FEO-049, title: "Finish construction commercial control", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Connect contracts, quantities, commitments, claims, costs and agreed retention to ERP/Projects. The review saw: Estimates, variations, claims and retention exist. Subcontractor claims, measured quantities, retention caps/splits and actual-cost comparison are incomplete."}
  - {id: FEO-050, title: "Complete property accounting reconciliation", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Connect approved payable/expense evidence, explicit apportionment rules and owner statement/reconciliation. The review saw: Leases, rent reviews/indexing, service charges, deposits and portals already have substantial implementation. Owner expenses are not consistently sourced from ERP; allocation is floor-area-only."}
  - {id: FEO-051, title: "Complete nonprofit fund and donation workflows", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Model restricted/designated funds with actual accounting dimensions or accounts, grant restrictions and receipt rules; reuse Commerce and ERP. The review saw: Donations, grants, memberships and volunteers exist. Restricted-fund ledger accounting, recurring/online giving and tax receipts are not established."}
  - {id: FEO-052, title: "Finish government case lifecycle and disclosure policy", workstream: G, status: not_started, classification: ["product_boundary"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Implement the promised appeal/escalation and payment experience where missing; classify public register fields and retention by approved policy. The review saw: Citizen permits, review stages, renewals and public register exist. Public disclosure and jurisdiction profiles require explicit validation."}
  - {id: FEO-053, title: "Complete logistics routing and driver evidence", workstream: G, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-MAPS-KEY"], limits: "Not started here: Integrate a selected routing provider and supported mobile profile, retain delivery evidence, publish realistic route/load semantics and reconcile collection returns. The review saw: Routing is straight-line/window sorting, not road-time optimization. Warm offline evidence exists; cold launch and real maps/telematics remain unqualified."}
  - {id: FEO-054, title: "Qualify Edge and industrial operations per device and site", workstream: G, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-INDUSTRIAL-HARDWARE", "BLOCK-INDUSTRIAL-VENDORS", "BLOCK-INDUSTRIAL-SAFETY", "BLOCK-INDUSTRIAL-SECURITY"], limits: "Not started here: Keep Ferrum supervisory. The review saw: Many protocol adapters, command ledger and simulated equipment tests exist; protocol support does not establish vendor-device or physical safety qualification."}
  - {id: FEO-055, title: "Finish no-code authoring of supported rules and structured steps", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Provide typed visual controls for all advertised business-author features, with explicit advanced-source mode for unsupported constructs; keep lossless round-tripping. The review saw: Guided/diagram/source views share one definition, but decision tables, rules and structured-step settings still need source editing."}
  - {id: FEO-056, title: "Complete customization conflict and release lifecycle", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Version and diff every customization type; provide test-workspace promotion, dependency checks, migration plans for open work and reversible activation where semantically possible. The review saw: Field/property conflict checks exist; older overrides lack baselines and rules/workflows/print templates are not all compared."}
  - {id: FEO-057, title: "Finish native process packs and recovery roles", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Package native procurement, return, onboarding, contract and quality workflows on the existing capability owner; add scoped recovery roles and explicit handover. The review saw: Logic has strong reference profiles and receipts. Some race/compensation evidence is state-machine-level; recovery is admin-centric and routine substitute handling limited."}
  - {id: FEO-058, title: "Qualify production Full Process without requiring cloud work", workstream: D, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Publish and exercise a supported self-hosted durable-runtime topology, worker bounds, authentication, history replay, backup/reconciliation and version upgrades. The review saw: Temporal reference evidence includes development-layout operation; full runtime TLS/availability/backup and sustained capacity are not established by those walks."}
  - {id: FEO-059, title: "Reauthorize each AI disclosure and effect", workstream: D, status: verified_software, classification: ["reproduced_defect"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["server/src/assistant.rs", "crates/kernel/src/shell.rs"], tests: ["server/tests/assistant_boundaries_it.rs", "server/tests/assistant_it.rs"], limits: "Before every call to the model, every retry and every tool, the person (signed in at the same session version, active, with the same rights) and the workspace's policy are read again; a change stops the turn there and the calls left are answered as not run (assistant_boundaries_it: a role taken away between rounds, the assistant turned off during a retry; mutants turn-trusts-its-start, retry-without-asking). A change of a role's grants that leaves the person's roles as they were is used by the next call, not treated as a stop"}
  - {id: FEO-060, title: "Reconstruct authorized historical AI context", workstream: D, status: verified_software, classification: ["source_flaw"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["server/src/assistant.rs"], tests: ["server/tests/assistant_boundaries_it.rs", "server/tests/assistant_it.rs"], limits: "A new turn sends the person's earlier words, never earlier calls, results or page context, and an earlier answer only while every record and kind of record it drew on is still readable, as narrowed for the provider, and only to the destination it went to under the same egress policy (each answer records both); otherwise a line says it was left out (assistant_boundaries_it: access taken away and given back, another destination; mutants earlier-answers-always-sent, earlier-results-sent-again). Answers drawn from tools that name no record (an app's) are kept while destination and policy are unchanged; conversations from before this change send earlier answers no more, having no record of either"}
  - {id: FEO-061, title: "Use trusted capability semantics and full input validation", workstream: D, status: verified_software, classification: ["source_flaw"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["server/src/assistant.rs"], tests: ["server/tests/assistant_boundaries_it.rs", "server/src/assistant.rs"], limits: "A call runs without asking only if this server lists the tool as a read, or its capability's definition only reads, or its action is declared read-only (the kernel runs those in a read-only transaction); a tool's own readOnlyHint counts for nothing (mutant tool-says-it-reads). Inputs are checked at every depth before anything runs: types with null only where allowed, required and unknown fields, enumerations, bounds, lengths, uuid and date formats (inputs_are_checked_at_every_depth; mutants null-for-any-type, nested-inputs-unchecked). A call refused for its input keeps its place, so its result goes back with the others. Schemas' patterns and $ref are not used by the tools and not checked"}
  - {id: FEO-062, title: "Reserve AI budgets and enforce output disclosure policy", workstream: D, status: verified_software, classification: ["source_flaw"], levels: {mechanism: verified, adoption: verified, workflow: verified, release: none}, acceptance: ran_in_software, files: ["server/src/assistant.rs", "crates/kernel/migrations/20261109000004_assistant_reservation.sql"], tests: ["server/tests/assistant_boundaries_it.rs", "server/src/assistant.rs"], limits: "Each call holds back its input and its most output from the month's allowance under one lock per workspace, its answer capped at what is left; with less than 1,024 tokens to answer with it is not made, and what it held is let go once its use is recorded (assistant_boundaries_it: a second turn while the first is in flight finds nothing left; mutant allowance-not-held). A Ferrum API key, a provider's key or a private key in an answer is streamed, shown and kept as [withheld], also when cut across streamed pieces (mutants keys-streamed-as-written, answers-kept-unredacted). The input is reckoned at a third of the request's bytes, not by the provider's tokenizer; other kinds of secret are not recognized"}
  - {id: FEO-063, title: "Implement governed database-backed skills and memory lifecycle", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Build versioned skill releases, separate grants, approved knowledge sources, provenance/ACL/freshness, candidate lessons and derived-index deletion using existing identity/events/Logic. The review saw: The visible reference has app guidance, conversations, trigram retrieval and approved phrase-to-metric examples, not the complete prior skills/memory target."}
  - {id: FEO-064, title: "Evaluate real model usefulness and safety on business tasks", workstream: D, status: blocked_external, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-MODEL-KEY"], limits: "Not started here: Use a provider key and controlled budget for held-out business, ambiguity, multilingual, injection, refusal and failure cases. The review saw: Scripted adversarial and grounded-answer tests exist; the cited reference does not establish successful evaluation against a real permitted model."}
  - {id: FEO-065, title: "Use certified metrics across dashboards and operational objectives", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Make dashboard cards, objectives, scheduled reports and AI bind to the same semantic revision, currency, period/grain and viewer scope. The review saw: Metrics is governed and supports native ratios/series. The broad register still describes Studio dashboards querying independently rather than using certified definitions."}
  - {id: FEO-066, title: "Complete governed external analytics and dataset extraction", workstream: D, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Add source onboarding/freshness/partition contracts, required external series and reproducible export pagination/checkpoints. The review saw: External Metrics uses Wren/DataFusion over configured CSV/Parquet files; external series/remote pushdown are absent in the cited reference, and full dataset export is capped."}
  - {id: FEO-067, title: "Complete user-delegated OAuth and connector resource controls", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-CONNECTOR-SANDBOXES"], limits: "Not started here: Add consented delegated OAuth, refresh rotation/revocation, provider-account budgets, capability-specific deletion semantics, by-reference media and per-connection destinations. The review saw: Connector brokerage supports client credentials, not full authorization-code/refresh-token lifecycle; deletion propagation, shared provider quotas, media streaming and connection egress are incomplete."}
  - {id: FEO-068, title: "Qualify a workflow-driven connector cohort", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-CONNECTOR-SANDBOXES"], limits: "Not started here: Choose required payment, identity, productivity, shipping and accounting connectors based on supported customer journeys. The review saw: Provider adapters exist but current register distinguishes stand-ins from real approved sandboxes."}
  - {id: FEO-069, title: "Publish the SDK and certify extension lifecycle", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-NPM-PUBLISH"], limits: "Not started here: Publish reproducible versioned packages, templates, API/event contracts, compatibility tests and private/local registry paths for self-hosters. The review saw: Scaffolding/pack/sign tooling exists but packages still depend on frontend checkouts, and supported compatibility commitments are not in force."}
  - {id: FEO-070, title: "Complete optional app-store purchases, renewals and settlement", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-PAYMENT-KEYS"], limits: "Not started here: Finish customer challenge recovery, invoices/refunds/disputes and publisher settlement only for the commercial store scope; do not block free/internal Ferrum on this optional service. The review saw: The app store has purchase/license flows, but required card challenges are refused, payouts are manual and invoicing/tax/proration coverage is limited. This is distinct from Commerce subscriptions."}
  - {id: FEO-071, title: "Review licenses, provenance and third-party obligations per artifact", workstream: E, status: blocked_external, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-LEGAL-REVIEW"], limits: "Not started here: Maintain SBOM/provenance, exact copied/adapted source history, notices and release obligations; obtain qualified review of SDK/plugin distribution terms. The review saw: The registry has dependency/license inventories and unresolved artifact legal review, not a final legal determination for every distribution."}
  - {id: FEO-072, title: "Add task-based onboarding, shared inboxes and exception workbenches", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Provide industry setup, task help, useful empty states, cross-app navigation, unified approvals/tasks and recovery queues; use capabilities to tailor portal and launcher content. The review saw: The suite provides metadata-driven pages and multiple native interfaces, but complete role-oriented operating experiences are not established by entity counts."}
  - {id: FEO-073, title: "Turn browser walks into repeatable product acceptance suites", workstream: E, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Automate ordinary-role happy/negative paths against the exact image; cover permissions, time zones, mobile, reconnect, upgrade and recovery. The review saw: Many valuable manual browser walks exist, but standing cross-app browser regression coverage is incomplete."}
  - {id: FEO-074, title: "Complete human accessibility and localization qualification", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-ACCESSIBILITY-AUDIT"], limits: "Not started here: Run real assistive-technology task sessions and native-language review; translate domain metadata and content separately; validate numbers/dates, mixed-direction text and complex controls. The review saw: Current Logic includes keyboard/axe/virtual screen-reader evidence and fixes, but no human assistive-technology user review. Arabic/Hindi and RTL exist with unreviewed translations and metadata gaps."}
  - {id: FEO-075, title: "Qualify cold-start offline, device retention and recovery", workstream: E, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Test actual supported browsers/devices, durable pending data, session changes, clock expiry, storage eviction and background synchronization. The review saw: Lease-based caches and offline work exist, but several cold-start/service-worker/mobile paths were not exercised in the embedded browser used for walkthroughs."}
  - {id: FEO-076, title: "Provide reconciled migration and customer exit kits", workstream: F, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Build source mapping, staged validation, attachments/identity imports, opening balances, stock valuation, open documents, delta cutover and reconciliation with repeatable rollback/exit. The review saw: Generic import/export and compatibility paths do not by themselves establish a complete business migration."}
  - {id: FEO-077, title: "Exercise clean install and disconnected product profiles", workstream: F, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Run clean-host and actual no-internet installations with exact dependency artifacts, certificate setup, mail/storage/scan/engine checks and actionable doctor output. The review saw: Compose/Kubernetes/offline bundle tooling exists; preflight is partly syntax-checked and a real disconnected install is not established by stand-ins."}
  - {id: FEO-078, title: "Qualify whole-tenant restoration and current policy replay", workstream: F, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Restore records, ledgers, files, customizations, keys, process history and integration cursors into isolation; apply current holds/revocations/deletions before releasing effects. The review saw: Individual database, process and local deployment restore evidence exists; full business state and external effects must be tested together for each supported profile."}
  - {id: FEO-079, title: "Finish observability, capacity and realistic soak testing", workstream: F, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Instrument correlated operations without sensitive data, define profile SLOs, run mixed noisy-tenant/large-dataset/end-of-period workloads and verify alerts with operator response. The review saw: Request traces/basic metrics and CI workloads exist; complete DB/job/provider spans and business workload sizing are not established."}
  - {id: FEO-080, title: "Exercise upgrades and artifact-based release governance", workstream: F, status: not_started, classification: ["qualification_gap"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, limits: "Not started here: Build once, qualify exact artifacts, require review/checks, publish compatibility/deprecation windows and test previous-to-current upgrades including backfills and schema boundaries. The review saw: Release evidence and promotion machinery exist; broad registry statements saying workflows never ran are stale. Customizations and open processes complicate safe upgrades."}
  - {id: FEO-081, title: "Make maintenance and support independently operable", workstream: F, status: not_started, classification: ["documented_incomplete"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, blockers: ["BLOCK-LTS-SUPPORT"], limits: "Not started here: Add a second capable maintainer, role-specific runbooks, vulnerability handling and an explicit supported-version commitment. The review saw: The new Logic maintenance document names one owner for its profiles, with no second owner and no funded LTS commitment. Ownership is present, not absent."}
  - {id: FEO-082, title: "Reconcile stale limits and overlapping requirement registers", workstream: A, status: partial, classification: ["stale_evidence"], levels: {mechanism: partial, adoption: none, workflow: none, release: none}, files: ["docs/registry/feo.yaml", "docs/closure/catalog.json", "scripts/registry.py"], tests: ["scripts/registry.py"], limits: "The 82 packages are tracked here with what each claims and why, checked by scripts/registry.py like the other programs. Corrected so far: six Logic Platform limits that still said parallel steps, subprocesses, process data flow, source maps and replay were to come (FLC-CAP-003, FLC-COMP-005, 006, 009, 010, FLC-PROC-007), each against the code; the hold, retention, merge, assistant and receipt rows changed by FEO-003 to 007. Other registers' stale limits are corrected as each package is worked; their overlap is not yet resolved into one owner per claim"}
