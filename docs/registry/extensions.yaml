  - {id: FERRUM-EXT-009, title: "Monetization: plans, purchases, payouts, refunds, taxes", status: partial, basis: tested, repositories: [CBFerrum/ferrum-store], spec: "12.5", deps: [FERRUM-EXT-008], files: ["ferrum-store:src/billing.rs", "ferrum-store:src/stripe.rs", "ferrum-store:migrations/20261104000001_billing.sql", "ferrum-store:migrations/20261104000002_cards.sql", "ferrum-store:templates/app.html", "ferrum-store:README.md", server/src/appmgr.rs, server/src/controllers/apps.rs, crates/kernel/migrations/20261104000003_app_licence.sql], tests: ["ferrum-store:tests/store.rs", server/tests/apps_api.rs], external: [BLOCK-PAYMENT-KEYS], limits: ["Plans by verified publishers who name who supports the app; purchases for a workspace with the buyer's country's tax; licences the store signs; renewals with a week of grace, tried again daily; cancelling at the end of a period; refunds within 14 days; disputes answered by the publisher and decided by an administrator; payouts net of tax and a 15% commission once past the refund window, a later refund coming off the next", "Stripe as the payment provider (ferrum-store src/stripe.rs): a buyer saves a card on Stripe's own page (Checkout in setup mode) and Stripe's signed webhook says which; purchases and renewals charge it off-session with the store's key as Idempotency-Key, tried again with it when Stripe cannot be reached or fails; a payment not taken at once is cancelled and the purchase refused; a refused renewal is tried the next day with a new key; refunds; a card taken off at Stripe and forgotten. Tested against a stand-in speaking the parts of Stripe's API the store uses, not Stripe itself, which needs the operator's account (BLOCK-PAYMENT-KEYS)", "A bank asking the buyer to confirm a charge (strong customer authentication) refuses it, since there is no page to confirm it on; payouts are worked out and marked paid by an administrator, not sent through Stripe Connect", "Prices exclusive of tax at one rate per country; no reverse charge, tax identifiers, invoices or proration", "A sold app installs or upgrades only with a live licence for this workspace: an administrator gives it (PUT /api/admin/apps/{id}/licence), the App Manager keeps it once the store's signature, the app and one of the workspace's own hosts check out, asks the store again at each installation, and re-reads every licence with the revocation list; a lapse shows in GET /api/admin/apps/licences and leaves what is installed as it is. In the pages: bought on the app's page in the store, Your purchases with its licence, cancelling, the money back and disputes, publishers' answers and administrators' decisions; the install plan lists the sold apps and their licences, and the App Manager's install dialog asks for the licence (Ferrum-Frontend PR 21). Walked in a browser with a store on this machine and its test provider: bought, installed with its licence, cancelled, disputed, answered, refunded (evidence/browser-2026-11-04-flows.md)"]}
