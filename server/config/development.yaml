# Development configuration. Every value can be overridden with environment variables.
logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  host: <%= get_env(name="PUBLIC_URL", default="http://localhost") %>
  middlewares:
    # Unknown routes get a plain 404, never Loco's demo page.
    fallback:
      enable: false
    limit_payload:
      enable: true
      body_limit: 30mb
    timeout_request:
      enable: true
      timeout: 120000
    compression:
      enable: true
    cors:
      enable: true
      allow_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
      allow_headers: ["*"]
      allow_methods: ["*"]
      max_age: 3600

workers:
  mode: BackgroundAsync

mailer:
  stub: true

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://ferrum:ferrum@localhost:5432/ferrum_dev") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 600000
  min_connections: 1
  max_connections: 2
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET", default="ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5YWJjZGVm") %>
    expiration: 43200

settings:
  default_workspace: "<%= get_env(name="FERRUM_DEFAULT_WORKSPACE", default="") %>"
  ui_dir: "<%= get_env(name="FERRUM_UI_DIR", default="") %>"
  session_days: <%= get_env(name="FERRUM_SESSION_DAYS", default="14") %>
  ui_source: "<%= get_env(name="FERRUM_UI_SOURCE", default="") %>"
  apps_base: "<%= get_env(name="FERRUM_APPS_BASE", default="") %>"
  base_domain: "<%= get_env(name="FERRUM_BASE_DOMAIN", default="") %>"
  region: "<%= get_env(name="FERRUM_REGION", default="") %>"
  regions: "<%= get_env(name="FERRUM_REGIONS", default="") %>"
  packages_dir: <%= get_env(name="FERRUM_PACKAGES_DIR", default="../packages") %>
  db_max_connections: <%= get_env(name="FERRUM_DB_MAX_CONNECTIONS", default="20") %>
  bootstrap_token: <%= get_env(name="FERRUM_BOOTSTRAP_TOKEN", default="dev-bootstrap-token") %>
  webhooks_allow_private: true
  sso_allow_private: true
  run_background: true
  files_dir: <%= get_env(name="FERRUM_FILES_DIR", default="../storage") %>
  s3_bucket: "<%= get_env(name="FERRUM_S3_BUCKET", default="") %>"
  s3_region: "<%= get_env(name="FERRUM_S3_REGION", default="") %>"
  s3_endpoint: "<%= get_env(name="FERRUM_S3_ENDPOINT", default="") %>"
  require_object_storage: false
  secret_key: "<%= get_env(name="FERRUM_SECRET_KEY", default="") %>"
  apps:
    # App stores (comma-separated base URLs) and the keys whose signatures this server trusts
    # (comma-separated store:<base64> / publisher:<base64>). Uploads: off | private | cluster.
    registries: "<%= get_env(name="FERRUM_APP_STORES", default="") %>"
    trusted_keys: "<%= get_env(name="FERRUM_APP_TRUSTED_KEYS", default="") %>"
    uploads: <%= get_env(name="FERRUM_APP_UPLOADS", default="cluster") %>
    allow_unsigned_uploads: <%= get_env(name="FERRUM_APP_ALLOW_UNSIGNED", default="true") %>
