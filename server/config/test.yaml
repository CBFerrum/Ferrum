logger:
  enable: true
  level: warn
  format: compact

server:
  port: 5160
  binding: 127.0.0.1
  host: http://localhost
  middlewares:
    # Unknown routes get a plain 404, never Loco's demo page.
    fallback:
      enable: false
    limit_payload:
      enable: true
      body_limit: 30mb
    # As production: a test that asks the way a browser does (Accept-Encoding) gets what a browser gets.
    compression:
      enable: true

workers:
  mode: ForegroundBlocking

mailer:
  stub: true

auth:
  jwt:
    secret: dGVzdC1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expiration: 3600

settings:
  database_url: "<%= get_env(name="DATABASE_URL", default="postgres://ferrum:ferrum@localhost:5432/ferrum_test") %>"
  default_workspace: "<%= get_env(name="FERRUM_DEFAULT_WORKSPACE", default="") %>"
  ui_dir: "<%= get_env(name="FERRUM_UI_DIR", default="") %>"
  session_days: <%= get_env(name="FERRUM_SESSION_DAYS", default="14") %>
  ui_source: "<%= get_env(name="FERRUM_UI_SOURCE", default="") %>"
  apps_base: "<%= get_env(name="FERRUM_APPS_BASE", default="") %>"
  base_domain: "<%= get_env(name="FERRUM_BASE_DOMAIN", default="") %>"
  accounts_host: "<%= get_env(name="FERRUM_ACCOUNTS_HOST", default="") %>"
  hooks_host: "<%= get_env(name="FERRUM_HOOKS_HOST", default="") %>"
  passkey_rp: "<%= get_env(name="FERRUM_PASSKEY_RP", default="") %>"
  link_host: "<%= get_env(name="FERRUM_LINK_HOST", default="") %>"
  region: "<%= get_env(name="FERRUM_REGION", default="") %>"
  regions: "<%= get_env(name="FERRUM_REGIONS", default="") %>"
  dev_ui: <%= get_env(name="FERRUM_DEV_UI", default="false") %>
  push_services: "<%= get_env(name="FERRUM_PUSH_SERVICES", default="") %>"
  push_contact: "<%= get_env(name="FERRUM_PUSH_CONTACT", default="") %>"
  # Zones (docs/operations.md, "Zones"). FERRUM_ZONES is JSON (single quotes cannot be in it).
  zones: '<%= get_env(name="FERRUM_ZONES", default="") %>'
  zone: "<%= get_env(name="FERRUM_ZONE", default="") %>"
  zone_default: "<%= get_env(name="FERRUM_ZONE_DEFAULT", default="") %>"
  zone_mode: "<%= get_env(name="FERRUM_ZONE_MODE", default="") %>"
  # Sending the audit log elsewhere (docs/operations.md). Empty: nothing is sent.
  audit_sink_url: "<%= get_env(name="FERRUM_AUDIT_SINK_URL", default="") %>"
  audit_sink_secret: "<%= get_env(name="FERRUM_AUDIT_SINK_SECRET", default="") %>"
  packages_dir: <%= get_env(name="FERRUM_PACKAGES_DIR", default="../packages") %>
  db_max_connections: 10
  database_direct_url: "<%= get_env(name="FERRUM_DATABASE_DIRECT_URL", default="") %>"
  database_read_url: "<%= get_env(name="FERRUM_DATABASE_READ_URL", default="") %>"
  database_direct_host: "<%= get_env(name="FERRUM_DATABASE_DIRECT_HOST", default="") %>"
  database_read_host: "<%= get_env(name="FERRUM_DATABASE_READ_HOST", default="") %>"
  database_read_max_lag_secs: <%= get_env(name="FERRUM_DATABASE_READ_MAX_LAG_SECS", default="10") %>
  bootstrap_token: test-bootstrap-token
  operator_token: "<%= get_env(name="FERRUM_OPERATOR_TOKEN", default="") %>"
  webhooks_allow_private: true
  sso_allow_private: true
  run_background: false
  files_dir: <%= get_env(name="FERRUM_FILES_DIR", default="../target/test-storage") %>
  host_leaving_days: <%= get_env(name="FERRUM_HOST_LEAVING_DAYS", default="14") %>
  # How a domain of a workspace's own is proven: points, or record (its DNS record as well). Empty: record with a
  # base domain, points without (docs/operations.md, "Custom domains").
  domain_proof: "<%= get_env(name="FERRUM_DOMAIN_PROOF", default="") %>"
  # The DNS servers asked for that record, comma-separated addresses. Empty: the system's.
  dns_resolvers: "<%= get_env(name="FERRUM_DNS_RESOLVERS", default="") %>"
