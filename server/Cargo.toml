[package]
name = "ferrum-server"
description = "Ferrum HTTP API (Loco on Axum): REST, OpenAPI, ERPNext compatibility, background workers"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ferrum"

[[bin]]
name = "ferrum"
path = "src/bin/main.rs"

[features]
# Native apps compiled into this server (all official ones by default; docs/plan/apps.md). Most live
# in their own repositories; a workspace whose installed app is not in a build keeps its data and
# loses the app until it is back.
default = ["crm", "projects", "helpdesk", "pos", "commerce"]
crm = ["dep:ferrum-app-crm"]
projects = ["dep:ferrum-app-projects"]
helpdesk = ["dep:ferrum-app-helpdesk"]
pos = ["dep:ferrum-app-pos"]
commerce = ["dep:ferrum-app-commerce"]

[dependencies]
ferrum-kernel = { path = "../crates/kernel" }
ferrum-meta = { path = "../crates/meta" }
ferrum-domain = { path = "../crates/domain" }
ferrum-plugins = { path = "../crates/plugins" }
ferrum-mcp = { path = "../crates/mcp" }
ferrum-app-crm = { git = "https://github.com/CBFerrum/ferrum-app-crm", branch = "main", optional = true }
ferrum-app-projects = { git = "https://github.com/CBFerrum/ferrum-app-projects", branch = "main", optional = true }
ferrum-app-helpdesk = { git = "https://github.com/CBFerrum/ferrum-app-helpdesk", branch = "main", optional = true }
ferrum-app-pos = { git = "https://github.com/CBFerrum/ferrum-app-pos", branch = "main", optional = true }
ferrum-app-commerce = { git = "https://github.com/CBFerrum/ferrum-app-commerce", branch = "main", optional = true }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
migration = { path = "migration", package = "ferrum-migration" }
loco-rs = { version = "1.2", default-features = false, features = ["auth", "cli", "with-db", "cache_inmem", "worker", "storage_aws_s3"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
dashmap = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bytes = "1"
# Loco builds OpenDAL without an HTTP client; S3 storage needs one installed.
opendal = { version = "0.58", default-features = false, features = ["http-transport-reqwest"] }

[dev-dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["auth", "cli", "with-db", "cache_inmem", "worker", "testing"] }
serial_test = "3"

[lints]
workspace = true
