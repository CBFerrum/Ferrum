# ERP as an app of its own, with its interface at /erp/ (docs/plan/apps-ui.md §13). Its packages
# bring the customers, suppliers and items other apps share (parties, products) and add their ERP
# fields to them. Recorded as installed in every workspace that has accounting; India is its add-on.
id: erp
name: ERP
version: 0.1.0
publisher: cbferrum
summary: Accounting, selling, buying, stock and manufacturing
categories: [finance, inventory, manufacturing]
runtime: native
platform: ">=0.3.1, <0.4"
packages: [accounting, inventory, buying, selling, manufacturing]
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: erp
      route: erp
      title: ERP
      description: Accounting, selling, buying, stock and manufacturing
      color: "#2f5bea"
      roles: [Accounts Manager, Accounts User, Sales Manager, Sales User, Purchase Manager, Purchase User, Stock Manager, Stock User, Manufacturing Manager, Manufacturing User]
  shell.open:
    - {id: core, package: core, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: parties, package: parties, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: products, package: products, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: accounting, package: accounting, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: selling, package: selling, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: buying, package: buying, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: inventory, package: inventory, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
    - {id: manufacturing, package: manufacturing, path: "erp/e/{entity}/{id}", list: "erp/e/{entity}"}
