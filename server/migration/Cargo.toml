[package]
name = "ferrum-migration"
description = "Loco migrator hook; Ferrum's schema is owned by the kernel's SQL migrations and package metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["with-db"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }

[lints]
workspace = true
