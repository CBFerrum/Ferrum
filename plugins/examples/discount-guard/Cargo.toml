# Example Ferrum plugin. Build:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
# Install (as an administrator):
#   curl -X POST $FERRUM/api/admin/plugins -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
#     -d "{\"name\":\"discount-guard\",\"hooks\":[{\"entity\":\"SalesInvoice\",\"stage\":\"validate\"},{\"entity\":\"SalesOrder\",\"stage\":\"validate\"}],
#          \"wasm_base64\":\"$(base64 < target/wasm32-unknown-unknown/release/discount_guard.wasm | tr -d '\n')\"}"
[package]
name = "discount-guard"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

# Not part of the server workspace.
[workspace]
