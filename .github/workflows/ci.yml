name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      FERRUM_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_test
      FERRUM_DOMAIN_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_domain_test
      FERRUM_MCP_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_mcp_test
      FERRUM_PLUGINS_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_plugins_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The application role must not be a superuser: superusers bypass row-level security.
      - name: Create the application role and test databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role ferrum login password 'ferrum';
          create database ferrum_test owner ferrum;
          create database ferrum_domain_test owner ferrum;
          create database ferrum_mcp_test owner ferrum;
          create database ferrum_plugins_test owner ferrum;
          create database ferrum_procurement_test owner ferrum;
          create database ferrum_stock_ops_test owner ferrum;
          create database ferrum_finance_test owner ferrum;
          create database ferrum_mfg_ops_test owner ferrum;
          create database ferrum_studio_test owner ferrum;
          create database ferrum_apps_api_test owner ferrum;
          SQL
      # An S3-compatible endpoint for the object storage test.
      - name: Start an S3 emulator
        run: |
          python3 -m pip install --quiet "moto[s3]" flask flask-cors boto3
          nohup moto_server -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:9000/ > /dev/null && break; sleep 1; done
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test python3 -c "import boto3; boto3.client('s3', endpoint_url='http://localhost:9000', region_name='us-east-1').create_bucket(Bucket='ferrum-ci')"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          FERRUM_TEST_S3_ENDPOINT: http://localhost:9000
          FERRUM_TEST_S3_BUCKET: ferrum-ci
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec advisories
        run: cargo install cargo-audit --locked && cargo audit

  image:
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/cbferrum/ferrum:${{ github.sha }}
            ghcr.io/cbferrum/ferrum:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
