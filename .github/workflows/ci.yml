name: ci

on:
  push:
    branches: [main]
    # Documentation alone needs no build (and would cancel one in progress).
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; on main every run that starts finishes, so each
  # candidate pushed is either promoted or fails a check, and none is left half-tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      FERRUM_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_test
      FERRUM_TEST_SUPERUSER: postgres://postgres:postgres@localhost:5432
      FERRUM_MCP_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_mcp_test
      FERRUM_PLUGINS_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_plugins_test
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile's Rust: a new stable's lints must not fail unrelated changes. Bump both together.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The application role must not be a superuser: superusers bypass row-level security.
      # A backup and restore are part of the tests, and pg_dump refuses a server newer than itself.
      - name: PostgreSQL 17's tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Create the application role and test databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role ferrum login password 'ferrum';
          create database ferrum_test owner ferrum;
          create database ferrum_mcp_test owner ferrum;
          create database ferrum_plugins_test owner ferrum;
          create database ferrum_plugin_resources_test owner ferrum;
          create database ferrum_restore_test owner ferrum;
          create database ferrum_witness_test owner ferrum;
          create database ferrum_app_resources_test owner ferrum;
          create database ferrum_studio_test owner ferrum;
          create database ferrum_apps_api_test owner ferrum;
          create database ferrum_sso_test owner ferrum;
          create database ferrum_coedit_test owner ferrum;
          create database ferrum_assistant_test owner ferrum;
          create database ferrum_journeys_test owner ferrum;
          create database ferrum_ops_test owner ferrum;
          create database ferrum_saga_test owner ferrum;
          SQL
      # An S3-compatible endpoint for the object storage test.
      - name: Start an S3 emulator
        run: |
          python3 -m pip install --quiet "moto[s3]" flask flask-cors boto3
          nohup moto_server -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:9000/ > /dev/null && break; sleep 1; done
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test python3 -c "import boto3; boto3.client('s3', endpoint_url='http://localhost:9000', region_name='us-east-1').create_bucket(Bucket='ferrum-ci')"
      # The secret key through a key-management service (crates/kernel/tests/kms_it.rs): OpenBao's
      # Transit engine, from its release by digest.
      - name: OpenBao
        run: |
          curl -fsSL -o openbao.tar.gz https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz
          echo "0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243  openbao.tar.gz" | sha256sum -c
          tar -xzf openbao.tar.gz bao && sudo install -m 755 bao /usr/local/bin/bao
          nohup bao server -dev -dev-root-token-id=ferrum-ci-root -dev-listen-address=127.0.0.1:8200 > openbao.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8200/v1/sys/health > /dev/null && exit 0; sleep 1; done; cat openbao.log; exit 1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          FERRUM_KMS_TEST_TRANSIT: http://127.0.0.1:8200
          FERRUM_KMS_TEST_TOKEN: ferrum-ci-root
          FERRUM_TEST_S3_ENDPOINT: http://localhost:9000
          FERRUM_TEST_S3_BUCKET: ferrum-ci
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  # SAML, whose signatures xmlsec1 checks (crates/saml), is a feature the job above does not build:
  # its own tests, the sign-in round trip through the kernel, and a sign-in on Keycloak's login page,
  # a real identity provider signing with another implementation (Apache Santuario). The real
  # software the kernel's tests otherwise stand in for runs here too: ClamAV for the upload scanner.
  saml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      FERRUM_SAML_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_saml_test
      FERRUM_SAML_KEYCLOAK: http://localhost:8180
      FERRUM_TEST_DATABASE_URL: postgres://ferrum:ferrum@localhost:5432/ferrum_test
      FERRUM_TEST_CLAMD: localhost:3310
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: saml
      - name: xmlsec1, libxml2 and libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-dev libxmlsec1-dev libclang-dev pkg-config
      - name: Keycloak
        run: |
          docker run -d --name keycloak -p 8180:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.8.1 start-dev
      # With its signatures in the image; it loads them while the tests build.
      - name: ClamAV
        run: docker run -d --name clamav -p 3310:3310 -e CLAMAV_NO_FRESHCLAMD=true -e CLAMAV_NO_MILTERD=true clamav/clamav:1.4.3
      - name: The application role and test database
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role ferrum login password 'ferrum';
          create database ferrum_saml_test owner ferrum;
          create database ferrum_test owner ferrum;
          SQL
      - run: cargo clippy -p ferrum-saml -p ferrum-kernel --features ferrum-saml/xmlsec,ferrum-kernel/saml --all-targets --locked -- -D warnings
      - run: cargo test -p ferrum-saml --features xmlsec --locked
      - name: Keycloak is up
        run: for i in $(seq 1 90); do curl -fs http://localhost:8180/realms/master > /dev/null && exit 0; sleep 2; done; docker logs keycloak; exit 1
      - run: cargo test -p ferrum-kernel --features saml --locked --test saml_it --test saml_keycloak_it --test scan_it

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec advisories
        run: cargo install cargo-audit --locked && cargo audit
      # Every accepted advisory has an owner, a reason and a review date (scripts/registry.py).
      - name: Requirements registry, accepted advisories and generated documents
        run: python3 -m pip install --quiet pyyaml && python3 scripts/registry.py check && python3 scripts/test_registry.py && python3 scripts/test_manifests.py && python3 scripts/mutants.py --check && python3 scripts/test_baseline.py && python3 scripts/test_mutation_paths.py && python3 scripts/test_builder_inventory.py
      # The Helm chart renders what deploy/k8s renders (same resources, same environment variables).
      - name: Helm chart against deploy/k8s
        run: bash deploy/helm/test.sh
      # The tools that carry a release to a site without internet (docs/operations.md), against stand-ins.
      - name: Offline bundles
        run: python3 deploy/offline/test_offline.py
      - name: Licenses of everything compiled in
        run: python3 scripts/licenses.py check
      # What every app gives that a program can see (docs/app-contract.md), in the apps the lock takes.
      - name: Every app compiled in meets the app contract
        run: python3 scripts/check_apps.py
      # Every statement an app runs on an entity table outside the document pipeline is in the
      # review with a kind (docs/registry/mutation-paths.md, FEO-010).
      - name: Direct writes reviewed
        run: python3 scripts/mutation_paths.py

  # The editor server for Drive's browser editors (deploy/editors, docs/plan/browser-editors.md):
  # built from the pinned editor builds, exercised in Chromium, Firefox and WebKit as the cluster
  # runs it (read-only, no capabilities), then pushed as a candidate for `promote`.
  editors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/editors
          load: true
          tags: ferrum-editors:ci
          cache-from: type=gha,scope=editors
          cache-to: type=gha,scope=editors,mode=max
      - name: Browser tests
        working-directory: deploy/editors/test
        run: |
          docker run -d --name editors -p 8090:8080 -e FERRUM_PUBLIC_URL=http://127.0.0.1:8091 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges ferrum-editors:ci
          mkdir -p site && python3 fixtures.py site
          python3 -m http.server 8091 --bind 127.0.0.1 -d site > /dev/null 2>&1 &
          npm i --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y -q xvfb libgl1-mesa-dri > /dev/null
          for i in $(seq 30); do curl -fs http://127.0.0.1:8090/healthz && break; sleep 1; done
          xvfb-run -a node relay.test.mjs
      - if: failure()
        run: docker logs editors
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image that was tested goes up as a candidate, not a new build of it. `promote` tags it.
      - if: github.event_name == 'push'
        id: candidate
        run: |
          candidate="ghcr.io/cbferrum/ferrum-editors:candidate-$GITHUB_SHA"
          docker tag ferrum-editors:ci "$candidate"
          docker push "$candidate"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$candidate")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      # What this build is made of, with its image and this run, kept with the run.
      - if: github.event_name == 'push'
        run: python3 -m pip install --quiet pyyaml && python3 scripts/release_evidence.py evidence --image "${{ steps.candidate.outputs.digest }}" > release-evidence.json
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence.json

  image:
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: ferrum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Pull requests from forks get no registry token: their smoke test starts on the new image.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is deployed with the Compose stack and exercised before it is published, as an
      # upgrade of the last published one.
      - name: Deploy and check the image
        run: |
          python3 -m pip install --quiet httpx
          # The browser editors' server beside the stack (the editors job tests it in browsers).
          docker buildx build --load -q -t ferrum-editors:ci deploy/editors
          # The meeting server too (LiveKit), as deploy/meet.yml runs it.
          FERRUM_IMAGE=ferrum:ci FERRUM_PREVIOUS_IMAGE=ghcr.io/cbferrum/ferrum:latest \
            FERRUM_EDITORS_IMAGE=ferrum-editors:ci SMOKE_MEET=1 deploy/smoke.sh
      - if: github.event_name == 'push'
        id: candidate
        run: |
          candidate="ghcr.io/cbferrum/ferrum:candidate-$GITHUB_SHA"
          docker tag ferrum:ci "$candidate"
          docker push "$candidate"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$candidate")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

  # A commit's release is the exact images that passed every job above, named by digest: nothing is
  # built here. Its SBOM and provenance are attested, and it gets the commit's tag. `latest` moves
  # only after the cluster qualification (cluster.yml).
  promote:
    if: github.event_name == 'push'
    needs: [rust, audit, editors, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SERVER: ghcr.io/cbferrum/ferrum
      SERVER_DIGEST: ${{ needs.image.outputs.digest }}
      EDITORS: ghcr.io/cbferrum/ferrum-editors
      EDITORS_DIGEST: ${{ needs.editors.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.SERVER }}@${{ env.SERVER_DIGEST }}
          format: spdx-json
          output-file: ferrum.spdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.SERVER }}
          subject-digest: ${{ env.SERVER_DIGEST }}
          sbom-path: ferrum.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SERVER }}
          subject-digest: ${{ env.SERVER_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.EDITORS }}
          subject-digest: ${{ env.EDITORS_DIGEST }}
          push-to-registry: true
      - name: Tag the commit's release
        run: |
          # Without --prefer-index=false a new index wraps the image, under a digest nothing attested.
          docker buildx imagetools create --prefer-index=false -t "$SERVER:$GITHUB_SHA" "$SERVER@$SERVER_DIGEST"
          docker buildx imagetools create --prefer-index=false -t "$EDITORS:$GITHUB_SHA" "$EDITORS@$EDITORS_DIGEST"
