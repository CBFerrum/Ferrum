- name: JournalEntryAccount
  label: Journal Entry Line
  kind: child
  fields:
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true}
    - {name: party_type, type: select, options: [Customer, Supplier], in_list: true}
    - {name: customer, type: link, to: Customer, visible_if: "doc.party_type == 'Customer'", required_if: "doc.party_type == 'Customer'", in_list: true}
    - {name: supplier, type: link, to: Supplier, visible_if: "doc.party_type == 'Supplier'", required_if: "doc.party_type == 'Supplier'", in_list: true}
    - {name: debit, type: currency, min: "0", default: 0, in_list: true}
    - {name: credit, type: currency, min: "0", default: 0, in_list: true}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {is_group: false}}
    - {name: project, type: link, to: Project}
    - {name: remarks, type: data}
  rules:
    - {name: one_side, check: "(doc.debit > 0.0) != (doc.credit > 0.0)", message: "Each line needs either a debit or a credit"}

- name: JournalEntry
  label: Journal Entry
  label_plural: Journal Entries
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  numbering: {template: "JV-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_list: true, in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: entry_type, type: select, options: [Journal Entry, Opening Entry, Adjustment, Depreciation, Exchange Revaluation], default: Journal Entry, in_filter: true}
    - {name: currency, type: link, to: Currency, fetch_from: company.default_currency, read_only: true}
    - {name: accounts, type: table, of: JournalEntryAccount, required: true}
    - {name: total_debit, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: total_credit, type: currency, currency: currency, read_only: true}
    - {name: remark, type: text}
  rules:
    - {name: balanced, check: "doc.total_debit == doc.total_credit", message: "Total debit must equal total credit", on: submit}
    - {name: not_empty, check: "doc.total_debit > 0.0", message: "The entry has no amounts", on: submit}
  list: {columns: [number, posting_date, entry_type, total_debit], sort: posting_date desc}

- name: PaymentReference
  label: Payment Allocation
  kind: child
  fields:
    - {name: invoice_type, type: select, options: [Sales Invoice, Purchase Invoice], required: true, in_list: true}
    - {name: invoice, type: data, required: true, label: Invoice ID}
    - {name: invoice_number, type: data, read_only: true, in_list: true}
    - {name: due_date, type: date, read_only: true, in_list: true}
    - {name: outstanding, type: currency, read_only: true, in_list: true}
    - {name: allocated_amount, type: currency, required: true, min: "0", in_list: true}

- name: PaymentEntry
  label: Payment Entry
  label_plural: Payment Entries
  kind: document
  module: accounting
  submittable: true
  company_scoped: true
  numbering: {template: "PAY-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  title_field: party_name
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: payment_type, type: select, options: [Receive, Pay], required: true, default: Receive, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, visible_if: "doc.payment_type == 'Receive'", required_if: "doc.payment_type == 'Receive'", in_filter: true}
    - {name: supplier, type: link, to: Supplier, visible_if: "doc.payment_type == 'Pay'", required_if: "doc.payment_type == 'Pay'", in_filter: true}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: party_account, type: link, to: Account, read_only: true}
    - {name: bank_account, type: link, to: Account, required: true, link_filters: {is_group: false}, label: Bank / Cash Account}
    - {name: currency, type: link, to: Currency, required: true, in_list: true}
    - {name: exchange_rate, type: decimal, default: 1, min: "0.000000001", description: Payment currency → company currency}
    - {name: paid_amount, type: currency, currency: currency, required: true, min: "0", in_list: true}
    - {name: base_paid_amount, type: currency, read_only: true}
    - {name: unallocated_amount, type: currency, currency: currency, read_only: true}
    - {name: exchange_difference, type: currency, read_only: true}
    - {name: reference_no, type: data, label: Cheque / Reference No}
    - {name: reference_date, type: date}
    - {name: references, type: table, of: PaymentReference, label: Allocations}
    - {name: remarks, type: text}
  rules:
    - {name: positive, check: "doc.paid_amount > 0.0", message: "Paid amount must be greater than zero", on: submit}
  actions:
    - {name: get_outstanding_invoices, label: Get Outstanding Invoices, docstatus: [0], permission: write}
  list: {columns: [number, posting_date, payment_type, party_name, paid_amount], sort: posting_date desc}
