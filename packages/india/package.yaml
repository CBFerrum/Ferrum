package: india
version: 0.1.0
label: India Compliance
description: GSTIN validation (checksum), place of supply, automatic CGST+SGST vs IGST selection, HSN on lines, e-invoice/e-way bill fields.
depends: [selling, buying]
field_prefix: in_

overlays:
  - entity: Company
    ops:
      - {op: add_field, after: tax_id, field: {name: in_gstin, type: data, label: GSTIN, max_length: 15}}
      - {op: add_field, after: in_gstin, field: {name: in_state_code, type: data, label: GST State Code, max_length: 2}}
  - entity: Customer
    ops:
      - {op: add_field, after: tax_id, field: {name: in_gstin, type: data, label: GSTIN, max_length: 15}}
      - {op: add_field, after: in_gstin, field: {name: in_gst_category, type: select, label: GST Category, options: [Registered, Unregistered, Consumer, Overseas, SEZ], default: Unregistered}}
      - {op: add_field, after: in_gst_category, field: {name: in_state_code, type: data, label: GST State Code, max_length: 2}}
  - entity: Supplier
    ops:
      - {op: add_field, after: tax_id, field: {name: in_gstin, type: data, label: GSTIN, max_length: 15}}
      - {op: add_field, after: in_gstin, field: {name: in_gst_category, type: select, label: GST Category, options: [Registered, Unregistered, Overseas, SEZ], default: Registered}}
      - {op: add_field, after: in_gst_category, field: {name: in_state_code, type: data, label: GST State Code, max_length: 2}}
  - entity: TaxTemplate
    ops:
      - {op: add_field, after: kind, field: {name: in_supply_type, type: select, label: GST Supply Type, options: [Intra-State, Inter-State, Export, Exempt]}}
  - entity: SalesInvoice
    ops:
      - {op: add_field, after: customer_name, field: {name: in_place_of_supply, type: data, label: Place of Supply (State Code), max_length: 2}}
      - {op: add_field, after: in_place_of_supply, field: {name: in_irn, type: data, label: e-Invoice IRN, read_only: true}}
      - {op: add_field, after: in_irn, field: {name: in_ewaybill_no, type: data, label: e-Way Bill No}}
  - entity: PurchaseInvoice
    ops:
      - {op: add_field, after: supplier_name, field: {name: in_place_of_supply, type: data, label: Place of Supply (State Code), max_length: 2}}
      - {op: add_field, after: in_place_of_supply, field: {name: in_reverse_charge, type: check, label: Reverse Charge}}
