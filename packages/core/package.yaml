package: core
version: 0.3.0
label: Core
description: What every app needs — companies, currencies with their exchange rates, units, letter heads and print settings.

# The platform's own wording for people outside the workspace (docs/builder/decisions.md BD-22, BD-23): a workspace
# edits each like any message template.
messages:
  - key: core.comment_shared
    label: Staff shared a comment with someone outside
    channels: [email, inapp]
    values: [record, comment]
    languages:
      en:
        email:
          subject: "A new note on {{ values.record }}"
          body: "<p>There is a new note for you on {{ values.record }}:</p><blockquote>{{ values.comment }}</blockquote>"
        inapp:
          title: "A new note on {{ values.record }}"
          text: "{{ values.comment }}"
  - key: core.link_page
    label: The page a signed action link opens
    values: [record, kind]
    languages:
      en:
        inapp:
          title: "{{ values.kind }} {{ values.record }}"
          text: "Choose what to do below."
  - key: core.link_done
    label: What a signed action link says once used
    languages:
      en:
        inapp:
          title: "Thank you"
          text: "We have recorded your answer."
  - key: core.link_gone
    label: What a link that no longer works says
    languages:
      en:
        inapp:
          title: "This link does not work any more"
          text: "It may have expired, been used already or been withdrawn. Ask whoever sent it for a new one."
  - key: core.link_code
    label: The one-time code a signed action link asks for
    values: [code, record, kind]
    languages:
      en:
        email:
          subject: "Your code: {{ values.code }}"
          body: "<p>Your code is <strong>{{ values.code }}</strong>. It works for ten minutes.</p>"
        text:
          text: "Your code is {{ values.code }}. It works for ten minutes."
        inapp:
          title: "Enter the code we sent you"
          text: "Send me a code"
  - key: core.new_device
    label: A sign-in from a device the person has not used before
    channels: [email]
    values: [time, address, browser, devices]
    languages:
      en:
        email:
          subject: "A new sign-in to your account"
          body: "<p>Your account was signed in to at {{ values.time }} from a device it had not been used on before.</p><p>Address: {{ values.address }}<br>Browser: {{ values.browser }}</p><p>If this was you, there is nothing to do. If it was not, sign that device out from your signed-in devices ({{ values.devices }}) and change your password.</p>"

seed:
  - entity: Currency
    key: [code]
    records:
      - {code: INR, currency_name: Indian Rupee, symbol: "₹", precision: 2}
      - {code: USD, currency_name: US Dollar, symbol: "$", precision: 2}
      - {code: EUR, currency_name: Euro, symbol: "€", precision: 2}
      - {code: GBP, currency_name: Pound Sterling, symbol: "£", precision: 2}
      - {code: AED, currency_name: UAE Dirham, symbol: "AED", precision: 2}
      - {code: SGD, currency_name: Singapore Dollar, symbol: "S$", precision: 2}
      - {code: JPY, currency_name: Japanese Yen, symbol: "¥", precision: 0}
      - {code: KWD, currency_name: Kuwaiti Dinar, symbol: "KD", precision: 3}
      - {code: CNY, currency_name: Chinese Yuan, symbol: "¥", precision: 2}
  - entity: Uom
    key: [uom_name]
    records:
      - {uom_name: Nos, whole_number: true}
      - {uom_name: Unit, whole_number: true}
      - {uom_name: Box, whole_number: true}
      - {uom_name: Set, whole_number: true}
      - {uom_name: Kg, whole_number: false}
      - {uom_name: Gram, whole_number: false}
      - {uom_name: Meter, whole_number: false}
      - {uom_name: Litre, whole_number: false}
      - {uom_name: Hour, whole_number: false}
