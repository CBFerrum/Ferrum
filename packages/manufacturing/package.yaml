package: manufacturing
version: 0.1.0
label: Manufacturing
description: Multi-level bills of materials with revisions, work orders with actual costing, and an MRP run that proposes purchases and production.
depends: [inventory, accounting, buying, selling]
field_prefix: mfg_

overlays:
  - entity: StockEntry
    ops:
      - {op: add_options, field: purpose, options: [Manufacture]}
      - {op: add_field, after: purpose, field: {name: mfg_work_order, type: link, to: WorkOrder, label: Work Order, read_only: true, visible_if: "doc.purpose == 'Manufacture'", in_filter: true}}
      - {op: add_field, after: mfg_work_order, field: {name: mfg_additional_cost, type: currency, label: Additional Cost, min: "0", visible_if: "doc.purpose == 'Manufacture'", description: Operating cost added to the finished goods value}}
  - entity: StockEntryItem
    ops:
      - {op: add_field, field: {name: mfg_is_finished_item, type: check, label: Finished Item, read_only: true}}

modules:
  - name: manufacturing
    label: Manufacturing
    icon: factory
    order: 60
    items: [Bom, WorkOrder, MrpRun, Item, report:stock_balance]

roles:
  - name: Manufacturing Manager
    permissions:
      - {entity: Bom, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: WorkOrder, read: true, write: true, create: true, delete: true, submit: true, cancel: true}
      - {entity: MrpRun, read: true, write: true, create: true, delete: true}
      - {entity: Item, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Company, read: true}
      - {entity: Uom, read: true}
      - {entity: PurchaseOrder, read: true, create: true, write: true}
      - {entity: Supplier, read: true}
  - name: Manufacturing User
    permissions:
      - {entity: Bom, read: true}
      - {entity: WorkOrder, read: true, write: true, create: true, submit: true}
      - {entity: Item, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Company, read: true}
