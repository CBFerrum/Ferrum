package: mfg_ops
version: 0.1.0
label: Manufacturing Operations
description: Workstations, operations, routings, job cards, production planning and subcontracting
depends: [manufacturing, buying, selling]
field_prefix: mfo_

overlays:
  - entity: Bom
    ops:
      - {op: add_field, after: operating_cost, field: {name: mfo_routing, type: link, to: Routing, label: Routing, description: Copies its operations into the BOM when chosen}}
      - {op: add_field, after: mfo_routing, field: {name: mfo_operations, type: table, of: BomOperation, label: Operations}}
      - {op: add_field, after: mfo_operations, field: {name: mfo_operations_routing, type: data, read_only: true, hidden: true}}
      - {op: set_property, field: operating_cost, property: read_only_if, value: "size(doc.mfo_operations) > 0"}
      - {op: set_property, field: operating_cost, property: description, value: "Labour and overheads per BOM quantity; with operations it is their cost"}
      - {op: add_action, action: {name: mfo_update_operating_cost, label: Update Operating Cost, docstatus: [0, 1], permission: write, condition: "size(doc.mfo_operations) > 0"}}
  - entity: BomItem
    ops:
      - {op: add_field, field: {name: mfo_operation, type: link, to: Operation, label: Consumed at Operation, description: Materials without one go with the first operation}}
  - entity: WorkOrder
    ops:
      - {op: add_field, after: actual_cost, field: {name: mfo_operations, type: table, of: WorkOrderOperation, label: Operations}}
      - {op: add_field, after: mfo_operations, field: {name: mfo_operations_bom, type: data, read_only: true, hidden: true}}
      - {op: add_field, after: mfo_operations_bom, field: {name: mfo_planned_operating_cost, type: currency, read_only: true, label: Planned Operating Cost}}
      - {op: add_field, after: mfo_planned_operating_cost, field: {name: mfo_actual_operating_cost, type: currency, read_only: true, no_copy: true, label: Actual Operating Cost}}
      - {op: add_field, after: mfo_actual_operating_cost, field: {name: mfo_production_plan, type: link, to: ProductionPlan, read_only: true, label: Production Plan, in_filter: true}}
      - {op: add_field, after: mfo_production_plan, field: {name: mfo_production_plan_item, type: data, read_only: true, hidden: true}}
      - {op: add_action, action: {name: mfo_make_job_cards, label: Create Job Cards, docstatus: [1], permission: write, condition: "size(doc.mfo_operations) > 0"}}
  - entity: StockEntry
    ops:
      - {op: add_field, field: {name: mfo_job_card, type: link, to: JobCard, read_only: true, label: Job Card, in_filter: true}}
      - {op: add_field, field: {name: mfo_job_card_qty, type: decimal, read_only: true, label: Job Card Quantity, description: Quantity of the job card whose materials this entry moves}}
      - {op: add_field, field: {name: mfo_subcontracting_order, type: link, to: SubcontractingOrder, read_only: true, label: Subcontracting Order, in_filter: true}}
  - entity: StockEntryItem
    ops:
      - {op: add_field, field: {name: mfo_supplied_item, type: data, read_only: true, hidden: true}}

modules:
  - name: shop_floor
    label: Shop Floor
    icon: wrench
    order: 61
    items: [JobCard, ProductionPlan, WorkOrder, Workstation, WorkstationType, Operation, Routing, report:job_card_summary, report:capacity_planning,
            report:work_order_operations, report:production_plan_status]
  - name: subcontracting
    label: Subcontracting
    icon: handshake
    order: 62
    items: [SubcontractingOrder, SubcontractingReceipt, SubcontractingBom, report:subcontracting_status]

roles:
  - name: Manufacturing Manager
    permissions:
      - {entity: WorkstationType, read: true, write: true, create: true, delete: true}
      - {entity: Workstation, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Operation, read: true, write: true, create: true, delete: true}
      - {entity: Routing, read: true, write: true, create: true, delete: true}
      - {entity: JobCard, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: ProductionPlan, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: SubcontractingBom, read: true, write: true, create: true, delete: true}
      - {entity: SubcontractingOrder, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: SubcontractingReceipt, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: StockEntry, read: true, write: true, create: true, submit: true, cancel: true}
      - {entity: SalesOrder, read: true}
      - {entity: Customer, read: true}
      - {entity: Account, read: true}
  - name: Manufacturing User
    permissions:
      - {entity: WorkstationType, read: true}
      - {entity: Workstation, read: true}
      - {entity: Operation, read: true}
      - {entity: Routing, read: true}
      - {entity: JobCard, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: ProductionPlan, read: true}
      - {entity: StockEntry, read: true, write: true, create: true, submit: true}
  - name: Purchase User
    permissions:
      - {entity: SubcontractingBom, read: true}
      - {entity: SubcontractingOrder, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: SubcontractingReceipt, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: Bom, read: true}
  - name: Purchase Manager
    permissions:
      - {entity: SubcontractingBom, read: true, write: true, create: true, delete: true}
      - {entity: SubcontractingOrder, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: SubcontractingReceipt, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: StockEntry, read: true, write: true, create: true, submit: true}
      - {entity: Bom, read: true}
  - name: Stock User
    permissions:
      - {entity: SubcontractingOrder, read: true}
      - {entity: SubcontractingReceipt, read: true, write: true, create: true, submit: true}
