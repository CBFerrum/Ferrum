- name: ProductionPlanSalesOrder
  label: Production Plan Sales Order
  kind: child
  fields:
    - {name: sales_order, type: link, to: SalesOrder, required: true, in_list: true}
    - {name: customer, type: link, to: Customer, read_only: true, fetch_from: sales_order.customer, in_list: true}
    - {name: order_date, type: date, read_only: true, fetch_from: sales_order.posting_date, in_list: true}
    - {name: grand_total, type: currency, read_only: true, fetch_from: sales_order.grand_total}

- name: ProductionPlanMaterialRequest
  label: Production Plan Material Request
  kind: child
  fields:
    - {name: material_request, type: data, required: true, in_list: true, label: Material Request, description: Its id (Material Requests come with the Procurement app)}
    - {name: material_request_number, type: data, read_only: true, in_list: true}

- name: ProductionPlanItem
  label: Production Plan Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, read_only: true, fetch_from: item.item_name}
    - {name: bom, type: link, to: Bom, in_list: true, description: Defaults to the item's default BOM}
    - {name: planned_qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: pending_qty, type: decimal, read_only: true, description: Open on the source document when fetched}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Finished Goods Warehouse}
    - {name: planned_start_date, type: date}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true}
    - {name: so_line, type: data, read_only: true, hidden: true}
    - {name: material_request, type: data, read_only: true}
    - {name: mr_line, type: data, read_only: true, hidden: true}
    - {name: ordered_qty, type: decimal, read_only: true, no_copy: true, in_list: true, label: Work Order Qty}
    - {name: produced_qty, type: decimal, read_only: true, no_copy: true, in_list: true}

- name: ProductionPlanSubAssembly
  label: Production Plan Sub-assembly
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, read_only: true, fetch_from: item.item_name}
    - {name: bom, type: link, to: Bom, required: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: bom_level, type: int, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, description: Produced into; defaults to the raw material warehouse}
    - {name: planned_start_date, type: date}
    - {name: ordered_qty, type: decimal, read_only: true, no_copy: true, in_list: true, label: Work Order Qty}
    - {name: produced_qty, type: decimal, read_only: true, no_copy: true, in_list: true}

- name: ProductionPlanMaterial
  label: Production Plan Raw Material
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, read_only: true, fetch_from: item.item_name}
    - {name: uom, type: link, to: Uom, read_only: true, fetch_from: item.stock_uom, label: Unit}
    - {name: required_qty, type: decimal, read_only: true, in_list: true}
    - {name: actual_qty, type: decimal, read_only: true, label: In Stock}
    - {name: projected_qty, type: decimal, read_only: true, in_list: true}
    - {name: safety_stock, type: decimal, read_only: true}
    - {name: qty_to_order, type: decimal, min: "0", in_list: true}
    - {name: supplier, type: link, to: Supplier, description: Defaults to the item's first approved supplier}
    - {name: required_by, type: date}
    - {name: order_entity, type: data, read_only: true, no_copy: true, hidden: true}
    - {name: order_id, type: data, read_only: true, no_copy: true, hidden: true}
    - {name: order_number, type: data, read_only: true, no_copy: true, in_list: true, label: Requested In}

- name: ProductionPlanWarehouse
  label: Production Plan Warehouse
  kind: child
  fields:
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, in_list: true}

- name: ProductionPlan
  label: Production Plan
  kind: document
  module: shop_floor
  submittable: true
  company_scoped: true
  numbering: {template: "PP-{FY}-{seq:5}", date_field: posting_date}
  description: Plans production from sales orders, material requests or by hand, then makes the work orders and the material requests.
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, description: Filters Get Sales Orders}
    - {name: from_date, type: date, description: Filters Get Sales Orders and Get Material Requests by date}
    - {name: to_date, type: date}
    - {name: sales_orders, type: table, of: ProductionPlanSalesOrder}
    - {name: material_requests, type: table, of: ProductionPlanMaterialRequest}
    - {name: po_items, type: table, of: ProductionPlanItem, label: Items to Manufacture}
    - {name: sub_assemblies, type: table, of: ProductionPlanSubAssembly, label: Sub-assemblies}
    - {name: for_warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, label: Raw Material Warehouse, description: Where materials and sub-assemblies are needed}
    - {name: fg_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Finished Goods Warehouse}
    - {name: warehouses, type: table, of: ProductionPlanWarehouse, label: Stock Considered In, description: Warehouses whose projected stock nets the raw materials; empty means the raw material warehouse}
    - {name: include_safety_stock, type: check, default: true}
    - {name: raw_materials, type: table, of: ProductionPlanMaterial}
    - {name: total_planned_qty, type: decimal, read_only: true, in_list: true}
    - {name: total_produced_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: status, type: select, options: [Draft, Submitted, Material Requested, In Process, Completed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
  rules:
    - {name: date_range, check: "doc.from_date == null || doc.to_date == null || doc.to_date >= doc.from_date", message: "The to date is before the from date"}
    - {name: has_items, check: "size(doc.po_items) > 0", message: "Add the items to manufacture", on: submit}
  form:
    - {label: Plan, columns: 2, fields: [company, posting_date, for_warehouse, fg_warehouse, include_safety_stock, status]}
    - {label: Sources, collapsible: true, fields: [customer, from_date, to_date, sales_orders, material_requests]}
    - {label: Production, fields: [po_items, sub_assemblies, total_planned_qty, total_produced_qty]}
    - {label: Materials, fields: [warehouses, raw_materials]}
  actions:
    - {name: get_sales_orders, label: Get Sales Orders, docstatus: [0], permission: write}
    - {name: get_material_requests, label: Get Material Requests, docstatus: [0], permission: write}
    - {name: get_items, label: Get Items, docstatus: [0], permission: write}
    - {name: get_raw_materials, label: Get Raw Materials, docstatus: [0], permission: write}
    - {name: make_work_orders, label: Create Work Orders, docstatus: [1], permission: read, condition: "doc.status != 'Completed'"}
    - {name: make_material_requests, label: Request Materials, docstatus: [1], permission: read}
  list: {columns: [number, posting_date, total_planned_qty, total_produced_qty, status], sort: created_at desc}
