- name: JobCardTimeLog
  label: Job Card Time Log
  kind: child
  fields:
    - {name: from_time, type: datetime, required: true, in_list: true}
    - {name: to_time, type: datetime, required: true, in_list: true}
    - {name: time_in_mins, type: decimal, read_only: true, in_list: true, label: Minutes}
    - {name: completed_qty, type: decimal, default: 0, min: "0", in_list: true}
    - {name: employee, type: data, in_list: true, label: Operator, description: Defaults to the job card's operator}

- name: JobCard
  label: Job Card
  kind: document
  module: shop_floor
  submittable: true
  company_scoped: true
  numbering: {template: "JC-{FY}-{seq:5}", date_field: posting_date}
  search_fields: [employee, employee_name]
  description: One operation of a work order on a workstation, with the time spent and the quantity completed.
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: work_order, type: link, to: WorkOrder, required: true, in_list: true, in_filter: true}
    - {name: item, type: link, to: Item, read_only: true, in_filter: true}
    - {name: item_name, type: data, read_only: true, in_list: true}
    - {name: operation, type: link, to: Operation, required: true, in_list: true, in_filter: true}
    - {name: wo_operation, type: data, hidden: true, label: Work Order Operation Row}
    - {name: sequence, type: int, read_only: true, description: Position of the operation in the work order}
    - {name: workstation, type: link, to: Workstation, in_list: true, in_filter: true, description: Defaults to the work order operation's workstation}
    - {name: employee, type: data, in_filter: true, label: Operator, description: "Free text, or an employee (id, number or name) when the HR app is installed"}
    - {name: employee_name, type: data, read_only: true, label: Operator Name}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: for_quantity, type: decimal, min: "0.000000001", in_list: true, label: Qty to Manufacture, description: Defaults to what the operation still has open}
    - {name: time_logs, type: table, of: JobCardTimeLog}
    - {name: total_time_in_mins, type: decimal, read_only: true, label: Total Time (Minutes)}
    - {name: total_completed_qty, type: decimal, read_only: true, in_list: true}
    - {name: scrap_qty, type: decimal, default: 0, min: "0", label: Process Loss Qty}
    - {name: transferred_qty, type: decimal, read_only: true, no_copy: true, description: Quantity whose materials were transferred to the shop floor}
    - {name: hour_rate, type: currency, read_only: true}
    - {name: operating_cost, type: currency, read_only: true}
    - {name: status, type: select, options: [Open, Work In Progress, Material Transferred, Completed, Cancelled], default: Open, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: remarks, type: text}
  form:
    - {label: Job, columns: 2, fields: [work_order, item, item_name, operation, workstation, sequence, for_quantity, posting_date, status, company]}
    - {label: Operator, columns: 2, fields: [employee, employee_name]}
    - {label: Time, fields: [time_logs, total_time_in_mins, total_completed_qty, scrap_qty]}
    - {label: Cost and Materials, columns: 2, collapsible: true, fields: [hour_rate, operating_cost, transferred_qty, wo_operation, remarks]}
  actions:
    - {name: make_material_transfer, label: Transfer Materials, docstatus: [0], permission: write}
  list: {columns: [number, item_name, operation, workstation, for_quantity, total_completed_qty, status], sort: created_at desc}
