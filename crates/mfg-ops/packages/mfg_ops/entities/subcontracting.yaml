- name: SubcontractingBom
  label: Subcontracting BOM
  kind: master
  module: subcontracting
  title_field: finished_good_name
  description: What a subcontractor makes, from which BOM's materials, and the service item it bills.
  fields:
    - {name: finished_good, type: link, to: Item, required: true, in_list: true, in_filter: true}
    - {name: finished_good_name, type: data, read_only: true, fetch_from: finished_good.item_name, in_list: true}
    - {name: finished_good_qty, type: decimal, required: true, default: 1, min: "0.000000001"}
    - {name: finished_good_bom, type: link, to: Bom, required: true, description: Its materials are sent to the subcontractor}
    - {name: service_item, type: link, to: Item, required: true, in_list: true, description: The non-stock item the subcontractor bills}
    - {name: service_item_qty, type: decimal, required: true, default: 1, min: "0.000000001", description: Service quantity per finished good quantity}
    - {name: supplier, type: link, to: Supplier, in_list: true, in_filter: true, description: Empty means any supplier}
    - {name: is_active, type: check, default: true, in_list: true, in_filter: true}
  list: {columns: [finished_good_name, service_item, supplier, is_active], sort: created_at desc}

- name: SubcontractingOrderItem
  label: Subcontracting Order Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true, label: Finished Good}
    - {name: item_name, type: data, read_only: true, fetch_from: item.item_name}
    - {name: subcontracting_bom, type: link, to: SubcontractingBom, description: Defaults to the active one for the item and supplier}
    - {name: bom, type: link, to: Bom, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Receive Into}
    - {name: schedule_date, type: date, label: Required By}
    - {name: service_rate, type: currency, required: true, default: 0, min: "0", in_list: true, description: Subcontracting charge per finished unit}
    - {name: service_amount, type: currency, read_only: true, in_list: true}
    - {name: service_item, type: link, to: Item, read_only: true}
    - {name: service_qty, type: decimal, read_only: true}
    - {name: received_qty, type: decimal, read_only: true, no_copy: true, in_list: true}

- name: SubcontractingOrderSuppliedItem
  label: Subcontracting Order Supplied Item
  kind: child
  fields:
    - {name: sco_line, type: data, read_only: true, hidden: true}
    - {name: main_item, type: link, to: Item, read_only: true, in_list: true, label: For Finished Good}
    - {name: rm_item, type: link, to: Item, read_only: true, in_list: true, label: Raw Material}
    - {name: rm_item_name, type: data, read_only: true}
    - {name: required_qty, type: decimal, read_only: true, in_list: true}
    - {name: source_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Send From}
    - {name: supplied_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: consumed_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: returned_qty, type: decimal, read_only: true, no_copy: true, in_list: true}

- name: SubcontractingOrder
  label: Subcontracting Order
  kind: document
  module: subcontracting
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "SCO-{FY}-{seq:5}", on: submit, date_field: posting_date}
  description: Goods a subcontractor makes from materials we send; the service is bought on a linked purchase order.
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: supplier, type: link, to: Supplier, required: true, in_filter: true}
    - {name: supplier_name, type: data, read_only: true, fetch_from: supplier.supplier_name, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Order Date, in_list: true, in_filter: true}
    - {name: schedule_date, type: date, label: Required By}
    - {name: supplier_warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, description: Our stock held at the subcontractor}
    - {name: set_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Receive Into}
    - {name: set_reserve_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, label: Send Materials From}
    - {name: items, type: table, of: SubcontractingOrderItem, required: true}
    - {name: supplied_items, type: table, of: SubcontractingOrderSuppliedItem, label: Materials to Supply}
    - {name: total_qty, type: decimal, read_only: true}
    - {name: service_total, type: currency, read_only: true, in_list: true}
    - {name: purchase_order, type: link, to: PurchaseOrder, label: Service Purchase Order, description: A draft is created on submit when empty}
    - {name: per_received, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, Open, Partial Material Transferred, Material Transferred, Partially Received, Completed, Cancelled],
       default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
  form:
    - {label: Order, columns: 2, fields: [company, supplier, supplier_name, posting_date, schedule_date, status, purchase_order, per_received]}
    - {label: Warehouses, columns: 3, fields: [supplier_warehouse, set_warehouse, set_reserve_warehouse]}
    - {label: Items, fields: [items, total_qty, service_total]}
    - {label: Materials to Supply, fields: [supplied_items]}
  actions:
    - {name: make_material_transfer, label: Transfer Materials to Supplier, docstatus: [1], permission: read, condition: "doc.status != 'Completed'"}
    - {name: make_subcontracting_receipt, label: Create Subcontracting Receipt, docstatus: [1], permission: read, condition: "doc.per_received < 100.0"}
    - {name: return_excess_materials, label: Return Excess Materials, docstatus: [1], permission: read}
    - {name: make_purchase_order, label: Create Service Purchase Order, docstatus: [1], permission: read}
  list: {columns: [number, supplier_name, posting_date, service_total, status], sort: posting_date desc}

- name: SubcontractingReceiptItem
  label: Subcontracting Receipt Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, read_only: true, fetch_from: item.item_name}
    - {name: sco_line, type: data, hidden: true, label: Subcontracting Order Line}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true, label: Accepted Warehouse}
    - {name: service_rate, type: currency, read_only: true}
    - {name: service_cost, type: currency, read_only: true}
    - {name: rm_cost, type: currency, read_only: true, no_copy: true, label: Materials Cost}
    - {name: additional_cost, type: currency, read_only: true}
    - {name: amount, type: currency, read_only: true, no_copy: true, in_list: true, label: Valuation Amount}
    - {name: valuation_rate, type: currency, read_only: true, no_copy: true}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}

- name: SubcontractingReceiptSuppliedItem
  label: Subcontracting Receipt Consumed Item
  kind: child
  fields:
    - {name: receipt_line, type: data, read_only: true, hidden: true}
    - {name: sco_supplied_item, type: data, read_only: true, hidden: true}
    - {name: main_item, type: link, to: Item, read_only: true, in_list: true}
    - {name: rm_item, type: link, to: Item, read_only: true, in_list: true}
    - {name: required_qty, type: decimal, read_only: true, in_list: true}
    - {name: consumed_qty, type: decimal, min: "0", in_list: true, description: Empty means as required}
    - {name: rate, type: currency, read_only: true, no_copy: true}
    - {name: amount, type: currency, read_only: true, no_copy: true}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}

- name: SubcontractingAdditionalCost
  label: Subcontracting Additional Cost
  kind: child
  fields:
    - {name: description, type: data, required: true, in_list: true}
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true, description: Credited; the cost is added to the goods' value}
    - {name: amount, type: currency, required: true, min: "0", in_list: true}

- name: SubcontractingReceipt
  label: Subcontracting Receipt
  kind: document
  module: subcontracting
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "SCR-{FY}-{seq:5}", on: submit, date_field: posting_date}
  description: Goods received from a subcontractor, valued at the materials it consumed plus its service and any additional costs.
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: subcontracting_order, type: link, to: SubcontractingOrder, required: true, in_list: true, in_filter: true}
    - {name: supplier, type: link, to: Supplier, read_only: true, in_filter: true}
    - {name: supplier_name, type: data, read_only: true, in_list: true}
    - {name: supplier_warehouse, type: link, to: Warehouse, read_only: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default: "23:59:59", description: "HH:MM:SS (orders entries on the same day)"}
    - {name: supplier_delivery_note, type: data}
    - {name: items, type: table, of: SubcontractingReceiptItem, required: true}
    - {name: supplied_items, type: table, of: SubcontractingReceiptSuppliedItem, label: Consumed Materials, description: One row per material of each received line; an empty consumed quantity means as required}
    - {name: additional_costs, type: table, of: SubcontractingAdditionalCost}
    - {name: total_qty, type: decimal, read_only: true}
    - {name: service_cost_total, type: currency, read_only: true}
    - {name: additional_cost_total, type: currency, read_only: true}
    - {name: rm_cost_total, type: currency, read_only: true, no_copy: true, label: Materials Cost}
    - {name: total_amount, type: currency, read_only: true, no_copy: true, in_list: true}
    - {name: status, type: select, options: [Draft, Completed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: remarks, type: text}
  rules:
    - {name: time_format, check: "doc.posting_time == null || doc.posting_time.matches('^[0-2][0-9]:[0-5][0-9](:[0-5][0-9])?$')", message: "Posting time must be HH:MM or HH:MM:SS"}
  list: {columns: [number, supplier_name, posting_date, total_amount, status], sort: posting_date desc}
