[package]
name = "ferrum-calc"
description = "Pure decimal pricing, discount, tax and totals engine shared by server and browser (WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true

# A plain rlib: a cdylib output has no hash in its file name, so builds with different feature sets
# overwrite each other's copy. For the browser:
#   cargo rustc -p ferrum-calc --release --features wasm --target wasm32-unknown-unknown --crate-type cdylib

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
proptest = { workspace = true }
rust_decimal_macros = "1"

[lints]
workspace = true
