- name: SiteMember
  label: Site Member
  kind: child
  fields:
    - {name: user_email, type: email, required: true, in_list: true}

- name: Site
  label: Site
  kind: master
  module: ops
  title_field: site_name
  search_fields: [site_code]
  description: A place where physical work happens. Its offline limit says how long it may go on without hearing from the platform.
  fields:
    - {name: site_name, type: data, required: true, in_list: true}
    - {name: site_code, type: data, required: true, unique: true, in_list: true, max_length: 40}
    - {name: company, type: link, to: Company, in_list: true, in_filter: true}
    - {name: time_zone, type: data, max_length: 64, description: "IANA time zone, e.g. Europe/Berlin"}
    - {name: status, type: select, options: [Active, Inactive], default: Active, in_list: true, in_filter: true}
    - {name: max_offline_hours, type: int, default: 72, min: 1, max: 720, label: Longest Offline (Hours), description: "After this long without the platform a site starts no new work. A site offline cannot learn that a person was revoked, so this is also how long that can go unnoticed."}
    - {name: telemetry_budget_mb, type: int, default: 1024, min: 1, label: Telemetry Budget (MB), description: "What the site may hold of unsent measurements. Past it, the oldest plain samples go first. Commands and evidence are never counted in this."}
    - {name: restricted, type: check, label: Members Only, description: "Only the people listed may see or act on this site, whatever their roles"}
    - {name: members, type: table, of: SiteMember, visible_if: "doc.restricted"}
    - {name: notes, type: text}
  form:
    - {label: Site, fields: [site_name, site_code, company, time_zone, status]}
    - {label: Offline, fields: [max_offline_hours, telemetry_budget_mb]}
    - {label: Access, fields: [restricted, members]}
    - {label: Notes, collapsible: true, fields: [notes]}
  list: {columns: [site_name, site_code, company, status], sort: site_name asc}

- name: SiteArea
  label: Site Area
  label_plural: Site Areas
  kind: master
  module: ops
  title_field: area_name
  description: A zone, line, cell or work centre inside a site.
  fields:
    - {name: area_name, type: data, required: true, in_list: true}
    - {name: site, type: link, to: Site, required: true, in_list: true, in_filter: true}
    - {name: kind, type: select, options: [Zone, Aisle, Dock, Line, Cell, Work Center, Room], default: Zone, in_list: true, in_filter: true}
    - {name: parent_area, type: link, to: SiteArea}
  unique: [[site, area_name]]
  list: {columns: [area_name, site, kind], sort: area_name asc}

- name: EnvelopeDevice
  label: Envelope Device
  kind: child
  fields:
    - {name: device, type: link, to: Device, required: true, in_list: true}

- name: EnvelopeLimit
  label: Envelope Limit
  kind: child
  fields:
    - {name: parameter, type: data, required: true, in_list: true, max_length: 200, description: "Where it is in the command's payload, with dots: qty, task.station"}
    - {name: min_value, type: decimal, in_list: true}
    - {name: max_value, type: decimal, in_list: true}
    - {name: allowed, type: text, in_list: true, description: "The values it may take, separated by commas: approved job numbers, destinations"}

- name: AutomationEnvelope
  label: Automation Envelope
  label_plural: Automation Envelopes
  kind: master
  module: ops
  title_field: envelope_name
  description: What software may do on its own, approved by a person, with limits. Anything outside it goes to a person. Switching one off takes effect at once.
  fields:
    - {name: envelope_name, type: data, required: true, in_list: true}
    - {name: site, type: link, to: Site, required: true, in_list: true, in_filter: true}
    - {name: operation, type: data, required: true, in_list: true, max_length: 100}
    - {name: enabled, type: check, default: true, in_list: true, in_filter: true}
    - {name: agents, type: check, label: AI Agents Too, in_filter: true, description: "Off, only rules and schedules run under this, and whatever an agent proposes goes to a person"}
    - {name: devices, type: table, of: EnvelopeDevice, description: "Only these. Empty means every device at the site that may do this"}
    - {name: limits, type: table, of: EnvelopeLimit, label: Parameter Limits, description: "A payload outside any of these, or without one of them, goes to a person"}
    - {name: equipment_state, type: select, options: [Running, Idle, Stopped], description: "The state the device must last have reported. Empty asks nothing of it"}
    - {name: evidence_metric, type: data, max_length: 120, description: "A reading that must be recent, or nobody knows how the device stands"}
    - {name: evidence_max_age_secs, type: int, min: 1, label: Evidence Age (Seconds), description: "How old that reading may be"}
    - {name: max_per_hour, type: int, required: true, min: 1, label: Most per Hour, in_list: true}
    - {name: max_in_progress, type: int, min: 1, label: Most Unfinished at Once, description: "Commands under this envelope that have not ended, unknown outcomes included. Empty means no limit"}
    - {name: valid_until, type: datetime, required: true, in_list: true}
    - {name: approved_by, type: data, read_only: true}
    - {name: notes, type: text}
  form:
    - {label: Envelope, fields: [envelope_name, site, operation, enabled, agents, valid_until, approved_by]}
    - {label: Where, fields: [devices]}
    - {label: What, fields: [limits]}
    - {label: When, fields: [equipment_state, evidence_metric, evidence_max_age_secs]}
    - {label: How Much, fields: [max_per_hour, max_in_progress]}
    - {label: Notes, collapsible: true, fields: [notes]}
  unique: [[site, operation]]
  list: {columns: [envelope_name, site, operation, enabled, valid_until], sort: envelope_name asc}
