[package]
name = "ferrum-process"
description = "Ferrum's durable process runtime on Temporal: one workflow drives a release's state machine, and every effect, task and wait goes through the kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrum-kernel = { path = "../kernel" }
ferrum-logic = { path = "../logic" }
# The versions the qualification spike ran (docs/logic/decisions.md L-01); a new one is qualified again first.
temporalio-sdk = { version = "=1.1.2", default-features = false }
temporalio-client = { version = "=1.1.2", default-features = false }
# Protobuf compiled in Rust (protox): no build, the image's included, needs protoc installed.
temporalio-common = { version = "=1.1.2", default-features = false, features = ["vendored-protox"] }
temporalio-macros = "=1.1.2"
temporalio-workflow = "=1.1.2"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = "2"

[dev-dependencies]
ferrum-meta = { path = "../meta" }
sqlx = { workspace = true }

[lints]
workspace = true
