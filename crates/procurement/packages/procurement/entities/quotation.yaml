- name: SupplierQuotationItem
  label: Supplier Quotation Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: uom, type: link, to: Uom, label: UOM, fetch_from: item.stock_uom, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: price_list_rate, type: currency, label: Quoted Rate, min: "0", in_list: true}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: rate, type: currency, read_only: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: net_amount, type: currency, read_only: true}
    - {name: lead_time_days, type: int, min: 0, max: 3650, in_list: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: schedule_date, type: date, label: Required By}
    - {name: request_for_quotation, type: link, to: RequestForQuotation, read_only: true}
    - {name: rfq_line, type: data, read_only: true, hidden: true}
    - {name: material_request, type: link, to: MaterialRequest, read_only: true}
    - {name: mr_line, type: data, read_only: true, hidden: true}
    - {name: ordered_qty, type: decimal, read_only: true, no_copy: true}
    - {name: item_tax_rates, type: json, read_only: true}

- name: SupplierQuotation
  label: Supplier Quotation
  kind: document
  module: procurement
  submittable: true
  company_scoped: true
  title_field: supplier_name
  numbering: {template: "SQ-{FY}-{seq:5}", on: submit, date_field: posting_date}
  search_fields: [supplier_reference]
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: supplier, type: link, to: Supplier, required: true, in_filter: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, label: Quotation Date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: valid_till, type: date, in_list: true, description: "Defaults to the quotation date plus Procurement Settings → Quotation Validity"}
    - {name: supplier_reference, type: data, label: Supplier's Quotation No}
    - {name: request_for_quotation, type: link, to: RequestForQuotation, read_only: true, in_filter: true}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: tax_template, type: link, to: TaxTemplate}
    - {name: items, type: table, of: SupplierQuotationItem, required: true}
    - {name: taxes, type: table, of: TaxRow}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: total, type: currency, read_only: true}
    - {name: net_total, type: currency, read_only: true}
    - {name: total_taxes, type: currency, read_only: true}
    - {name: grand_total, type: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, read_only: true}
    - {name: rounded_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: per_ordered, type: percent, label: "% Ordered", read_only: true, no_copy: true}
    - {name: status, type: select, default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true,
       options: [Draft, Submitted, Ordered, Expired, Cancelled]}
    - {name: terms, type: text, label: Supplier Notes}
  indexes: [[status, valid_till]]
  rules:
    - {name: valid_after_date, check: "doc.valid_till == null || doc.valid_till >= doc.posting_date", message: "Valid till cannot be before the quotation date"}
  actions:
    - {name: make_purchase_order, label: Create Purchase Order, docstatus: [1], permission: read, condition: "doc.status == 'Submitted'"}
  list: {columns: [number, supplier_name, posting_date, valid_till, grand_total, status], sort: posting_date desc}
