- name: SupplierScorecardCriterion
  label: Scorecard Criterion
  kind: child
  fields:
    - {name: criterion_name, type: data, required: true, in_list: true}
    - {name: weight, type: percent, required: true, min: "0", max: "100", in_list: true}
    - {name: formula, type: code, required: true, in_list: true,
       description: "CEL over the period's metrics: doc.on_time_pct, doc.quality_pct, doc.price_variance_pct, doc.response_rate_pct,
         doc.received_qty, doc.accepted_qty, doc.rejected_qty, doc.on_time_qty, doc.po_count, doc.po_amount, doc.rfq_count,
         doc.rfq_responded (all decimals: write 100.0, not 100)"}
    - {name: max_score, type: decimal, default: 100, min: "0.000000001", description: The formula's best value; scores are scaled to 0-100}

- name: SupplierScorecardStanding
  label: Scorecard Standing
  kind: child
  fields:
    - {name: standing_name, type: data, required: true, in_list: true}
    - {name: min_score, type: decimal, required: true, min: "0", max: "100", in_list: true}
    - {name: max_score, type: decimal, required: true, min: "0", max: "100", in_list: true}
    - {name: warn_rfqs, type: check, label: Warn on RFQs, in_list: true}
    - {name: prevent_rfqs, type: check, label: Prevent RFQs, in_list: true}
    - {name: warn_pos, type: check, label: Warn on Purchase Orders, in_list: true}
    - {name: prevent_pos, type: check, label: Prevent Purchase Orders, in_list: true}

- name: SupplierScorecard
  label: Supplier Scorecard
  kind: master
  module: procurement
  title_field: supplier_name
  description: "Scores a supplier per month or quarter from delivery, quality, price and responsiveness; its standing can warn about or block new RFQs and purchase orders."
  fields:
    - {name: supplier, type: link, to: Supplier, required: true, unique: true, in_filter: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: period, type: select, label: Evaluation Period, required: true, default: Monthly, options: [Monthly, Quarterly], in_list: true}
    - {name: start_date, type: date, label: Score From, required: true, default_expr: today,
       description: Scoring starts with the period containing this date; a period is scored once it has ended}
    - {name: criteria, type: table, of: SupplierScorecardCriterion, description: "Weights must add up to 100 (defaults are filled in when left empty)"}
    - {name: standings, type: table, of: SupplierScorecardStanding, description: "Score ranges covering 0-100 (defaults are filled in when left empty)"}
    - {name: current_score, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: current_standing, type: data, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: warn_rfqs, type: check, read_only: true, no_copy: true}
    - {name: prevent_rfqs, type: check, read_only: true, no_copy: true}
    - {name: warn_pos, type: check, read_only: true, no_copy: true}
    - {name: prevent_pos, type: check, read_only: true, no_copy: true}
    - {name: scored_until, type: date, label: Scored Until, read_only: true, no_copy: true}
    - {name: disabled, type: check, in_filter: true, description: A disabled scorecard never warns or blocks}
  actions:
    - {name: refresh, label: Score Ended Periods Now, permission: write}
  list: {columns: [supplier_name, period, current_score, current_standing], sort: supplier_name asc}

- name: SupplierScorecardPeriod
  label: Scorecard Period
  kind: master
  module: procurement
  description: One scored period of a supplier scorecard (written by the scorecard engine).
  fields:
    - {name: scorecard, type: link, to: SupplierScorecard, required: true, on_delete: cascade, read_only: true, in_filter: true}
    - {name: supplier, type: link, to: Supplier, read_only: true, in_list: true, in_filter: true}
    - {name: period_start, type: date, required: true, read_only: true, in_list: true}
    - {name: period_end, type: date, required: true, read_only: true, in_list: true}
    - {name: score, type: decimal, read_only: true, in_list: true}
    - {name: standing, type: data, read_only: true, in_list: true}
    - {name: no_activity, type: check, read_only: true, description: Nothing happened in this period; the previous score carries forward}
    - {name: on_time_pct, type: decimal, label: On-time Delivery %, read_only: true}
    - {name: quality_pct, type: decimal, label: Received Quality %, read_only: true}
    - {name: price_variance_pct, type: decimal, label: Price Variance vs Quotes %, read_only: true}
    - {name: response_rate_pct, type: decimal, label: RFQ Response Rate %, read_only: true}
    - {name: received_qty, type: decimal, read_only: true}
    - {name: rejected_qty, type: decimal, read_only: true}
    - {name: on_time_qty, type: decimal, read_only: true}
    - {name: po_count, type: int, label: Purchase Orders, read_only: true}
    - {name: po_amount, type: currency, label: Ordered Amount, read_only: true}
    - {name: rfq_count, type: int, label: RFQs, read_only: true}
    - {name: rfq_responded, type: int, label: RFQs Answered, read_only: true}
    - {name: criteria_scores, type: json, read_only: true}
  unique: [[scorecard, period_start]]
  list: {columns: [supplier, period_start, score, standing], sort: period_start desc}
