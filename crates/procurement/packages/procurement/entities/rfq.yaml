- name: RequestForQuotationItem
  label: Request for Quotation Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: uom, type: link, to: Uom, label: UOM, fetch_from: item.stock_uom, read_only: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}}
    - {name: schedule_date, type: date, label: Required By, in_list: true}
    - {name: material_request, type: link, to: MaterialRequest, read_only: true}
    - {name: mr_line, type: data, label: Material Request Line, read_only: true, hidden: true}

- name: RequestForQuotationSupplier
  label: Request for Quotation Supplier
  kind: child
  fields:
    - {name: supplier, type: link, to: Supplier, required: true, in_list: true}
    - {name: supplier_name, type: data, fetch_from: supplier.supplier_name, read_only: true, in_list: true}
    - {name: email, type: email, label: Contact Email, in_list: true, description: "Defaults to the supplier's email"}
    - {name: quote_status, type: select, default: Pending, read_only: true, no_copy: true, in_list: true, options: [Pending, Received, No Quote]}
    - {name: supplier_quotation, type: link, to: SupplierQuotation, read_only: true, no_copy: true}
    - {name: email_status, type: select, default: Not Sent, read_only: true, no_copy: true, in_list: true, options: [Not Sent, Queued, Sent, Failed]}
    - {name: email_error, type: data, read_only: true, no_copy: true}
    - {name: last_sent_at, type: datetime, read_only: true, no_copy: true}
    - {name: link_expires_at, type: datetime, label: Link Valid Until, read_only: true, no_copy: true}
    - {name: send_id, type: data, read_only: true, no_copy: true, hidden: true}
    - {name: scorecard_standing, type: data, label: Scorecard, read_only: true, no_copy: true}

- name: RequestForQuotation
  label: Request for Quotation
  label_plural: Requests for Quotation
  kind: document
  module: procurement
  submittable: true
  company_scoped: true
  numbering: {template: "RFQ-{FY}-{seq:5}", on: submit, date_field: transaction_date}
  description: "Invites suppliers to quote; each supplier answers on a signed web page that turns their rates into a supplier quotation."
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: transaction_date, type: date, label: Date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: response_deadline, type: date, label: Quotations Due By, in_list: true,
       description: "Defaults to the date plus Procurement Settings → Quotations Due In; links sent to suppliers stop working after it"}
    - {name: schedule_date, type: date, label: Required By}
    - {name: message, type: text, label: Message for Supplier, default: "Please send us your best rates and lead times for the items below."}
    - {name: items, type: table, of: RequestForQuotationItem, required: true}
    - {name: suppliers, type: table, of: RequestForQuotationSupplier}
    - {name: status, type: select, default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true, options: [Draft, Submitted, Cancelled]}
  rules:
    - {name: deadline_after_date, check: "doc.response_deadline == null || doc.response_deadline >= doc.transaction_date",
       message: "Quotations Due By cannot be before the date"}
    - {name: has_suppliers, check: "size(doc.suppliers) > 0", message: "Invite at least one supplier", on: submit}
  actions:
    - {name: send, label: Send to Suppliers, docstatus: [1], permission: submit,
       confirm: "Email each supplier a link to submit their quotation?"}
    - {name: make_supplier_quotation, label: Create Supplier Quotation, docstatus: [1], permission: read}
  list: {columns: [number, transaction_date, response_deadline, status], sort: transaction_date desc}
