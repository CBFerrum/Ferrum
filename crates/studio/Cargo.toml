[package]
name = "ferrum-studio"
description = "Analytics engine, report builder, charts, number cards, dashboards and spaces, all customizable without code"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
ferrum-kernel = { path = "../kernel" }
ferrum-meta = { path = "../meta" }
ferrum-domain = { path = "../domain" }
ferrum-calc = { path = "../calc" }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { version = "0.10", default-features = false }
futures = { workspace = true }
rust_decimal = { workspace = true }
rust_xlsxwriter = "0.102"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Studio's tests report on ERP's records (sales, purchases, the books).
ferrum-app-erp = { git = "https://github.com/CBFerrum/ferrum-app-erp", branch = "main" }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { workspace = true }

[lints]
workspace = true
