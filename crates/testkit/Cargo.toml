[package]
name = "ferrum-testkit"
description = "The one way an app's integration suite starts: a kernel booted as the server boots one, a workspace and its people, and the helpers every suite wrote for itself (docs/testkit.md). A dev-dependency only."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrum-kernel = { path = "../kernel" }
ferrum-meta = { path = "../meta" }
ferrum-domain = { path = "../domain" }
async-trait = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The kit's own test boots a real app of this repository.
ferrum-ops = { path = "../ops" }

[lints]
workspace = true
