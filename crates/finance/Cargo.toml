[package]
name = "ferrum-finance"
description = "Budgets, bank reconciliation, period closing, dunning, subscriptions and payment terms"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
ferrum-kernel = { path = "../kernel" }
ferrum-meta = { path = "../meta" }
ferrum-domain = { path = "../domain" }
ferrum-calc = { path = "../calc" }
async-trait = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Dunning letters are Jinja templates, like the kernel's print formats (same crate and version).
minijinja = { version = "2", features = ["fuel"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
