- name: PaymentTermsTemplateDetail
  label: Payment Term
  kind: child
  fields:
    - {name: description, type: data, in_list: true}
    - {name: invoice_portion, type: percent, required: true, min: "0.000000001", max: "100", in_list: true, label: Portion (%)}
    - name: due_date_based_on
      type: select
      required: true
      in_list: true
      default: "Day(s) after invoice date"
      options: ["Day(s) after invoice date", "Day(s) after the end of the invoice month", "Month(s) after the end of the invoice month", "Day of the month"]
    - {name: credit_days, type: int, default: 0, min: 0, max: 3650, in_list: true}
    - {name: credit_months, type: int, default: 0, min: 0, max: 120, description: "Months after the invoice month (end-of-month and day-of-month rules)"}
    - {name: day_of_month, type: int, min: 1, max: 31, visible_if: "doc.due_date_based_on == 'Day of the month'",
       required_if: "doc.due_date_based_on == 'Day of the month'", description: Clamped to the month's last day}
    - {name: discount_percent, type: percent, default: 0, min: "0", max: "100", label: Early Payment Discount %}
    - {name: discount_days, type: int, default: 0, min: 0, max: 3650, label: Discount Valid (days after invoice)}

- name: PaymentTermsTemplate
  label: Payment Terms Template
  module: finance
  kind: master
  title_field: template_name
  description: Splits an invoice or order into installments with their own due dates and early payment discounts.
  fields:
    - {name: template_name, type: data, required: true, unique: true, in_list: true}
    - {name: terms, type: table, of: PaymentTermsTemplateDetail, required: true, label: Installments}
    - {name: disabled, type: check, in_filter: true}
  list: {columns: [template_name, disabled], sort: template_name asc}

- name: PaymentSchedule
  label: Payment Schedule
  kind: child
  fields:
    - {name: description, type: data, in_list: true}
    - {name: due_date, type: date, required: true, in_list: true}
    - {name: invoice_portion, type: percent, min: "0", max: "100", in_list: true, label: Portion (%)}
    - {name: payment_amount, type: currency, currency: parent.currency, in_list: true}
    - {name: base_payment_amount, type: currency, read_only: true}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: discount_date, type: date}
    - {name: discount_amount, type: currency, currency: parent.currency, read_only: true}
