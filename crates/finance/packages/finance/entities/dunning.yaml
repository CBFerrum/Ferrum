- name: DunningLevel
  label: Dunning Level
  kind: child
  fields:
    - {name: level, type: int, required: true, min: 1, max: 20, in_list: true}
    - {name: days_overdue, type: int, required: true, min: 0, max: 3650, in_list: true, label: From Days Overdue}
    - {name: dunning_fee, type: currency, default: 0, min: "0", in_list: true}
    - {name: interest_rate, type: percent, default: 0, min: "0", max: "100", in_list: true, label: Interest (% p.a.)}
    - {name: subject, type: data, label: Letter Subject}
    - {name: letter_text, type: text, description: "Jinja template; variables: customer_name, company, posting_date, dunning_level, currency, total_outstanding, interest_rate, interest_amount, dunning_fee, dunning_amount, grand_total, overdue (rows with invoice, installment, due_date, overdue_days, outstanding, interest)"}

- name: DunningType
  label: Dunning Type
  module: finance
  kind: master
  company_scoped: true
  title_field: dunning_type
  description: Escalation levels for overdue customers - days overdue, fee, yearly interest and the letter to send.
  fields:
    - {name: dunning_type, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: is_default, type: check, in_list: true, description: Used for customers without a dunning type of their own}
    - {name: income_account, type: link, to: Account, link_filters: {is_group: false}, description: Credited with dunning fees (the company's default income account when empty)}
    - {name: interest_income_account, type: link, to: Account, link_filters: {is_group: false}, description: Credited with interest (the income account when empty)}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {is_group: false}}
    - {name: levels, type: table, of: DunningLevel, required: true}
  unique: [[company, dunning_type]]
  list: {columns: [dunning_type, company, is_default], sort: dunning_type asc}

- name: DunningOverdue
  label: Overdue Payment
  kind: child
  fields:
    - {name: sales_invoice, type: link, to: SalesInvoice, in_list: true}
    - {name: invoice_number, type: data, in_list: true}
    - {name: installment, type: data, in_list: true}
    - {name: due_date, type: date, in_list: true}
    - {name: overdue_days, type: int, in_list: true}
    - {name: outstanding, type: currency, currency: parent.currency, in_list: true}
    - {name: interest, type: currency, currency: parent.currency, in_list: true}

- name: Dunning
  label: Dunning
  module: finance
  kind: document
  submittable: true
  company_scoped: true
  numbering: {template: "DUNN-{FY}-{seq:5}", gapless: true, on: submit, date_field: posting_date}
  title_field: customer_name
  description: A reminder for a customer's overdue installments, charging the level's fee and interest to the customer's account.
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: dunning_type, type: link, to: DunningType, required: true, description: The customer's or the company's default when empty}
    - {name: dunning_level, type: int, read_only: true, in_list: true}
    - {name: currency, type: link, to: Currency, description: Invoices in this currency are dunned (the company currency when empty)}
    - {name: conversion_rate, type: decimal, read_only: true}
    - {name: overdue_payments, type: table, of: DunningOverdue, read_only: true}
    - {name: total_outstanding, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: interest_rate, type: percent, read_only: true, label: Interest (% p.a.)}
    - {name: interest_amount, type: currency, currency: currency, read_only: true}
    - {name: dunning_fee, type: currency, currency: currency, read_only: true}
    - {name: dunning_amount, type: currency, currency: currency, read_only: true, in_list: true, label: Fee and Interest}
    - {name: grand_total, type: currency, currency: currency, read_only: true, label: Total Due}
    - {name: base_dunning_amount, type: currency, read_only: true}
    - {name: outstanding_amount, type: currency, currency: currency, read_only: true, no_copy: true, label: Fee and Interest Outstanding}
    - {name: debit_to, type: link, to: Account, read_only: true, label: Receivable Account}
    - {name: status, type: select, options: [Draft, Unresolved, Resolved, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: letter_subject, type: data, read_only: true}
    - {name: letter, type: text, read_only: true}
    - {name: letter_sent_to, type: data, read_only: true, no_copy: true}
    - {name: letter_sent_at, type: datetime, read_only: true, no_copy: true}
  rules:
    - {name: has_overdue, check: "size(doc.overdue_payments) > 0", message: "The customer has no overdue payments in this currency", on: submit}
  actions:
    - {name: send_letter, label: Email Dunning Letter, docstatus: [1], permission: write, confirm: "Email the dunning letter to the customer?"}
  form:
    - {label: Dunning, columns: 2, fields: [company, customer, customer_name, posting_date, dunning_type, dunning_level, currency, conversion_rate, status]}
    - {label: Overdue Payments, columns: 1, fields: [overdue_payments]}
    - {label: Amounts, columns: 2, fields: [total_outstanding, interest_rate, interest_amount, dunning_fee, dunning_amount, grand_total, base_dunning_amount,
        outstanding_amount, debit_to]}
    - {label: Letter, columns: 1, collapsible: true, fields: [letter_subject, letter, letter_sent_to, letter_sent_at]}
  list: {columns: [number, customer_name, posting_date, dunning_level, total_outstanding, dunning_amount, status], sort: posting_date desc}
