- name: MonthlyDistributionPercentage
  label: Monthly Distribution Percentage
  kind: child
  fields:
    - {name: month, type: select, required: true, in_list: true,
       options: [January, February, March, April, May, June, July, August, September, October, November, December]}
    - {name: percentage_allocation, type: percent, required: true, min: "0", max: "100", in_list: true, label: Percentage}

- name: MonthlyDistribution
  label: Monthly Distribution
  module: finance
  kind: master
  title_field: distribution_name
  description: How an annual budget spreads over the calendar months (12 percentages summing to 100); reusable across budgets.
  fields:
    - {name: distribution_name, type: data, required: true, unique: true, in_list: true}
    - {name: percentages, type: table, of: MonthlyDistributionPercentage, label: Monthly Percentages, description: "Left empty, the year is split evenly"}
    - {name: total_percentage, type: percent, read_only: true, in_list: true}
  list: {columns: [distribution_name, total_percentage], sort: distribution_name asc}

- name: BudgetAccount
  label: Budget Account
  kind: child
  fields:
    - {name: account, type: link, to: Account, required: true, link_filters: {is_group: false}, in_list: true}
    - {name: budget_amount, type: currency, required: true, min: "0", in_list: true, label: Annual Budget}

- name: Budget
  label: Budget
  module: finance
  kind: document
  submittable: true
  company_scoped: true
  numbering: {template: "BUDGET-{seq:5}"}
  description: Annual amounts per income or expense account for a cost center (and its children) or a project, with what happens when purchase orders, material requests or actual expenses would exceed them.
  owner_fields: [budget_owner]
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: fiscal_year, type: link, to: FiscalYear, required: true, in_list: true, in_filter: true}
    - {name: budget_against, type: select, options: [Cost Center, Project], required: true, default: Cost Center, in_list: true, in_filter: true}
    - {name: cost_center, type: link, to: CostCenter, in_list: true, in_filter: true,
       visible_if: "doc.budget_against == 'Cost Center'", required_if: "doc.budget_against == 'Cost Center'"}
    - {name: project, type: link, to: Project, in_list: true, in_filter: true,
       visible_if: "doc.budget_against == 'Project'", required_if: "doc.budget_against == 'Project'"}
    - {name: monthly_distribution, type: link, to: MonthlyDistribution, description: Spreads the annual amounts over the months for the accumulated monthly checks (even months when empty)}
    - {name: budget_owner, type: email, description: Notified in the app when a Warn action lets a document exceed this budget}
    - {name: applicable_on_material_request, type: check, label: Applicable on Material Request}
    - {name: action_if_annual_budget_exceeded_on_mr, type: select, options: [Stop, Warn, Ignore], default: Warn,
       visible_if: "doc.applicable_on_material_request", label: Annual Budget Exceeded on Material Request}
    - {name: action_if_accumulated_monthly_budget_exceeded_on_mr, type: select, options: [Stop, Warn, Ignore], default: Warn,
       visible_if: "doc.applicable_on_material_request", label: Accumulated Monthly Budget Exceeded on Material Request}
    - {name: applicable_on_purchase_order, type: check, label: Applicable on Purchase Order, description: Open purchase orders commit budget until they are billed}
    - {name: action_if_annual_budget_exceeded_on_po, type: select, options: [Stop, Warn, Ignore], default: Warn,
       visible_if: "doc.applicable_on_purchase_order", label: Annual Budget Exceeded on Purchase Order}
    - {name: action_if_accumulated_monthly_budget_exceeded_on_po, type: select, options: [Stop, Warn, Ignore], default: Warn,
       visible_if: "doc.applicable_on_purchase_order", label: Accumulated Monthly Budget Exceeded on Purchase Order}
    - {name: applicable_on_booking_actual_expenses, type: check, default: true, label: Applicable on Booking Actual Expenses}
    - {name: action_if_annual_budget_exceeded, type: select, options: [Stop, Warn, Ignore], default: Stop,
       visible_if: "doc.applicable_on_booking_actual_expenses", label: Annual Budget Exceeded on Actual Expenses}
    - {name: action_if_accumulated_monthly_budget_exceeded, type: select, options: [Stop, Warn, Ignore], default: Warn,
       visible_if: "doc.applicable_on_booking_actual_expenses", label: Accumulated Monthly Budget Exceeded on Actual Expenses}
    - {name: accounts, type: table, of: BudgetAccount, required: true, label: Budget Accounts}
    - {name: total_budget, type: currency, read_only: true, in_list: true}
  form:
    - {label: Budget, columns: 2, fields: [company, fiscal_year, budget_against, cost_center, project, monthly_distribution, budget_owner, total_budget]}
    - {label: Accounts, columns: 1, fields: [accounts]}
    - {label: Control Actions, columns: 2, collapsible: true, fields: [applicable_on_booking_actual_expenses, action_if_annual_budget_exceeded,
        action_if_accumulated_monthly_budget_exceeded, applicable_on_purchase_order, action_if_annual_budget_exceeded_on_po,
        action_if_accumulated_monthly_budget_exceeded_on_po, applicable_on_material_request, action_if_annual_budget_exceeded_on_mr,
        action_if_accumulated_monthly_budget_exceeded_on_mr]}
  list: {columns: [number, fiscal_year, budget_against, cost_center, project, total_budget], sort: created_at desc}
