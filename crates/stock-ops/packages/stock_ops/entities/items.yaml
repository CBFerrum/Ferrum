- name: ItemAttributeValue
  label: Item Attribute Value
  kind: child
  fields:
    - {name: attribute_value, type: data, required: true, in_list: true}
    - {name: abbr, type: data, label: Abbreviation, required: true, in_list: true, max_length: 20, description: Used in variant item codes}

- name: ItemAttribute
  label: Item Attribute
  kind: master
  module: stock_ops
  title_field: attribute_name
  fields:
    - {name: attribute_name, type: data, required: true, unique: true, in_list: true}
    - {name: numeric_values, type: check, in_list: true, description: The values are a numeric range instead of a list}
    - {name: from_range, type: decimal, visible_if: "doc.numeric_values", required_if: "doc.numeric_values"}
    - {name: to_range, type: decimal, visible_if: "doc.numeric_values", required_if: "doc.numeric_values"}
    - {name: increment, type: decimal, min: "0.000000001", visible_if: "doc.numeric_values", required_if: "doc.numeric_values"}
    - {name: values, type: table, of: ItemAttributeValue, visible_if: "!doc.numeric_values"}
  rules:
    - {name: range_order, check: "!doc.numeric_values || doc.to_range >= doc.from_range", message: "To Range must not be below From Range"}
  list: {columns: [attribute_name, numeric_values], sort: attribute_name asc}

- name: ItemVariantAttribute
  label: Item Variant Attribute
  kind: child
  fields:
    - {name: attribute, type: link, to: ItemAttribute, required: true, in_list: true}
    - {name: attribute_value, type: data, in_list: true, description: "The variant's value (empty on templates)"}
    - {name: numeric_values, type: check, fetch_from: attribute.numeric_values, read_only: true}
    - {name: from_range, type: decimal, fetch_from: attribute.from_range, description: A template may narrow the attribute's range}
    - {name: to_range, type: decimal, fetch_from: attribute.to_range}
    - {name: increment, type: decimal, fetch_from: attribute.increment}

- name: ProductBundleItem
  label: Product Bundle Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true, description: Quantity per bundle}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Unit}
    - {name: description, type: text}

- name: ProductBundle
  label: Product Bundle
  kind: master
  module: stock_ops
  title_field: item_name
  description: A non-stock item sold as a kit; deliveries move its components instead.
  fields:
    - {name: item, type: link, to: Item, label: Bundle Item, required: true, unique: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: description, type: text}
    - {name: items, type: table, of: ProductBundleItem, label: Components, required: true}
    - {name: disabled, type: check, in_filter: true}
  list: {columns: [item, item_name, disabled], sort: created_at desc}

- name: PackedItem
  label: Packed Item
  kind: child
  fields:
    - {name: parent_item, type: link, to: Item, label: Bundle, read_only: true, in_list: true}
    - {name: item, type: link, to: Item, label: Component, required: true, read_only: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: qty, type: decimal, read_only: true, in_list: true}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Unit}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true}
    - {name: batch_no, type: data, in_list: true}
    - {name: serial_no, type: text, description: One serial number per line}
    - {name: valuation_rate, type: currency, read_only: true, no_copy: true}
    - {name: parent_line, type: data, read_only: true, hidden: true}
    - {name: pick_list_item, type: data, read_only: true, hidden: true, no_copy: true}
