- name: Batch
  label: Batch
  label_plural: Batches
  kind: master
  module: stock_ops
  title_field: batch_id
  search_fields: [batch_id]
  description: Batch details. Picking skips expired and disabled batches and takes the earliest expiry first, then the oldest receipt.
  fields:
    - {name: batch_id, type: data, label: Batch No, required: true, in_list: true, max_length: 140}
    - {name: item, type: link, to: Item, required: true, in_list: true, in_filter: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: manufacturing_date, type: date, in_list: true}
    - {name: expiry_date, type: date, in_list: true, in_filter: true}
    - {name: supplier, type: link, to: Supplier}
    - {name: description, type: text}
    - {name: disabled, type: check, in_filter: true, description: Disabled batches are never picked}
  unique: [[item, batch_id]]
  rules:
    - {name: expiry_after_manufacture, check: "doc.expiry_date == null || doc.manufacturing_date == null || doc.expiry_date >= doc.manufacturing_date", message: "The expiry date is before the manufacturing date"}
  list: {columns: [batch_id, item, expiry_date], sort: expiry_date asc}

- name: PickListItem
  label: Pick List Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, in_list: true}
    - {name: qty, type: decimal, label: Qty to Pick, required: true, min: "0.000000001", in_list: true}
    - {name: picked_qty, type: decimal, min: "0", in_list: true, description: Defaults to the quantity to pick}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Unit}
    - {name: batch_no, type: data, in_list: true}
    - {name: serial_no, type: text, description: One serial number per line}
    - {name: sales_order, type: link, to: SalesOrder, read_only: true}
    - {name: so_line, type: data, read_only: true}
    - {name: product_bundle_item, type: link, to: Item, label: Bundle, read_only: true}
    - {name: qty_per_bundle, type: decimal, read_only: true}
    - {name: delivered_qty, type: decimal, read_only: true, no_copy: true, in_list: true}

- name: PickList
  label: Pick List
  kind: document
  module: stock_ops
  submittable: true
  company_scoped: true
  description: Where to pick the stock for sales orders or a transfer; picked stock is held for this list until it is delivered.
  numbering: {template: "PICK-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: purpose, type: select, options: [Delivery, Material Transfer], required: true, default: Delivery, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, in_list: true, in_filter: true, visible_if: "doc.purpose == 'Delivery'"}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: parent_warehouse, type: link, to: Warehouse, label: Pick From, description: Warehouses under this one (empty for every warehouse of the company)}
    - {name: target_warehouse, type: link, to: Warehouse, link_filters: {is_group: false}, visible_if: "doc.purpose == 'Material Transfer'", required_if: "doc.purpose == 'Material Transfer'"}
    - {name: locations, type: table, of: PickListItem, label: Item Locations, required: true}
    - {name: status, type: select, options: [Draft, Open, Completed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: per_delivered, type: percent, read_only: true, no_copy: true, in_list: true}
    - {name: remarks, type: text}
  actions:
    - {name: get_item_locations, label: Get Item Locations, docstatus: [0], permission: write}
    - {name: make_delivery_note, label: Create Delivery Note, docstatus: [1], permission: read, condition: "doc.purpose == 'Delivery' && doc.status == 'Open'"}
    - {name: make_stock_entry, label: Create Stock Entry, docstatus: [1], permission: read, condition: "doc.purpose == 'Material Transfer' && doc.status == 'Open'"}
  list: {columns: [number, purpose, customer, posting_date, status], sort: posting_date desc}

- name: PackingSlipItem
  label: Packing Slip Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Unit}
    - {name: net_weight, type: decimal, min: "0", in_list: true, description: Net weight per unit}
    - {name: weight_uom, type: link, to: Uom, label: Weight Unit}
    - {name: batch_no, type: data}
    - {name: dn_line, type: data, label: Delivery Note Line, description: Filled in when the delivery note has one line for the item}
    - {name: description, type: text}

- name: PackingSlip
  label: Packing Slip
  kind: document
  module: stock_ops
  submittable: true
  company_scoped: true
  title_field: customer_name
  description: Packages of a draft delivery note, with package numbers and weights.
  numbering: {template: "PS-{FY}-{seq:5}", on: submit}
  fields:
    - {name: delivery_note, type: link, to: DeliveryNote, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, required: true, fetch_from: delivery_note.company, read_only: true, in_filter: true}
    - {name: customer, type: link, to: Customer, fetch_from: delivery_note.customer, read_only: true}
    - {name: customer_name, type: data, fetch_from: delivery_note.customer_name, read_only: true, in_list: true}
    - {name: from_case_no, type: int, label: From Package No, required: true, min: 1, in_list: true}
    - {name: to_case_no, type: int, label: To Package No, min: 1, in_list: true, description: Defaults to the first package number}
    - {name: items, type: table, of: PackingSlipItem, required: true}
    - {name: net_weight_pkg, type: decimal, label: Net Weight, read_only: true}
    - {name: gross_weight_pkg, type: decimal, label: Gross Weight, min: "0"}
    - {name: weight_uom, type: link, to: Uom, label: Weight UOM}
    - {name: remarks, type: text}
  rules:
    - {name: case_order, check: "doc.to_case_no == 0 || doc.to_case_no >= doc.from_case_no", message: "To Package No must not be below From Package No"}
  list: {columns: [number, delivery_note, customer_name, from_case_no, to_case_no], sort: created_at desc}
