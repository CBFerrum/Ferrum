- name: QualityInspectionParameter
  label: Quality Inspection Parameter
  kind: child
  fields:
    - {name: parameter, type: data, required: true, in_list: true}
    - {name: numeric, type: check, default: true, in_list: true}
    - {name: min_value, type: decimal, in_list: true, visible_if: "doc.numeric"}
    - {name: max_value, type: decimal, in_list: true, visible_if: "doc.numeric"}
    - {name: accepted_values, type: text, visible_if: "!doc.numeric", description: One accepted value per line}
    - {name: formula, type: code, label: Acceptance Formula, description: "Optional CEL condition over doc.readings, doc.mean, doc.min, doc.max, doc.count and doc.value, e.g. doc.mean >= 9.8 && doc.max <= 10.5"}

- name: QualityInspectionTemplate
  label: Quality Inspection Template
  kind: master
  module: stock_ops
  title_field: template_name
  fields:
    - {name: template_name, type: data, required: true, unique: true, in_list: true}
    - {name: parameters, type: table, of: QualityInspectionParameter, required: true}
    - {name: description, type: text}
  list: {columns: [template_name], sort: template_name asc}

- name: QualityInspectionReading
  label: Quality Inspection Reading
  kind: child
  fields:
    - {name: parameter, type: data, required: true, in_list: true}
    - {name: numeric, type: check, default: true}
    - {name: min_value, type: decimal}
    - {name: max_value, type: decimal}
    - {name: accepted_values, type: text}
    - {name: formula, type: code}
    - {name: readings, type: text, in_list: true, description: "Measured values, one per line or comma-separated"}
    - {name: status, type: select, options: [Accepted, Rejected], read_only: true, in_list: true}

- name: QualityInspection
  label: Quality Inspection
  kind: document
  module: stock_ops
  submittable: true
  company_scoped: true
  title_field: item_name
  description: Readings for an item of a receipt, delivery or stock entry; the status follows the template's criteria.
  numbering: {template: "QI-{FY}-{seq:5}", on: submit, date_field: report_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: inspection_type, type: select, options: [Incoming, Outgoing, In Process], required: true, in_list: true, in_filter: true, description: Follows the reference when left empty}
    - {name: report_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: reference_type, type: select, options: [Purchase Receipt, Purchase Invoice, Delivery Note, Sales Invoice, Stock Entry], required: true, in_filter: true}
    - {name: purchase_receipt, type: link, to: PurchaseReceipt, visible_if: "doc.reference_type == 'Purchase Receipt'", required_if: "doc.reference_type == 'Purchase Receipt'", in_filter: true}
    - {name: purchase_invoice, type: link, to: PurchaseInvoice, visible_if: "doc.reference_type == 'Purchase Invoice'", required_if: "doc.reference_type == 'Purchase Invoice'", in_filter: true}
    - {name: delivery_note, type: link, to: DeliveryNote, visible_if: "doc.reference_type == 'Delivery Note'", required_if: "doc.reference_type == 'Delivery Note'", in_filter: true}
    - {name: sales_invoice, type: link, to: SalesInvoice, visible_if: "doc.reference_type == 'Sales Invoice'", required_if: "doc.reference_type == 'Sales Invoice'", in_filter: true}
    - {name: stock_entry, type: link, to: StockEntry, visible_if: "doc.reference_type == 'Stock Entry'", required_if: "doc.reference_type == 'Stock Entry'", in_filter: true}
    - {name: reference_line, type: data, description: The inspected line of the document (empty covers every line of this item)}
    - {name: item, type: link, to: Item, required: true, in_list: true, in_filter: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: batch_no, type: data}
    - {name: serial_no, type: text}
    - {name: sample_size, type: decimal, required: true, min: "0", default: 1}
    - {name: template, type: link, to: QualityInspectionTemplate, label: Inspection Template}
    - {name: inspected_by, type: data, default_expr: "user.email"}
    - {name: manual_inspection, type: check, description: Set the status by hand instead of from the readings}
    - {name: status, type: select, options: [Accepted, Rejected], in_list: true, in_filter: true, description: Computed from the readings unless the inspection is manual}
    - {name: readings, type: table, of: QualityInspectionReading}
    - {name: remarks, type: text}
  list: {columns: [number, item_name, inspection_type, report_date, status], sort: report_date desc}
