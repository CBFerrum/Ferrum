- name: StockReconciliationItem
  label: Stock Reconciliation Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: warehouse, type: link, to: Warehouse, required: true, link_filters: {is_group: false}, in_list: true}
    - {name: batch_no, type: data, in_list: true, description: Required for batch-tracked items; one line per batch}
    - {name: serial_no, type: text, description: "Counted serial numbers, one per line"}
    - {name: qty, type: decimal, label: Counted Qty, required: true, min: "0", in_list: true}
    - {name: valuation_rate, type: currency, min: "0", in_list: true, description: "Empty: only the quantity changes, at the current valuation. Set: the counted stock is revalued at this rate"}
    - {name: amount, type: currency, read_only: true}
    - {name: current_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: current_valuation_rate, type: currency, read_only: true, no_copy: true}
    - {name: current_amount, type: currency, read_only: true, no_copy: true}
    - {name: current_serial_no, type: text, read_only: true, no_copy: true}
    - {name: quantity_difference, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: amount_difference, type: currency, read_only: true, no_copy: true, in_list: true}

- name: StockReconciliation
  label: Stock Reconciliation
  kind: document
  module: stock_ops
  submittable: true
  company_scoped: true
  description: Sets counted quantities (and optionally valuation rates); the differences post as stock moves against the difference account.
  numbering: {template: "MAT-RECO-{FY}-{seq:5}", on: submit, date_field: posting_date}
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: purpose, type: select, options: [Stock Reconciliation, Opening Stock], required: true, default: Stock Reconciliation, in_list: true, in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: posting_time, type: data, default: "23:59:59", description: "HH:MM:SS (orders entries on the same day)"}
    - {name: expense_account, type: link, to: Account, label: Difference Account, link_filters: {is_group: false}, description: "Defaults to the company's stock adjustment account (opening balance account for opening stock)"}
    - {name: cost_center, type: link, to: CostCenter}
    - {name: items, type: table, of: StockReconciliationItem, required: true}
    - {name: difference_amount, type: currency, read_only: true, no_copy: true, in_list: true}
    - {name: remarks, type: text}
  rules:
    - {name: time_format, check: "doc.posting_time == null || doc.posting_time.matches('^[0-2][0-9]:[0-5][0-9](:[0-5][0-9])?$')", message: "Posting time must be HH:MM or HH:MM:SS"}
  list: {columns: [number, purpose, posting_date, difference_amount], sort: posting_date desc}
