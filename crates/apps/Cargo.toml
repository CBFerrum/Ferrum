[package]
name = "ferrum-apps"
description = "Ferrum apps: manifest, signed bundle format, verification and dependency resolution (shared by the server, the CLI and the store)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrum-meta = { path = "../meta" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = { version = "1", features = ["serde"] }
ring = "0.17"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
# Descriptions (README.md) for the store's pages and the install dialog: Markdown, never raw HTML.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[lints]
workspace = true
