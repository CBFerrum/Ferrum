# AN EXAMPLE, NOT THE PRODUCT. It runs a PostgreSQL, an object store and a daily backup of the database beside the product
# (deploy/docker-compose.yml), and hands the product the two addresses it takes: DATABASE_URL and the bucket. Ferrum itself
# operates neither. You own what runs here: README.md says what that means (backups copied off the host, upgrades of PostgreSQL,
# the store's volume and key, disk).
#
#   reference/single-host/up.sh                # writes reference/single-host/.env once, then:
#   docker compose -f deploy/docker-compose.yml -f reference/single-host/compose.yml --env-file reference/single-host/.env up -d
#
# The product's file comes first, so that this one's values win the merge, and its relative paths (the product's directory,
# deploy/) are what the paths below are written against.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The superuser is only for administration; Ferrum connects as the ordinary role `ferrum` created by postgres-init
      # (superusers bypass row-level security).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in reference/single-host/.env (up.sh writes it)}
      FERRUM_DB_PASSWORD: ${FERRUM_DB_PASSWORD:?set FERRUM_DB_PASSWORD in reference/single-host/.env (up.sh writes it)}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "wal_level=replica"]
    # Parallel queries share memory through /dev/shm, which Docker makes 64 MB: a three-hour soak
    # ran out of it ("could not resize shared memory segment") once tables had grown.
    shm_size: 512mb
    volumes:
      - db:/var/lib/postgresql/data
      - ../reference/single-host/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Over TCP: while a new volume's init scripts run, the server listens on its socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ferrum"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The object store for files: SeaweedFS (Apache-2.0), one process, chosen by trial (docs/references/object-stores.md). Only its
  # S3 port is reachable, on this network alone; it keeps versions, applies lifecycle rules and encrypts what it keeps. It is
  # given the key in reference/single-host/.env (reference/store/start.sh refuses to start without it, naming it).
  store:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-4.53}
    restart: unless-stopped
    environment:
      STORE_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in reference/single-host/.env (up.sh writes them)}
      STORE_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in reference/single-host/.env (up.sh writes it)}
    entrypoint: ["/bin/sh", "/etc/ferrum-store/start.sh"]
    volumes:
      - store:/data
      - ../reference/store:/etc/ferrum-store:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Makes the store's bucket once it answers: `ferrum task bucket_set_up` of the product's image (versioning, lifecycle rules,
  # encryption; a bucket's own rules are never replaced, and running it again does nothing). Until it has worked the server is
  # not ready, saying NoSuchBucket.
  store-setup:
    image: ${FERRUM_IMAGE:?set FERRUM_IMAGE to a commit tag, docs/operations.md "Images"}
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      store:
        condition: service_healthy
    command: ["task", "bucket_set_up"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FERRUM_S3_BUCKET: ${FERRUM_S3_BUCKET}
      FERRUM_S3_ENDPOINT: ${FERRUM_S3_ENDPOINT}
      FERRUM_S3_REGION: ${FERRUM_S3_REGION}
      FERRUM_BACKUP_REACH_DAYS: ${BACKUP_KEEP_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The database's backup: deploy/dump.sh dump (every row of every workspace, as the server's own role) once a day into the
  # `backups` volume, the dumps older than BACKUP_KEEP_DAYS days deleted. A failing dump is in this service's log
  # (`docker compose logs backup`) and nowhere else: watch it. The dumps are on this host's disk until you copy them off
  # (README.md); the store's volume is not part of this job.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        while :; do
          file=/backups/ferrum-$$(date +%Y-%m-%d-%H%M).dump
          if /usr/local/bin/dump.sh dump "$$DATABASE_URL" "$$file.new"; then
            mv "$$file.new" "$$file"
            find /backups -name 'ferrum-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            echo "the dump failed: $$file" >&2
            find /backups -name '*.new' -delete
          fi
          sleep 86400
        done
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - backups:/backups
      - ./dump.sh:/usr/local/bin/dump.sh:ro
    security_opt: [no-new-privileges:true]

  ferrum:
    depends_on:
      db:
        condition: service_healthy
      store:
        condition: service_healthy
    environment:
      # The dumps' reach is what deleted files wait for (docs/operations.md, "Backups of files").
      FERRUM_BACKUP_REACH_DAYS: ${BACKUP_KEEP_DAYS:-30}
      FERRUM_FILES_DELETE_AFTER_DAYS: ${BACKUP_KEEP_DAYS:-30}

volumes:
  db:
  store:
  backups:
